<!doctype html>
<!-- pro-design-brief 보드 템플릿. design_brief_cli.py board 가 제목·목차·섹션 자리표시를 채운다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1f2328; --sub: #59636e; --line: #d8dee4;
    --accent: #3b5bdb; --ok: #2f9e44; --warn: #e8590c; --missing: #c92a2a; --soft: #eef1f6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { width: 1400px; margin: 0 auto; padding: 24px; }
  nav { position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; flex-wrap: wrap;
        padding: 10px 24px; background: var(--card); border-bottom: 1px solid var(--line); }
  nav button { border: 1px solid var(--line); background: var(--soft); border-radius: 999px;
               padding: 4px 12px; font: inherit; cursor: pointer; }
  nav button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
  section.topic { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
                  padding: 24px 28px; margin: 0 0 20px; }
  section.topic > h2 { margin: 0 0 14px; font-size: 22px; }
  .banner { background: #fff4e6; border: 1px solid #ffd8a8; border-radius: 10px; padding: 10px 14px;
            font-weight: 600; margin-bottom: 14px; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 16px; }
  .kv dt { color: var(--sub); } .kv dd { margin: 0; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  figure { margin: 0; background: var(--soft); border-radius: 10px; padding: 10px; }
  figure img { display: block; max-width: 360px; max-height: 720px; border-radius: 6px; }
  figure.zoom img { max-width: 100%; image-rendering: pixelated; }
  .alt figure { max-width: 100%; }
  .alt figure img { max-width: 100%; }
  /* 상태 표 안의 그림은 섬네일 — 전체 크기로 넣으면 한 장이 세로 1만 px 을 넘는다 (실측) */
  td figure img { max-width: 170px; max-height: 360px; }
  /* 한글·전각은 두 칸으로 고정한다 — 글꼴이 정확히 두 배 폭으로 그리지 않아 오른쪽 선이 어긋난다 (실측) */
  pre.ascii .w { display: inline-block; width: 2ch; text-align: center; }
  .alt pre.ascii { font-size: 11px; }
  figcaption { margin-top: 6px; font-size: 13px; color: var(--sub); text-align: center; }
  pre.ascii { margin: 0; font: 13px/1.3 "SF Mono", Menlo, "D2Coding", monospace; white-space: pre;
              background: #fff; border: 1px dashed var(--line); padding: 10px; border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--soft); font-weight: 600; }
  .tag { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: 12px; font-weight: 600; }
  .tag.done { background: #d3f9d8; color: var(--ok); }
  .tag.temp { background: #fff3bf; color: #9c6500; }
  .tag.none { background: #ffe3e3; color: var(--missing); }
  .tag.rec { background: var(--accent); color: #fff; }
  .tag.legal { background: #e9ecef; color: #495057; }
  .alt { width: 400px; background: var(--soft); border-radius: 12px; padding: 14px; }
  .alt h3 { margin: 0 0 8px; }
  .alt ul { margin: 6px 0; padding-left: 18px; }
  .muted { color: var(--sub); }
</style>
</head>
<body>
<nav aria-label="보드 목차">
  <button type="button" data-show="all" aria-pressed="true">전체</button>
  <!--NAV-->
</nav>
<main>
<!--SECTIONS-->
</main>
<script>
  // 탭: 주제 하나만 보거나 전체를 본다. PNG 는 섹션마다 따로 찍으므로 이 상태와 무관하다.
  document.querySelectorAll('nav button').forEach((b) => b.addEventListener('click', () => {
    const want = b.dataset.show;
    document.querySelectorAll('nav button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    document.querySelectorAll('section.topic').forEach((s) => {
      s.hidden = want !== 'all' && s.id !== want;
    });
  }));
</script>
</body>
</html>
