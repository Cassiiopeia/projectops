# ===================================================================
# GitHub Projects Sync Worker - Cloudflare config
# ===================================================================
#
# This Worker receives GitHub Organization webhooks and
# syncs issue labels automatically when a Projects Status changes.
#
# Required Secrets (set with wrangler secret put):
#   - GITHUB_TOKEN: GitHub Personal Access Token (repo, project scopes)
#   - WEBHOOK_SECRET: GitHub Webhook Secret (for verification)
#
# How to deploy:
#   1. npm install
#   2. wrangler secret put GITHUB_TOKEN
#   3. wrangler secret put WEBHOOK_SECRET
#   4. wrangler deploy
#
# ===================================================================

name = "github-projects-sync-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Environment variables (non-secret settings)
[vars]
# Project number (the number in {org}/projects/{number} — always change it to your own)
PROJECT_NUMBER = "6"

# Status field name
STATUS_FIELD = "Status"

# Status labels to sync (JSON array)
STATUS_LABELS = '["작업전","작업중","담당자확인","피드백","작업완료","보류","취소"]'

# Organization name — always change it to your own org
ORG_NAME = "your-org"
