# ===================================================================
# PROJECT-TEMPLATE-DOCS-DEPLOY.yaml
# projectops docs site (VitePress) GitHub Pages deploy workflow v1.0
# ===================================================================
#
# This workflow is for the projectops repo only.
# template_integrator does not copy it, and template_initializer deletes it.
#
# What it does:
# - builds docs/ with site/ (VitePress config) and deploys to GitHub Pages
# - docs/ is the only docs source; site/ holds only build config
#
# Triggers: push to main changing docs/** or site/** (+ manual run)
#
# Prerequisite: set Settings → Pages → Source to "GitHub Actions"
# ===================================================================

name: PROJECT-TEMPLATE-DOCS-DEPLOY

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "site/**"
      - ".github/workflows/PROJECT-TEMPLATE-DOCS-DEPLOY.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time. Do not cancel a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build docs
        run: |
          cd site
          npm ci
          npm run docs:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
