# ===================================================================
# PROJECT-COMMON-VERSION-CONTROL.yaml
# Automatic version management workflow v2.1
# ===================================================================
#
# [Safety net] Only when a direct push to main (production) skips the release PR,
# bumps the version automatically and syncs every related file.
# For normal releases (develop->main PR), RELEASE-CHANGELOG bumps before merging,
# and that merge push includes a version.yml change, so the guard skips this workflow.
#
# [semver] With options.semver_auto on (a missing key counts as on), regardless of a development branch,
# major/minor/patch is decided from commit subjects in the push range — same rule as the release PR path (RELEASE-CHANGELOG) (#805, #815).
# Always patch only when semver_auto: false is set explicitly.
#
# ===================================================================
# Main improvements:
# - Automatic version sync (version.yml <-> project files)
# - Stronger error handling
# - Better logging
# - More robust scripts
# - [v2.1] pull-rebase + retry logic to prevent race conditions
#
# Version files per project type: .github/config/project-types.json (version_manager reads it)
# Table: https://cassiiopeia.github.io/projectops/version-control
# ===================================================================

name: PROJECT-VERSION-CONTROL

# Prevent concurrent runs (https://github.com/Cassiiopeia/projectops/issues/63)
concurrency:
  group: version-increment
  cancel-in-progress: false

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'CHANGELOG.json'
      - 'version.yml'  # prevents infinite loops
  workflow_dispatch:

permissions:
  contents: write

# The commit step stages the whole working tree: keep Python from writing __pycache__/*.pyc there (#1288)
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  version-bump:
    name: Auto bump version
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch || 'main' }}

      - name: Detect release merge (safety guard)
        id: release_guard
        run: |
          BEFORE="${{ github.event.before }}"
          # Without BEFORE (new branch with zero SHA, force push, etc.), check only the previous commit
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="HEAD^..HEAD"
          else
            RANGE="$BEFORE..HEAD"
          fi
          # Decided by the `version:` value, not the file name (#806).
          # version.yml also holds settings (options.*, metadata.template.*), so pushes changing only settings
          # and projectops update PRs were mistaken for releases and lost their version/tag.
          RELEASE_MERGE=false
          if git diff --name-only $RANGE 2>/dev/null | grep -qx "version.yml"; then
            BASE="${RANGE%%..*}"
            OLD_V=$(git show "$BASE:version.yml" 2>/dev/null | grep -m1 -E '^version:' || true)
            NEW_V=$(grep -m1 -E '^version:' version.yml 2>/dev/null || true)
            # If version.yml did not exist before (first integration), skip as before — the initial version is not bumped right away.
            if [ -z "$OLD_V" ] || [ "$OLD_V" != "$NEW_V" ]; then
              RELEASE_MERGE=true
            else
              echo "ℹ️ version.yml changed but the version value did not (${NEW_V}), treating it as a settings change and bumping"
            fi
          fi
          echo "range=$RANGE" >> $GITHUB_OUTPUT
          if [ "$RELEASE_MERGE" = "true" ]; then
            echo "is_release_merge=true" >> $GITHUB_OUTPUT
            echo "✅ Release merge detected (version value changed), skipping the bump"
          else
            echo "is_release_merge=false" >> $GITHUB_OUTPUT
            echo "⚠️ Direct push to main detected, running the safety-net bump"
          fi

      - name: Make version scripts executable
        if: steps.release_guard.outputs.is_release_merge != 'true'
        run: |
          chmod +x .github/scripts/version_manager.sh
          echo "Version scripts are executable"

      - name: Read and sync current version
        id: current_version
        if: steps.release_guard.outputs.is_release_merge != 'true'
        run: |
          echo "🔍 Reading and syncing the current version..."
          CURRENT_VERSION=$(./.github/scripts/version_manager.sh get | tail -n 1)
          if [ -z "$CURRENT_VERSION" ]; then
            echo "❌ Failed to read the version"
            exit 1
          fi
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Current version: $CURRENT_VERSION"

      - name: Decide bump level
        id: bump
        if: steps.release_guard.outputs.is_release_merge != 'true'
        env:
          RANGE: ${{ steps.release_guard.outputs.range }}
        run: |
          BUMP=patch
          SEMVER_AUTO=$(python3 .github/scripts/version_manager.py get-option semver_auto true 2>/dev/null || echo "true")
          if [ "$SEMVER_AUTO" != "true" ]; then
            echo "ℹ️ semver_auto is off, using patch"
          else
            # Decide from commit subjects in the push range regardless of a development branch (same rule as RELEASE-CHANGELOG).
            git log --pretty=%s $RANGE > "$RUNNER_TEMP/commits.txt"
            BUMP=$(python3 .github/scripts/changelog_manager.py classify-bump --commits-file "$RUNNER_TEMP/commits.txt" | tail -n 1)
            echo "ℹ️ semver_auto: deciding from $(wc -l < "$RUNNER_TEMP/commits.txt") push range commit lines"
          fi
          case "$BUMP" in major|minor|patch) ;; *) echo "⚠️ Unexpected bump '$BUMP', using patch"; BUMP=patch ;; esac
          echo "bump=$BUMP" >> $GITHUB_OUTPUT
          echo "✅ Bump level: $BUMP"

      - name: Compute and write new version
        id: version
        if: steps.release_guard.outputs.is_release_merge != 'true'
        run: |
          BUMP="${{ steps.bump.outputs.bump }}"
          echo "⬆️ Bumping version ($BUMP)..."
          NEW_VERSION=$(./.github/scripts/version_manager.sh increment --bump "${BUMP:-patch}" | tail -n 1)
          if [ -z "$NEW_VERSION" ]; then
            echo "❌ Version update failed"
            exit 1
          fi
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "✅ New version: $NEW_VERSION"

      - name: Read project type
        id: project_info
        if: steps.release_guard.outputs.is_release_merge != 'true'
        run: |
          if [ -f "version.yml" ]; then
            # Multi-type — extract the project_types array as csv (v4.1.0 SSOT: the singular project_type key is not read)
            PROJECT_TYPES=$(python3 .github/scripts/version_manager.py get-types 2>/dev/null || true)  # #851 also reads block lists
            # primary type = first array item
            PROJECT_TYPE=$(echo "$PROJECT_TYPES" | cut -d',' -f1)
            [ -z "$PROJECT_TYPE" ] && PROJECT_TYPE="unknown"
            [ -z "$PROJECT_TYPES" ] && PROJECT_TYPES="$PROJECT_TYPE"
            echo "project_type=$PROJECT_TYPE" >> $GITHUB_OUTPUT
            echo "project_types=$PROJECT_TYPES" >> $GITHUB_OUTPUT
            echo "Project type: $PROJECT_TYPE (all: $PROJECT_TYPES)"
          else
            echo "project_type=unknown" >> $GITHUB_OUTPUT
            echo "project_types=unknown" >> $GITHUB_OUTPUT
            echo "⚠️ version.yml not found."
          fi

      - name: Check and commit changes
        if: steps.release_guard.outputs.is_release_merge != 'true'
        run: |
          echo "📝 Configuring Git and checking changes..."
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # Stage all changes
          git add -A

          # Check for changes
          if git diff --staged --quiet; then
            echo "ℹ️ No changes (already in sync)."
          else
            echo "📤 Committing changes..."
            REPO_NAME=$(basename "${{ github.repository }}")
            NEW_VERSION="${{ steps.version.outputs.new_version }}"
            # The commit message uses the version.yml language (#787). Without the catalog, the old Korean text.
            COMMIT_TITLE=$(python3 .github/scripts/i18n/messages.py get release.commit.version_control --var repo="$REPO_NAME" --var version="$NEW_VERSION" 2>/dev/null) \
              || COMMIT_TITLE="$REPO_NAME 버전 정보 관리: chore: 버전 $NEW_VERSION"
            COMMIT_MSG="$COMMIT_TITLE [skip ci]"

            if git commit -m "$COMMIT_MSG"; then
              # Prevent race conditions: pull-rebase, then push (up to 3 retries)
              MAX_RETRIES=3
              RETRY_COUNT=0
              PUSH_SUCCESS=false

              while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
                RETRY_COUNT=$((RETRY_COUNT + 1))
                echo "🔄 Push attempt $RETRY_COUNT/$MAX_RETRIES..."

                if git push; then
                  PUSH_SUCCESS=true
                  echo "✅ Version update committed"
                  break
                else
                  echo "⚠️ Push failed, syncing remote changes..."

                  # Fetch the latest from remote and rebase
                  if git pull --rebase origin ${{ github.event.repository.default_branch || 'main' }}; then
                    echo "✅ Rebase succeeded, retrying push..."
                  else
                    echo "❌ Rebase failed, resolve the conflict"
                    git rebase --abort 2>/dev/null || true
                    exit 1
                  fi
                fi
              done

              if [ "$PUSH_SUCCESS" = false ]; then
                echo "❌ Push failed after $MAX_RETRIES attempts"
                exit 1
              fi
            else
              echo "❌ Commit failed"
              exit 1
            fi
          fi

      - name: Create Git tag
        if: steps.release_guard.outputs.is_release_merge != 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          # An empty version pushes a tag named just "v" and reports success (#545).
          if [ -z "$NEW_VERSION" ]; then
            echo "::error::Release version is empty, stopping without creating a tag."
            exit 1
          fi
          if ! printf '%s' "$NEW_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::Release version is not semver: '$NEW_VERSION'"
            exit 1
          fi

          TAG_NAME="v$NEW_VERSION"

          echo "🏷️ Creating Git tag: $TAG_NAME"

          # Check for an existing tag
          if git tag -l | grep -q "^$TAG_NAME$"; then
            echo "⚠️ Tag $TAG_NAME already exists, skipping."
          else
            if git tag "$TAG_NAME" && git push origin "$TAG_NAME"; then
              echo "✅ Created Git tag: $TAG_NAME"
            else
              echo "❌ Failed to create tag: $TAG_NAME"
              exit 1
            fi
          fi

          # Check it actually reached the remote — if push fails silently,
          # everything is green but the tag is missing (the real incident in #545).
          if ! git ls-remote --tags origin "refs/tags/$TAG_NAME" | grep -q "$TAG_NAME"; then
            echo "::error::Tag $TAG_NAME is not on the remote, the release is missing."
            exit 1
          fi

      - name: Version update summary
        if: always()
        run: |
          echo ""
          echo "🎉 Version update workflow done"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 Summary:"
          echo "  📦 Project type: ${{ steps.project_info.outputs.project_type }}"
          echo "  📌 Previous version: ${{ steps.current_version.outputs.current_version }}"
          echo "  🆙 New version: ${{ steps.version.outputs.new_version }}"
          echo "  🔖 Git tag: v${{ steps.version.outputs.new_version }}"
          echo "  📝 Commit: ${{ github.sha }}"
          echo "  🌿 Branch: $GITHUB_REF_NAME"
          echo "  🕐 Time: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Show an error only on failure
          if [ "${{ job.status }}" != "success" ]; then
            echo "❌ Some steps failed. Check the log."
          else
            echo "✅ All steps succeeded."
          fi