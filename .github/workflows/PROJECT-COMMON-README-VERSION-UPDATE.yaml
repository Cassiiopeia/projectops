# ===================================================================
# PROJECT-COMMON-README-VERSION-UPDATE.yaml
# README 파일 버전 자동 업데이트 워크플로우
# ===================================================================
#
# 이 워크플로우는 main 브랜치로 푸시가 발생할 때 README.md 파일의
# 버전 정보를 version_manager.sh를 통해 가져와 자동으로 업데이트합니다.
#
# ===================================================================
# 작동 방식:
# 1. main 브랜치 푸시 시 트리거
# 2. version_manager.sh를 통해 최신 버전 정보 추출
# 3. README.md 파일의 버전 정보 업데이트
# 4. 변경사항 커밋 및 푸시
#
# ⚠️ README.md 파일 버전 표기 가이드라인:
#
# ✅ 지원되는 버전 표기 형식들:
# - ## 최신 버전 : v1.0.0 (2025-08-15)
# - ## 최신버전 : v1.0.0 (2025-08-15)
# - ## Current Version : v1.0.0 (2025-08-15)
# - ## Recent Version : v1.0.0 (2025-08-15)
# - ## Version : v1.0.0 (2025-08-15)
# - ## 버전 : v1.0.0 (2025-08-15)
#
# - 대소문자 구분 없음
# - 콜론(:) 앞뒤 공백 자유롭게 허용
# - "version", "버전", "최신", "current", "recent" 등의 키워드 포함 시 자동 인식
# - 주석 <!-- AUTO-VERSION-SECTION: DO NOT EDIT MANUALLY -->가 자동으로 추가됩니다.
#
# ❌ 지원되지 않는 형식 (에러 발생):
# - ## 최신 버전: v1.0.0** (마크다운 볼드 문자 사용 금지)
# - ## 최신 버전 v1.0.0 (콜론 누락)
# - 정규표현식 특수문자(*, [, ], ^, $) 포함된 버전 표기
#
# 🔧 환경변수 설정:
# - SHOW_DATE: 버전에 날짜 표시 여부 (true/false, 기본값: true)
#   * true: v1.0.0 (2025-08-16) 형식
#   * false: v1.0.0 형식
# ===================================================================

name: README VERSION UPDATE

# 환경변수 설정 - 사용자 맞춤 설정
env:
  # 버전에 날짜 표시 여부 (true/false)
  SHOW_DATE: true  # 🔧 이 값을 false로 변경하면 날짜가 표시되지 않습니다

on:
  push:
    branches: ["main"]
  # PAT 없이 릴리스한 경우 push 트리거가 발생하지 않으므로(#551) 릴리스 워크플로우가 직접 깨운다.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    name: Update README version info
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch || 'main' }}

      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Read latest version with version_manager.sh
        id: version_info
        run: |
          # 버전 관리 스크립트에 실행 권한 부여
          chmod +x .github/scripts/version_manager.sh
          
          # version_manager.sh를 통해 최신 버전 가져오기
          LATEST_VERSION=$(.github/scripts/version_manager.sh get | tail -n 1)
          
          # 현재 날짜를 릴리즈 날짜로 사용
          RELEASE_DATE=$(date '+%Y-%m-%d')
          
          # 버전 정보 저장
          echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
          echo "release_date=$RELEASE_DATE" >> $GITHUB_OUTPUT

      - name: Update version info in README.md
        run: |
          LATEST_VERSION="${{ steps.version_info.outputs.latest_version }}"
          RELEASE_DATE="${{ steps.version_info.outputs.release_date }}"
          SHOW_DATE="${{ env.SHOW_DATE }}"

          # README.md 가 없는 프로젝트도 많다 — 없으면 실패시키지 않고 건너뛴다 (#726)
          if [ ! -f README.md ]; then
            echo "::notice::No README.md, skipping the version line (it is added on the next push once README.md exists)"
            exit 0
          fi

          # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          # 에러 메시지 출력 함수
          # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
          print_error_message() {
            local error_type="$1"
            local version_line="$2"
            local header_part="$3"
            local version_text="$4"

            echo ""
            echo "❌ README.md version update failed"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "🔍 Error type: $error_type"
            echo ""
            echo "📋 Diagnostics:"
            echo "   • Current version line: $version_line"
            echo "   • Extracted header: $header_part"
            echo "   • New version text: $version_text"
            echo ""
            echo "💡 How to fix:"
            echo "   Make sure the version line in README.md matches one of these formats:"
            echo ""
            echo "   ✅ Supported formats:"
            echo "      • ## Latest version : v1.0.0 (2025-08-15)"
            echo "      • ## 최신 버전 : v1.0.0 (2025-08-15)"
            echo "      • ## 최신버전 : v1.0.0"
            echo "      • ## Version : v1.0.0"
            echo "      • ## Current Version : v1.0.0 (2025-08-15)"
            echo ""
            echo "   ⚠️ Notes:"
            echo "      • Do not use markdown bold (**)"
            echo "      • Do not use regex special characters (*, [, ], ^, $)"
            echo "      • The version must come right after the colon (:)"
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          }

          # 날짜 표시 여부에 따라 버전 형식 결정
          if [ "$SHOW_DATE" = "true" ]; then
            VERSION_TEXT="v${LATEST_VERSION} (${RELEASE_DATE})"
            echo "🗓️ Version with date: $VERSION_TEXT"
          else
            VERSION_TEXT="v${LATEST_VERSION}"
            echo "📋 Version only: $VERSION_TEXT"
          fi

          # 다양한 버전 표기 패턴을 찾기 위한 정규표현식
          # 대소문자 무시, 공백 유연하게 처리
          VERSION_PATTERNS=(
            "^##[[:space:]]*최신[[:space:]]*버전[[:space:]]*:"
            "^##[[:space:]]*최신버전[[:space:]]*:"
            "^##[[:space:]]*[Cc]urrent[[:space:]]*[Vv]ersion[[:space:]]*:"
            "^##[[:space:]]*[Rr]ecent[[:space:]]*[Vv]ersion[[:space:]]*:"
            "^##[[:space:]]*[Vv]ersion[[:space:]]*:"
            "^##[[:space:]]*버전[[:space:]]*:"
            "^##[[:space:]]*[Ll]atest[[:space:]]*[Vv]ersion[[:space:]]*:"
          )

          # 버전 라인 찾기
          VERSION_LINE=""
          PATTERN_FOUND=""

          for pattern in "${VERSION_PATTERNS[@]}"; do
            if grep -qi "$pattern" README.md; then
              VERSION_LINE=$(grep -i "$pattern" README.md | head -n 1)
              PATTERN_FOUND="$pattern"
              echo "✅ Found version line: $VERSION_LINE"
              break
            fi
          done

          # 버전 라인이 없으면 기본 형식으로 추가
          if [ -z "$VERSION_LINE" ]; then
            echo "📝 No version line found, adding one"

            # 새 제목은 version.yml 의 언어(options.language)를 따른다 (#769). 두 제목 모두 위 패턴이 다시 찾는다.
            # 카탈로그가 없는 오래된 설치는 기존 한국어 제목으로 대체한다.
            VERSION_HEADING=$(python3 .github/scripts/i18n/messages.py get readme.version_heading 2>/dev/null) \
              || VERSION_HEADING="최신 버전"

            # 파일 맨 앞에 제목이 있는지 확인 후 그 다음에 추가
            if grep -q "^# " README.md; then
              # 첫 번째 제목 다음에 추가
              sed -i '/^# /a\\n<!-- AUTO-VERSION-SECTION: DO NOT EDIT MANUALLY -->\n## '"$VERSION_HEADING"' : '"$VERSION_TEXT" README.md
            else
              # 파일 맨 앞에 추가
              sed -i '1i\<!-- AUTO-VERSION-SECTION: DO NOT EDIT MANUALLY -->\n## '"$VERSION_HEADING"' : '"$VERSION_TEXT"'\n' README.md
            fi
            echo "✅ Added version line: $VERSION_TEXT"
          else
            # 기존 버전 라인 업데이트

            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            # 버전 라인 형식 검증 및 경고
            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            if [[ "$VERSION_LINE" =~ \*\* ]]; then
              echo ""
              echo "⚠️ Warning: the version line contains markdown bold (**)"
              echo "   Current version line: $VERSION_LINE"
              echo "   This may make the version update fail"
              echo ""
            fi

            # HTML 주석이 해당 라인 위에 있는지 확인
            LINE_NUMBER=$(grep -n -i "$PATTERN_FOUND" README.md | head -n 1 | cut -d: -f1)
            PREV_LINE_NUMBER=$((LINE_NUMBER - 1))

            if [ $PREV_LINE_NUMBER -gt 0 ]; then
              PREV_LINE=$(sed -n "${PREV_LINE_NUMBER}p" README.md)
              if [[ "$PREV_LINE" != *"AUTO-VERSION-SECTION"* ]]; then
                # 주석이 없으면 버전 라인 위에 추가
                sed -i "${PREV_LINE_NUMBER}a\\<!-- AUTO-VERSION-SECTION: DO NOT EDIT MANUALLY -->" README.md
                echo "✅ Added auto-update marker comment"
                # 주석 추가로 라인 번호가 변경됨
                LINE_NUMBER=$((LINE_NUMBER + 1))
              fi
            else
              # 첫 번째 라인이면 그 위에 추가
              sed -i '1i\<!-- AUTO-VERSION-SECTION: DO NOT EDIT MANUALLY -->' README.md
              echo "✅ Added auto-update marker comment"
              # 주석 추가로 라인 번호가 변경됨
              LINE_NUMBER=$((LINE_NUMBER + 1))
            fi

            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            # 헤더 부분 추출 (콜론까지만 추출하여 안전하게 처리)
            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            HEADER_PART=$(echo "$VERSION_LINE" | sed 's/\(.*:\).*/\1 /')

            # 헤더 추출 실패 검증
            if [ -z "$HEADER_PART" ] || [[ "$HEADER_PART" == "$VERSION_LINE" ]]; then
              print_error_message "Header extraction failed - no colon (:) found" "$VERSION_LINE" "$HEADER_PART" "$VERSION_TEXT"
              exit 1
            fi

            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            # 라인 번호 기반으로 직접 교체 (정규표현식 특수문자 문제 회피)
            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            NEW_LINE="${HEADER_PART}${VERSION_TEXT}"

            if ! sed -i "${LINE_NUMBER}s|.*|${NEW_LINE}|" README.md 2>/tmp/sed_error.log; then
              SED_ERROR=$(cat /tmp/sed_error.log 2>/dev/null || echo "unknown sed error")
              print_error_message "sed command failed - $SED_ERROR" "$VERSION_LINE" "$HEADER_PART" "$VERSION_TEXT"
              exit 1
            fi

            # 변경 결과 검증
            UPDATED_LINE=$(sed -n "${LINE_NUMBER}p" README.md)
            if [[ "$UPDATED_LINE" != *"$VERSION_TEXT"* ]]; then
              print_error_message "Version replacement check failed" "$VERSION_LINE" "$HEADER_PART" "$VERSION_TEXT"
              echo "   • Updated line: $UPDATED_LINE"
              exit 1
            fi

            echo "✅ Version info updated: $VERSION_TEXT"
          fi

      - name: Commit and push changes
        run: |
          DEFAULT_BRANCH="${{ github.event.repository.default_branch || 'main' }}"
          # README.md 가 없으면 git add 가 pathspec 오류(128)로 죽는다 (#726)
          if [ -f README.md ]; then git add README.md; fi

          if git diff --staged --quiet; then
            echo "📝 No changes in README.md"
          else
            REPO_NAME=$(basename "${{ github.repository }}")
            VERSION="${{ steps.version_info.outputs.latest_version }}"

            # 커밋 메시지는 version.yml 의 언어(options.language)로 만든다 (#787).
            # 카탈로그가 없는 오래된 설치는 기존 한국어 문구로 대체한다 — 메시지 때문에 릴리스가 막히면 안 된다.
            COMMIT_TITLE=$(python3 .github/scripts/i18n/messages.py get release.commit.readme --var repo="$REPO_NAME" --var version="$VERSION" 2>/dev/null) \
              || COMMIT_TITLE="$REPO_NAME 버전 관리 : docs : v$VERSION README 버전 정보 업데이트"
            git commit -m "$COMMIT_TITLE [skip ci]"

            # Race Condition 방지: pull-rebase 후 push (최대 3회 재시도)
            MAX_RETRIES=3
            RETRY_COUNT=0
            PUSH_SUCCESS=false

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "🔄 Push attempt $RETRY_COUNT/$MAX_RETRIES..."

              if git push origin HEAD:$DEFAULT_BRANCH; then
                PUSH_SUCCESS=true
                echo "✅ README.md version info updated"
                break
              else
                echo "⚠️ Push failed, syncing remote changes..."

                # --autostash: 앞 단계의 chmod +x 같은 스테이징 안 된 변경이 있으면
                # 일반 rebase 는 "You have unstaged changes" 로 거부해 재시도가 한 번도 못 돈다 (#807).
                if git pull --rebase --autostash origin $DEFAULT_BRANCH; then
                  echo "✅ Rebase succeeded, retrying push..."
                else
                  echo "❌ Rebase failed, resolve the conflict"
                  git rebase --abort 2>/dev/null || true
                  exit 1
                fi
              fi
            done

            if [ "$PUSH_SUCCESS" = false ]; then
              echo "❌ Push failed after $MAX_RETRIES attempts"
              exit 1
            fi
          fi
