# ===================================================================
# PROJECT-TEMPLATE-INITIALIZER.yaml
# GitHub 템플릿 자동 초기화 워크플로우
# ===================================================================
#
# 이 워크플로우는 GitHub 템플릿을 통해 새 프로젝트가 생성될 때
# 자동으로 실행되어 프로젝트를 초기 상태로 설정합니다.
#
# ===================================================================
# 🔥 안전장치:
# 1. 이슈 개수 확인 (0개 = 새 저장소)
# 2. 저장소 생성일 확인 (최근 1시간 이내)
#
# 자동화 작업:
# 1. version.yml을 0.0.0, basic 타입으로 초기화
# 2. CHANGELOG.md, CHANGELOG.json 파일 삭제
# 3. README.md를 기본 템플릿으로 초기화
# 4. 이슈 템플릿의 assignee를 현재 저장소 소유자로 변경
# 5. 초기화 완료 후 이 워크플로우 파일 자체를 삭제 (일회성)
#
# 🛡️ 안전장치:
# - 다중 조건 검증으로 중복 실행 완전 차단
# - 템플릿이 아닌 기존 프로젝트에서 실행 방지
# - 초기화 완료 후 워크플로우 자체 삭제로 재실행 불가
# ===================================================================

name: PROJECT-TEMPLATE-INITIALIZER

on:
  workflow_dispatch:  # 수동 실행
  push:
    paths:
      - '.github/scripts/template_initializer.sh'

# 동시 실행 방지
concurrency:
  group: template-initializer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-initialization-needed:
    name: Check whether initialization is needed
    runs-on: ubuntu-latest
    outputs:
      needs_init: ${{ steps.check.outputs.needs_init }}
      project_name: ${{ steps.check.outputs.project_name }}
      current_version: ${{ steps.check.outputs.current_version }}
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Check whether initialization is needed (issue count + repository age)
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log("=== 🔍 Checking whether template initialization is needed ===");
            
            let needsInit = true;
            let failureReasons = [];
            
            // 1. 이슈 개수 확인 (0개 = 새 저장소)
            console.log("1️⃣ Checking issue count...");
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 1
            });
            
            if (issues.length > 0) {
              console.log(`❌ Found ${issues.length} issue(s). (not a new repository)`);
              failureReasons.push(`${issues.length} issue(s) exist`);
              needsInit = false;
            } else {
              console.log("✅ No issues. (new repository)");
            }
            
            // 2. 저장소 생성일 확인 (최근 1시간 이내)
            console.log("2️⃣ Checking repository creation time...");
            const { data: repo } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo
            });
            
            const createdAt = new Date(repo.created_at);
            const now = new Date();
            const ageHours = (now - createdAt) / (1000 * 60 * 60);
            
            console.log(`Repository created: ${createdAt.toISOString()}`);
            console.log(`Current time: ${now.toISOString()}`);
            console.log(`Repository age: ${ageHours.toFixed(1)} hours`);
            
            if (ageHours > 1) { // 1시간 이상
              console.log("❌ Repository is more than 1 hour old.");
              failureReasons.push(`repository age ${ageHours.toFixed(1)} hours`);
              needsInit = false;
            } else {
              console.log("✅ Repository was created within the last hour.");
            }
            
            // 결과 설정
            const projectName = context.repo.repo;
            const currentVersion = "template";
            
            core.setOutput('needs_init', needsInit.toString());
            core.setOutput('project_name', projectName);
            core.setOutput('current_version', currentVersion);
            
            console.log("\n=== 🎯 Result ===");
            if (needsInit) {
              console.log("✅ Template initialization is needed.");
              console.log(`Project name: ${projectName}`);
              console.log(`Repository age: ${ageHours.toFixed(1)} hours`);
            } else {
              console.log("❌ Template initialization is not needed.");
              console.log("Reasons:", failureReasons.join(', '));
            }

  initialize-template:
    name: Initialize template
    runs-on: ubuntu-latest
    needs: check-initialization-needed
    if: needs.check-initialization-needed.outputs.needs_init == 'true'
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Make initializer script executable
        run: |
          chmod +x .github/scripts/template_initializer.sh

      - name: Run template initializer
        run: |
          echo "=== Template initialization started ==="
          
          # 스크립트 실행 (옵션 플래그 방식)
          ./.github/scripts/template_initializer.sh \
            --version 0.0.0 \
            --type basic
          
          echo "=== Initialization finished ==="

      - name: Commit and push changes
        run: |
          echo "=== Preparing commit ==="
          
          # 워크플로우 파일 삭제 (일회성 실행)
          if [ -f ".github/workflows/PROJECT-TEMPLATE-INITIALIZER.yaml" ]; then
            rm -f .github/workflows/PROJECT-TEMPLATE-INITIALIZER.yaml
            echo "✅ Removed the template initializer workflow file."
          fi
          
          # 변경된 파일들 확인
          git status --porcelain
          
          # 모든 변경사항 스테이징
          git add .
          
          # 변경사항이 있는지 확인
          if git diff --staged --quiet; then
            echo "❌ No changes to commit."
            exit 1
          fi
          
          # 커밋 메시지 생성
          commit_message="projectops : init : ${{ needs.check-initialization-needed.outputs.project_name }} base template initialized

          Initialization steps run automatically:
          - version.yml → 0.0.0, basic type
          - CHANGELOG.md, CHANGELOG.json → removed
          - LICENSE, CONTRIBUTING.md → removed
          - test folder (.github/scripts/test) → removed
          - README.md → reset to the base template
          - issue template assignee → ${{ github.repository_owner }}
          - template initializer workflow removed (one-time run finished)
          
          Project: ${{ needs.check-initialization-needed.outputs.project_name }}
          Initialized at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")"
          
          # 커밋 실행
          git commit -m "$commit_message"
          
          # 원격 저장소 최신 상태 확인 후 푸시
          DEFAULT_BRANCH="${{ github.event.repository.default_branch || 'main' }}"
          git fetch origin $DEFAULT_BRANCH
          
          # 충돌이 있으면 강제 푸시 (템플릿 초기화는 한 번만 실행되므로 안전)
          if ! git push origin $DEFAULT_BRANCH; then
            echo "⚠️ Push rejected, retrying with --force-with-lease..."
            git push --force-with-lease origin $DEFAULT_BRANCH
          fi
          
          echo "✅ Initialization committed and pushed"

      - name: Create develop branch
        run: |
          if git ls-remote --exit-code --heads origin develop >/dev/null 2>&1; then
            echo "✅ develop branch already exists — skipped"
          else
            git push origin HEAD:develop
            echo "✅ Created develop branch (day-to-day work goes to develop; releases go through a develop→main PR)"
          fi
