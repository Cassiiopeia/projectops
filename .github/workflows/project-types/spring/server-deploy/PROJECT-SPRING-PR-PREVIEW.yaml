# ===================================================================
# Spring Boot PR/Issue Preview system (SSH + Docker)
# ===================================================================
#
# 🔑 Required GitHub Secrets
# ===================================================================
# APPLICATION_PROD_YML (optional): contents of application-prod.yml
# DOCKERHUB_USERNAME: Docker Hub user name
# DOCKERHUB_TOKEN: Docker Hub access token
# SERVER_HOST: deploy server address
# SERVER_USER: SSH user name
# SERVER_PASSWORD: SSH password (when SSH_AUTH_METHOD=password)
# SSH_KEY: SSH private key .pem contents (when SSH_AUTH_METHOD=key, AWS EC2 etc.)
# ===================================================================
#
# 🚀 Usage:
#   @projectops server build    - build and deploy the PR/issue
#   @projectops server destroy  - delete the Preview environment
#   @projectops server status   - check the current state
#
# 📊 Resource naming:
#   - Container: {PROJECT_NAME}-pr-{PR number}
#   - Image: {DOCKERHUB_USERNAME}/{PROJECT_NAME}:pr-{PR number}
#   - Domain: {PROJECT_NAME}-pr-{PR number}.pr.suhsaechan.kr
#   - Preview URL: http://{domain}:8079
#
# ===================================================================

name: PROJECT-SPRING-PR-PREVIEW

# ===================================================================
# ⚠️ [Section 1] Per-project settings - edit only this section when using it in another project
# ===================================================================
env:
  # Project identifier (used for container name, image name, domain) (edit per project)
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo

  # Spring Boot build settings (edit per project)
  JAVA_VERSION: "__JAVA_VERSION__"  # @wizard ask:21
  GRADLE_BUILD_CMD: './gradlew clean build -x test -Dspring.profiles.active=prod'
  JAR_PATH: 'Suh-Web/build/libs/*.jar'  # For multi-module builds, edit the build output path yourself
  APPLICATION_YML_PATH: "__APPLICATION_YML_PATH__"  # @wizard auto:spring-app-yml-path

  # Docker settings (edit per project)
  DOCKERFILE_PATH: './Dockerfile'
  INTERNAL_PORT: '8080'

  # 🗂️ Volume mount settings (edit per project; empty = no mount)
  PROJECT_TARGET_DIR: ""  # data directory on the server (e.g. /volume1/projects/myapp/data)
  PROJECT_MNT_DIR: ""     # mount path inside the container (e.g. /mnt/myapp)

  # Traefik & Preview domain settings (do not change after the environment is set up)
  TRAEFIK_NETWORK: traefik-network
  PREVIEW_DOMAIN_SUFFIX: pr.suhsaechan.kr
  PREVIEW_PORT: '8079'

  # 🔐 SSH auth method: "password" (Synology, regular servers) | "key" (AWS EC2, .pem)
  #   password → uses the SERVER_PASSWORD secret
  #   key      → uses the SSH_KEY secret (the full .pem file contents as the secret value)
  SSH_AUTH_METHOD: "password"  # @wizard ask:password

  # SSH port (do not change after the server port is set up)
  SSH_PORT: '2022'

  # Issue Helper comment marker (edit per project)
  # Used to extract the branch name from issue comments
  ISSUE_HELPER_MARKER: 'Guide by SUH-LAB'

  # Health check settings (edit per project)
  # - HEALTH_CHECK_PATH: HTTP health check path (empty = skip the HTTP check)
  # - HEALTH_CHECK_LOG_PATTERN: log pattern match (fallback when HTTP fails)
  # - API_DOCS_PATH: API docs URL (empty = not shown in the deploy comment)
  #
  # Spring Boot defaults:
  #   HEALTH_CHECK_PATH: '/actuator/health'
  #   HEALTH_CHECK_LOG_PATTERN: 'Started .* in [0-9.]+ seconds'
  #   API_DOCS_PATH: '/swagger-ui.html' or '/swagger-ui/index.html'
  HEALTH_CHECK_PATH: '/actuator/health'
  HEALTH_CHECK_LOG_PATTERN: 'Started .* in [0-9.]+ seconds'
  API_DOCS_PATH: '/docs/swagger'

# ===================================================================
# Trigger settings
# ===================================================================
on:
  issue_comment:
    types: [created]      # PR comments + issue comments
  issues:
    types: [closed]       # destroy when the issue closes
  pull_request:
    types: [closed]       # destroy when the PR closes

permissions:
  contents: read
  pull-requests: write
  issues: write

# ===================================================================
# Jobs
# ===================================================================
jobs:
  # -----------------------------------------------------------------
  # Job 1: parse the command (supports PR and issue comments)
  # -----------------------------------------------------------------
  check-command:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: Check command
    # Keep anyone on a public repo from triggering a server deploy by comment. Change the allow list with PROJECTOPS_TRIGGER_ASSOCIATIONS
    if: |
      github.event_name == 'issue_comment' &&
      (
        github.event.repository.private == true ||
        contains(fromJSON(vars.PROJECTOPS_TRIGGER_ASSOCIATIONS || '["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.parse.outputs.command }}
      is_valid: ${{ steps.parse.outputs.is_valid }}
      is_pr: ${{ steps.parse.outputs.is_pr }}
      custom_branch: ${{ steps.parse.outputs.custom_branch }}
      is_custom_branch: ${{ steps.parse.outputs.is_custom_branch }}
    steps:
      - name: Add 👀 reaction to the comment
        # Skip bot guide comments (#576) — guide text has matched the condition and misfired before
        if: ${{ !contains(github.event.comment.body, '<!-- SUH-ISSUE-HELPER -->') && contains(github.event.comment.body, '@projectops') && contains(github.event.comment.body, 'server') }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Parse the command
        id: parse
        env:
          COMMENT: ${{ github.event.comment.body }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
        run: |
          # Check whether it is a PR or an issue
          if [[ "$IS_PR" == "true" ]]; then
            echo "is_pr=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Command detected in a PR comment"
          else
            echo "is_pr=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Command detected in an issue comment"
          fi

          # Parse the command (supports a branch parameter)
          # Format: @projectops server <command> [branch-name]
          if [[ "$COMMENT" =~ @projectops[[:space:]]+server[[:space:]]+build([[:space:]]+([^[:space:]]+))? ]]; then
            echo "command=build" >> $GITHUB_OUTPUT
            echo "is_valid=true" >> $GITHUB_OUTPUT
            if [[ -n "${BASH_REMATCH[2]}" ]]; then
              echo "custom_branch=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
              echo "is_custom_branch=true" >> $GITHUB_OUTPUT
              echo "✅ Command detected: build (branch: ${BASH_REMATCH[2]})"
            else
              echo "is_custom_branch=false" >> $GITHUB_OUTPUT
              echo "✅ Command detected: build"
            fi
          elif [[ "$COMMENT" =~ @projectops[[:space:]]+server[[:space:]]+destroy([[:space:]]+([^[:space:]]+))? ]]; then
            echo "command=destroy" >> $GITHUB_OUTPUT
            echo "is_valid=true" >> $GITHUB_OUTPUT
            if [[ -n "${BASH_REMATCH[2]}" ]]; then
              echo "custom_branch=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
              echo "is_custom_branch=true" >> $GITHUB_OUTPUT
              echo "✅ Command detected: destroy (branch: ${BASH_REMATCH[2]})"
            else
              echo "is_custom_branch=false" >> $GITHUB_OUTPUT
              echo "✅ Command detected: destroy"
            fi
          elif [[ "$COMMENT" =~ @projectops[[:space:]]+server[[:space:]]+status([[:space:]]+([^[:space:]]+))? ]]; then
            echo "command=status" >> $GITHUB_OUTPUT
            echo "is_valid=true" >> $GITHUB_OUTPUT
            if [[ -n "${BASH_REMATCH[2]}" ]]; then
              echo "custom_branch=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
              echo "is_custom_branch=true" >> $GITHUB_OUTPUT
              echo "✅ Command detected: status (branch: ${BASH_REMATCH[2]})"
            else
              echo "is_custom_branch=false" >> $GITHUB_OUTPUT
              echo "✅ Command detected: status"
            fi
          else
            echo "is_valid=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Not an @projectops server command"
          fi

  # -----------------------------------------------------------------
  # Job 2-1: build & deploy (run from a PR comment)
  # -----------------------------------------------------------------
  build-preview-pr:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: Build & deploy preview (PR)
    needs: check-command
    if: |
      needs.check-command.outputs.is_valid == 'true' &&
      needs.check-command.outputs.command == 'build' &&
      needs.check-command.outputs.is_pr == 'true' &&
      needs.check-command.outputs.is_custom_branch != 'true'
    runs-on: ubuntu-latest
    steps:
      # Comment text follows the repo language (version.yml options.language) (#769).
      # Fetch only the catalog as a module in $RUNNER_TEMP and delete the fetched folder (so it does not clash with the later checkout)
      # Fetched from the default branch — the merge ref of a PR closed event may already be gone
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js spring_preview. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha.substring(0, 7));
            return pr.data.number;

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Progress comment system
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Create progress comment
        id: progress
        uses: actions/github-script@v7
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const prNumber = context.issue.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const startTime = Date.now();

            const body = [
              t('spring_preview.heading.pr_building'),
              '',
              t('spring_preview.table.stage_header'),
              '|------|------|----------|',
              t('spring_preview.row.build', { status: t('spring_preview.status.running'), time: '-' }),
              t('spring_preview.row.docker', { status: t('spring_preview.status.waiting'), time: '-' }),
              t('spring_preview.row.deploy', { status: t('spring_preview.status.waiting'), time: '-' }),
              '',
              t('spring_preview.link.live_log', { url: runUrl }),
              '',
              '---',
              t('spring_preview.footer.auto_update')
            ].join('\n');

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

            core.setOutput('comment_id', comment.id);
            core.setOutput('start_time', startTime);

      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      # =================================================================
      # ⚠️ [Section 2] Create per-project secret files
      # =================================================================
      #
      # 📋 Required (every Spring Boot project):
      #   - application-prod.yml
      #
      # 📋 Optional (add/remove per project):
      #   - Firebase: firebase-admin-sdk.json, firebase-messaging-sw.js
      #   - Vertex AI: gen-lang-client-xxx.json
      #   - Other config files: admin.yml, prompt.yml, etc.
      #
      # ⚠️ When using it in another project:
      #   1. Delete the steps you do not need
      #   2. Add the steps you need
      #   3. Adjust the file paths to the project
      # =================================================================

      # [Required] Spring Boot config file
      - name: "[Required] Create application-prod.yml"
        env:
          APPLICATION_PROD_YML: ${{ secrets.APPLICATION_PROD_YML }}
        run: |
          mkdir -p $(dirname ${{ env.APPLICATION_YML_PATH }})
          printf '%s\n' "$APPLICATION_PROD_YML" > ${{ env.APPLICATION_YML_PATH }}

      # [Optional] Examples below; delete them if not needed.
      # - name: "[Optional] Create Vertex AI Service Account Key"
      #   env:
      #     VERTEX_SA_KEY: ${{ secrets.VERTEX_SA_KEY }}
      #   run: |
      #     echo "$VERTEX_SA_KEY" | sed 's/\\n/\n/g' > ./Suh-Web/src/main/resources/vertex-ai-key.json

      # - name: "[Optional] Create Firebase Admin SDK"
      #   env:
      #     FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_KEY_JSON }}
      #   run: |
      #     echo "$FIREBASE_KEY_JSON" | sed 's/\\n/\n/g' > ./Suh-Web/src/main/resources/firebase-admin-sdk.json

      # =================================================================
      # ⚠️ [End of Section 2] Create per-project secret files
      # =================================================================

      - name: Gradle build
        run: ${{ env.GRADLE_BUILD_CMD }}

      - name: Progress - build done
        id: build_progress
        uses: actions/github-script@v7
        with:
          script: |
            const { t, elapsed: elapsedText } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id }};
            const startTime = ${{ steps.progress.outputs.start_time }};
            const now = Date.now();
            const elapsed = now - startTime;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const buildDuration = elapsedText(minutes, seconds);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              t('spring_preview.heading.pr_building'),
              '',
              t('spring_preview.table.stage_header'),
              '|------|------|----------|',
              t('spring_preview.row.build', { status: t('spring_preview.status.done'), time: buildDuration }),
              t('spring_preview.row.docker', { status: t('spring_preview.status.running'), time: '-' }),
              t('spring_preview.row.deploy', { status: t('spring_preview.status.waiting'), time: '-' }),
              '',
              t('spring_preview.link.live_log', { url: runUrl }),
              '',
              '---',
              t('spring_preview.footer.auto_update')
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            core.setOutput('build_duration', buildDuration);
            core.setOutput('docker_start', now);

      - name: Docker login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build & push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:pr-${{ github.event.issue.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Progress - Docker done
        id: docker_progress
        uses: actions/github-script@v7
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id }};
            const buildDuration = '${{ steps.build_progress.outputs.build_duration }}';
            const dockerStart = ${{ steps.build_progress.outputs.docker_start }};
            const now = Date.now();
            const dockerElapsed = now - dockerStart;
            const minutes = Math.floor(dockerElapsed / 60000);
            const seconds = Math.floor((dockerElapsed % 60000) / 1000);
            const dockerDuration = elapsed(minutes, seconds);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              t('spring_preview.heading.pr_building'),
              '',
              t('spring_preview.table.stage_header'),
              '|------|------|----------|',
              t('spring_preview.row.build', { status: t('spring_preview.status.done'), time: buildDuration }),
              t('spring_preview.row.docker', { status: t('spring_preview.status.done'), time: dockerDuration }),
              t('spring_preview.row.deploy', { status: t('spring_preview.status.running'), time: '-' }),
              '',
              t('spring_preview.link.live_log', { url: runUrl }),
              '',
              '---',
              t('spring_preview.footer.auto_update')
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            core.setOutput('build_duration', buildDuration);
            core.setOutput('docker_duration', dockerDuration);
            core.setOutput('deploy_start', now);

      - name: Deploy to server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          envs: SERVER_PASSWORD
          script: |
            set -e

            # Environment variables (for the deploy server)
            export PATH=$PATH:/usr/local/bin
            export PW="${SERVER_PASSWORD}"

            # 🔐 sudo wrapper depending on the SSH auth method
            SSH_AUTH_METHOD="${{ env.SSH_AUTH_METHOD }}"
            SSH_AUTH_METHOD="${SSH_AUTH_METHOD:-password}"
            if [ "${SSH_AUTH_METHOD}" = "key" ]; then
              SUDO() { sudo "$@"; }
            else
              SUDO() { echo "$PW" | sudo -S "$@"; }
            fi
            echo "🔐 SSH auth method: ${SSH_AUTH_METHOD}"

            # Variables
            PR_NUMBER=${{ github.event.issue.number }}
            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            CONTAINER_NAME="${PROJECT_NAME}-pr-${PR_NUMBER}"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}:pr-${PR_NUMBER}"
            DOMAIN="${PROJECT_NAME}-pr-${PR_NUMBER}.${{ env.PREVIEW_DOMAIN_SUFFIX }}"
            INTERNAL_PORT="${{ env.INTERNAL_PORT }}"
            TRAEFIK_NETWORK="${{ env.TRAEFIK_NETWORK }}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Starting the PR Preview deployment"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦 Project: ${PROJECT_NAME}"
            echo "🔢 PR number: #${PR_NUMBER}"
            echo "📛 Container: ${CONTAINER_NAME}"
            echo "🌐 Domain: ${DOMAIN}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Pull the image
            echo "📥 Pulling the Docker image..."
            SUDO docker pull "${IMAGE}"

            # Remove the existing container
            echo "🗑️ Removing the old container..."
            SUDO docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

            # Build the volume mount options
            VOLUME_OPTS="-v /etc/localtime:/etc/localtime:ro"
            if [ -n "${{ env.PROJECT_TARGET_DIR }}" ] && [ -n "${{ env.PROJECT_MNT_DIR }}" ]; then
              VOLUME_OPTS="$VOLUME_OPTS -v ${{ env.PROJECT_TARGET_DIR }}:${{ env.PROJECT_MNT_DIR }}"
            fi

            # Run the new container
            echo "🐳 Starting the new container..."
            SUDO docker run -d \
              --name "${CONTAINER_NAME}" \
              --network "${TRAEFIK_NETWORK}" \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.${CONTAINER_NAME}.rule=Host(\`${DOMAIN}\`)" \
              --label "traefik.http.routers.${CONTAINER_NAME}.entrypoints=web" \
              --label "traefik.http.services.${CONTAINER_NAME}.loadbalancer.server.port=${INTERNAL_PORT}" \
              -e TZ=Asia/Seoul \
              -e SPRING_PROFILES_ACTIVE=prod \
              $VOLUME_OPTS \
              "${IMAGE}"

            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            # Health check (waits up to 120 seconds) - hybrid approach
            # 1. Try the HTTP check if HEALTH_CHECK_PATH is set
            # 2. Fallback: log pattern match (HEALTH_CHECK_LOG_PATTERN)
            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            echo ""
            echo "⏳ Starting the health check (waits up to 120 seconds)..."
            HEALTH_PATH="${{ env.HEALTH_CHECK_PATH }}"
            LOG_PATTERN="${{ env.HEALTH_CHECK_LOG_PATTERN }}"
            MAX_RETRIES=24
            RETRY_COUNT=0
            HEALTH_CHECK_PASSED=false
            HEALTH_CHECK_METHOD=""

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              sleep 5
              RETRY_COUNT=$((RETRY_COUNT + 1))

              # 1. Check the container state
              STATUS=$(SUDO docker inspect --format='{{.State.Status}}' "${CONTAINER_NAME}" 2>/dev/null || echo "not_found")

              if [ "$STATUS" = "exited" ]; then
                echo "❌ The container exited unexpectedly!"
                echo ""
                echo "📋 Container logs (last 100 lines):"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                SUDO docker logs --tail 100 "${CONTAINER_NAME}"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                exit 1
              fi

              if [ "$STATUS" = "running" ]; then
                # 2. Try the HTTP health check (only when HEALTH_CHECK_PATH is set)
                if [ -n "$HEALTH_PATH" ]; then
                  HEALTH=$(SUDO docker exec "${CONTAINER_NAME}" wget -qO- "http://localhost:${INTERNAL_PORT}${HEALTH_PATH}" 2>/dev/null || echo "")

                  # Spring Actuator response ({"status":"UP"}) or a plain HTTP response
                  if echo "$HEALTH" | grep -q '"status":"UP"' || [ -n "$HEALTH" ]; then
                    echo "✅ Started successfully! (HTTP response: ${HEALTH_PATH})"
                    HEALTH_CHECK_PASSED=true
                    HEALTH_CHECK_METHOD="HTTP"
                    break
                  fi
                fi

                # 3. No HTTP response: fall back to log pattern matching
                if [ -n "$LOG_PATTERN" ]; then
                  STARTED=$(SUDO docker logs --tail 50 "${CONTAINER_NAME}" 2>&1 | grep -E "$LOG_PATTERN" || echo "")

                  if [ -n "$STARTED" ]; then
                    echo "✅ Started successfully! (log pattern)"
                    echo "   $STARTED"
                    HEALTH_CHECK_PASSED=true
                    HEALTH_CHECK_METHOD="Log"
                    break
                  fi
                fi
              fi

              echo "⏳ Waiting... ($RETRY_COUNT/$MAX_RETRIES) - status: $STATUS"
            done

            if [ "$HEALTH_CHECK_PASSED" = "false" ]; then
              echo ""
              echo "❌ Health check timed out (120 seconds)"
              echo ""
              echo "📋 Container logs (last 100 lines):"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              SUDO docker logs --tail 100 "${CONTAINER_NAME}"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              exit 1
            fi

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ Deployment and health check complete! (method: ${HEALTH_CHECK_METHOD})"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Deployment complete comment
        uses: actions/github-script@v7
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id }};
            const buildDuration = '${{ steps.docker_progress.outputs.build_duration }}';
            const dockerDuration = '${{ steps.docker_progress.outputs.docker_duration }}';
            const deployStart = ${{ steps.docker_progress.outputs.deploy_start }};
            const now = Date.now();
            const deployElapsed = now - deployStart;
            const minutes = Math.floor(deployElapsed / 60000);
            const seconds = Math.floor((deployElapsed % 60000) / 1000);
            const deployDuration = elapsed(minutes, seconds);

            const projectName = '${{ env.PROJECT_NAME }}';
            const domainSuffix = '${{ env.PREVIEW_DOMAIN_SUFFIX }}';
            const previewPort = '${{ env.PREVIEW_PORT }}';
            const apiDocsPath = '${{ env.API_DOCS_PATH }}';
            const prNumber = context.issue.number;
            const domain = `${projectName}-pr-${prNumber}.${domainSuffix}`;
            const previewUrl = `http://${domain}:${previewPort}`;
            const sha = '${{ steps.pr.outputs.sha }}';

            // Build the Preview environment table (API Docs row only when API_DOCS_PATH is set)
            const envRows = [
              `| **Preview URL** | ${previewUrl} |`,
            ];
            if (apiDocsPath) {
              envRows.push(`| **API Docs** | ${previewUrl}${apiDocsPath} |`);
            }
            envRows.push(t('spring_preview.row.container', { container: `${projectName}-pr-${prNumber}` }));
            envRows.push(t('spring_preview.row.commit', { sha: sha }));

            const branchName = '${{ steps.pr.outputs.ref }}';

            const body = [
              t('spring_preview.heading.pr_deployed'),
              '',
              t('spring_preview.table.stage_header'),
              '|------|------|----------|',
              t('spring_preview.row.build', { status: t('spring_preview.status.done'), time: buildDuration }),
              t('spring_preview.row.docker', { status: t('spring_preview.status.done'), time: dockerDuration }),
              t('spring_preview.row.deploy', { status: t('spring_preview.status.done'), time: deployDuration }),
              '',
              t('spring_preview.section.preview_env'),
              t('spring_preview.table.item_header'),
              '|------|-----|',
              ...envRows,
              '',
              t('spring_preview.section.commands'),
              t('spring_preview.table.command_header'),
              '|--------|------|',
              t('spring_preview.cmd.redeploy', { command: '@projectops server build' }),
              t('spring_preview.cmd.destroy', { command: '@projectops server destroy' }),
              t('spring_preview.cmd.status', { command: '@projectops server status' }),
              '',
              '<details>',
              t('spring_preview.section.advanced_summary'),
              '',
              '```',
              `@projectops server build ${branchName}`,
              `@projectops server destroy ${branchName}`,
              `@projectops server status ${branchName}`,
              '```',
              '</details>',
              '',
              '---',
              t('spring_preview.footer.generated', { system: 'PR Preview' })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

      - name: Error comment on build/deploy failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id || 0 }};
            const projectName = '${{ env.PROJECT_NAME }}';
            const prNumber = context.issue.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // Show where it failed based on progress
            const buildDuration = '${{ steps.build_progress.outputs.build_duration }}';
            const dockerDuration = '${{ steps.docker_progress.outputs.docker_duration }}';

            // Decide the failure point - early-stage failures included
            let buildStatus, dockerStatus, deployStatus;
            let buildTime = '-', dockerTime = '-';

            if (!commentId) {
              // Failed before the progress comment was created (initialization)
              buildStatus = t('spring_preview.status.init_failed');
              dockerStatus = '-';
              deployStatus = '-';
            } else if (!buildDuration || buildDuration === '') {
              // Failed in the build stage
              buildStatus = t('spring_preview.status.failed');
              dockerStatus = t('spring_preview.status.waiting');
              deployStatus = t('spring_preview.status.waiting');
            } else if (!dockerDuration || dockerDuration === '') {
              // Failed in the Docker stage
              buildStatus = t('spring_preview.status.done');
              dockerStatus = t('spring_preview.status.failed');
              deployStatus = t('spring_preview.status.waiting');
              buildTime = buildDuration;
            } else {
              // Failed in the deploy stage
              buildStatus = t('spring_preview.status.done');
              dockerStatus = t('spring_preview.status.done');
              deployStatus = t('spring_preview.status.failed');
              buildTime = buildDuration;
              dockerTime = dockerDuration;
            }

            const body = [
              t('spring_preview.heading.pr_failed'),
              '',
              t('spring_preview.table.stage_header'),
              '|------|------|----------|',
              t('spring_preview.row.build', { status: buildStatus, time: buildTime }),
              t('spring_preview.row.docker', { status: dockerStatus, time: dockerTime }),
              t('spring_preview.row.deploy', { status: deployStatus, time: '-' }),
              '',
              t('spring_preview.link.build_log', { url: runUrl }),
              '',
              t('spring_preview.section.possible_causes'),
              t('spring_preview.cause.gradle'),
              t('spring_preview.cause.docker'),
              t('spring_preview.cause.container_start_spring'),
              t('spring_preview.cause.health_timeout'),
              '',
              t('spring_preview.section.next_steps'),
              t('spring_preview.next.check_log'),
              t('spring_preview.next.retry', { command: '@projectops server build' }),
              '',
              '---',
              t('spring_preview.footer.generated', { system: 'PR Preview' })
            ].join('\n');

            // Update the progress comment if it exists, otherwise create one
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }

  # -----------------------------------------------------------------
  # Job 2-2: get the branch name from the issue
  # -----------------------------------------------------------------
  get-branch-from-issue:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: Get branch from issue
    needs: check-command
    if: |
      needs.check-command.outputs.is_valid == 'true' &&
      needs.check-command.outputs.is_pr == 'false' &&
      needs.check-command.outputs.is_custom_branch != 'true'
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.extract.outputs.branch }}
      found: ${{ steps.extract.outputs.found }}
      issue_number: ${{ steps.extract.outputs.issue_number }}
    steps:
      # Comment text follows the repo language (version.yml options.language) (#769).
      # Fetch only the catalog as a module in $RUNNER_TEMP and delete the fetched folder (so it does not clash with the later checkout)
      # Fetched from the default branch — the merge ref of a PR closed event may already be gone
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js spring_preview. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Extract branch name from issue comments
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const marker = '${{ env.ISSUE_HELPER_MARKER }}';

            console.log(`🔍 Searching issue #${issueNumber} for a branch...`);
            console.log(`📝 Marker: ${marker}`);

            // Fetch all issue comments
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            // Branch extraction pattern (same format regardless of the marker)
            // Matches both "### 브랜치" and "### 브랜치명"
            const branchRegex = /###\s*브랜치(?:명)?\s*\n```\s*\n([^\n]+)\s*\n```/;

            for (const comment of comments.data) {
              // Find the comment that contains the marker
              if (comment.body.includes(marker)) {
                const match = comment.body.match(branchRegex);
                if (match) {
                  const branchName = match[1].trim();
                  core.setOutput('branch', branchName);
                  core.setOutput('found', 'true');
                  core.setOutput('issue_number', issueNumber);
                  console.log(`✅ Branch found: ${branchName}`);
                  return;
                }
              }
            }

            // Branch not found - not an error, handled gracefully
            core.setOutput('found', 'false');
            core.setOutput('issue_number', issueNumber);
            console.log('⚠️ No branch found in the Issue Helper comments.');

      - name: Notify missing branch
        if: steps.extract.outputs.found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const issueNumber = context.issue.number;
            const marker = '${{ env.ISSUE_HELPER_MARKER }}';

            const body = [
              t('spring_preview.heading.branch_not_found_warning'),
              '',
              t('spring_preview.table.item_header'),
              '|------|-----|',
              `| **Issue** | #${issueNumber} |`,
              t('spring_preview.row.marker', { marker: marker }),
              '',
              t('spring_preview.section.checklist'),
              t('spring_preview.check.helper_comment'),
              t('spring_preview.check.branch_section', { heading: '### 브랜치' }),
              t('spring_preview.check.marker_env'),
              '',
              '---',
              t('spring_preview.footer.generated', { system: 'Preview' })
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  # -----------------------------------------------------------------
  # Job 2-3: build & deploy (run from an issue comment)
  # -----------------------------------------------------------------
  build-preview-issue:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: Build & deploy preview (Issue)
    needs: [check-command, get-branch-from-issue]
    if: |
      needs.check-command.outputs.is_valid == 'true' &&
      needs.check-command.outputs.command == 'build' &&
      needs.check-command.outputs.is_pr == 'false' &&
      needs.check-command.outputs.is_custom_branch != 'true' &&
      needs.get-branch-from-issue.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:
      # Comment text follows the repo language (version.yml options.language) (#769).
      # Fetch only the catalog as a module in $RUNNER_TEMP and delete the fetched folder (so it does not clash with the later checkout)
      # Fetched from the default branch — the merge ref of a PR closed event may already be gone
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js spring_preview. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Check branch exists
        id: check_branch
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.get-branch-from-issue.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const branchName = process.env.BRANCH_NAME;
            const issueNumber = ${{ needs.get-branch-from-issue.outputs.issue_number }};

            console.log(`🔍 Checking that the branch exists: ${branchName}`);

            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: branchName
              });
              core.setOutput('exists', 'true');
              console.log(`✅ Branch exists: ${branchName}`);
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('exists', 'false');
                console.log(`❌ Branch not found: ${branchName}`);

                // Branch-not-found notice comment
                const body = [
                  t('spring_preview.heading.branch_not_found'),
                  '',
                  t('spring_preview.table.item_header'),
                  '|------|-----|',
                  `| **Issue** | #${issueNumber} |`,
                  t('spring_preview.row.branch', { branch: branchName }),
                  '',
                  t('spring_preview.section.checklist'),
                  t('spring_preview.check.pushed', { n: 1 }),
                  t('spring_preview.check.name', { n: 2 }),
                  t('spring_preview.check.not_deleted', { n: 3 }),
                  '',
                  '---',
                  t('spring_preview.footer.generated', { system: 'Preview' })
                ].join('\n');

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: body
                });
              } else {
                throw error;
              }
            }

      - name: Stop if the branch is missing
        if: steps.check_branch.outputs.exists == 'false'
        run: |
          echo "⚠️ The branch does not exist, skipping the build."
          exit 0

      - name: Set issue info
        if: steps.check_branch.outputs.exists == 'true'
        id: issue
        env:
          BRANCH_NAME: ${{ needs.get-branch-from-issue.outputs.branch_name }}
        run: |
          echo "ref=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "issue_number=${{ needs.get-branch-from-issue.outputs.issue_number }}" >> $GITHUB_OUTPUT
          # Get the latest commit SHA of the branch
          echo "sha=$(git ls-remote https://github.com/${{ github.repository }}.git "refs/heads/$BRANCH_NAME" | cut -c1-7)" >> $GITHUB_OUTPUT

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # Progress comment system
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Create progress comment
        if: steps.check_branch.outputs.exists == 'true'
        id: progress
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.get-branch-from-issue.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const issueNumber = ${{ needs.get-branch-from-issue.outputs.issue_number }};
            const branchName = process.env.BRANCH_NAME;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const startTime = Date.now();

            const body = [
              t('spring_preview.heading.issue_building'),
              '',
              t('spring_preview.line.branch', { branch: branchName }),
              '',
              t('spring_preview.table.stage_header'),
              '|------|------|----------|',
              t('spring_preview.row.build', { status: t('spring_preview.status.running'), time: '-' }),
              t('spring_preview.row.docker', { status: t('spring_preview.status.waiting'), time: '-' }),
              t('spring_preview.row.deploy', { status: t('spring_preview.status.waiting'), time: '-' }),
              '',
              t('spring_preview.link.live_log', { url: runUrl }),
              '',
              '---',
              t('spring_preview.footer.auto_update')
            ].join('\n');

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

            core.setOutput('comment_id', comment.id);
            core.setOutput('start_time', startTime);

      - name: Check out code
        if: steps.check_branch.outputs.exists == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.get-branch-from-issue.outputs.branch_name }}

      - name: Set up JDK
        if: steps.check_branch.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Make gradlew executable
        if: steps.check_branch.outputs.exists == 'true'
        run: chmod +x gradlew

      # =================================================================
      # ⚠️ [Section 2] Create per-project secret files
      # =================================================================
      - name: "[Required] Create application-prod.yml"
        if: steps.check_branch.outputs.exists == 'true'
        env:
          APPLICATION_PROD_YML: ${{ secrets.APPLICATION_PROD_YML }}
        run: |
          mkdir -p $(dirname ${{ env.APPLICATION_YML_PATH }})
          printf '%s\n' "$APPLICATION_PROD_YML" > ${{ env.APPLICATION_YML_PATH }}
      # =================================================================
      # ⚠️ [End of Section 2] Create per-project secret files
      # =================================================================

      - name: Gradle build
        if: steps.check_branch.outputs.exists == 'true'
        run: ${{ env.GRADLE_BUILD_CMD }}

      - name: Progress - build done
        if: steps.check_branch.outputs.exists == 'true'
        id: build_progress
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.get-branch-from-issue.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed: elapsedText } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id }};
            const branchName = process.env.BRANCH_NAME;
            const startTime = ${{ steps.progress.outputs.start_time }};
            const now = Date.now();
            const elapsed = now - startTime;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const buildDuration = elapsedText(minutes, seconds);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              t('spring_preview.heading.issue_building'),
              '',
              t('spring_preview.line.branch', { branch: branchName }),
              '',
              t('spring_preview.table.stage_header'),
              '|------|------|----------|',
              t('spring_preview.row.build', { status: t('spring_preview.status.done'), time: buildDuration }),
              t('spring_preview.row.docker', { status: t('spring_preview.status.running'), time: '-' }),
              t('spring_preview.row.deploy', { status: t('spring_preview.status.waiting'), time: '-' }),
              '',
              t('spring_preview.link.live_log', { url: runUrl }),
              '',
              '---',
              t('spring_preview.footer.auto_update')
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            core.setOutput('build_duration', buildDuration);
            core.setOutput('docker_start', now);

      - name: Docker login
        if: steps.check_branch.outputs.exists == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check_branch.outputs.exists == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build & push Docker image
        if: steps.check_branch.outputs.exists == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:pr-${{ needs.get-branch-from-issue.outputs.issue_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Progress - Docker done
        if: steps.check_branch.outputs.exists == 'true'
        id: docker_progress
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.get-branch-from-issue.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id }};
            const branchName = process.env.BRANCH_NAME;
            const buildDuration = '${{ steps.build_progress.outputs.build_duration }}';
            const dockerStart = ${{ steps.build_progress.outputs.docker_start }};
            const now = Date.now();
            const dockerElapsed = now - dockerStart;
            const minutes = Math.floor(dockerElapsed / 60000);
            const seconds = Math.floor((dockerElapsed % 60000) / 1000);
            const dockerDuration = elapsed(minutes, seconds);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              t('spring_preview.heading.issue_building'),
              '',
              t('spring_preview.line.branch', { branch: branchName }),
              '',
              t('spring_preview.table.stage_header'),
              '|------|------|----------|',
              t('spring_preview.row.build', { status: t('spring_preview.status.done'), time: buildDuration }),
              t('spring_preview.row.docker', { status: t('spring_preview.status.done'), time: dockerDuration }),
              t('spring_preview.row.deploy', { status: t('spring_preview.status.running'), time: '-' }),
              '',
              t('spring_preview.link.live_log', { url: runUrl }),
              '',
              '---',
              t('spring_preview.footer.auto_update')
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            core.setOutput('build_duration', buildDuration);
            core.setOutput('docker_duration', dockerDuration);
            core.setOutput('deploy_start', now);

      - name: Deploy to server
        if: steps.check_branch.outputs.exists == 'true'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          envs: SERVER_PASSWORD
          script: |
            set -e

            # Environment variables (for the deploy server)
            export PATH=$PATH:/usr/local/bin
            export PW="${SERVER_PASSWORD}"

            # 🔐 sudo wrapper depending on the SSH auth method
            SSH_AUTH_METHOD="${{ env.SSH_AUTH_METHOD }}"
            SSH_AUTH_METHOD="${SSH_AUTH_METHOD:-password}"
            if [ "${SSH_AUTH_METHOD}" = "key" ]; then
              SUDO() { sudo "$@"; }
            else
              SUDO() { echo "$PW" | sudo -S "$@"; }
            fi
            echo "🔐 SSH auth method: ${SSH_AUTH_METHOD}"

            # Variables
            ISSUE_NUMBER=${{ needs.get-branch-from-issue.outputs.issue_number }}
            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            CONTAINER_NAME="${PROJECT_NAME}-pr-${ISSUE_NUMBER}"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}:pr-${ISSUE_NUMBER}"
            DOMAIN="${PROJECT_NAME}-pr-${ISSUE_NUMBER}.${{ env.PREVIEW_DOMAIN_SUFFIX }}"
            INTERNAL_PORT="${{ env.INTERNAL_PORT }}"
            TRAEFIK_NETWORK="${{ env.TRAEFIK_NETWORK }}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Starting the Issue Preview deployment"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦 Project: ${PROJECT_NAME}"
            echo "🔢 Issue number: #${ISSUE_NUMBER}"
            echo "📛 Container: ${CONTAINER_NAME}"
            echo "🌐 Domain: ${DOMAIN}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Pull the image
            echo "📥 Pulling the Docker image..."
            SUDO docker pull "${IMAGE}"

            # Remove the existing container
            echo "🗑️ Removing the old container..."
            SUDO docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

            # Build the volume mount options
            VOLUME_OPTS="-v /etc/localtime:/etc/localtime:ro"
            if [ -n "${{ env.PROJECT_TARGET_DIR }}" ] && [ -n "${{ env.PROJECT_MNT_DIR }}" ]; then
              VOLUME_OPTS="$VOLUME_OPTS -v ${{ env.PROJECT_TARGET_DIR }}:${{ env.PROJECT_MNT_DIR }}"
            fi

            # Run the new container
            echo "🐳 Starting the new container..."
            SUDO docker run -d \
              --name "${CONTAINER_NAME}" \
              --network "${TRAEFIK_NETWORK}" \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.${CONTAINER_NAME}.rule=Host(\`${DOMAIN}\`)" \
              --label "traefik.http.routers.${CONTAINER_NAME}.entrypoints=web" \
              --label "traefik.http.services.${CONTAINER_NAME}.loadbalancer.server.port=${INTERNAL_PORT}" \
              -e TZ=Asia/Seoul \
              -e SPRING_PROFILES_ACTIVE=prod \
              $VOLUME_OPTS \
              "${IMAGE}"

            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            # Health check (waits up to 120 seconds) - hybrid approach
            # 1. Try the HTTP check if HEALTH_CHECK_PATH is set
            # 2. Fallback: log pattern match (HEALTH_CHECK_LOG_PATTERN)
            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            echo ""
            echo "⏳ Starting the health check (waits up to 120 seconds)..."
            HEALTH_PATH="${{ env.HEALTH_CHECK_PATH }}"
            LOG_PATTERN="${{ env.HEALTH_CHECK_LOG_PATTERN }}"
            MAX_RETRIES=24
            RETRY_COUNT=0
            HEALTH_CHECK_PASSED=false
            HEALTH_CHECK_METHOD=""

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              sleep 5
              RETRY_COUNT=$((RETRY_COUNT + 1))

              # 1. Check the container state
              STATUS=$(SUDO docker inspect --format='{{.State.Status}}' "${CONTAINER_NAME}" 2>/dev/null || echo "not_found")

              if [ "$STATUS" = "exited" ]; then
                echo "❌ The container exited unexpectedly!"
                echo ""
                echo "📋 Container logs (last 100 lines):"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                SUDO docker logs --tail 100 "${CONTAINER_NAME}"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                exit 1
              fi

              if [ "$STATUS" = "running" ]; then
                # 2. Try the HTTP health check (only when HEALTH_CHECK_PATH is set)
                if [ -n "$HEALTH_PATH" ]; then
                  HEALTH=$(SUDO docker exec "${CONTAINER_NAME}" wget -qO- "http://localhost:${INTERNAL_PORT}${HEALTH_PATH}" 2>/dev/null || echo "")

                  # Spring Actuator response ({"status":"UP"}) or a plain HTTP response
                  if echo "$HEALTH" | grep -q '"status":"UP"' || [ -n "$HEALTH" ]; then
                    echo "✅ Started successfully! (HTTP response: ${HEALTH_PATH})"
                    HEALTH_CHECK_PASSED=true
                    HEALTH_CHECK_METHOD="HTTP"
                    break
                  fi
                fi

                # 3. No HTTP response: fall back to log pattern matching
                if [ -n "$LOG_PATTERN" ]; then
                  STARTED=$(SUDO docker logs --tail 50 "${CONTAINER_NAME}" 2>&1 | grep -E "$LOG_PATTERN" || echo "")

                  if [ -n "$STARTED" ]; then
                    echo "✅ Started successfully! (log pattern)"
                    echo "   $STARTED"
                    HEALTH_CHECK_PASSED=true
                    HEALTH_CHECK_METHOD="Log"
                    break
                  fi
                fi
              fi

              echo "⏳ Waiting... ($RETRY_COUNT/$MAX_RETRIES) - status: $STATUS"
            done

            if [ "$HEALTH_CHECK_PASSED" = "false" ]; then
              echo ""
              echo "❌ Health check timed out (120 seconds)"
              echo ""
              echo "📋 Container logs (last 100 lines):"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              SUDO docker logs --tail 100 "${CONTAINER_NAME}"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              exit 1
            fi

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ Deployment and health check complete! (method: ${HEALTH_CHECK_METHOD})"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Deployment complete comment
        if: steps.check_branch.outputs.exists == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.get-branch-from-issue.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id }};
            const branchName = process.env.BRANCH_NAME;
            const buildDuration = '${{ steps.docker_progress.outputs.build_duration }}';
            const dockerDuration = '${{ steps.docker_progress.outputs.docker_duration }}';
            const deployStart = ${{ steps.docker_progress.outputs.deploy_start }};
            const now = Date.now();
            const deployElapsed = now - deployStart;
            const minutes = Math.floor(deployElapsed / 60000);
            const seconds = Math.floor((deployElapsed % 60000) / 1000);
            const deployDuration = elapsed(minutes, seconds);

            const projectName = '${{ env.PROJECT_NAME }}';
            const domainSuffix = '${{ env.PREVIEW_DOMAIN_SUFFIX }}';
            const previewPort = '${{ env.PREVIEW_PORT }}';
            const apiDocsPath = '${{ env.API_DOCS_PATH }}';
            const issueNumber = ${{ needs.get-branch-from-issue.outputs.issue_number }};
            const domain = `${projectName}-pr-${issueNumber}.${domainSuffix}`;
            const previewUrl = `http://${domain}:${previewPort}`;
            const sha = '${{ steps.issue.outputs.sha }}';

            // Build the Preview environment table (API Docs row only when API_DOCS_PATH is set)
            const envRows = [
              `| **Preview URL** | ${previewUrl} |`,
            ];
            if (apiDocsPath) {
              envRows.push(`| **API Docs** | ${previewUrl}${apiDocsPath} |`);
            }
            envRows.push(t('spring_preview.row.container', { container: `${projectName}-pr-${issueNumber}` }));
            envRows.push(t('spring_preview.row.branch', { branch: branchName }));
            envRows.push(t('spring_preview.row.commit', { sha: sha }));

            const body = [
              t('spring_preview.heading.issue_deployed'),
              '',
              t('spring_preview.line.branch', { branch: branchName }),
              '',
              t('spring_preview.table.stage_header'),
              '|------|------|----------|',
              t('spring_preview.row.build', { status: t('spring_preview.status.done'), time: buildDuration }),
              t('spring_preview.row.docker', { status: t('spring_preview.status.done'), time: dockerDuration }),
              t('spring_preview.row.deploy', { status: t('spring_preview.status.done'), time: deployDuration }),
              '',
              t('spring_preview.section.preview_env'),
              t('spring_preview.table.item_header'),
              '|------|-----|',
              ...envRows,
              '',
              t('spring_preview.section.commands'),
              t('spring_preview.table.command_header'),
              '|--------|------|',
              t('spring_preview.cmd.redeploy', { command: '@projectops server build' }),
              t('spring_preview.cmd.destroy', { command: '@projectops server destroy' }),
              t('spring_preview.cmd.status', { command: '@projectops server status' }),
              '',
              '<details>',
              t('spring_preview.section.advanced_summary'),
              '',
              '```',
              `@projectops server build ${branchName}`,
              `@projectops server destroy ${branchName}`,
              `@projectops server status ${branchName}`,
              '```',
              '</details>',
              '',
              '---',
              t('spring_preview.footer.generated', { system: 'Issue Preview' })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

      - name: Error comment on build/deploy failure
        if: failure() && steps.check_branch.outputs.exists == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.get-branch-from-issue.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id || 0 }};
            const projectName = '${{ env.PROJECT_NAME }}';
            const issueNumber = ${{ needs.get-branch-from-issue.outputs.issue_number }};
            const branchName = process.env.BRANCH_NAME;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const buildDuration = '${{ steps.build_progress.outputs.build_duration }}';
            const dockerDuration = '${{ steps.docker_progress.outputs.docker_duration }}';

            let buildStatus, dockerStatus, deployStatus;
            let buildTime = '-', dockerTime = '-';

            if (!commentId) {
              buildStatus = t('spring_preview.status.init_failed');
              dockerStatus = '-';
              deployStatus = '-';
            } else if (!buildDuration || buildDuration === '') {
              buildStatus = t('spring_preview.status.failed');
              dockerStatus = t('spring_preview.status.waiting');
              deployStatus = t('spring_preview.status.waiting');
            } else if (!dockerDuration || dockerDuration === '') {
              buildStatus = t('spring_preview.status.done');
              dockerStatus = t('spring_preview.status.failed');
              deployStatus = t('spring_preview.status.waiting');
              buildTime = buildDuration;
            } else {
              buildStatus = t('spring_preview.status.done');
              dockerStatus = t('spring_preview.status.done');
              deployStatus = t('spring_preview.status.failed');
              buildTime = buildDuration;
              dockerTime = dockerDuration;
            }

            const body = [
              t('spring_preview.heading.issue_failed'),
              '',
              t('spring_preview.line.branch', { branch: branchName }),
              '',
              t('spring_preview.table.stage_header'),
              '|------|------|----------|',
              t('spring_preview.row.build', { status: buildStatus, time: buildTime }),
              t('spring_preview.row.docker', { status: dockerStatus, time: dockerTime }),
              t('spring_preview.row.deploy', { status: deployStatus, time: '-' }),
              '',
              t('spring_preview.link.build_log', { url: runUrl }),
              '',
              t('spring_preview.section.possible_causes'),
              t('spring_preview.cause.gradle'),
              t('spring_preview.cause.docker'),
              t('spring_preview.cause.container_start_spring'),
              t('spring_preview.cause.health_timeout'),
              '',
              t('spring_preview.section.next_steps'),
              t('spring_preview.next.check_log'),
              t('spring_preview.next.retry', { command: '@projectops server build' }),
              '',
              '---',
              t('spring_preview.footer.generated', { system: 'Issue Preview' })
            ].join('\n');

            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body
              });
            }

  # -----------------------------------------------------------------
  # Job 3: delete the Preview (PR/issue closed or destroy command)
  # -----------------------------------------------------------------
  destroy-preview:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: Delete preview
    # No needs dependency: runs independently on PR/issue closed events too
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      (github.event_name == 'issues' && github.event.action == 'closed') ||
      (github.event_name == 'issue_comment' && !contains(github.event.comment.body, '<!-- SUH-ISSUE-HELPER -->') && contains(github.event.comment.body, '@projectops') && contains(github.event.comment.body, 'server destroy'))
    runs-on: ubuntu-latest
    steps:
      # Comment text follows the repo language (version.yml options.language) (#769).
      # Fetch only the catalog as a module in $RUNNER_TEMP and delete the fetched folder (so it does not clash with the later checkout)
      # Fetched from the default branch — the merge ref of a PR closed event may already be gone
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js spring_preview. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Get PR/issue number
        id: pr_number
        run: |
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "type=comment" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "type=pr_closed" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "type=issue_closed" >> $GITHUB_OUTPUT
          fi

      # Running SSH and comments on every close event makes repos that never used a preview
      # fail on missing secrets and flood comments (secondary rate limit) (#808).
      # Delete only when a deploy-complete comment remains, and skip quietly when secrets are missing.
      - name: Check what to delete
        id: target
        uses: actions/github-script@v7
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          NUMBER: ${{ steps.pr_number.outputs.number }}
          TRIGGER_TYPE: ${{ steps.pr_number.outputs.type }}
        with:
          script: |
            const number = Number(process.env.NUMBER);
            if (!process.env.SERVER_HOST) {
              core.notice('No SERVER_HOST secret, skipping the Preview removal.');
              core.setOutput('should_destroy', 'false');
              return;
            }
            // If the user asked for destroy directly, delete even without a trace.
            if (process.env.TRIGGER_TYPE === 'comment') {
              core.setOutput('should_destroy', 'true');
              return;
            }
            const container = `${process.env.PROJECT_NAME}-pr-${number}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            });
            // The Preview is alive only if the last deploy-complete comment comes after the last delete-complete comment.
            // Look for title markers in both languages (so comments left from before a language switch are cleaned up too)
            const deployedMarkers = ['Preview 배포 완료', 'Preview deployed'];
            const deletedMarkers = ['Preview 환경 삭제 완료', 'Preview environment deleted'];
            let lastDeploy = -1, lastDestroy = -1;
            comments.forEach((c, i) => {
              const body = c.body || '';
              if (!body.includes(`\`${container}\``)) return;
              if (deployedMarkers.some((marker) => body.includes(marker))) lastDeploy = i;
              if (deletedMarkers.some((marker) => body.includes(marker))) lastDestroy = i;
            });
            const alive = lastDeploy > lastDestroy;
            if (!alive) core.notice(`No Preview is deployed on #${number}, skipping the removal.`);
            core.setOutput('should_destroy', alive ? 'true' : 'false');

      - name: Delete container & image
        if: steps.target.outputs.should_destroy == 'true'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          envs: SERVER_PASSWORD
          script: |
            # Environment variables (for the deploy server)
            export PATH=$PATH:/usr/local/bin
            export PW="${SERVER_PASSWORD}"

            # 🔐 sudo wrapper depending on the SSH auth method
            SSH_AUTH_METHOD="${{ env.SSH_AUTH_METHOD }}"
            SSH_AUTH_METHOD="${SSH_AUTH_METHOD:-password}"
            if [ "${SSH_AUTH_METHOD}" = "key" ]; then
              SUDO() { sudo "$@"; }
            else
              SUDO() { echo "$PW" | sudo -S "$@"; }
            fi
            echo "🔐 SSH auth method: ${SSH_AUTH_METHOD}"

            PR_NUMBER=${{ steps.pr_number.outputs.number }}
            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            CONTAINER_NAME="${PROJECT_NAME}-pr-${PR_NUMBER}"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}:pr-${PR_NUMBER}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🗑️ Removing the Preview"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦 Project: ${PROJECT_NAME}"
            echo "🔢 Number: #${PR_NUMBER}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # Remove the container
            echo "🐳 Removing the container..."
            SUDO docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

            # Remove the image
            echo "🖼️ Removing the image..."
            SUDO docker rmi "${IMAGE}" 2>/dev/null || true

            echo "✅ Removed!"

      - name: Deletion complete comment
        # Only when something was actually deleted — posting 'deleted' with nothing deleted caused the comment flood (#808)
        if: steps.target.outputs.should_destroy == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const number = ${{ steps.pr_number.outputs.number }};
            const projectName = '${{ env.PROJECT_NAME }}';

            const body = [
              t('spring_preview.heading.destroyed'),
              '',
              t('spring_preview.table.item_header'),
              '|------|-----|',
              t('spring_preview.row.container', { container: `${projectName}-pr-${number}` }),
              t('spring_preview.row.state', { state: t('spring_preview.state.deleted') }),
              '',
              t('spring_preview.hint.redeploy', { command: '@projectops server build' }),
              '',
              '---',
              t('spring_preview.footer.generated', { system: 'PR/Issue Preview' })
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: body
            });

  # -----------------------------------------------------------------
  # Job 4: check status (supports PRs and issues)
  # -----------------------------------------------------------------
  check-status:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: Check preview status
    needs: check-command
    if: needs.check-command.outputs.is_valid == 'true' && needs.check-command.outputs.command == 'status'
    runs-on: ubuntu-latest
    steps:
      # Comment text follows the repo language (version.yml options.language) (#769).
      # Fetch only the catalog as a module in $RUNNER_TEMP and delete the fetched folder (so it does not clash with the later checkout)
      # Fetched from the default branch — the merge ref of a PR closed event may already be gone
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js spring_preview. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Check container status
        id: status
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            # Environment variables (for the deploy server)
            export PATH=$PATH:/usr/local/bin

            NUMBER=${{ github.event.issue.number }}
            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            CONTAINER_NAME="${PROJECT_NAME}-pr-${NUMBER}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔍 Checking the Preview status"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            if docker ps --filter "name=${CONTAINER_NAME}" --format "{{.Names}}" | grep -q "${CONTAINER_NAME}"; then
              echo "STATUS=running"
              echo "✅ The container is running"
              docker ps --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Status}}\t{{.RunningFor}}"
            else
              echo "STATUS=not_found"
              echo "❌ Container not found"
            fi

      - name: Status comment (running)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        id: check_running
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            # Environment variables (for the deploy server)
            export PATH=$PATH:/usr/local/bin

            NUMBER=${{ github.event.issue.number }}
            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            CONTAINER_NAME="${PROJECT_NAME}-pr-${NUMBER}"
            docker ps --filter "name=${CONTAINER_NAME}" --format "{{.Names}}" | grep -q "${CONTAINER_NAME}"

      - name: Post status comment
        uses: actions/github-script@v7
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const number = context.issue.number;
            const projectName = '${{ env.PROJECT_NAME }}';
            const domainSuffix = '${{ env.PREVIEW_DOMAIN_SUFFIX }}';
            const previewPort = '${{ env.PREVIEW_PORT }}';
            const domain = `${projectName}-pr-${number}.${domainSuffix}`;
            const previewUrl = `http://${domain}:${previewPort}`;
            const isRunning = '${{ steps.check_running.outcome }}' === 'success';
            const isPr = '${{ needs.check-command.outputs.is_pr }}' === 'true';
            const contextType = isPr ? 'PR' : 'Issue';

            let body;
            if (isRunning) {
              body = [
                t('spring_preview.heading.running'),
                '',
                t('spring_preview.table.item_header'),
                '|------|-----|',
                `| **Preview URL** | ${previewUrl} |`,
                t('spring_preview.row.container', { container: `${projectName}-pr-${number}` }),
                t('spring_preview.row.state', { state: '🟢 Running' }),
                '',
                t('spring_preview.section.commands'),
                t('spring_preview.table.command_header'),
                '|--------|------|',
                t('spring_preview.cmd.redeploy', { command: '@projectops server build' }),
                t('spring_preview.cmd.destroy', { command: '@projectops server destroy' }),
                '',
                '---',
                t('spring_preview.footer.generated', { system: `${contextType} Preview` })
              ].join('\n');
            } else {
              body = [
                t('spring_preview.heading.not_found'),
                '',
                t('spring_preview.table.item_header'),
                '|------|-----|',
                t('spring_preview.row.container', { container: `${projectName}-pr-${number}` }),
                t('spring_preview.row.state', { state: '🔴 Not Found' }),
                '',
                t('spring_preview.hint.deploy', { command: '@projectops server build' }),
                '',
                '---',
                t('spring_preview.footer.generated', { system: `${contextType} Preview` })
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: body
            });

  # ============================================================
  # Custom Branch Preview Jobs
  # Build, delete or check status for a specific branch
  # Command: @projectops server build <branch-name>
  # ============================================================

  build-preview-custom-branch:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: Build & deploy preview (Custom Branch)
    needs: check-command
    if: |
      needs.check-command.outputs.is_valid == 'true' &&
      needs.check-command.outputs.command == 'build' &&
      needs.check-command.outputs.is_custom_branch == 'true'
    runs-on: ubuntu-latest
    steps:
      # Comment text follows the repo language (version.yml options.language) (#769).
      # Fetch only the catalog as a module in $RUNNER_TEMP and delete the fetched folder (so it does not clash with the later checkout)
      # Fetched from the default branch — the merge ref of a PR closed event may already be gone
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js spring_preview. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Extract issue number from branch name
        id: extract
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.check-command.outputs.custom_branch }}
        with:
          script: |
            const branchName = process.env.BRANCH_NAME;
            const issueMatch = branchName.match(/#(\d+)/);

            if (issueMatch) {
              core.setOutput('issue_number', issueMatch[1]);
              core.setOutput('use_hash', 'false');
              core.setOutput('container_suffix', `pr-${issueMatch[1]}`);
            } else {
              // Generate the hash
              let hash = 0;
              for (let i = 0; i < branchName.length; i++) {
                const char = branchName.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
              }
              const hashStr = Math.abs(hash).toString(16).slice(-6).padStart(6, '0');
              core.setOutput('container_suffix', `custom-${hashStr}`);
              core.setOutput('use_hash', 'true');
            }

            core.setOutput('branch_name', branchName);

      - name: Check whether the branch exists
        id: check_branch
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.extract.outputs.branch_name }}
        with:
          script: |
            const branchName = process.env.BRANCH_NAME;
            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: branchName
              });
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('exists', 'false');
              } else {
                throw error;
              }
            }

      - name: Missing branch error comment
        if: steps.check_branch.outputs.exists == 'false'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.extract.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const branchName = process.env.BRANCH_NAME;

            const body = [
              t('spring_preview.heading.branch_not_found'),
              '',
              t('spring_preview.table.item_header'),
              '|------|-----|',
              t('spring_preview.row.branch', { branch: branchName }),
              '',
              t('spring_preview.section.checklist'),
              t('spring_preview.check.name', { n: 1 }),
              t('spring_preview.check.pushed', { n: 2 }),
              t('spring_preview.check.not_deleted', { n: 3 }),
              '',
              '---',
              t('spring_preview.footer.generated', { system: 'Preview' })
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

            core.setFailed('Branch not found: ' + branchName);

      - name: Checkout
        if: steps.check_branch.outputs.exists == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.extract.outputs.branch_name }}

      - name: Get latest commit info
        if: steps.check_branch.outputs.exists == 'true'
        id: commit
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Post progress comment
        if: steps.check_branch.outputs.exists == 'true'
        id: progress
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.extract.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const projectName = '${{ env.PROJECT_NAME }}';
            const containerSuffix = '${{ steps.extract.outputs.container_suffix }}';
            const branchName = process.env.BRANCH_NAME;
            const sha = '${{ steps.commit.outputs.sha }}';

            const body = [
              t('spring_preview.heading.custom_started'),
              '',
              t('spring_preview.line.branch', { branch: branchName }),
              t('spring_preview.line.commit', { sha: sha }),
              '',
              t('spring_preview.table.stage_header'),
              '|------|------|----------|',
              t('spring_preview.row.build', { status: t('spring_preview.status.running'), time: '-' }),
              t('spring_preview.row.docker', { status: t('spring_preview.status.waiting'), time: '-' }),
              t('spring_preview.row.deploy', { status: t('spring_preview.status.waiting'), time: '-' }),
              '',
              '---',
              t('spring_preview.footer.generated', { system: 'Preview' })
            ].join('\n');

            const comment = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

            core.setOutput('comment_id', comment.data.id);

      - name: Set up JDK
        if: steps.check_branch.outputs.exists == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Gradle cache
        if: steps.check_branch.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Gradle build
        if: steps.check_branch.outputs.exists == 'true'
        id: build
        run: |
          BUILD_START=$(date +%s)
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test --no-daemon
          BUILD_END=$(date +%s)
          BUILD_DURATION=$((BUILD_END - BUILD_START))
          echo "duration=${BUILD_DURATION}s" >> $GITHUB_OUTPUT

      - name: Update progress - build done
        if: steps.check_branch.outputs.exists == 'true'
        id: build_progress
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.extract.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id }};
            const projectName = '${{ env.PROJECT_NAME }}';
            const branchName = process.env.BRANCH_NAME;
            const sha = '${{ steps.commit.outputs.sha }}';
            const buildDuration = '${{ steps.build.outputs.duration }}';

            const body = [
              t('spring_preview.heading.custom_started'),
              '',
              t('spring_preview.line.branch', { branch: branchName }),
              t('spring_preview.line.commit', { sha: sha }),
              '',
              t('spring_preview.table.stage_header'),
              '|------|------|----------|',
              t('spring_preview.row.build', { status: t('spring_preview.status.done'), time: buildDuration }),
              t('spring_preview.row.docker', { status: t('spring_preview.status.running'), time: '-' }),
              t('spring_preview.row.deploy', { status: t('spring_preview.status.waiting'), time: '-' }),
              '',
              '---',
              t('spring_preview.footer.generated', { system: 'Preview' })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            core.setOutput('build_duration', buildDuration);

      - name: Docker Hub login
        if: steps.check_branch.outputs.exists == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image
        if: steps.check_branch.outputs.exists == 'true'
        id: docker
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          DOCKER_START=$(date +%s)
          CONTAINER_SUFFIX="${{ steps.extract.outputs.container_suffix }}"
          IMAGE_TAG="$DOCKERHUB_USERNAME/${{ env.PROJECT_NAME }}:${CONTAINER_SUFFIX}"
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          DOCKER_END=$(date +%s)
          DOCKER_DURATION=$((DOCKER_END - DOCKER_START))
          echo "duration=${DOCKER_DURATION}s" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Update progress - Docker done
        if: steps.check_branch.outputs.exists == 'true'
        id: docker_progress
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.extract.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id }};
            const projectName = '${{ env.PROJECT_NAME }}';
            const branchName = process.env.BRANCH_NAME;
            const sha = '${{ steps.commit.outputs.sha }}';
            const buildDuration = '${{ steps.build_progress.outputs.build_duration }}';
            const dockerDuration = '${{ steps.docker.outputs.duration }}';

            const body = [
              t('spring_preview.heading.custom_started'),
              '',
              t('spring_preview.line.branch', { branch: branchName }),
              t('spring_preview.line.commit', { sha: sha }),
              '',
              t('spring_preview.table.stage_header'),
              '|------|------|----------|',
              t('spring_preview.row.build', { status: t('spring_preview.status.done'), time: buildDuration }),
              t('spring_preview.row.docker', { status: t('spring_preview.status.done'), time: dockerDuration }),
              t('spring_preview.row.deploy', { status: t('spring_preview.status.running'), time: '-' }),
              '',
              '---',
              t('spring_preview.footer.generated', { system: 'Preview' })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            core.setOutput('docker_duration', dockerDuration);

      - name: Deploy to server
        if: steps.check_branch.outputs.exists == 'true'
        id: deploy
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            export PATH=$PATH:/usr/local/bin

            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            CONTAINER_SUFFIX="${{ steps.extract.outputs.container_suffix }}"
            CONTAINER_NAME="${PROJECT_NAME}-${CONTAINER_SUFFIX}"
            IMAGE_TAG="${{ steps.docker.outputs.image_tag }}"
            PREVIEW_PORT="${{ env.PREVIEW_PORT }}"
            DOMAIN_SUFFIX="${{ env.PREVIEW_DOMAIN_SUFFIX }}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Deploying the Custom Branch Preview"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            docker pull $IMAGE_TAG

            if docker ps -a --filter "name=${CONTAINER_NAME}" --format "{{.Names}}" | grep -q "${CONTAINER_NAME}"; then
              echo "🗑️ Removing the old container: ${CONTAINER_NAME}"
              docker stop ${CONTAINER_NAME} || true
              docker rm ${CONTAINER_NAME} || true
            fi

            echo "🐳 Starting the new container: ${CONTAINER_NAME}"
            docker run -d \
              --name ${CONTAINER_NAME} \
              --network traefik-network \
              -l "traefik.enable=true" \
              -l "traefik.http.routers.${CONTAINER_NAME}.rule=Host(\`${CONTAINER_NAME}.${DOMAIN_SUFFIX}\`)" \
              -l "traefik.http.routers.${CONTAINER_NAME}.entrypoints=web" \
              -l "traefik.http.services.${CONTAINER_NAME}.loadbalancer.server.port=${PREVIEW_PORT}" \
              ${IMAGE_TAG}

            echo "⏳ Waiting for the health check (up to 60 seconds)..."
            for i in {1..12}; do
              if docker ps --filter "name=${CONTAINER_NAME}" --filter "status=running" --format "{{.Names}}" | grep -q "${CONTAINER_NAME}"; then
                echo "✅ The container is running"
                break
              fi
              echo "Waiting... ($i/12)"
              sleep 5
            done

            if ! docker ps --filter "name=${CONTAINER_NAME}" --filter "status=running" --format "{{.Names}}" | grep -q "${CONTAINER_NAME}"; then
              echo "❌ Deployment failed: the container is not running"
              exit 1
            fi

            echo "✅ Deployed!"
            echo "🌐 Preview URL: http://${CONTAINER_NAME}.${DOMAIN_SUFFIX}:${PREVIEW_PORT}"

      - name: Record deployment time
        if: steps.check_branch.outputs.exists == 'true'
        id: deploy_time
        run: echo "duration=$(node -e "process.stdout.write(require(process.env.RUNNER_TEMP + '/projectops-messages.cjs').t('spring_preview.status.done_short'))")" >> $GITHUB_OUTPUT

      - name: Deployment complete comment
        if: steps.check_branch.outputs.exists == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.extract.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id }};
            const projectName = '${{ env.PROJECT_NAME }}';
            const containerSuffix = '${{ steps.extract.outputs.container_suffix }}';
            const branchName = process.env.BRANCH_NAME;
            const sha = '${{ steps.commit.outputs.sha }}';
            const domainSuffix = '${{ env.PREVIEW_DOMAIN_SUFFIX }}';
            const previewPort = '${{ env.PREVIEW_PORT }}';
            const apiDocsPath = '${{ env.API_DOCS_PATH }}';

            const containerName = `${projectName}-${containerSuffix}`;
            const previewUrl = `http://${containerName}.${domainSuffix}:${previewPort}`;

            const buildDuration = '${{ steps.build_progress.outputs.build_duration }}';
            const dockerDuration = '${{ steps.docker_progress.outputs.docker_duration }}';
            const deployDuration = '${{ steps.deploy_time.outputs.duration }}';

            const envRows = [
              `| **Preview URL** | ${previewUrl} |`,
            ];
            if (apiDocsPath) {
              envRows.push(`| **API Docs** | ${previewUrl}${apiDocsPath} |`);
            }
            envRows.push(t('spring_preview.row.container', { container: containerName }));
            envRows.push(t('spring_preview.row.branch', { branch: branchName }));
            envRows.push(t('spring_preview.row.commit', { sha: sha }));

            const body = [
              t('spring_preview.heading.custom_deployed'),
              '',
              t('spring_preview.line.branch', { branch: branchName }),
              '',
              t('spring_preview.table.stage_header'),
              '|------|------|----------|',
              t('spring_preview.row.build', { status: t('spring_preview.status.done'), time: buildDuration }),
              t('spring_preview.row.docker', { status: t('spring_preview.status.done'), time: dockerDuration }),
              t('spring_preview.row.deploy', { status: t('spring_preview.status.done'), time: deployDuration }),
              '',
              t('spring_preview.section.preview_env'),
              t('spring_preview.table.item_header'),
              '|------|-----|',
              ...envRows,
              '',
              t('spring_preview.section.commands'),
              t('spring_preview.table.command_header'),
              '|--------|------|',
              t('spring_preview.cmd.redeploy', { command: `@projectops server build ${branchName}` }),
              t('spring_preview.cmd.destroy', { command: `@projectops server destroy ${branchName}` }),
              t('spring_preview.cmd.status', { command: `@projectops server status ${branchName}` }),
              '',
              '---',
              t('spring_preview.footer.generated', { system: 'Preview' })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

      - name: Error comment on build/deploy failure
        if: failure() && steps.check_branch.outputs.exists == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.extract.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id || 0 }};
            const projectName = '${{ env.PROJECT_NAME }}';
            const branchName = process.env.BRANCH_NAME;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const buildDuration = '${{ steps.build_progress.outputs.build_duration }}';
            const dockerDuration = '${{ steps.docker_progress.outputs.docker_duration }}';

            let buildStatus, dockerStatus, deployStatus;
            let buildTime = '-', dockerTime = '-';

            if (!commentId) {
              buildStatus = t('spring_preview.status.init_failed');
              dockerStatus = '-';
              deployStatus = '-';
            } else if (!buildDuration || buildDuration === '') {
              buildStatus = t('spring_preview.status.failed');
              dockerStatus = t('spring_preview.status.waiting');
              deployStatus = t('spring_preview.status.waiting');
            } else if (!dockerDuration || dockerDuration === '') {
              buildStatus = t('spring_preview.status.done');
              dockerStatus = t('spring_preview.status.failed');
              deployStatus = t('spring_preview.status.waiting');
              buildTime = buildDuration;
            } else {
              buildStatus = t('spring_preview.status.done');
              dockerStatus = t('spring_preview.status.done');
              deployStatus = t('spring_preview.status.failed');
              buildTime = buildDuration;
              dockerTime = dockerDuration;
            }

            const body = [
              t('spring_preview.heading.custom_failed'),
              '',
              t('spring_preview.line.branch', { branch: branchName }),
              '',
              t('spring_preview.table.stage_header'),
              '|------|------|----------|',
              t('spring_preview.row.build', { status: buildStatus, time: buildTime }),
              t('spring_preview.row.docker', { status: dockerStatus, time: dockerTime }),
              t('spring_preview.row.deploy', { status: deployStatus, time: '-' }),
              '',
              t('spring_preview.link.build_log', { url: runUrl }),
              '',
              t('spring_preview.section.possible_causes'),
              t('spring_preview.cause.gradle'),
              t('spring_preview.cause.docker'),
              t('spring_preview.cause.server_connection'),
              t('spring_preview.cause.container_start'),
              '',
              '---',
              t('spring_preview.footer.generated', { system: 'Preview' })
            ].join('\n');

            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  destroy-preview-custom-branch:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: Delete preview (Custom Branch)
    needs: check-command
    if: |
      needs.check-command.outputs.is_valid == 'true' &&
      needs.check-command.outputs.command == 'destroy' &&
      needs.check-command.outputs.is_custom_branch == 'true'
    runs-on: ubuntu-latest
    steps:
      # Comment text follows the repo language (version.yml options.language) (#769).
      # Fetch only the catalog as a module in $RUNNER_TEMP and delete the fetched folder (so it does not clash with the later checkout)
      # Fetched from the default branch — the merge ref of a PR closed event may already be gone
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js spring_preview. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Extract container suffix from branch name
        id: extract
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.check-command.outputs.custom_branch }}
        with:
          script: |
            const branchName = process.env.BRANCH_NAME;
            const issueMatch = branchName.match(/#(\d+)/);

            if (issueMatch) {
              core.setOutput('container_suffix', `pr-${issueMatch[1]}`);
            } else {
              let hash = 0;
              for (let i = 0; i < branchName.length; i++) {
                const char = branchName.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
              }
              const hashStr = Math.abs(hash).toString(16).slice(-6).padStart(6, '0');
              core.setOutput('container_suffix', `custom-${hashStr}`);
            }

            core.setOutput('branch_name', branchName);

      - name: Remove container
        id: destroy
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            export PATH=$PATH:/usr/local/bin

            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            CONTAINER_SUFFIX="${{ steps.extract.outputs.container_suffix }}"
            CONTAINER_NAME="${PROJECT_NAME}-${CONTAINER_SUFFIX}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🗑️ Removing the Custom Branch Preview"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            if docker ps -a --filter "name=${CONTAINER_NAME}" --format "{{.Names}}" | grep -q "${CONTAINER_NAME}"; then
              echo "🗑️ Removing the container: ${CONTAINER_NAME}"
              docker stop ${CONTAINER_NAME} || true
              docker rm ${CONTAINER_NAME} || true
              echo "DESTROYED=true"
            else
              echo "ℹ️ The container does not exist: ${CONTAINER_NAME}"
              echo "DESTROYED=false"
            fi

      - name: Removal confirmation comment
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.extract.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const projectName = '${{ env.PROJECT_NAME }}';
            const containerSuffix = '${{ steps.extract.outputs.container_suffix }}';
            const branchName = process.env.BRANCH_NAME;
            const containerName = `${projectName}-${containerSuffix}`;

            const body = [
              t('spring_preview.heading.custom_destroyed'),
              '',
              t('spring_preview.table.item_header'),
              '|------|-----|',
              t('spring_preview.row.branch', { branch: branchName }),
              t('spring_preview.row.container', { container: containerName }),
              '',
              t('spring_preview.hint.redeploy', { command: `@projectops server build ${branchName}` }),
              '',
              '---',
              t('spring_preview.footer.generated', { system: 'Preview' })
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  check-status-custom-branch:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: Check preview status (Custom Branch)
    needs: check-command
    if: |
      needs.check-command.outputs.is_valid == 'true' &&
      needs.check-command.outputs.command == 'status' &&
      needs.check-command.outputs.is_custom_branch == 'true'
    runs-on: ubuntu-latest
    steps:
      # Comment text follows the repo language (version.yml options.language) (#769).
      # Fetch only the catalog as a module in $RUNNER_TEMP and delete the fetched folder (so it does not clash with the later checkout)
      # Fetched from the default branch — the merge ref of a PR closed event may already be gone
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js spring_preview. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Extract container suffix from branch name
        id: extract
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.check-command.outputs.custom_branch }}
        with:
          script: |
            const branchName = process.env.BRANCH_NAME;
            const issueMatch = branchName.match(/#(\d+)/);

            if (issueMatch) {
              core.setOutput('container_suffix', `pr-${issueMatch[1]}`);
            } else {
              let hash = 0;
              for (let i = 0; i < branchName.length; i++) {
                const char = branchName.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
              }
              const hashStr = Math.abs(hash).toString(16).slice(-6).padStart(6, '0');
              core.setOutput('container_suffix', `custom-${hashStr}`);
            }

            core.setOutput('branch_name', branchName);

      - name: Check container status
        id: check_running
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            export PATH=$PATH:/usr/local/bin

            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            CONTAINER_SUFFIX="${{ steps.extract.outputs.container_suffix }}"
            CONTAINER_NAME="${PROJECT_NAME}-${CONTAINER_SUFFIX}"

            docker ps --filter "name=${CONTAINER_NAME}" --format "{{.Names}}" | grep -q "${CONTAINER_NAME}"

      - name: Post status comment
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.extract.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const projectName = '${{ env.PROJECT_NAME }}';
            const containerSuffix = '${{ steps.extract.outputs.container_suffix }}';
            const branchName = process.env.BRANCH_NAME;
            const domainSuffix = '${{ env.PREVIEW_DOMAIN_SUFFIX }}';
            const previewPort = '${{ env.PREVIEW_PORT }}';

            const containerName = `${projectName}-${containerSuffix}`;
            const previewUrl = `http://${containerName}.${domainSuffix}:${previewPort}`;
            const isRunning = '${{ steps.check_running.outcome }}' === 'success';

            let body;
            if (isRunning) {
              body = [
                t('spring_preview.heading.custom_running'),
                '',
                t('spring_preview.table.item_header'),
                '|------|-----|',
                t('spring_preview.row.branch', { branch: branchName }),
                `| **Preview URL** | ${previewUrl} |`,
                t('spring_preview.row.container', { container: containerName }),
                t('spring_preview.row.state', { state: '🟢 Running' }),
                '',
                t('spring_preview.section.commands'),
                t('spring_preview.table.command_header'),
                '|--------|------|',
                t('spring_preview.cmd.redeploy', { command: `@projectops server build ${branchName}` }),
                t('spring_preview.cmd.destroy', { command: `@projectops server destroy ${branchName}` }),
                '',
                '---',
                t('spring_preview.footer.generated', { system: 'Preview' })
              ].join('\n');
            } else {
              body = [
                t('spring_preview.heading.custom_not_found'),
                '',
                t('spring_preview.table.item_header'),
                '|------|-----|',
                t('spring_preview.row.branch', { branch: branchName }),
                t('spring_preview.row.container', { container: containerName }),
                t('spring_preview.row.state', { state: '🔴 Not Found' }),
                '',
                t('spring_preview.hint.deploy', { command: `@projectops server build ${branchName}` }),
                '',
                '---',
                t('spring_preview.footer.generated', { system: 'Preview' })
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
