# ===================================================================
# Spring GitHub Packages library publish workflow
# ===================================================================
#
# Publishes a Java library module to GitHub Packages (Maven repo) automatically.
# Hosts dependencies with GitHub alone, without Nexus.
#
# ⚠️ CI/CD only for publishing Java library modules.
#    Not for deploying Spring Boot applications.
#
# ===================================================================
# 🛠️ build.gradle requirements
# ===================================================================
# Add a GitHub Packages entry to the publishing.repositories.maven block:
#
#   maven {
#     name = "GitHubPackages"
#     url = uri("https://maven.pkg.github.com/${System.getenv('GITHUB_REPOSITORY')}")
#     credentials {
#       username = System.getenv("GITHUB_ACTOR")
#       password = System.getenv("GITHUB_TOKEN")
#     }
#   }
#
# 💡 Free account limits (private repos):
#   - 500MB storage + 1GB transfer free per month
#   - Public repos are free without limit
# ===================================================================

name: PROJECT-SPRING-GITHUB-PACKAGES-PUBLISH

on:
  push:
    branches: ["main"]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: github-packages-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      - name: Get version
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}
            echo "🏷️ Version from tag: $VERSION"
          else
            chmod +x .github/scripts/version_manager.sh
            VERSION=$(./.github/scripts/version_manager.sh get | tail -n 1)
            echo "📄 Version from version.yml: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version $VERSION"

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "🚀 Publishing version $VERSION to GitHub Packages"
          ./gradlew publishMavenPublicationToGitHubPackagesRepository -Pversion=$VERSION
