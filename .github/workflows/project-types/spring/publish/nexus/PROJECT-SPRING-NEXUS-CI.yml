# ===================================================================
# Spring Nexus CI 워크플로우
# ===================================================================
#
# 🔑 필수 GitHub Secrets
# ===================================================================
# GRADLE_PROPERTIES: gradle.properties 파일 내용 (Nexus 인증 정보 포함)
# ===================================================================

name: PROJECT-SPRING-NEXUS-CI

on:
  pull_request:
    branches: [ develop ]
    types: [opened, synchronize, reopened]
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

jobs:
  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    
    steps:
    # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
    # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
    # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
    - name: Check out the message catalog
      continue-on-error: true
      uses: actions/checkout@v5
      with:
        sparse-checkout: |
          .github/scripts/i18n
          version.yml
        sparse-checkout-cone-mode: false
        path: .projectops-messages
        ref: ${{ github.event.repository.default_branch }}

    - name: Load comment messages
      working-directory: ${{ github.workspace }}
      run: |
        python3 .projectops-messages/.github/scripts/i18n/messages.py js nexus_ci. \
          --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
          || { echo "::warning::Message catalog not found, comments show message keys"
               echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
        rm -rf .projectops-messages

    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@b5418f5a58f5fd2eb486dd7efb368fe7be7eae45 # v2
      continue-on-error: true

    - name: Create gradle.properties from secret
      env:
        GRADLE_PROPERTIES: ${{ secrets.GRADLE_PROPERTIES }}
      run: |
        echo -e "$GRADLE_PROPERTIES" > gradle.properties

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      with:
        gradle-version: wrapper

    - name: Clean Build Directory
      run: ./gradlew clean

    - name: Compile Sources
      id: compile
      run: |
        set +e
        ./gradlew compileJava compileTestJava 2>&1 | tee compile_output.txt
        echo "compile_exit_code=$?" >> $GITHUB_OUTPUT
        set -e
      continue-on-error: true

    - name: Run Tests
      id: test
      run: |
        set +e
        ./gradlew test 2>&1 | tee test_output.txt
        echo "test_exit_code=$?" >> $GITHUB_OUTPUT
        set -e
      continue-on-error: true

    - name: Build JAR
      id: build
      run: |
        set +e
        ./gradlew build -x test 2>&1 | tee build_output.txt
        echo "build_exit_code=$?" >> $GITHUB_OUTPUT
        set -e
      continue-on-error: true

    - name: Generate Build Report
      id: report
      if: always()
      run: |
        # 상태 값은 뒤 스텝의 if: 조건이 비교하는 출력값이라 번역하지 않는다 (댓글에서만 언어별로 바꿔 보여 준다, #769)
        # 빌드 상태 확인 (exit code 기반)
        COMPILE_STATUS="✅ 성공"
        TEST_STATUS="✅ 성공"
        BUILD_STATUS="✅ 성공"
        
        # 컴파일 상태 확인
        COMPILE_EXIT_CODE="${{ steps.compile.outputs.compile_exit_code }}"
        if [ "$COMPILE_EXIT_CODE" != "0" ] && [ "$COMPILE_EXIT_CODE" != "" ]; then
          COMPILE_STATUS="❌ 실패"
        fi
        
        # 테스트 상태 확인  
        TEST_EXIT_CODE="${{ steps.test.outputs.test_exit_code }}"
        if [ "$TEST_EXIT_CODE" != "0" ] && [ "$TEST_EXIT_CODE" != "" ]; then
          TEST_STATUS="❌ 실패"
        fi
        
        # 빌드 상태 확인
        BUILD_EXIT_CODE="${{ steps.build.outputs.build_exit_code }}"
        if [ "$BUILD_EXIT_CODE" != "0" ] && [ "$BUILD_EXIT_CODE" != "" ]; then
          BUILD_STATUS="❌ 실패"
        fi
        
        # 전체 빌드 상태
        OVERALL_STATUS="✅ 성공"
        if [ "$COMPILE_EXIT_CODE" != "0" ] || [ "$TEST_EXIT_CODE" != "0" ] || [ "$BUILD_EXIT_CODE" != "0" ]; then
          OVERALL_STATUS="❌ 실패"
        fi
        
        echo "compile_status=$COMPILE_STATUS" >> $GITHUB_OUTPUT
        echo "test_status=$TEST_STATUS" >> $GITHUB_OUTPUT
        echo "build_status=$BUILD_STATUS" >> $GITHUB_OUTPUT
        echo "overall_status=$OVERALL_STATUS" >> $GITHUB_OUTPUT

    - name: Extract Error Details
      id: errors
      if: always()
      run: |
        # 댓글에 들어가는 제목·안내는 레포 언어를 따른다 (#769). 카탈로그가 없으면 영문
        msg() { python3 .github/scripts/i18n/messages.py get "$1" 2>/dev/null || printf '%s' "$2"; }

        # 컴파일 에러 추출
        if [ -f compile_output.txt ] && [ "${{ steps.compile.outputs.compile_exit_code }}" != "0" ]; then
          echo "compile_errors<<EOF" >> $GITHUB_OUTPUT
          echo "$(msg nexus_ci.errors.compile_heading '## 🚨 Compile errors')" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          grep -A 15 -B 15 "error\|Error\|ERROR\|FAILED\|Failed\|failed" compile_output.txt | head -60 >> $GITHUB_OUTPUT || echo "$(msg nexus_ci.errors.compile_log_missing 'Could not find the error log.')" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi
        
        # 테스트 에러 추출
        if [ -f test_output.txt ] && [ "${{ steps.test.outputs.test_exit_code }}" != "0" ]; then
          echo "test_errors<<EOF" >> $GITHUB_OUTPUT
          echo "$(msg nexus_ci.errors.test_heading '## 🧪 Test failures')" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          grep -A 15 -B 15 "FAILED\|Failed\|failed\|error\|Error\|ERROR" test_output.txt | head -60 >> $GITHUB_OUTPUT || echo "$(msg nexus_ci.errors.test_log_missing 'Could not find the test error log.')" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi
        
        # 빌드 에러 추출
        if [ -f build_output.txt ] && [ "${{ steps.build.outputs.build_exit_code }}" != "0" ]; then
          echo "build_errors<<EOF" >> $GITHUB_OUTPUT
          echo "$(msg nexus_ci.errors.build_heading '## 📦 Build errors')" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          grep -A 15 -B 15 "FAILED\|Failed\|failed\|error\|Error\|ERROR" build_output.txt | head -60 >> $GITHUB_OUTPUT || echo "$(msg nexus_ci.errors.build_log_missing 'Could not find the build error log.')" >> $GITHUB_OUTPUT
          echo '```' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi

    - name: Comment on PR (Success)
      if: github.event_name == 'pull_request' && steps.report.outputs.overall_status == '✅ 성공'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
          // 상태 출력값(한국어 고정)을 댓글 언어로 바꿔 보여 준다
          const showStatus = (value) => ({ '✅ 성공': t('nexus_ci.status.success'), '❌ 실패': t('nexus_ci.status.failure') })[value] ?? value;
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          // 기존 봇 댓글 찾기
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('🔧 CI Build Check')
          );
          
          // 기존 댓글을 찾는 표식 '🔧 CI Build Check' 는 언어와 상관없이 제목에 넣는다
          const successMessage = [
            t('nexus_ci.comment.heading', { marker: '🔧 CI Build Check' }),
            '',
            t('nexus_ci.comment.build_succeeded'),
            '',
            t('nexus_ci.comment.table_header'),
            '|------|------|',
            `| ${t('nexus_ci.label.compile')} | ${showStatus('${{ steps.report.outputs.compile_status }}')} |`,
            `| ${t('nexus_ci.label.test')} | ${showStatus('${{ steps.report.outputs.test_status }}')} |`,
            `| ${t('nexus_ci.label.build')} | ${showStatus('${{ steps.report.outputs.build_status }}')} |`,
            '',
            t('nexus_ci.comment.overall', { status: showStatus('${{ steps.report.outputs.overall_status }}') }),
            '',
            '---',
            t('nexus_ci.comment.footer', { time: new Date().toLocaleString(t('nexus_ci.time.locale'), { timeZone: t('nexus_ci.time.zone') }) }),
          ].join('\n');
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: successMessage
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: successMessage
            });
          }

    - name: Comment on PR (Failure)
      if: github.event_name == 'pull_request' && steps.report.outputs.overall_status == '❌ 실패'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
          // 상태 출력값(한국어 고정)을 댓글 언어로 바꿔 보여 준다
          const showStatus = (value) => ({ '✅ 성공': t('nexus_ci.status.success'), '❌ 실패': t('nexus_ci.status.failure') })[value] ?? value;
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          
          // 기존 봇 댓글 찾기
          const botComment = comments.find(comment => 
            comment.user.type === 'Bot' && 
            comment.body.includes('🔧 CI Build Check')
          );
          
          let errorDetails = '';
          
          // 컴파일 에러 추가
          if ('${{ steps.errors.outputs.compile_errors }}') {
            errorDetails += '${{ steps.errors.outputs.compile_errors }}\n\n';
          }
          
          // 테스트 에러 추가  
          if ('${{ steps.errors.outputs.test_errors }}') {
            errorDetails += '${{ steps.errors.outputs.test_errors }}\n\n';
          }
          
          // 빌드 에러 추가
          if ('${{ steps.errors.outputs.build_errors }}') {
            errorDetails += '${{ steps.errors.outputs.build_errors }}\n\n';
          }
          
          // 기존 댓글을 찾는 표식 '🔧 CI Build Check' 는 언어와 상관없이 제목에 넣는다
          const failureMessage = [
            t('nexus_ci.comment.heading', { marker: '🔧 CI Build Check' }),
            '',
            t('nexus_ci.comment.build_failed'),
            '',
            t('nexus_ci.comment.table_header'),
            '|------|------|',
            `| ${t('nexus_ci.label.compile')} | ${showStatus('${{ steps.report.outputs.compile_status }}')} |`,
            `| ${t('nexus_ci.label.test')} | ${showStatus('${{ steps.report.outputs.test_status }}')} |`,
            `| ${t('nexus_ci.label.build')} | ${showStatus('${{ steps.report.outputs.build_status }}')} |`,
            '',
            t('nexus_ci.comment.overall', { status: showStatus('${{ steps.report.outputs.overall_status }}') }),
            '',
            t('nexus_ci.comment.error_details_heading'),
            '',
            errorDetails,
            '',
            t('nexus_ci.comment.fix_heading'),
            t('nexus_ci.comment.fix_build'),
            t('nexus_ci.comment.fix_errors'),
            t('nexus_ci.comment.fix_tests'),
            '',
            '---',
            t('nexus_ci.comment.footer', { time: new Date().toLocaleString(t('nexus_ci.time.locale'), { timeZone: t('nexus_ci.time.zone') }) }),
          ].join('\n');
          
          if (botComment) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: botComment.id,
              body: failureMessage
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: failureMessage
            });
          }

    - name: Create Check Run
      if: always()
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
          // 상태 출력값(한국어 고정)을 체크 결과 언어로 바꿔 보여 준다
          const showStatus = (value) => ({ '✅ 성공': t('nexus_ci.status.success'), '❌ 실패': t('nexus_ci.status.failure') })[value] ?? value;
          const conclusion = '${{ steps.report.outputs.overall_status }}' === '✅ 성공' ? 'success' : 'failure';
          const summary = t(conclusion === 'success' ? 'nexus_ci.check.summary_success' : 'nexus_ci.check.summary_failure');
          
          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            name: 'Build Verification',
            head_sha: context.sha,
            status: 'completed',
            conclusion: conclusion,
            output: {
              title: '🔧 CI Build Check',
              summary: summary,
              text: `
              ${t('nexus_ci.label.compile')}: ${showStatus('${{ steps.report.outputs.compile_status }}')}
              ${t('nexus_ci.label.test')}: ${showStatus('${{ steps.report.outputs.test_status }}')}  
              ${t('nexus_ci.label.build')}: ${showStatus('${{ steps.report.outputs.build_status }}')}
              `
            }
          });

    - name: Fail Job on Build Failure
      if: steps.report.outputs.overall_status == '❌ 실패'
      run: |
        echo "❌ The build failed. Check the error messages above."
        exit 1
