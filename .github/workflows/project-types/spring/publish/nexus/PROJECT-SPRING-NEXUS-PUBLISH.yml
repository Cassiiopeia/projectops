# ===================================================================
# Spring Nexus library publish workflow
# ===================================================================
#
# 🔑 Required GitHub Secrets
# ===================================================================
# GRADLE_PROPERTIES: contents of gradle.properties (includes Nexus credentials)
# ===================================================================

name: PROJECT-SPRING-NEXUS-PUBLISH

on:
  push:
    branches: ["main"]
    tags:
      - 'v*.*.*'

permissions:
  # Only uploads to Nexus — no GITHUB_TOKEN permission needed beyond reading the repo (#595).
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # v2

      - name: Create gradle.properties from secret
        env:
          GRADLE_PROPERTIES: ${{ secrets.GRADLE_PROPERTIES }}
        run: |
          echo -e "$GRADLE_PROPERTIES" > gradle.properties

      - name: Get version
        id: get_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Extract the version from the tag
            TAG_NAME=${GITHUB_REF#refs/tags/}
            VERSION=${TAG_NAME#v}
            echo "🏷️ Version from tag: $VERSION"
          else
            # Extract the version from version.yml on main
            chmod +x .github/scripts/version_manager.sh
            VERSION=$(./.github/scripts/version_manager.sh get | tail -n 1)
            echo "📄 Version from version.yml: $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version $VERSION"

      - name: Publish to Nexus
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          echo "🚀 Publishing version $VERSION to Nexus Repository"
          ./gradlew publish -Pversion=$VERSION

