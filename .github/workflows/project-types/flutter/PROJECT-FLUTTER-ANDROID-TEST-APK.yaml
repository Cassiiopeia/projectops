# ===================================================================
# Flutter Android 테스트용 APK 빌드 워크플로우
# ===================================================================
#
# 이 워크플로우는 기능 브랜치에서 수동으로 실행하여
# 테스트용 Android APK를 빌드합니다.
#
# 주요 특징:
# - workflow_dispatch로 수동 실행 또는 repository_dispatch로 트리거
# - 버전은 version.yml에서 동적으로 읽어 사용 (운영 버전과 동일, 빌드 번호로 구분)
# - 빌드 번호는 build_number.py가 정하는 시각 기반 값 (2024-01-01 UTC부터 지난 초)
# - 브랜치명에서 이슈 번호 자동 추출 (YYYYMMDD_#이슈번호_내용 형식)
# - GitHub API로 이슈 정보 가져와서 빌드 정보에 포함
# - APK 파일만 생성 (Play Store 배포 제거)
# - 아티팩트로 업로드하여 다운로드 가능 (최대 500MB/아티팩트)
# - 아티팩트 이름에 브랜치명 포함하여 구분 용이
# - Firebase App Distribution 연동 (FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 시크릿 있을 때)
#
# ⚠️ 브랜치 규칙 의존:
# 이 워크플로우는 브랜치명 `YYYYMMDD_#이슈번호_제목` 형식에서 이슈 번호를 추출합니다.
# 이슈 생성 시 SUH-ISSUE-HELPER 댓글이 제안하는 브랜치명을 그대로 사용하세요.
# 형식이 다르면: 이슈 연동 빌드 정보가 누락됩니다 (빌드 자체는 진행).
# 상세: docs/BRANCH-CONVENTION.md (템플릿 레포)
#
# 사용 방법:
# 1. 기능 브랜치로 체크아웃
# 2. GitHub Actions에서 이 워크플로우 선택
# 3. "Run workflow" 버튼 클릭
# 4. 빌드 완료 후 아티팩트에서 APK 다운로드
#
# ===================================================================
# 🔑 필수 GitHub Secrets
# ===================================================================
#
# 🔐 Release Keystore (Play Store 배포와 동일):
# RELEASE_KEYSTORE_BASE64: 릴리즈 키스토어 파일 (base64)
# RELEASE_KEYSTORE_PASSWORD: 키스토어 비밀번호
# RELEASE_KEY_ALIAS: 키 별칭
# RELEASE_KEY_PASSWORD: 키 비밀번호
#
# 📝 환경 설정 (선택):
# ENV_FILE (선택): .env 파일 내용
# GOOGLE_SERVICES_JSON (선택): google-services.json 내용 (Firebase 사용 시)
#
# 🔥 Firebase App Distribution (선택):
# FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: Firebase 서비스 계정 JSON (base64)
#
# 🪄 빠른 설정: .github/util/flutter/firebase-wizard/firebase-wizard.html을
#    브라우저에서 열어 5단계 마법사로 Firebase 배포를 자동 설정할 수 있습니다.
#
# ===================================================================

name: PROJECT-Flutter-Android-Test-APK

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-android-app]

# ⚠️ repository_dispatch 는 **기본 브랜치(main)의 워크플로 정의**로 실행된다 (#595).
#    이 파일을 develop 에서 고치고 테스트 빌드를 다시 걸면 **여전히 옛 정의가 돈다** —
#    고친 게 안 먹은 것처럼 보여 원인을 엉뚱한 데서 찾게 된다.
#    반드시 기본 브랜치에 반영된 뒤에 확인할 것. (build 대상 브랜치와는 별개다)

permissions:
  # 이슈·PR에 진행 상황 댓글을 단다. 명시하지 않으면 레포 기본값을 따르는데,
  # GitHub 신규 레포 기본값은 read 라서 **댓글 다는 순간 실패**한다 (#595).
  #   RequestError [HttpError]: Resource not accessible by integration
  contents: read
  issues: write
  pull-requests: write

# ===================================================================
# 🔧 프로젝트별 설정 (아래 값들을 수정하세요)
# ===================================================================
env:
  # 레포 변수 FLUTTER_VERSION·JAVA_VERSION 이 있으면 아래 값보다 먼저 쓴다 (템플릿 업데이트에도 유지, #758)
  FLUTTER_VERSION: "3.38.9"
  JAVA_VERSION: "__JAVA_VERSION__"  # @wizard ask:17
  ENV_FILE_PATH: ".env"
  FIREBASE_APP_ID: "{FIREBASE_APP_ID}"
  FIREBASE_TESTER_GROUP: "{TESTER_GROUP}"

  # Flutter 루트 경로(레포 루트 기준). 단일레포면 ".", 모노레포면 "app" 등.
  # 통합 시점에 integrator의 flutter-root resolver가 project_paths.flutter 값으로 1회 치환.
  # FLUTTER_ROOT는 Flutter SDK 경로용 공식 변수라 충돌 — APP_ROOT로 분리
  APP_ROOT: "."  # @wizard auto:flutter-root
jobs:
  prepare-test-build:
    name: Prepare test build
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.build_info.outputs.version }}
      issue_url: ${{ steps.issue_info.outputs.issue_url }}
      issue_title: ${{ steps.issue_info.outputs.issue_title }}
      issue_number: ${{ steps.issue_info.outputs.issue_number }}
      branch_name: ${{ steps.issue_info.outputs.branch_name }}
      commit_hash: ${{ steps.build_info.outputs.commit_hash }}
      commit_sha: ${{ steps.build_info.outputs.commit_sha }}
      pr_number: ${{ steps.build_info.outputs.pr_number }}
      build_number: ${{ steps.build_info.outputs.build_number }}
      progress_comment_id: ${{ steps.progress_comment.outputs.comment_id }}
      progress_start_time: ${{ steps.progress_comment.outputs.start_time }}
      firebase_available: ${{ steps.firebase_check.outputs.available }}

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js test_apk. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Check that the branch exists first
        id: verify_branch
        if: github.event_name == 'repository_dispatch'
        uses: actions/github-script@v7
        env:
          # 외부에서 온 브랜치명은 스크립트 소스에 넣지 않고 env 로 전달 (#646)
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const branchName = process.env.BRANCH_NAME;
            const prNumber = '${{ github.event.client_payload.pr_number }}';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            console.log(`🔍 Checking that the branch exists: ${branchName}`);

            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: branchName
              });
              console.log(`✅ Branch exists: ${branchName}`);
            } catch (error) {
              if (error.status === 404) {
                console.log(`❌ Branch not found: ${branchName}`);

                // 에러 댓글 작성
                // 서명은 구버전 소비자가 읽는 계약 문자열이라 값으로 넣는다 (contracts.py)
                const body = t('test_apk.branch_missing.body', {
                  branch: branchName, number: prNumber, signature: 'Guide by ProjectOps', url: runUrl
                });

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(prNumber),
                  body: body
                });

                core.setFailed(`Branch not found: ${branchName}`);
              } else {
                core.setFailed(`Error while checking the branch: ${error.message}`);
              }
            }

      - name: Check Firebase credentials
        id: firebase_check
        # checkout 전에 실행되므로 APP_ROOT 디렉터리가 아직 없다.
        # Secret 유무만 확인하는 스텝이라 레포 루트에서 실행한다.
        working-directory: ${{ github.workspace }}
        env:
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_SECRET" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "✅ Firebase service account found - App Distribution upload will run"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⚠️ No Firebase service account - skipping the App Distribution upload"
          fi

      # ===================================================================
      # 진행 상황 댓글 시스템
      # ===================================================================
      - name: Create the progress comment
        id: progress_comment
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const prNumber = parseInt('${{ github.event.client_payload.pr_number }}');
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const startTime = Date.now();
            const firebaseAvailable = '${{ steps.firebase_check.outputs.available }}' === 'true';

            const rows = [
              `| ${t('test_apk.stage.prepare')} | ${t('test_apk.status.in_progress')} | - |`,
              `| ${t('test_apk.stage.build')} | ${t('test_apk.status.waiting')} | - |`,
              `| ${t('test_apk.stage.artifact')} | ${t('test_apk.status.waiting')} | - |`,
            ];
            if (firebaseAvailable) {
              rows.push(`| 🔥 Firebase App Distribution | ${t('test_apk.status.waiting')} | - |`);
            }

            const body = [
              t('test_apk.heading.in_progress'),
              '',
              t('test_apk.table.header'),
              '|------|------|----------|',
              ...rows,
              '',
              t('test_apk.live_log', { url: runUrl })
            ].join('\n');

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

            console.log(`✅ Progress comment created (ID: ${comment.id})`);
            core.setOutput('comment_id', comment.id.toString());
            core.setOutput('start_time', startTime.toString());

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref }}

      - name: Pull latest changes
        env:
          BRANCH_NAME: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref_name }}
        run: |
          echo "🌿 Branch: $BRANCH_NAME"
          git pull origin "$BRANCH_NAME" || echo "⚠️ Pull failed (the branch may already be up to date)"

      # 브랜치명에서 이슈 번호 추출 및 GitHub API로 이슈 정보 가져오기
      - name: Read issue information from the branch name
        id: issue_info
        env:
          # 브랜치명은 스크립트 소스에 직접 넣지 않고 env 로 받는다 (#646)
          DISPATCH_BRANCH: ${{ github.event.client_payload.branch_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # repository_dispatch인 경우 client_payload에서 브랜치명 가져오기
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            BRANCH_NAME="$DISPATCH_BRANCH"
            ISSUE_NUMBER="${{ github.event.client_payload.issue_number }}"
          else
            BRANCH_NAME="$REF_NAME"
            # 브랜치명에서 이슈 번호 추출 (#387 형식)
            # 브랜치 이름의 **첫** `#번호` 를 쓴다. 탐욕 매칭(`.*#`)은 제목에 `#` 이 또 있으면 마지막 번호를 잡았다.
            ISSUE_NUMBER=$(echo "$BRANCH_NAME" | sed -n 's/^[^#]*#\([0-9][0-9]*\).*/\1/p')
          fi

          echo "🌿 Branch: $BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "⚠️ No issue number found in the branch name."
            echo "issue_url=" >> $GITHUB_OUTPUT
            echo "issue_title=" >> $GITHUB_OUTPUT
            echo "issue_number=" >> $GITHUB_OUTPUT
          else
            echo "✅ Issue number: #$ISSUE_NUMBER"
            ISSUE_URL="https://github.com/${{ github.repository }}/issues/$ISSUE_NUMBER"
            echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT
            echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

            # GitHub API로 이슈 정보 가져오기
            echo "🔍 Reading the issue through the GitHub API..."
            ISSUE_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER")

            ISSUE_TITLE=$(echo "$ISSUE_RESPONSE" | jq -r '.title // "No issue info"')
            ISSUE_STATE=$(echo "$ISSUE_RESPONSE" | jq -r '.state // "unknown"')

            if [ "$ISSUE_TITLE" = "null" ] || [ "$ISSUE_TITLE" = "No issue info" ]; then
              echo "⚠️ Issue #$ISSUE_NUMBER was not found."
              echo "issue_title=" >> $GITHUB_OUTPUT
            else
              echo "📋 Issue title: $ISSUE_TITLE"
              echo "📌 Issue state: $ISSUE_STATE"
              echo "issue_title=$ISSUE_TITLE" >> $GITHUB_OUTPUT
            fi
          fi

      # 버전 관리 스크립트 권한 설정
      - name: Make the version script executable
        working-directory: ${{ github.workspace }}   # 레포 루트 자산(.github/scripts·version.yml)은 APP_ROOT가 아닌 레포 루트 기준
        run: chmod +x ./.github/scripts/version_manager.sh

      # 빌드 번호는 build_number.py 한 곳에서만 정한다 (시각 기반, 1초 단위 단조 증가)
      - name: Decide the build number
        id: build_no
        working-directory: ${{ github.workspace }}   # build_number.py는 레포 루트 자산
        run: python3 .github/scripts/build_number.py next

      # 빌드 정보 생성
      - name: Collect build information
        working-directory: ${{ github.workspace }}   # 레포 루트 자산(.github/scripts·version.yml)은 APP_ROOT가 아닌 레포 루트 기준
        id: build_info
        run: |
          # version_manager.sh로 버전 가져오기 (프로덕션 워크플로우와 동일한 방식)
          VERSION=$(./.github/scripts/version_manager.sh get | tail -n 1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # repository_dispatch 컨텍스트 커밋은 기본 브랜치 것이라 실제 빌드한 HEAD를 직접 읽는다
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_SHORT=$(echo "$COMMIT_SHA" | cut -c1-7)
          BUILD_NUMBER="${{ steps.build_no.outputs.build_number }}"
          BUILD_DATE=$(date '+%Y-%m-%d %H:%M:%S')

          # repository_dispatch 이벤트인 경우 진행 댓글을 달 PR 번호를 받는다 (빌드 번호와 무관)
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            PR_NUMBER="${{ github.event.client_payload.pr_number }}"
            echo "📋 repository_dispatch event"
            echo "  PR number: #$PR_NUMBER"
          else
            PR_NUMBER=""
            echo "📋 workflow_dispatch event"
          fi

          echo "commit_hash=$COMMIT_SHORT" >> $GITHUB_OUTPUT
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "build_date=$BUILD_DATE" >> $GITHUB_OUTPUT

          echo "📋 Build information:"
          echo "  Build number: #$BUILD_NUMBER"
          if [ -n "$PR_NUMBER" ]; then
            echo "  PR number: #$PR_NUMBER"
          fi
          echo "  Commit: $COMMIT_SHORT"
          echo "  Build date: $BUILD_DATE"

      # 취소 처리 (#648): 댓글을 만든 준비 job 이 실행 중일 때 취소된 경우. 준비 job 은 needs 가 없어 같은 job 의 스텝 출력으로 ID 를 읽는다. 이 스텝이 뒤의 스텝들 끝에 있어야 어느 시점에 취소돼도 잡힌다.
      - name: Update progress - cancelled (prepare job)
        if: cancelled() && github.event_name == 'repository_dispatch' && steps.progress_comment.outputs.comment_id != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          COMMENT_ID: ${{ steps.progress_comment.outputs.comment_id }}
          START_TIME: ${{ steps.progress_comment.outputs.start_time }}
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          RUN_ID: ${{ github.run_id }}
          FIREBASE_AVAILABLE: ${{ steps.firebase_check.outputs.available }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: formatElapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt(process.env.COMMENT_ID, 10);
            const startTime = parseInt(process.env.START_TIME, 10);
            const branchName = process.env.BRANCH_NAME;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}`;
            const firebaseAvailable = process.env.FIREBASE_AVAILABLE === 'true';
            // 성공/실패 스텝이 이미 최종 상태를 쓴 댓글은 덮어쓰지 않는다
            const { data: current } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId
            });
            if (!(current.body || '').startsWith(t('test_apk.heading.in_progress'))) {
              console.log('The comment already shows a final state, skipping the cancel update');
              return;
            }

            let duration = '-';
            if (!Number.isNaN(startTime)) {
              const elapsed = Date.now() - startTime;
              const minutes = Math.floor(elapsed / 60000);
              const seconds = Math.floor((elapsed % 60000) / 1000);
              duration = formatElapsed(minutes, seconds);
            }

            const body = [
              t('test_apk.heading.cancelled'),
              '',
              t('test_apk.table.header'),
              '|------|------|----------|',
              `| ${t('test_apk.stage.prepare')} | ${t('test_apk.status.cancelled')} | - |`,
              `| ${t('test_apk.stage.build')} | ${t('test_apk.status.cancelled')} | - |`,
              `| ${t('test_apk.stage.artifact')} | ${t('test_apk.status.cancelled')} | - |`,
              ...(firebaseAvailable ? [`| 🔥 Firebase App Distribution | ${t('test_apk.status.cancelled')} | - |`] : []),
              '',
              t('test_apk.cancelled.details', { branch: branchName, duration, url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log('🚫 Progress updated: cancelled');

  build-android-test:
    name: Build Android test APK
    runs-on: ubuntu-latest
    needs: prepare-test-build

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js test_apk. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # 준비 job이 고정한 SHA로 받는다. 브랜치명으로 받으면 그 사이 push된 커밋이 섞여
          # 댓글과 build-info에 표시한 커밋과 실제 빌드한 코드가 달라지므로 pull도 하지 않는다.
          ref: ${{ needs.prepare-test-build.outputs.commit_sha }}

      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > ${{ env.ENV_FILE_PATH }}
          echo "✅ ${{ env.ENV_FILE_PATH }} file created"

      # 빌드 프로파일 — 런타임(.env)과 컴파일타임(dart-define)을 한 곳에서 정한다 (#603)
      #
      # 예전에는 .env 만 고치고 dart-define 은 빌드 명령에 따로 적었다. 그래서
      # **한쪽만 적용돼도 빌드가 통과했다** — .env 에 개발 플래그가 찍혔는데 설치해 보면
      # 디버깅 도구가 없었다. 로그만 봐서는 알 수 없었다.
      #
      # 설정(.github/config/build-profile.json)이 없는 저장소에서는 아무 일도 하지 않는다.
      - name: Apply build profile (test)
        id: build_profile
        run: |
          python3 "${{ github.workspace }}/.github/scripts/apply_build_profile.py" \
            test "${{ env.ENV_FILE_PATH }}" \
            --config "${{ github.workspace }}/.github/config/build-profile.json"

      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/key.jks
          echo "✅ Release keystore created"
          ls -la android/keystore/

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat << EOF | sed -E 's/^ {10}//' > android/key.properties
          storeFile=keystore/key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "✅ key.properties created"

      # Secret 이 있을 때만 쓴다 — 없으면 커밋된 파일을 그대로 두고, 필요한데 없으면 원인을 ::error 로 (#785)
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/firebase_config_files.py" restore --platform android --app-root .

      # Flutter 설정
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Flutter version
        run: |
          echo "✅ Flutter setup completed"
          flutter --version

      # Flutter 및 Gradle 캐시
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 프로젝트 의존성 설치
      - name: Install dependencies
        run: |
          flutter pub get
          echo "✅ Dependencies installed"

      # Gradle 셋업
      - name: Setup Gradle
        working-directory: ${{ env.APP_ROOT }}/android
        run: |
          # Flutter 기본 .gitignore가 gradlew를 제외하므로 CI 체크아웃 시 없을 수 있다.
          # flutter build가 자체 Gradle을 쓰므로 없어도 빌드는 진행된다.
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "✅ Gradle wrapper permissions set"
          else
            echo "ℹ️ No gradlew - using the Gradle bundled with Flutter"
          fi

      # Java 설정
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ vars.JAVA_VERSION || env.JAVA_VERSION }}

      - name: Verify Java version
        run: |
          echo "✅ Java setup completed"
          java -version

      # Ruby 설정
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.4.1"
          bundler-cache: true

      - name: Verify Ruby version
        run: |
          echo "✅ Ruby setup completed"
          ruby -v

      # Fastlane 설치 (Bundler 방식 - gem 충돌 방지)
      - name: Install Fastlane
        working-directory: ${{ env.APP_ROOT }}/android
        run: |
          # multi_json: google-apis transitive 의존성이 선언 누락한 upstream 버그 회피 (gemspec 미선언 → Gem::LoadError)
          printf 'source "https://rubygems.org"\ngem "fastlane"\ngem "multi_json"\n' > Gemfile
          bundle install
          echo "✅ Fastlane installed (Bundler)"
          bundle exec fastlane --version

      # 진행상황 - 준비 완료
      - name: Progress - prepare done
        id: progress_step1
        if: github.event_name == 'repository_dispatch' && needs.prepare-test-build.outputs.progress_comment_id != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: formatElapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt('${{ needs.prepare-test-build.outputs.progress_comment_id }}');
            const startTime = parseInt('${{ needs.prepare-test-build.outputs.progress_start_time }}');
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();
            const elapsed = Math.round((now - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const elapsedStr = formatElapsed(minutes, seconds);
            const firebaseAvailable = '${{ needs.prepare-test-build.outputs.firebase_available }}' === 'true';

            const rows = [
              `| ${t('test_apk.stage.prepare')} | ${t('test_apk.status.done')} | ${elapsedStr} |`,
              `| ${t('test_apk.stage.build')} | ${t('test_apk.status.in_progress')} | - |`,
              `| ${t('test_apk.stage.artifact')} | ${t('test_apk.status.waiting')} | - |`,
            ];
            if (firebaseAvailable) {
              rows.push(`| 🔥 Firebase App Distribution | ${t('test_apk.status.waiting')} | - |`);
            }

            const body = [
              t('test_apk.heading.in_progress'),
              '',
              t('test_apk.table.header'),
              '|------|------|----------|',
              ...rows,
              '',
              t('test_apk.live_log', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(`✅ Progress updated: prepare done (${elapsedStr})`);
            core.setOutput('elapsed', elapsedStr);
            core.setOutput('end_time', now.toString());

      - name: Generate APK filename
        id: apk_filename
        env:
          # 이슈 제목은 따옴표나 $(...) 가 들어올 수 있어 env 로 전달 (#646)
          ISSUE_TITLE: ${{ needs.prepare-test-build.outputs.issue_title }}
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          COMMIT_SHORT="${{ needs.prepare-test-build.outputs.commit_hash }}"
          BUILD_NUMBER="${{ needs.prepare-test-build.outputs.build_number }}"
          ISSUE_NUMBER="${{ needs.prepare-test-build.outputs.issue_number }}"

          # 이슈 제목 정제
          CLEAN_TITLE=""
          if [ -n "$ISSUE_TITLE" ]; then
            CLEAN_TITLE="$ISSUE_TITLE"
            # 1. 이모지 제거 (유니코드 이모지 범위)
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/[\xF0\x9F][\x80-\xBF][\x80-\xBF][\x80-\xBF]//g; s/[\xE2\x9C\xE2\x9A\xE2\xAD\xE2\x9D\xE2\x99\xE2\x98\xE2\x9E\xE2\xAC\xE2\xAB\xE2\xAC][\x80-\xBF][\x80-\xBF]//g; s/[\xE2\x80\x8D]//g; s/\xEF\xB8\x8F//g; s/\xE2\x83\xA3//g')
            # 2. 대괄호 태그 제거 [xxx]
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/\[[^]]*\]//g')
            # 3. 앞뒤 공백 trim
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            # 4. 공백 → _
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/[[:space:]]/_/g')
            # 5. 파일시스템 비호환 문자 제거
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/[#\/\\:*?"<>|]//g')
            # 6. 연속 밑줄 정리
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/__*/_/g; s/^_//; s/_$//')
            # 7. 30자 제한
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | cut -c1-30)
            # 8. 끝 밑줄 제거
            CLEAN_TITLE=$(echo "$CLEAN_TITLE" | sed 's/_$//')
          fi

          # 파일명 조립
          if [ -n "$ISSUE_NUMBER" ] && [ -n "$CLEAN_TITLE" ]; then
            APK_NAME="${REPO_NAME}-${ISSUE_NUMBER}-${BUILD_NUMBER}-${CLEAN_TITLE}-${COMMIT_SHORT}.apk"
          elif [ -n "$ISSUE_NUMBER" ]; then
            APK_NAME="${REPO_NAME}-${ISSUE_NUMBER}-${BUILD_NUMBER}-${COMMIT_SHORT}.apk"
          else
            APK_NAME="${REPO_NAME}-${BUILD_NUMBER}-${COMMIT_SHORT}.apk"
          fi

          # 아티팩트 이름 (확장자 제거)
          ARTIFACT_NAME="${APK_NAME%.apk}"
          echo "artifact_name=$ARTIFACT_NAME" >> $GITHUB_OUTPUT
          echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
          echo "📦 APK file name: $APK_NAME"

      - name: Set test build version
        run: |
          VERSION="${{ needs.prepare-test-build.outputs.version }}"
          BUILD_NUMBER="${{ needs.prepare-test-build.outputs.build_number }}"
          echo "📋 Test build version: ${VERSION}+${BUILD_NUMBER}"
          sed -i "s/^version: .*/version: ${VERSION}+${BUILD_NUMBER}/" pubspec.yaml
          echo "✅ pubspec.yaml version updated:"
          grep "^version:" pubspec.yaml

      # APK 빌드 (Fastlane 또는 직접 빌드)
      - name: Build APK
        run: |
          # 마법사가 까는 Fastfile 에는 `build` lane 이 없다 (#601).
          # 있는 것: build_aab · deploy_internal · promote_internal_to_production · validate
          # 그래서 무턱대고 부르면 "Could not find lane" 으로 죽는다.
          # 직접 만든 Fastfile 에 build 가 있으면 그것을 쓰고, 없으면 flutter 로 빌드한다.
          BUILD_FLAGS="${{ steps.build_profile.outputs.build_flags }}"
          if [ -f "android/fastlane/Fastfile" ] \
             && grep -qE '^[[:space:]]*lane[[:space:]]*:build([[:space:]]|$)' android/fastlane/Fastfile; then
            # fastlane lane 은 빌드 명령을 자기가 만든다 — 여기서 dart-define 을 넘길 자리가 없다.
            # 조용히 빠뜨리면 이 스텝이 고치려던 바로 그 사고("한쪽만 적용")가 다시 난다.
            if [ -n "$BUILD_FLAGS" ]; then
              echo "::error::The build profile sets compile-time flags, but the build would run through the fastlane build lane."
              echo "::error::Change the Fastfile so the lane passes \$BUILD_FLAGS to flutter build, or remove the build lane to build with Flutter directly."
              exit 1
            fi
            echo "📦 Building with the fastlane build lane..."
            # 서브셸로 감싼다 — cd 가 새어 나가면 뒤 명령이 엉뚱한 곳에서 돈다
            ( cd android && bundle exec fastlane build --verbose )
          else
            echo "📦 Building with Flutter directly... ${BUILD_FLAGS:+(flags: $BUILD_FLAGS)}"
            # shellcheck disable=SC2086  # 플래그는 공백으로 갈라져야 한다
            flutter build apk --release $BUILD_FLAGS
          fi
          ls -la ./build/app/outputs/flutter-apk/ || true
          echo "✅ APK built"

      # APK 파일 이름 변경 및 준비
      - name: Rename and Prepare APK
        run: |
          mkdir -p ./android/app/build/outputs/apk/release/
          APK_NAME="${{ steps.apk_filename.outputs.apk_name }}"
          mv ./build/app/outputs/flutter-apk/app-release.apk ./android/app/build/outputs/apk/release/${APK_NAME}
          echo "✅ APK renamed to ${APK_NAME}"
          ls -la ./android/app/build/outputs/apk/release/

          # APK 파일 크기 확인
          APK_SIZE=$(stat -c%s "./android/app/build/outputs/apk/release/${APK_NAME}" 2>/dev/null || stat -f%z "./android/app/build/outputs/apk/release/${APK_NAME}" 2>/dev/null || echo "0")
          APK_SIZE_MB=$(echo "scale=2; $APK_SIZE / 1024 / 1024" | bc)
          echo "📦 APK size: ${APK_SIZE_MB}MB"

          # 아티팩트 용량 제한 확인 (500MB)
          if [ "$APK_SIZE" -gt 524288000 ]; then
            echo "⚠️ Warning: the APK is larger than 500MB (${APK_SIZE_MB}MB)"
          else
            echo "✅ The APK fits the artifact limit (${APK_SIZE_MB}MB / 500MB)"
          fi

      # 진행상황 - APK 빌드 완료
      - name: Progress - APK build done
        id: progress_step2
        if: github.event_name == 'repository_dispatch' && needs.prepare-test-build.outputs.progress_comment_id != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: formatElapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt('${{ needs.prepare-test-build.outputs.progress_comment_id }}');
            const step1EndTime = parseInt('${{ steps.progress_step1.outputs.end_time }}');
            const step1Elapsed = '${{ steps.progress_step1.outputs.elapsed }}';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();
            const elapsed = Math.round((now - step1EndTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const elapsedStr = formatElapsed(minutes, seconds);
            const firebaseAvailable = '${{ needs.prepare-test-build.outputs.firebase_available }}' === 'true';

            const rows = [
              `| ${t('test_apk.stage.prepare')} | ${t('test_apk.status.done')} | ${step1Elapsed || '-'} |`,
              `| ${t('test_apk.stage.build')} | ${t('test_apk.status.done')} | ${elapsedStr} |`,
              `| ${t('test_apk.stage.artifact')} | ${t('test_apk.status.in_progress')} | - |`,
            ];
            if (firebaseAvailable) {
              rows.push(`| 🔥 Firebase App Distribution | ${t('test_apk.status.waiting')} | - |`);
            }

            const body = [
              t('test_apk.heading.in_progress'),
              '',
              t('test_apk.table.header'),
              '|------|------|----------|',
              ...rows,
              '',
              t('test_apk.live_log', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(`✅ Progress updated: APK build done (${elapsedStr})`);
            core.setOutput('elapsed', elapsedStr);
            core.setOutput('end_time', now.toString());

      # 빌드 정보 파일 생성
      - name: Create build info file
        # ⚠️ heredoc 을 쓰지 않는다 (#597).
        #    `<< EOF` 의 종료자는 **컬럼 0** 이어야 하는데, if 블록 안에 두면 들여쓰게 된다.
        #    그러면 셸이 종료자를 못 찾고 스크립트 끝까지 읽어 `syntax error: unexpected
        #    end of file` 로 죽는다. `<<-` 로 바꿔도 탭만 허용해 해결되지 않는다.
        #    (딸려 있던 `sed -E 's/^ {10}//'` 도 실은 아무 일도 안 했다 — YAML의 `run: |`
        #     이 공통 들여쓰기를 이미 걷어내기 때문이다.)
        env:
          # 이슈 제목을 셸 소스에 직접 박으면 큰따옴표나 $(...) 가 들어왔을 때
          # 문자열이 깨지거나 명령이 실행된다. 값으로 넘겨 "$VAR" 로 받는다.
          BUILD_NUMBER: ${{ needs.prepare-test-build.outputs.build_number }}
          PR_NUMBER: ${{ needs.prepare-test-build.outputs.pr_number }}
          COMMIT_SHORT: ${{ needs.prepare-test-build.outputs.commit_hash }}
          ISSUE_NUMBER: ${{ needs.prepare-test-build.outputs.issue_number }}
          ISSUE_TITLE: ${{ needs.prepare-test-build.outputs.issue_title }}
          ISSUE_URL: ${{ needs.prepare-test-build.outputs.issue_url }}
          BUILD_BRANCH: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref_name }}
        run: |
          BRANCH_NAME="$BUILD_BRANCH"
          COMMIT_SHA="${{ needs.prepare-test-build.outputs.commit_sha }}"
          BUILD_DATE=$(date '+%Y-%m-%d %H:%M:%S')
          # 문구는 레포 언어를 따른다 (#769). 카탈로그는 레포 루트 기준이라 거기서 조회
          msg() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/i18n/messages.py get "$@" 2>/dev/null); }

          {
            msg test_apk.build_info.title; echo
            echo ""
            msg test_apk.build_info.build_number --var build_number="$BUILD_NUMBER"; echo
          } > build-info.txt

          if [ -n "$PR_NUMBER" ]; then
            { msg test_apk.build_info.pr_number --var pr_number="$PR_NUMBER"; echo; } >> build-info.txt
          fi

          {
            msg test_apk.build_info.branch --var branch="$BRANCH_NAME"; echo
            msg test_apk.build_info.commit --var commit="$COMMIT_SHORT"; echo
            msg test_apk.build_info.full_sha --var sha="$COMMIT_SHA"; echo
            msg test_apk.build_info.date --var date="$BUILD_DATE"; echo
            echo ""
          } >> build-info.txt

          # 이슈 정보가 있으면 추가
          if [ -n "$ISSUE_NUMBER" ]; then
            {
              msg test_apk.build_info.related_issue; echo
              echo "- #$ISSUE_NUMBER: $ISSUE_TITLE"
              echo "- URL: $ISSUE_URL"
              echo ""
            } >> build-info.txt
          fi

          echo "📋 Build info file created:"
          cat build-info.txt

      # 빌드 메타데이터 파일 생성 (댓글 작성 워크플로우용)
      - name: Create build metadata file
        env:
          BUILD_BRANCH: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref_name }}
        run: |
          cat << EOF | sed -E 's/^ {10}//' > build-metadata.json
          {
            "pr_number": "${{ needs.prepare-test-build.outputs.pr_number }}",
            "build_number": "${{ needs.prepare-test-build.outputs.build_number }}",
            "issue_number": "${{ needs.prepare-test-build.outputs.issue_number }}",
            "branch_name": "$BUILD_BRANCH"
          }
          EOF
          cat build-metadata.json

      # APK와 빌드 정보를 아티팩트로 업로드 (브랜치명 포함)
      - name: Upload APK and build info as Artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk_filename.outputs.artifact_name }}
          # 아티팩트 액션은 defaults를 따르지 않고 항상 레포 루트 기준이라 APP_ROOT prefix가 필요
          path: |
            ${{ env.APP_ROOT }}/android/app/build/outputs/apk/release/*.apk
            ${{ env.APP_ROOT }}/build-info.txt
            build-metadata.json
          retention-days: 7
          if-no-files-found: error

      - name: Record artifact upload time
        id: artifact_time
        if: github.event_name == 'repository_dispatch' && needs.prepare-test-build.outputs.progress_comment_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const { elapsed: formatElapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const step2EndTime = parseInt('${{ steps.progress_step2.outputs.end_time }}');
            const now = Date.now();
            const elapsed = Math.round((now - step2EndTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const elapsedStr = formatElapsed(minutes, seconds);
            core.setOutput('elapsed', elapsedStr);
            core.setOutput('end_time', now.toString());

      # Firebase App Distribution 업로드 (시크릿 존재 시에만)
      - name: Setup Firebase credentials file
        if: needs.prepare-test-build.outputs.firebase_available == 'true'
        env:
          FIREBASE_SA_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          echo "$FIREBASE_SA_BASE64" | base64 --decode > firebase-service-account.json
          echo "✅ Firebase service account JSON file created"

      # 테스터가 보는 릴리스 노트도 레포 언어를 따른다 (#769). 조회 실패 시 영문
      - name: Compose Firebase release notes
        id: firebase_notes
        if: needs.prepare-test-build.outputs.firebase_available == 'true'
        working-directory: ${{ github.workspace }}
        env:
          BUILD_NUMBER: ${{ needs.prepare-test-build.outputs.build_number }}
          BRANCH_NAME: ${{ needs.prepare-test-build.outputs.branch_name }}
          COMMIT_HASH: ${{ needs.prepare-test-build.outputs.commit_hash }}
          ISSUE_NUMBER: ${{ needs.prepare-test-build.outputs.issue_number }}
          ISSUE_TITLE: ${{ needs.prepare-test-build.outputs.issue_title }}
        run: |
          NOTES=$(python3 .github/scripts/i18n/messages.py get test_apk.firebase.release_notes \
            --var build_number="$BUILD_NUMBER" --var branch="$BRANCH_NAME" --var commit="$COMMIT_HASH" \
            --var issue_number="$ISSUE_NUMBER" --var issue_title="$ISSUE_TITLE" 2>/dev/null) \
            || NOTES=$(printf 'Test build #%s\nBranch: %s\nCommit: %s\nIssue: #%s %s' \
                 "$BUILD_NUMBER" "$BRANCH_NAME" "$COMMIT_HASH" "$ISSUE_NUMBER" "$ISSUE_TITLE")
          {
            echo "notes<<__PROJECTOPS_NOTES__"
            echo "$NOTES"
            echo "__PROJECTOPS_NOTES__"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to Firebase App Distribution
        id: firebase_upload
        if: needs.prepare-test-build.outputs.firebase_available == 'true'
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          # ⚠️ uses: 액션은 job의 defaults.working-directory를 따르지 않고
          #    항상 레포 루트 기준으로 경로를 해석한다.
          #    자격증명·APK는 APP_ROOT에서 생성되므로 prefix가 필요하다.
          serviceCredentialsFile: ${{ env.APP_ROOT }}/firebase-service-account.json
          groups: ${{ env.FIREBASE_TESTER_GROUP }}
          file: ${{ env.APP_ROOT }}/android/app/build/outputs/apk/release/${{ steps.apk_filename.outputs.apk_name }}
          releaseNotes: ${{ steps.firebase_notes.outputs.notes }}

      - name: Cleanup Firebase credentials
        if: always() && needs.prepare-test-build.outputs.firebase_available == 'true'
        run: rm -f firebase-service-account.json

      - name: Firebase upload result
        id: firebase_result
        if: needs.prepare-test-build.outputs.firebase_available == 'true'
        run: |
          if [ "${{ steps.firebase_upload.outcome }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Firebase App Distribution upload succeeded"
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ Firebase App Distribution upload failed - the APK artifact was uploaded"
          fi

      - name: Record Firebase upload time
        id: firebase_time
        if: needs.prepare-test-build.outputs.firebase_available == 'true' && github.event_name == 'repository_dispatch' && needs.prepare-test-build.outputs.progress_comment_id != ''
        uses: actions/github-script@v7
        with:
          script: |
            const { elapsed: formatElapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const artifactEndTime = parseInt('${{ steps.artifact_time.outputs.end_time }}');
            const now = Date.now();
            const elapsed = Math.round((now - artifactEndTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const elapsedStr = formatElapsed(minutes, seconds);
            core.setOutput('elapsed', elapsedStr);

      # 진행 상황 최종 업데이트 - 성공
      - name: Final progress update - success
        if: success() && github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.prepare-test-build.outputs.progress_comment_id != ''
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.prepare-test-build.outputs.branch_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: formatElapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt('${{ needs.prepare-test-build.outputs.progress_comment_id }}');
            const startTime = parseInt('${{ needs.prepare-test-build.outputs.progress_start_time }}');
            const step1Elapsed = '${{ steps.progress_step1.outputs.elapsed }}';
            const step2Elapsed = '${{ steps.progress_step2.outputs.elapsed }}';
            const step3Elapsed = '${{ steps.artifact_time.outputs.elapsed }}';
            const step4Elapsed = '${{ steps.firebase_time.outputs.elapsed }}';
            const prNumber = parseInt('${{ github.event.client_payload.pr_number }}');
            const buildNumber = '${{ needs.prepare-test-build.outputs.build_number }}';
            const branchName = process.env.BRANCH_NAME;
            const commitHash = '${{ needs.prepare-test-build.outputs.commit_hash }}';
            const issueNumber = '${{ needs.prepare-test-build.outputs.issue_number }}';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const artifactUrl = '${{ steps.upload_artifact.outputs.artifact-url }}' || `${runUrl}#artifacts`;

            const now = Date.now();
            const totalElapsed_s = Math.round((now - startTime) / 1000);
            const totalMin = Math.floor(totalElapsed_s / 60);
            const totalSec = totalElapsed_s % 60;
            const totalElapsed = formatElapsed(totalMin, totalSec);

            const firebaseAvailable = '${{ needs.prepare-test-build.outputs.firebase_available }}' === 'true';
            const firebaseSuccess = '${{ steps.firebase_result.outputs.status }}' === 'success';

            const lines = [
              t('test_apk.heading.success'),
              '',
              t('test_apk.table.header'),
              '|------|------|----------|',
              `| ${t('test_apk.stage.prepare')} | ${t('test_apk.status.done')} | ${step1Elapsed || '-'} |`,
              `| ${t('test_apk.stage.build')} | ${t('test_apk.status.done')} | ${step2Elapsed || '-'} |`,
              `| ${t('test_apk.stage.artifact')} | ${t('test_apk.status.done')} | ${step3Elapsed || '-'} |`,
            ];

            if (firebaseAvailable) {
              if (firebaseSuccess) {
                lines.push(`| 🔥 Firebase App Distribution | ${t('test_apk.status.done')} | ${step4Elapsed || '-'} |`);
              } else {
                lines.push(`| 🔥 Firebase App Distribution | ${t('test_apk.status.failed')} | ${step4Elapsed || '-'} |`);
              }
            }

            const version = '${{ needs.prepare-test-build.outputs.version }}';

            lines.push(
              '',
              t('test_apk.success.result', {
                version, build_number: buildNumber, branch: branchName, commit: commitHash, total: totalElapsed
              }),
              '',
            );

            if (firebaseAvailable && firebaseSuccess) {
              lines.push(t('test_apk.firebase.installable'));
            } else if (firebaseAvailable && !firebaseSuccess) {
              lines.push(t('test_apk.firebase.upload_failed'));
            }

            lines.push(
              t('test_apk.artifact_download', { url: artifactUrl }),
              t('test_apk.run_log', { url: runUrl })
            );

            const body = lines.join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(`✅ Progress updated: build succeeded (total ${totalElapsed})`);

            // PR과 연결된 이슈가 있고, PR 번호와 다른 경우 이슈에도 댓글
            if (issueNumber && issueNumber !== '' && parseInt(issueNumber) !== prNumber) {
              const issueLines = [
                t('test_apk.issue_success.heading'),
                '',
                t('test_apk.issue.app_version', { version, build_number: buildNumber }),
                t('test_apk.issue.commit', { commit: commitHash }),
                '',
              ];

              if (firebaseAvailable && firebaseSuccess) {
                issueLines.push(t('test_apk.firebase.installable'));
              } else if (firebaseAvailable && !firebaseSuccess) {
                issueLines.push(t('test_apk.firebase.upload_failed'));
              }

              issueLines.push(t('test_apk.artifact_download', { url: artifactUrl }));

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                body: issueLines.join('\n')
              });
              console.log(`✅ Posted the build success comment on issue #${issueNumber} too`);
            }

      # 진행 상황 최종 업데이트 - 실패
      - name: Final progress update - failure
        if: failure() && github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.prepare-test-build.outputs.progress_comment_id != ''
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.prepare-test-build.outputs.branch_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: formatElapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt('${{ needs.prepare-test-build.outputs.progress_comment_id }}');
            const startTime = parseInt('${{ needs.prepare-test-build.outputs.progress_start_time }}');
            const step1EndTime = parseInt('${{ steps.progress_step1.outputs.end_time }}') || 0;
            const step1Elapsed = '${{ steps.progress_step1.outputs.elapsed }}';
            const prNumber = parseInt('${{ github.event.client_payload.pr_number }}');
            const buildNumber = '${{ needs.prepare-test-build.outputs.build_number }}';
            const version = '${{ needs.prepare-test-build.outputs.version }}';
            const branchName = process.env.BRANCH_NAME;
            const issueNumber = '${{ needs.prepare-test-build.outputs.issue_number }}';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();

            let step2ElapsedStr = '-';
            if (step1EndTime > 0) {
              const step2_s = Math.round((now - step1EndTime) / 1000);
              const s2Min = Math.floor(step2_s / 60);
              const s2Sec = step2_s % 60;
              step2ElapsedStr = formatElapsed(s2Min, s2Sec);
            }

            const total_s = Math.round((now - startTime) / 1000);
            const tMin = Math.floor(total_s / 60);
            const tSec = total_s % 60;
            const totalElapsed = formatElapsed(tMin, tSec);

            const firebaseAvailable = '${{ needs.prepare-test-build.outputs.firebase_available }}' === 'true';

            const rows = [
              `| ${t('test_apk.stage.prepare')} | ${t('test_apk.status.done')} | ${step1Elapsed || '-'} |`,
              `| ${t('test_apk.stage.build')} | ${t('test_apk.status.failed')} | ${step2ElapsedStr} |`,
              `| ${t('test_apk.stage.artifact')} | ${t('test_apk.status.skipped')} | - |`,
            ];
            if (firebaseAvailable) {
              rows.push(`| 🔥 Firebase App Distribution | ${t('test_apk.status.skipped')} | - |`);
            }

            const body = [
              t('test_apk.heading.failure'),
              '',
              t('test_apk.table.header'),
              '|------|------|----------|',
              ...rows,
              '',
              t('test_apk.failure.details', {
                version, build_number: buildNumber, branch: branchName, total: totalElapsed, url: runUrl
              })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(`❌ Progress updated: build failed (${totalElapsed})`);

            if (issueNumber && issueNumber !== '' && parseInt(issueNumber) !== prNumber) {
              const issueBody = t('test_apk.issue_failure.body', { version, build_number: buildNumber, url: runUrl });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(issueNumber),
                body: issueBody
              });
              console.log(`❌ Posted the build failure comment on issue #${issueNumber} too`);
            }

      # 콘솔 알림
      - name: Notify Build Success
        if: success()
        env:
          BUILD_BRANCH: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref_name }}
        run: |
          echo "✅ Android test APK build succeeded!"
          echo "Build number: ${{ needs.prepare-test-build.outputs.build_number }}"
          if [ -n "${{ needs.prepare-test-build.outputs.pr_number }}" ]; then
            echo "PR number: ${{ needs.prepare-test-build.outputs.pr_number }}"
          fi
          echo "Branch: $BUILD_BRANCH"
          echo "Commit: ${{ needs.prepare-test-build.outputs.commit_hash }}"
          if [ -n "${{ needs.prepare-test-build.outputs.issue_url }}" ]; then
            echo "Related issue: ${{ needs.prepare-test-build.outputs.issue_url }}"
          fi
          echo ""
          echo "📦 Download the APK from the artifact."

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Android test APK build failed!"
          echo "Check the log."

      # 취소 처리 (#648): 빌드 job 이 실행 중일 때 취소된 경우. success()/failure() 스텝은 취소 시 돌지 않아 이 스텝이 유일한 정리 경로다. 준비 job 은 이미 끝났으므로 준비는 완료로 표시한다.
      - name: Update progress - cancelled (build job)
        if: cancelled() && github.event_name == 'repository_dispatch' && needs.prepare-test-build.outputs.progress_comment_id != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          COMMENT_ID: ${{ needs.prepare-test-build.outputs.progress_comment_id }}
          START_TIME: ${{ needs.prepare-test-build.outputs.progress_start_time }}
          BRANCH_NAME: ${{ needs.prepare-test-build.outputs.branch_name }}
          RUN_ID: ${{ github.run_id }}
          STEP1_ELAPSED: ${{ steps.progress_step1.outputs.elapsed }}
          FIREBASE_AVAILABLE: ${{ needs.prepare-test-build.outputs.firebase_available }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: formatElapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt(process.env.COMMENT_ID, 10);
            const startTime = parseInt(process.env.START_TIME, 10);
            const branchName = process.env.BRANCH_NAME;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}`;
            const step1Elapsed = process.env.STEP1_ELAPSED;
            const firebaseAvailable = process.env.FIREBASE_AVAILABLE === 'true';
            // 성공/실패 스텝이 이미 최종 상태를 쓴 댓글은 덮어쓰지 않는다
            const { data: current } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId
            });
            if (!(current.body || '').startsWith(t('test_apk.heading.in_progress'))) {
              console.log('The comment already shows a final state, skipping the cancel update');
              return;
            }

            let duration = '-';
            if (!Number.isNaN(startTime)) {
              const elapsed = Date.now() - startTime;
              const minutes = Math.floor(elapsed / 60000);
              const seconds = Math.floor((elapsed % 60000) / 1000);
              duration = formatElapsed(minutes, seconds);
            }

            const body = [
              t('test_apk.heading.cancelled'),
              '',
              t('test_apk.table.header'),
              '|------|------|----------|',
              `| ${t('test_apk.stage.prepare')} | ${t('test_apk.status.done')} | ${step1Elapsed || '-'} |`,
              `| ${t('test_apk.stage.build')} | ${t('test_apk.status.cancelled')} | - |`,
              `| ${t('test_apk.stage.artifact')} | ${t('test_apk.status.cancelled')} | - |`,
              ...(firebaseAvailable ? [`| 🔥 Firebase App Distribution | ${t('test_apk.status.cancelled')} | - |`] : []),
              '',
              t('test_apk.cancelled.details', { branch: branchName, duration, url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log('🚫 Progress updated: cancelled');
