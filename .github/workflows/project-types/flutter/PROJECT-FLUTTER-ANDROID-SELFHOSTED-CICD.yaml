# ===================================================================
# Flutter Android 자체 서버(SMB) 배포 워크플로우
# ===================================================================
#
# main 브랜치 푸시 시 Android APK를 빌드하고
# 자체 서버(예: Synology NAS·NAS·Linux)의 SMB 공유에 APK를 배포합니다.
#
# ===================================================================
# 🔑 필수 GitHub Secrets
# ===================================================================
# ENV_FILE 또는 ENV: .env 파일 내용 (둘 중 하나, ENV_FILE 우선)
# RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD (선택, 4개 모두):
#   저장소 변수 ANDROID_SELFHOSTED_RELEASE_SIGNING=true 일 때만 사용한다 (옵트인).
#   변수가 없으면 시크릿이 있어도 기존처럼 디버그 키로 서명하고 경고를 남긴다.
#   옵트인했는데 시크릿이 비어 있으면 빌드가 실패한다.
# GOOGLE_SERVICES_JSON (선택): Firebase google-services.json
# SERVER_HOST: 서버 호스트(SMB 접속 주소)
# SERVER_USER: SMB 사용자명
# SERVER_PASSWORD: SMB 비밀번호
# ===================================================================

name: PROJECT-Android-SelfHosted-CICD

on:
  push:
    branches: ["main"]
  workflow_dispatch: # 수동 실행 옵션 추가

permissions:
  # GITHUB_TOKEN 으로는 읽기만 한다. 명시해 두면 레포 기본값이 나중에 write 로 바뀌어도
  # 이 워크플로우가 필요 이상의 권한을 갖지 않는다 (#595).
  contents: read

# ============================================
# 🔧 프로젝트별 설정 (아래 값들을 수정하세요)
# ============================================
env:
  # 프로젝트 이름 (APK 파일명, 아티팩트명, 히스토리 파일명에 사용)
  APP_ARTIFACT_NAME: "__APP_ARTIFACT_NAME__"  # @wizard ask:@repo
  FLUTTER_VERSION: "3.38.9"
  JAVA_VERSION: "__JAVA_VERSION__"  # @wizard ask:17
  # SMB 서버 설정 (자체 서버 — Synology NAS·Linux 등)
  SMB_PORT: "44445" # 기본 445
  SMB_SHARE: "web"
  # Android 업로드 하위 경로. 빈 값이면 /{APP_ARTIFACT_NAME} 바로 아래에 올린다 (기존 동작).
  # 필요하면 "/android" 처럼 하위 경로를 넣는다. 값을 바꾸면 업로드 위치가 바뀌니 주의.
  SMB_PATH_ANDROID: ""
  # Flutter 루트 경로(레포 루트 기준). 단일레포면 ".", 모노레포면 "app" 등.
  # 통합 시점에 integrator의 flutter-root resolver가 project_paths.flutter 값으로 1회 치환.
  # FLUTTER_ROOT는 Flutter SDK 경로용 공식 변수라 충돌 — APP_ROOT로 분리
  APP_ROOT: "."  # @wizard auto:flutter-root
jobs:
  # 미설정 감지 (#662)
  # Flutter 레포에는 이 파일이 항상 설치된다. 자체 서버를 쓰지 않는 레포에서 main 푸시마다
  # 실패 런이 쌓이지 않도록, 자동 실행(push)일 때만 미설정이면 성공으로 건너뛴다.
  # 미설정 조건 2개: 마법사 치환 토큰이 남은 값, SMB Secret 3개가 모두 없음
  # 수동 실행은 그대로 진행 (main 이면 아래 사전 점검이 누락 항목을 오류로 알림)
  check-config:
    name: Check self-hosted deploy settings
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Detect unconfigured template
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          reasons=""
          for name in APP_ARTIFACT_NAME JAVA_VERSION SMB_PORT SMB_SHARE; do
            case "${!name}" in
              __*__) reasons="$reasons env.$name is still a template value (${!name});" ;;
            esac
          done
          # 3개 중 일부만 있으면 설정 중인 레포로 보고 진행 (사전 점검이 누락을 오류로 알림)
          if [ -z "$SERVER_HOST" ] && [ -z "$SERVER_USER" ] && [ -z "$SERVER_PASSWORD" ]; then
            reasons="$reasons secrets SERVER_HOST, SERVER_USER and SERVER_PASSWORD are not set;"
          fi
          if [ -z "$reasons" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          msg="Self-hosted (SMB) deploy is not configured, so this push run was skipped:${reasons} Set the values to enable it, or delete this workflow if you do not deploy to your own server."
          echo "::notice title=Self-hosted deploy skipped::${msg}"
          {
            echo "### Self-hosted deploy skipped"
            echo ""
            echo "${msg}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: check-config
    # 설정된 레포에서만, CHANGELOG 워크플로우가 성공한 경우에만 실행
    if: ${{ needs.check-config.outputs.configured == 'true' && (github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run') }}

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      # Repository 체크아웃 및 목록 출력
      # 사전 점검 (#666)
      # 신규 설치 직후에는 배포용 Secret 이 없는 것이 정상이다. 그대로 두면 빌드를 끝까지 돌린 뒤
      # 서명, 업로드 단계에서 원인을 짚기 어려운 에러로 실패하므로, 빌드 전에 무엇이 없는지 알린다.
      # Secret 이 모두 있으면 이 step 은 그대로 통과하며 이후 동작은 달라지지 않는다.
      - name: Preflight check of deploy secrets
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}   # 체크아웃 전이라 APP_ROOT 가 아직 없을 수 있다
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          fail=0
          for name in SERVER_HOST SERVER_USER SERVER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Deploy preflight::Secret ${name} is missing. It is required for the self-hosted (SMB) upload. Add it under Settings > Secrets and variables > Actions."
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "✅ Preflight check passed"

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: List repository contents
        run: |
          echo "Repository checked out"
          ls -la

      # Debug Keystore 설정 (디버깅 용도 유지)
      - name: Setup Debug Keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore || echo "Base64 decoding failed"
          echo "Debug Keystore created (for debugging)"
          ls -la ~/.android/
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android || echo "Keytool failed"

      # .env 파일 생성
      - name: Create .env file from GitHub Secret
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > .env
          echo ".env file created"
          ls -la

      # 빌드 프로파일 — 런타임(.env)과 컴파일타임(dart-define)을 한 곳에서 정한다 (#603)
      # 배포 빌드라 개발 키가 켜진 채 나가지 않는지 양쪽 층을 함께 확인한다.
      # 설정(.github/config/build-profile.json)이 없는 저장소에서는 아무 일도 하지 않는다.
      - name: Apply build profile (release)
        id: build_profile
        run: |
          python3 "${{ github.workspace }}/.github/scripts/apply_build_profile.py" \
            release .env \
            --config "${{ github.workspace }}/.github/config/build-profile.json"

      # Keystore와 key.properties 설정
      # 기본은 지금까지와 같이 디버그 키로 서명한다 (경고만 남긴다).
      # 저장소 변수 ANDROID_SELFHOSTED_RELEASE_SIGNING=true 로 명시해야만 릴리스 키로 서명한다.
      # RELEASE_* 시크릿은 다른 워크플로(Play Store 등)용으로 이미 있을 수 있어, 있다고 자동 전환하면
      # 서명 키가 바뀌어 기기에 설치된 이전 APK 위에 업데이트 설치가 안 되는 사고가 난다.
      # 옵트인했는데 시크릿이 비어 있으면 몰래 폴백하지 않고 실패시킨다.
      # 시크릿과 변수는 스크립트에 직접 넣지 않고 env 로만 받는다 (값은 출력하지 않는다).
      - name: Setup Keystore and key.properties
        env:
          ANDROID_SELFHOSTED_RELEASE_SIGNING: ${{ vars.ANDROID_SELFHOSTED_RELEASE_SIGNING }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p android/app/keystore
          if [ "$ANDROID_SELFHOSTED_RELEASE_SIGNING" = "true" ]; then
            if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ] \
               || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
              echo "::error::ANDROID_SELFHOSTED_RELEASE_SIGNING=true but one of RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD is empty. Add all 4 secrets or remove the variable."
              exit 1
            fi
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/keystore/key.jks
            printf 'storeFile=app/keystore/key.jks\n' > android/key.properties
            printf 'storePassword=%s\n' "$RELEASE_KEYSTORE_PASSWORD" >> android/key.properties
            printf 'keyAlias=%s\n' "$RELEASE_KEY_ALIAS" >> android/key.properties
            printf 'keyPassword=%s\n' "$RELEASE_KEY_PASSWORD" >> android/key.properties
            echo "Signing with the release key (key.properties created)"
          else
            echo "::warning::Signing with the debug key. To use the release key, set the repository variable ANDROID_SELFHOSTED_RELEASE_SIGNING=true and add the RELEASE_* secrets. If the signing key changes, the app may not install as an update over an existing install."
            echo "$DEBUG_KEYSTORE" | base64 -d > android/app/keystore/key.jks || echo "Base64 decoding failed"
            echo "Keystore created from DEBUG_KEYSTORE"
            echo "storeFile=app/keystore/key.jks" > android/key.properties
            echo "storePassword=android" >> android/key.properties
            echo "keyAlias=androiddebugkey" >> android/key.properties
            echo "keyPassword=android" >> android/key.properties
            echo "key.properties created (debug)"
          fi
          ls -la android/app/keystore android/

      # Google-services.json 생성
      - name: Create Google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          echo "✅ google-services.json created"
          ls -la android/app/

      # Flutter 설정 및 버전 확인
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ env.FLUTTER_VERSION }}

      - name: Verify Flutter version
        run: |
          echo "Flutter setup completed"
          flutter --version

      # Flutter 및 Gradle 캐시
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 프로젝트 의존성 설치
      - name: Install dependencies
        run: |
          flutter pub get
          echo "Dependencies installed"
          ls -la

      # Gradle 셋업
      - name: Setup Gradle
        working-directory: ${{ env.APP_ROOT }}/android
        run: |
          # Flutter 기본 .gitignore가 gradlew를 제외하므로 CI 체크아웃 시 없을 수 있다.
          # flutter build가 자체 Gradle을 쓰므로 없어도 빌드는 진행된다.
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "Gradle wrapper permissions set"
          else
            echo "No gradlew - using the Gradle bundled with Flutter"
          fi

      # Java 설정 및 버전 확인
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Verify Java version
        run: |
          echo "Java setup completed"
          java -version

      # Ruby 설정 및 확인
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.4.1"

      - name: Verify Ruby version
        run: |
          echo "Ruby setup completed"
          ruby -v

      # Fastlane 설치 (Bundler 방식 - gem 충돌 방지)
      - name: Install Fastlane
        working-directory: ${{ env.APP_ROOT }}/android
        run: |
          # multi_json: google-apis transitive 의존성이 선언 누락한 upstream 버그 회피 (gemspec 미선언 → Gem::LoadError)
          printf 'source "https://rubygems.org"\ngem "fastlane"\ngem "multi_json"\n' > Gemfile
          bundle install
          echo "Fastlane installed (Bundler)"
          bundle exec fastlane --version

      # 현재 버전 정보 및 짧은 커밋 해시 계산
      - name: Get version info and calculate short commit hash
        id: version_info
        run: |
          CURRENT_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION=$(echo $CURRENT_VERSION | cut -d'+' -f1)
          BUILD_NUMBER=$(echo $CURRENT_VERSION | cut -d'+' -f2)
          SHORT_COMMIT_HASH=$(echo ${{ github.sha }} | cut -c1-7)

          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "SHORT_COMMIT_HASH=$SHORT_COMMIT_HASH" >> $GITHUB_ENV

          echo "Current version: $CURRENT_VERSION"
          echo "Short commit hash: $SHORT_COMMIT_HASH"

      # APK 빌드 (릴리스 빌드 유지)
      - name: Build APK
        run: |
          # 마법사가 까는 Fastfile 에는 `build` lane 이 없다 (#601).
          # 있는 것: build_aab, deploy_internal, promote_internal_to_production, validate
          # 그래서 무턱대고 부르면 "Could not find lane" 으로 죽는다.
          # 직접 만든 Fastfile 에 build 가 있으면 그것을 쓰고, 없으면 flutter 로 빌드한다.
          BUILD_FLAGS="${{ steps.build_profile.outputs.build_flags }}"
          if [ -f "android/fastlane/Fastfile" ] \
             && grep -qE '^[[:space:]]*lane[[:space:]]*:build([[:space:]]|$)' android/fastlane/Fastfile; then
            # fastlane lane 은 빌드 명령을 자기가 만든다 — 여기서 dart-define 을 넘길 자리가 없다.
            # 조용히 빠뜨리면 이 스텝이 고치려던 바로 그 사고("한쪽만 적용")가 다시 난다.
            if [ -n "$BUILD_FLAGS" ]; then
              echo "::error::The build profile sets compile-time flags, but the build is about to run through the fastlane build lane."
              echo "::error::Change the Fastfile so the lane passes \$BUILD_FLAGS to flutter build, or remove the build lane to build with Flutter directly."
              exit 1
            fi
            echo "📦 Building with the fastlane build lane..."
            # 서브셸로 감싼다 — cd 가 새어 나가면 뒤 명령이 엉뚱한 곳에서 돈다
            ( cd android && bundle exec fastlane build --verbose )
          else
            echo "📦 Building with Flutter directly... ${BUILD_FLAGS:+(flags: $BUILD_FLAGS)}"
            # shellcheck disable=SC2086  # 플래그는 공백으로 갈라져야 한다
            flutter build apk --release $BUILD_FLAGS
          fi
          ls -la ./build/app/outputs/flutter-apk/ || true
          echo "APK built"

      # APK 파일 이름 변경 및 준비
      - name: Rename and Prepare APK
        run: |
          mkdir -p ./android/app/build/outputs/apk/release/
          mv ./build/app/outputs/flutter-apk/app-release.apk ./android/app/build/outputs/apk/release/${{ env.APP_ARTIFACT_NAME }}-v${{ env.VERSION }}-${{ env.SHORT_COMMIT_HASH }}.apk
          echo "APK renamed to ${{ env.APP_ARTIFACT_NAME }}-v${{ env.VERSION }}-${{ env.SHORT_COMMIT_HASH }}.apk"
          ls -la ./android/app/build/outputs/apk/release/

      # APK를 아티팩트로 업로드
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ARTIFACT_NAME }}-apk
          # 아티팩트 액션은 defaults를 따르지 않고 항상 레포 루트 기준이라 APP_ROOT prefix가 필요
          path: ${{ env.APP_ROOT }}/android/app/build/outputs/apk/release/${{ env.APP_ARTIFACT_NAME }}-v${{ env.VERSION }}-${{ env.SHORT_COMMIT_HASH }}.apk
          retention-days: 1

  deploy-android:
    name: Deploy Android APK
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: List repository contents for deploy
        run: |
          echo "Repository checked out for deploy"
          ls -la

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y smbclient jq
          echo "SMB and jq dependencies installed"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_ARTIFACT_NAME }}-apk
          # ⚠️ 업로드 path가 '단일 파일'이면 upload-artifact가 경로를 평탄화한다.
          #    레포 루트에 풀면 원위치가 복원되지 않으므로 원래 디렉터리를 명시한다.
          path: ${{ env.APP_ROOT }}/android/app/build/outputs/apk/release/

      - name: List downloaded structure (Debug)
        run: |
          ls -alR android/app/build/outputs
          echo "Downloaded structure listed"

      - name: Find APK file
        run: |
          APK_FILE=$(find android/app/build/outputs/ -name "*.apk" | head -n 1)
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          APK_NAME=$(basename "$APK_FILE")
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "APK file found: $APK_FILE"

      - name: Upload files to server via SMB
        env:
          SMB_SERVER: ${{ secrets.SERVER_HOST }}
          SMB_USERNAME: ${{ secrets.SERVER_USER }}
          SMB_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          SMB_PORT=${{ env.SMB_PORT }}
          SMB_SHARE=${{ env.SMB_SHARE }}
          SMB_PATH="/${{ env.APP_ARTIFACT_NAME }}${{ env.SMB_PATH_ANDROID }}"
          echo "Uploading APK file ${{ env.APK_NAME }} to SMB..."
          echo "SMB Path: $SMB_PATH"
          smbclient "//$SMB_SERVER/$SMB_SHARE" -p "$SMB_PORT" -U "$SMB_USERNAME%$SMB_PASSWORD" -m SMB3 -d 10 -c "mkdir $SMB_PATH; cd $SMB_PATH; put ${{ env.APK_FILE }} ${{ env.APK_NAME }}"
          echo "APK uploaded to SMB"

      - name: Update CICD history JSON
        env:
          SMB_SERVER: ${{ secrets.SERVER_HOST }}
          SMB_USERNAME: ${{ secrets.SERVER_USER }}
          SMB_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          export TZ='Asia/Seoul'
          BUILD_DATE=$(date +"%Y-%m-%d %H:%M")
          FILE_SIZE=$(stat -c%s "${{ env.APK_FILE }}")
          COMMIT_LINK="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          FULL_COMMIT_HASH="${{ github.sha }}"
          HISTORY_FILE="${{ env.APP_ARTIFACT_NAME }}-android-cicd-history.json"

          NEW_BUILD_INFO=$(jq -n \
            --arg apk_name "${{ env.APK_NAME }}" \
            --arg file_size "$FILE_SIZE" \
            --arg build_date "$BUILD_DATE" \
            --arg commit_link "$COMMIT_LINK" \
            --arg full_commit_hash "$FULL_COMMIT_HASH" \
            '{apk_name: $apk_name, file_size: $file_size, build_date: $build_date, commit_link: $commit_link, full_commit_hash: $full_commit_hash}')

          SMB_PORT=${{ env.SMB_PORT }}
          SMB_SHARE=${{ env.SMB_SHARE }}
          SMB_PATH="/${{ env.APP_ARTIFACT_NAME }}${{ env.SMB_PATH_ANDROID }}"

          smbclient "//$SMB_SERVER/$SMB_SHARE" -p "$SMB_PORT" -U "$SMB_USERNAME%$SMB_PASSWORD" -m SMB3 -d 10 -c "cd $SMB_PATH; get $HISTORY_FILE" || echo '{"files": []}' > $HISTORY_FILE
          echo "Downloaded or initialized $HISTORY_FILE"
          cat $HISTORY_FILE

          jq --argjson new_build "$NEW_BUILD_INFO" '.files += [$new_build]' $HISTORY_FILE > updated.json
          echo "Updated $HISTORY_FILE with new build info"
          cat updated.json

          smbclient "//$SMB_SERVER/$SMB_SHARE" -p "$SMB_PORT" -U "$SMB_USERNAME%$SMB_PASSWORD" -m SMB3 -d 10 -c "cd $SMB_PATH; put updated.json $HISTORY_FILE"
          echo "Updated $HISTORY_FILE uploaded to SMB"
