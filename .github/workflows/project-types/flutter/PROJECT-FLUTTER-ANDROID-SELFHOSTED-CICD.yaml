# ===================================================================
# Flutter Android self-hosted server (SMB) deploy workflow
# ===================================================================
#
# On a push to main, builds the Android APK and
# deploys it to an SMB share on your own server (e.g. Synology NAS, NAS, Linux).
#
# ===================================================================
# 🔑 Required GitHub Secrets
# ===================================================================
# ENV_FILE or ENV: contents of the .env file (either; ENV_FILE first)
# RELEASE_KEYSTORE_BASE64 / RELEASE_KEYSTORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD (optional, all 4):
#   used only when the repo variable ANDROID_SELFHOSTED_RELEASE_SIGNING=true (opt-in).
#   Without the variable it signs with the debug key as before and warns, even if the secrets exist.
#   If opted in but the secrets are empty, the build fails.
# GOOGLE_SERVICES_JSON (optional): Firebase google-services.json
# SERVER_HOST: server host (SMB address)
# SERVER_USER: SMB user name
# SERVER_PASSWORD: SMB password
# ===================================================================
# 🔀 Repo variable SELFHOSTED_DEPLOY_ENABLED (optional, #988)
# ===================================================================
# false: skip automatic push runs (monorepos where a Spring deploy already uses the SERVER_* Secrets)
# true : run on every push without guessing from Secrets
# unset: skip only when all 3 Secrets are missing (existing behavior)
# Manual runs (workflow_dispatch) proceed regardless of the value
# ===================================================================

name: PROJECT-Android-SelfHosted-CICD

on:
  push:
    branches: ["main"]
  workflow_dispatch: # manual run option

permissions:
  # GITHUB_TOKEN only reads. Declaring it keeps this workflow from gaining more permissions than needed
  # even if the repo default later changes to write (#595).
  contents: read

# ============================================
# 🔧 Per-project settings (edit the values below)
# ============================================
env:
  # Project name (used for the APK file name, artifact name, history file name)
  APP_ARTIFACT_NAME: "__APP_ARTIFACT_NAME__"  # @wizard ask:@repo
  # Repo variables FLUTTER_VERSION/JAVA_VERSION take precedence over the values below (kept across template updates, #758)
  FLUTTER_VERSION: "3.38.9"
  JAVA_VERSION: "__JAVA_VERSION__"  # @wizard ask:17
  # SMB server settings (self-hosted — Synology NAS, Linux, etc.)
  SMB_PORT: "44445" # default 445
  SMB_SHARE: "web"
  # Android upload subpath. Empty uploads directly under /{APP_ARTIFACT_NAME} (existing behavior).
  # Add a subpath like "/android" if needed. Changing the value changes the upload location, so be careful.
  SMB_PATH_ANDROID: ""
  # Flutter root path (relative to repo root). "." for a single repo, "app" etc. for a monorepo.
  # At integration, the integrator's flutter-root resolver substitutes it once with project_paths.flutter.
  # FLUTTER_ROOT is the official Flutter SDK path variable and would clash — hence APP_ROOT
  APP_ROOT: "."  # @wizard auto:flutter-root
jobs:
  # Detect missing setup (#662)
  # Flutter repos always get this file. So that repos not using a self-hosted server do not pile up
  # failed runs on every main push, automatic (push) runs without setup are skipped as success.
  # 2 missing-setup conditions: a value still holding the wizard placeholder token, all 3 SMB Secrets missing
  # Repo variable SELFHOSTED_DEPLOY_ENABLED: false skips, true skips the Secret guess (#988)
  # Manual runs proceed (on main, the preflight below reports missing items as errors)
  check-config:
    name: Check self-hosted deploy settings
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Detect unconfigured template
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_SWITCH: ${{ vars.SELFHOSTED_DEPLOY_ENABLED }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          if [ "$EVENT_NAME" != "push" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Switch value: true/false (case-insensitive); any other value warns and counts as unset
          switch=$(printf '%s' "$DEPLOY_SWITCH" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
          case "$switch" in
            true|false|"") ;;
            *)
              echo "::warning title=Self-hosted deploy switch::Repository variable SELFHOSTED_DEPLOY_ENABLED='${DEPLOY_SWITCH}' is not true or false, so it is ignored."
              switch="" ;;
          esac
          if [ "$switch" = "false" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            msg="Self-hosted (SMB) deploy is turned off by the repository variable SELFHOSTED_DEPLOY_ENABLED=false, so this push run was skipped. Set it to true, or delete the variable, to deploy on push again. Manual runs still deploy."
            echo "::notice title=Self-hosted deploy skipped::${msg}"
            {
              echo "### Self-hosted deploy skipped"
              echo ""
              echo "${msg}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          reasons=""
          for name in APP_ARTIFACT_NAME JAVA_VERSION SMB_PORT SMB_SHARE; do
            case "${!name}" in
              __*__) reasons="$reasons env.$name is still a template value (${!name});" ;;
            esac
          done
          # If only some of the 3 exist, treat the repo as being set up and proceed (the preflight reports what is missing as errors)
          # Skipped when the switch is true — monorepos sharing Secrets with another deploy run as intended
          if [ "$switch" != "true" ] && [ -z "$SERVER_HOST" ] && [ -z "$SERVER_USER" ] && [ -z "$SERVER_PASSWORD" ]; then
            reasons="$reasons secrets SERVER_HOST, SERVER_USER and SERVER_PASSWORD are not set;"
          fi
          if [ -z "$reasons" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          msg="Self-hosted (SMB) deploy is not configured, so this push run was skipped:${reasons} Set the values to enable it, delete this workflow if you do not deploy to your own server, or set the repository variable SELFHOSTED_DEPLOY_ENABLED=false to turn push deploys off."
          echo "::notice title=Self-hosted deploy skipped::${msg}"
          {
            echo "### Self-hosted deploy skipped"
            echo ""
            echo "${msg}"
          } >> "$GITHUB_STEP_SUMMARY"

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: check-config
    # Run only in configured repos and only when the CHANGELOG workflow succeeded
    if: ${{ needs.check-config.outputs.configured == 'true' && (github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run') }}

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      # Check out the repository and list files
      # Preflight (#666)
      # Right after a fresh install, missing deploy Secrets are normal. Left alone, the build runs to the end and then
      # fails at signing or upload with an error whose cause is hard to see, so report what is missing before the build.
      # With every Secret present this step passes unchanged and later behavior does not change.
      - name: Preflight check of deploy secrets
        if: github.ref == 'refs/heads/main'
        working-directory: ${{ github.workspace }}   # before checkout APP_ROOT may not exist yet
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          fail=0
          for name in SERVER_HOST SERVER_USER SERVER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Deploy preflight::Secret ${name} is missing. It is required for the self-hosted (SMB) upload. Add it under Settings > Secrets and variables > Actions."
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "✅ Preflight check passed"

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: List repository contents
        run: |
          echo "Repository checked out"
          ls -la

      # Debug keystore setup (kept for debugging)
      - name: Setup Debug Keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE" | base64 -d > ~/.android/debug.keystore || echo "Base64 decoding failed"
          echo "Debug Keystore created (for debugging)"
          ls -la ~/.android/
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android || echo "Keytool failed"

      # Create the .env file
      - name: Create .env file from GitHub Secret
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > .env
          echo ".env file created"
          ls -la

      # Build profile — runtime (.env) and compile time (dart-define) decided in one place (#603)
      # A release build, so check both layers together to make sure dev keys are not on.
      # Repos without the config (.github/config/build-profile.json) are left untouched.
      - name: Apply build profile (release)
        id: build_profile
        run: |
          python3 "${{ github.workspace }}/.github/scripts/apply_build_profile.py" \
            release .env \
            --config "${{ github.workspace }}/.github/config/build-profile.json"

      # Keystore and key.properties setup
      # By default it signs with the debug key as before (warning only).
      # It signs with the release key only when the repo variable ANDROID_SELFHOSTED_RELEASE_SIGNING=true is set explicitly.
      # RELEASE_* secrets may already exist for other workflows (Play Store, etc.); switching automatically because they exist
      # would change the signing key, and updates would fail to install over the previous APK on devices.
      # If opted in but the secrets are empty, fail instead of silently falling back.
      # Secrets and variables come only via env, never inlined in the script (values are never printed).
      - name: Setup Keystore and key.properties
        env:
          ANDROID_SELFHOSTED_RELEASE_SIGNING: ${{ vars.ANDROID_SELFHOSTED_RELEASE_SIGNING }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
        run: |
          mkdir -p android/app/keystore
          if [ "$ANDROID_SELFHOSTED_RELEASE_SIGNING" = "true" ]; then
            if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ] \
               || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
              echo "::error::ANDROID_SELFHOSTED_RELEASE_SIGNING=true but one of RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD is empty. Add all 4 secrets or remove the variable."
              exit 1
            fi
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android/app/keystore/key.jks
            printf 'storeFile=app/keystore/key.jks\n' > android/key.properties
            printf 'storePassword=%s\n' "$RELEASE_KEYSTORE_PASSWORD" >> android/key.properties
            printf 'keyAlias=%s\n' "$RELEASE_KEY_ALIAS" >> android/key.properties
            printf 'keyPassword=%s\n' "$RELEASE_KEY_PASSWORD" >> android/key.properties
            echo "Signing with the release key (key.properties created)"
          else
            echo "::warning::Signing with the debug key. To use the release key, set the repository variable ANDROID_SELFHOSTED_RELEASE_SIGNING=true and add the RELEASE_* secrets. If the signing key changes, the app may not install as an update over an existing install."
            echo "$DEBUG_KEYSTORE" | base64 -d > android/app/keystore/key.jks || echo "Base64 decoding failed"
            echo "Keystore created from DEBUG_KEYSTORE"
            echo "storeFile=app/keystore/key.jks" > android/key.properties
            echo "storePassword=android" >> android/key.properties
            echo "keyAlias=androiddebugkey" >> android/key.properties
            echo "keyPassword=android" >> android/key.properties
            echo "key.properties created (debug)"
          fi
          ls -la android/app/keystore android/

      # Written only when the Secret exists — otherwise the committed file stays, and if needed but missing the cause goes to ::error (#785)
      - name: Create Google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/firebase_config_files.py" restore --platform android --app-root .

      # Set up Flutter and check the version
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}

      - name: Verify Flutter version
        run: |
          echo "Flutter setup completed"
          flutter --version

      # Flutter and Gradle cache
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Install project dependencies
      - name: Install dependencies
        run: |
          flutter pub get
          echo "Dependencies installed"
          ls -la

      # Set up Gradle
      - name: Setup Gradle
        working-directory: ${{ env.APP_ROOT }}/android
        run: |
          # Flutter's default .gitignore excludes gradlew, so it may be missing in a CI checkout.
          # flutter build uses its own Gradle, so the build proceeds without it.
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "Gradle wrapper permissions set"
          else
            echo "No gradlew - using the Gradle bundled with Flutter"
          fi

      # Set up Java and check the version
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ vars.JAVA_VERSION || env.JAVA_VERSION }}

      - name: Verify Java version
        run: |
          echo "Java setup completed"
          java -version

      # Set up and check Ruby
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.4.1"

      - name: Verify Ruby version
        run: |
          echo "Ruby setup completed"
          ruby -v

      # Install Fastlane (with Bundler - avoids gem conflicts)
      - name: Install Fastlane
        working-directory: ${{ env.APP_ROOT }}/android
        run: |
          # multi_json: works around an upstream bug where a google-apis transitive dependency is undeclared (missing in gemspec → Gem::LoadError)
          printf 'source "https://rubygems.org"\ngem "fastlane"\ngem "multi_json"\n' > Gemfile
          bundle install
          echo "Fastlane installed (Bundler)"
          bundle exec fastlane --version

      # Compute the current version info and short commit hash
      - name: Get version info and calculate short commit hash
        id: version_info
        run: |
          CURRENT_VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          VERSION=$(echo $CURRENT_VERSION | cut -d'+' -f1)
          BUILD_NUMBER=$(echo $CURRENT_VERSION | cut -d'+' -f2)
          SHORT_COMMIT_HASH=$(echo ${{ github.sha }} | cut -c1-7)

          echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "SHORT_COMMIT_HASH=$SHORT_COMMIT_HASH" >> $GITHUB_ENV

          echo "Current version: $CURRENT_VERSION"
          echo "Short commit hash: $SHORT_COMMIT_HASH"

      # APK build (stays a release build)
      - name: Build APK
        run: |
          # The Fastfile installed by the wizard has no `build` lane (#601).
          # What exists: build_aab, deploy_internal, promote_internal_to_production, validate
          # So calling it blindly dies with "Could not find lane".
          # Use build if a hand-made Fastfile has it, otherwise build with flutter.
          BUILD_FLAGS="${{ steps.build_profile.outputs.build_flags }}"
          if [ -f "android/fastlane/Fastfile" ] \
             && grep -qE '^[[:space:]]*lane[[:space:]]*:build([[:space:]]|$)' android/fastlane/Fastfile; then
            # A fastlane lane builds its own build command — there is no place to pass dart-defines here.
            # Dropping them silently would bring back the exact incident this step fixes ("only one side applied").
            if [ -n "$BUILD_FLAGS" ]; then
              echo "::error::The build profile sets compile-time flags, but the build is about to run through the fastlane build lane."
              echo "::error::Change the Fastfile so the lane passes \$BUILD_FLAGS to flutter build, or remove the build lane to build with Flutter directly."
              exit 1
            fi
            echo "📦 Building with the fastlane build lane..."
            # Wrap in a subshell — a leaking cd would run later commands in the wrong place
            ( cd android && bundle exec fastlane build --verbose )
          else
            echo "📦 Building with Flutter directly... ${BUILD_FLAGS:+(flags: $BUILD_FLAGS)}"
            # shellcheck disable=SC2086  # flags must split on spaces
            flutter build apk --release $BUILD_FLAGS
          fi
          ls -la ./build/app/outputs/flutter-apk/ || true
          echo "APK built"

      # Rename and prepare the APK file
      - name: Rename and Prepare APK
        run: |
          mkdir -p ./android/app/build/outputs/apk/release/
          mv ./build/app/outputs/flutter-apk/app-release.apk ./android/app/build/outputs/apk/release/${{ env.APP_ARTIFACT_NAME }}-v${{ env.VERSION }}-${{ env.SHORT_COMMIT_HASH }}.apk
          echo "APK renamed to ${{ env.APP_ARTIFACT_NAME }}-v${{ env.VERSION }}-${{ env.SHORT_COMMIT_HASH }}.apk"
          ls -la ./android/app/build/outputs/apk/release/

      # Upload the APK as an artifact
      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_ARTIFACT_NAME }}-apk
          # Artifact actions ignore defaults and always use the repo root, so the APP_ROOT prefix is needed
          path: ${{ env.APP_ROOT }}/android/app/build/outputs/apk/release/${{ env.APP_ARTIFACT_NAME }}-v${{ env.VERSION }}-${{ env.SHORT_COMMIT_HASH }}.apk
          retention-days: 1

  deploy-android:
    name: Deploy Android APK
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: List repository contents for deploy
        run: |
          echo "Repository checked out for deploy"
          ls -la

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y smbclient jq
          echo "SMB and jq dependencies installed"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_ARTIFACT_NAME }}-apk
          # ⚠️ When the upload path is a single file, upload-artifact flattens the path.
          #    Extracting at the repo root would not restore the original location, so name the original directory.
          path: ${{ env.APP_ROOT }}/android/app/build/outputs/apk/release/

      - name: List downloaded structure (Debug)
        run: |
          ls -alR android/app/build/outputs
          echo "Downloaded structure listed"

      - name: Find APK file
        run: |
          APK_FILE=$(find android/app/build/outputs/ -name "*.apk" | head -n 1)
          echo "APK_FILE=$APK_FILE" >> $GITHUB_ENV
          APK_NAME=$(basename "$APK_FILE")
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          echo "APK file found: $APK_FILE"

      - name: Upload files to server via SMB
        env:
          SMB_SERVER: ${{ secrets.SERVER_HOST }}
          SMB_USERNAME: ${{ secrets.SERVER_USER }}
          SMB_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          SMB_PORT=${{ env.SMB_PORT }}
          SMB_SHARE=${{ env.SMB_SHARE }}
          SMB_PATH="/${{ env.APP_ARTIFACT_NAME }}${{ env.SMB_PATH_ANDROID }}"
          echo "Uploading APK file ${{ env.APK_NAME }} to SMB..."
          echo "SMB Path: $SMB_PATH"
          smbclient "//$SMB_SERVER/$SMB_SHARE" -p "$SMB_PORT" -U "$SMB_USERNAME%$SMB_PASSWORD" -m SMB3 -d 10 -c "mkdir $SMB_PATH; cd $SMB_PATH; put ${{ env.APK_FILE }} ${{ env.APK_NAME }}"
          echo "APK uploaded to SMB"

      - name: Update CICD history JSON
        env:
          SMB_SERVER: ${{ secrets.SERVER_HOST }}
          SMB_USERNAME: ${{ secrets.SERVER_USER }}
          SMB_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          export TZ='Asia/Seoul'
          BUILD_DATE=$(date +"%Y-%m-%d %H:%M")
          FILE_SIZE=$(stat -c%s "${{ env.APK_FILE }}")
          COMMIT_LINK="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          FULL_COMMIT_HASH="${{ github.sha }}"
          HISTORY_FILE="${{ env.APP_ARTIFACT_NAME }}-android-cicd-history.json"

          NEW_BUILD_INFO=$(jq -n \
            --arg apk_name "${{ env.APK_NAME }}" \
            --arg file_size "$FILE_SIZE" \
            --arg build_date "$BUILD_DATE" \
            --arg commit_link "$COMMIT_LINK" \
            --arg full_commit_hash "$FULL_COMMIT_HASH" \
            '{apk_name: $apk_name, file_size: $file_size, build_date: $build_date, commit_link: $commit_link, full_commit_hash: $full_commit_hash}')

          SMB_PORT=${{ env.SMB_PORT }}
          SMB_SHARE=${{ env.SMB_SHARE }}
          SMB_PATH="/${{ env.APP_ARTIFACT_NAME }}${{ env.SMB_PATH_ANDROID }}"

          smbclient "//$SMB_SERVER/$SMB_SHARE" -p "$SMB_PORT" -U "$SMB_USERNAME%$SMB_PASSWORD" -m SMB3 -d 10 -c "cd $SMB_PATH; get $HISTORY_FILE" || echo '{"files": []}' > $HISTORY_FILE
          echo "Downloaded or initialized $HISTORY_FILE"
          cat $HISTORY_FILE

          jq --argjson new_build "$NEW_BUILD_INFO" '.files += [$new_build]' $HISTORY_FILE > updated.json
          echo "Updated $HISTORY_FILE with new build info"
          cat updated.json

          smbclient "//$SMB_SERVER/$SMB_SHARE" -p "$SMB_PORT" -U "$SMB_USERNAME%$SMB_PASSWORD" -m SMB3 -d 10 -c "cd $SMB_PATH; put updated.json $HISTORY_FILE"
          echo "Updated $HISTORY_FILE uploaded to SMB"
