# ==========================================================================================
# Flutter CI (code analysis and build verification) workflow
# ==========================================================================================
#
# On PR creation or a push to main, this workflow
# verifies static analysis (flutter analyze) and the Android/iOS app builds.
#
# Key points:
# - Runs automatically on PR creation/update
# - Runs automatically on a push to main
# - Checks code quality with flutter analyze
# - Android/iOS builds can be enabled/disabled individually
# - Analyze Only mode: run code analysis only, without builds
# - For PRs, progress is updated live in a comment
# - Detailed error info on build failure
# - Analyze and builds run in parallel to save time
#
# How to use:
# 1. Edit the values in the env section at the top for your project
# 2. Set ANALYZE_ONLY to true to run code analysis only, without builds
# 3. Choose target platforms with ENABLE_ANDROID and ENABLE_IOS
# 4. Customize the env file path with ENV_FILE_PATH
#
# ==========================================================================================
# 🔧 Per-project settings
# ==========================================================================================
#
# ANALYZE_ONLY    : true runs analyze only and skips builds (default: false)
# ENABLE_ANDROID  : whether to build Android (when ANALYZE_ONLY=false)
# ENABLE_IOS      : whether to build iOS (when ANALYZE_ONLY=false)
# FLUTTER_VERSION : Flutter SDK version
# JAVA_VERSION    : Java version (for Android builds)
# XCODE_VERSION   : Xcode version (for iOS builds; empty = latest installed on the runner)
# ENV_FILE_PATH   : .env file path (default: .env at the root)
#
# ==========================================================================================
# 🔑 Required GitHub Secrets
# ==========================================================================================
# ENV_FILE (optional): contents of the .env file
# GOOGLE_SERVICES_JSON (optional): contents of android/app/google-services.json (when using Firebase)
# GOOGLE_SERVICE_INFO_PLIST (optional): contents of ios/Runner/GoogleService-Info.plist (raw or base64)
#
# * CI only verifies builds, so no signing/deploy Secrets are needed
# ==========================================================================================

name: PROJECT-Flutter-CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      analyze_only:
        description: 'Analyze Only mode (code analysis only, no builds)'
        type: boolean
        default: false
      enable_android:
        description: 'Enable the Android build (when Analyze Only=false)'
        type: boolean
        default: true
      enable_ios:
        description: 'Enable the iOS build (when Analyze Only=false)'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

# ==========================================================================================
# 🔧 Per-project settings (edit the values below)
# ==========================================================================================
env:
  # 🎯 CI mode
  ANALYZE_ONLY: "false"     # true: analyze only (skip builds), false: analyze + builds

  # 🎯 Build target platforms (applies only when ANALYZE_ONLY=false)
  ENABLE_ANDROID: "true"    # enable the Android build (true/false)
  ENABLE_IOS: "true"        # enable the iOS build (true/false)

  # 🔧 Per-project settings
  # Repo variables FLUTTER_VERSION/JAVA_VERSION take precedence over the values below (kept across template updates, #758)
  FLUTTER_VERSION: "3.38.9"
  JAVA_VERSION: "__JAVA_VERSION__"  # @wizard ask:17
  XCODE_VERSION: ""  # empty = auto-select the runner's latest Xcode; enter something like "26.6" only to pin (#758)
  ENV_FILE_PATH: ".env"     # env file path (customizable)

  # Flutter root path (relative to repo root). "." for a single repo, "app" etc. for a monorepo.
  # At integration, the integrator's flutter-root resolver substitutes it once with project_paths.flutter.
  # FLUTTER_ROOT is the official Flutter SDK path variable and would clash — hence APP_ROOT
  APP_ROOT: "."  # @wizard auto:flutter-root
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===================================================================
  # Job 1: preparation
  # ===================================================================
  prepare:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: CI 준비
    runs-on: ubuntu-latest

    outputs:
      comment_id: ${{ steps.comment.outputs.comment_id }}
      start_time: ${{ steps.comment.outputs.start_time }}
      branch_name: ${{ steps.info.outputs.branch_name }}
      commit_hash: ${{ steps.info.outputs.commit_hash }}
      analyze_only: ${{ steps.config.outputs.analyze_only }}
      enable_android: ${{ steps.config.outputs.enable_android }}
      enable_ios: ${{ steps.config.outputs.enable_ios }}

    steps:
      # Comment text follows the repo language (version.yml options.language) (#769).
      # Fetch only the catalog as a module in $RUNNER_TEMP and delete the fetched folder (so it does not clash with the later checkout)
      # Fetched from the default branch — the merge ref of a PR closed event may already be gone
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js flutter_ci. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      # Pass settings via outputs
      # workflow_dispatch inputs win if present, else env values
      - name: Pass settings to outputs
        id: config
        run: |
          # Check workflow_dispatch inputs
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ANALYZE_ONLY="${{ github.event.inputs.analyze_only }}"
            ENABLE_ANDROID="${{ github.event.inputs.enable_android }}"
            ENABLE_IOS="${{ github.event.inputs.enable_ios }}"
          else
            ANALYZE_ONLY="${{ env.ANALYZE_ONLY }}"
            ENABLE_ANDROID="${{ env.ENABLE_ANDROID }}"
            ENABLE_IOS="${{ env.ENABLE_IOS }}"
          fi

          echo "analyze_only=$ANALYZE_ONLY" >> $GITHUB_OUTPUT
          echo "enable_android=$ENABLE_ANDROID" >> $GITHUB_OUTPUT
          echo "enable_ios=$ENABLE_IOS" >> $GITHUB_OUTPUT
          echo "📋 CI settings:"
          echo "  Analyze Only: $ANALYZE_ONLY"
          echo "  Android: $ENABLE_ANDROID"
          echo "  iOS: $ENABLE_IOS"
          echo "  Trigger: ${{ github.event_name }}"

      # Collect build info
      - name: Collect build info
        id: info
        env:
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH_NAME="$HEAD_REF"
          else
            BRANCH_NAME="$REF_NAME"
          fi
          COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-7)

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT

          echo "📋 Build info:"
          echo "  Branch: $BRANCH_NAME"
          echo "  Commit: $COMMIT_HASH"

      # For PRs, create the progress comment
      - name: Create progress comment
        id: comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.info.outputs.branch_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const branchName = process.env.BRANCH_NAME;
            const commitHash = '${{ steps.info.outputs.commit_hash }}';
            const analyzeOnly = '${{ steps.config.outputs.analyze_only }}' === 'true';
            const enableAndroid = '${{ steps.config.outputs.enable_android }}' === 'true';
            const enableIos = '${{ steps.config.outputs.enable_ios }}' === 'true';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const startTime = Date.now();
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);

            // Decide the header
            const header = analyzeOnly
              ? t('flutter_ci.progress.heading_analyze_only')
              : t('flutter_ci.progress.heading');

            // Decide platform states
            let androidStatus, iosStatus;
            if (analyzeOnly) {
              androidStatus = t('flutter_ci.status.skipped');
              iosStatus = t('flutter_ci.status.skipped');
            } else {
              androidStatus = enableAndroid ? t('flutter_ci.status.in_progress') : t('flutter_ci.status.disabled');
              iosStatus = enableIos ? t('flutter_ci.status.in_progress') : t('flutter_ci.status.disabled');
            }

            const bodyParts = [
              header,
              '',
              t('flutter_ci.table.checks_header'),
              '|----------|------|----------|',
              t('flutter_ci.table.row_analyze', { status: t('flutter_ci.status.in_progress'), duration: '-' }),
              t('flutter_ci.table.row_android', { status: androidStatus, duration: '-' }),
              t('flutter_ci.table.row_ios', { status: iosStatus, duration: '-' }),
              '',
              t('flutter_ci.table.info_header'),
              '|------|-----|',
              t('flutter_ci.table.branch', { branch: branchName }),
              t('flutter_ci.table.commit', { commit: commitHash })
            ];

            if (analyzeOnly) {
              bodyParts.push('');
              bodyParts.push(t('flutter_ci.progress.analyze_only_note'));
            }

            bodyParts.push('');
            bodyParts.push(t('flutter_ci.progress.live_log', { url: runUrl }));
            bodyParts.push('');
            bodyParts.push('---');
            bodyParts.push(t('flutter_ci.progress.auto_update'));

            const body = bodyParts.join('\n');

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

            console.log(`✅ Progress comment created: #${comment.id}`);
            core.setOutput('comment_id', comment.id);
            core.setOutput('start_time', startTime);

  # ===================================================================
  # Job 2: code analysis (parallel)
  # ===================================================================
  analyze:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: 코드 분석
    runs-on: ubuntu-latest
    needs: prepare

    outputs:
      status: ${{ steps.result.outputs.status }}
      duration: ${{ steps.result.outputs.duration }}

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      # Comment text follows the repo language (version.yml options.language) (#769).
      # Fetch only the catalog as a module in $RUNNER_TEMP and delete the fetched folder (so it does not clash with the later checkout)
      # Fetched from the default branch — the merge ref of a PR closed event may already be gone
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Record analyze start time
        id: analyze_start
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('time', Date.now().toString());

      - name: Checkout repository
        uses: actions/checkout@v5

      # Compare the template's pinned Flutter/Java versions <-> the repo (pubspec, .fvmrc, Gradle) — warn only on mismatch (#758)
      - name: Check toolchain versions
        continue-on-error: true
        env:
          FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          JAVA_VERSION: ${{ vars.JAVA_VERSION || env.JAVA_VERSION }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/toolchain_versions.py" check --app-root .

      # Create the .env file
      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > ${{ env.ENV_FILE_PATH }}
          echo "✅ ${{ env.ENV_FILE_PATH }} file created"

      # Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Flutter version
        run: |
          echo "✅ Flutter setup completed"
          flutter --version

      # Flutter cache
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      # Install project dependencies
      - name: Install dependencies
        run: |
          flutter pub get
          echo "✅ Dependencies installed"

      # Run Flutter Analyze
      - name: Run Flutter Analyze
        id: analyze
        run: |
          echo "🔍 Starting Flutter code analysis..."
          flutter analyze --no-fatal-infos
          echo "✅ Code analysis done"

      # Record the analysis result
      - name: Record analyze result
        id: result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { elapsed: formatElapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const analyzeStart = parseInt('${{ steps.analyze_start.outputs.time }}');
            const now = Date.now();
            const elapsed = now - analyzeStart;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const duration = formatElapsed(minutes, seconds);

            const status = '${{ steps.analyze.outcome }}' === 'success' ? 'success' : 'failure';

            core.setOutput('status', status);
            core.setOutput('duration', duration);
            console.log(`📋 Code analysis result: ${status} (${duration})`);

  # ===================================================================
  # Job 3: Android build (conditional, parallel)
  # ===================================================================
  build-android:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: Android 빌드
    if: |
      needs.prepare.outputs.analyze_only != 'true' &&
      needs.prepare.outputs.enable_android == 'true'
    runs-on: ubuntu-latest
    needs: prepare

    outputs:
      status: ${{ steps.result.outputs.status }}
      duration: ${{ steps.result.outputs.duration }}

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      # Comment text follows the repo language (version.yml options.language) (#769).
      # Fetch only the catalog as a module in $RUNNER_TEMP and delete the fetched folder (so it does not clash with the later checkout)
      # Fetched from the default branch — the merge ref of a PR closed event may already be gone
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Record build start time
        id: build_start
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('time', Date.now().toString());

      - name: Checkout repository
        uses: actions/checkout@v5

      # Create the .env file
      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > ${{ env.ENV_FILE_PATH }}
          echo "✅ ${{ env.ENV_FILE_PATH }} file created"

      # Written only when the Secret exists — otherwise the committed file stays, and if needed but missing the cause goes to ::error (#785)
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/firebase_config_files.py" restore --platform android --app-root .

      # Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Flutter version
        run: |
          echo "✅ Flutter setup completed"
          flutter --version

      # Flutter cache
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      # Gradle cache
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Install project dependencies
      - name: Install dependencies
        run: |
          flutter pub get
          echo "✅ Dependencies installed"

      # Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ vars.JAVA_VERSION || env.JAVA_VERSION }}

      - name: Verify Java version
        run: |
          echo "✅ Java setup completed"
          java -version

      # Set up Gradle
      - name: Setup Gradle
        working-directory: ${{ env.APP_ROOT }}/android
        run: |
          # Flutter's default .gitignore excludes gradlew, so it may be missing in a CI checkout.
          # flutter build uses its own Gradle, so the build proceeds without it.
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "✅ Gradle wrapper permissions set"
          else
            echo "ℹ️ No gradlew - using the Gradle bundled with Flutter"
          fi

      # APK build
      - name: Build APK
        id: build
        run: |
          echo "📦 Starting the Flutter APK build..."
          # CI only verifies compilation, so no signing is needed.
          # --release requires signingConfig (keystore), but CI has no keystore,
          # so it fails with 'SigningConfig release is missing storeFile'.
          # Android has no equivalent of iOS --no-codesign, so --debug is used.
          flutter build apk --debug
          echo "✅ APK build done"
          ls -la ./build/app/outputs/flutter-apk/ || true

      # Record the build result
      - name: Record build result
        id: result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { elapsed: formatElapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const buildStart = parseInt('${{ steps.build_start.outputs.time }}');
            const now = Date.now();
            const elapsed = now - buildStart;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const duration = formatElapsed(minutes, seconds);

            const status = '${{ steps.build.outcome }}' === 'success' ? 'success' : 'failure';

            core.setOutput('status', status);
            core.setOutput('duration', duration);
            console.log(`📋 Android build result: ${status} (${duration})`);

  # ===================================================================
  # Job 4: iOS build (conditional, parallel)
  # ===================================================================
  build-ios:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: iOS 빌드
    if: |
      needs.prepare.outputs.analyze_only != 'true' &&
      needs.prepare.outputs.enable_ios == 'true'
    runs-on: macos-26
    needs: prepare

    outputs:
      status: ${{ steps.result.outputs.status }}
      duration: ${{ steps.result.outputs.duration }}

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      # Comment text follows the repo language (version.yml options.language) (#769).
      # Fetch only the catalog as a module in $RUNNER_TEMP and delete the fetched folder (so it does not clash with the later checkout)
      # Fetched from the default branch — the merge ref of a PR closed event may already be gone
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Record build start time
        id: build_start
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('time', Date.now().toString());

      - name: Checkout repository
        uses: actions/checkout@v5

      # Empty = latest stable Xcode on the runner; if the pinned version is missing on the runner, print the installed list and fail (#758)
      # Can also be pinned with the repo variable XCODE_VERSION (kept across template updates)
      - name: Select Xcode version
        working-directory: ${{ github.workspace }}
        env:
          XCODE_VERSION: ${{ env.XCODE_VERSION || vars.XCODE_VERSION }}
        run: python3 .github/scripts/select_xcode.py select --apply

      # Since Xcode 26 the iOS platform SDK is not included by default and must be installed separately.
      # Without it the build fails with 'iOS 26.0 Platform Not Installed'.
      - name: Install iOS device platform
        env:
          # xcode-select alone does not propagate to subprocesses, so set it explicitly
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: |
          sudo installer -pkg "$XCODE_APP_PATH/Contents/Resources/Packages/MobileDevice.pkg" -target / || true
          sudo installer -pkg "$XCODE_APP_PATH/Contents/Resources/Packages/MobileDeviceDevelopment.pkg" -target / || true
          sudo xcodebuild -license accept || true

          # ⚠️ Do not decide in advance whether it is installed and skip.
          #    The SDK xcodebuild -showsdks reports and the 'device platform' needed for device builds
          #    are separate. Even if the SDK shows, the build fails with 'iOS 26.0 is not installed'.
          #    So always download, unconditionally (returns at once if already present).
          xcrun simctl list >/dev/null 2>&1 || true
          for i in 1 2 3; do
            xcodebuild -downloadPlatform iOS && break
            echo "⚠️ Attempt $i failed - retrying"
            sleep 15
          done
          xcodebuild -showsdks | grep iphoneos || true

      # Create the .env file
      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > ${{ env.ENV_FILE_PATH }}
          echo "✅ ${{ env.ENV_FILE_PATH }} file created"

      # Firebase iOS config: restore only when the Secret exists; if needed but missing, cause goes to ::error (#785)
      - name: Create GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/firebase_config_files.py" restore --platform ios --app-root .

      # Set up Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Flutter version
        run: |
          echo "✅ Flutter setup completed"
          flutter --version

      # Flutter cache
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      # Install project dependencies
      - name: Install dependencies
        run: |
          flutter pub get
          echo "✅ Dependencies installed"

      # Set up Ruby and CocoaPods
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          # Without plugin dependencies Flutter creates no Podfile, so skip
          if [ -f ios/Podfile ]; then
            cd ios && pod install --repo-update || pod install
            echo "✅ CocoaPods installed"
          else
            echo "ℹ️ No ios/Podfile - the project has no CocoaPods dependencies, skipping"
          fi

      # iOS build (without signing)
      - name: Build iOS
        id: build
        env:
          # xcode-select alone does not propagate to the subprocesses Flutter creates,
          # so they see a different Xcode. As a result, even with the SDK installed
          # 'iOS 26.0 Platform Not Installed' occurs, so set it explicitly.
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: |
          set -o pipefail   # pass build failures through even after tee
          echo "📦 Starting the Flutter iOS build..."
          flutter build ios --release --no-codesign 2>&1 | tee "$RUNNER_TEMP/flutter-ios-build.log"
          echo "✅ iOS build done"

      # On a missing SDK symbol error, suggest that Xcode may be stale (#758)
      - name: Diagnose iOS build failure
        if: failure() && steps.build.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/select_xcode.py hint --log "$RUNNER_TEMP/flutter-ios-build.log"

      # Record the build result
      - name: Record build result
        id: result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { elapsed: formatElapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const buildStart = parseInt('${{ steps.build_start.outputs.time }}');
            const now = Date.now();
            const elapsed = now - buildStart;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const duration = formatElapsed(minutes, seconds);

            const status = '${{ steps.build.outcome }}' === 'success' ? 'success' : 'failure';

            core.setOutput('status', status);
            core.setOutput('duration', duration);
            console.log(`📋 iOS build result: ${status} (${duration})`);

  # ===================================================================
  # Job 5: report results
  # ===================================================================
  report:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: 결과 보고
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [prepare, analyze, build-android, build-ios]

    steps:
      # Comment text follows the repo language (version.yml options.language) (#769).
      # Fetch only the catalog as a module in $RUNNER_TEMP and delete the fetched folder (so it does not clash with the later checkout)
      # Fetched from the default branch — the merge ref of a PR closed event may already be gone
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js flutter_ci. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Update the final result comment
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.prepare.outputs.branch_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt('${{ needs.prepare.outputs.comment_id }}');
            const startTime = parseInt('${{ needs.prepare.outputs.start_time }}');
            const branchName = process.env.BRANCH_NAME;
            const commitHash = '${{ needs.prepare.outputs.commit_hash }}';
            const analyzeOnly = '${{ needs.prepare.outputs.analyze_only }}' === 'true';
            const enableAndroid = '${{ needs.prepare.outputs.enable_android }}' === 'true';
            const enableIos = '${{ needs.prepare.outputs.enable_ios }}' === 'true';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            // Collect results
            const analyzeStatus = '${{ needs.analyze.outputs.status }}';
            const analyzeDuration = '${{ needs.analyze.outputs.duration }}' || '-';
            const androidStatus = '${{ needs.build-android.outputs.status }}';
            const androidDuration = '${{ needs.build-android.outputs.duration }}' || '-';
            const iosStatus = '${{ needs.build-ios.outputs.status }}';
            const iosDuration = '${{ needs.build-ios.outputs.duration }}' || '-';

            // Compute total duration
            const now = Date.now();
            const totalElapsed = now - startTime;
            const totalMin = Math.floor(totalElapsed / 60000);
            const totalSec = Math.floor((totalElapsed % 60000) / 1000);
            const totalDuration = elapsed(totalMin, totalSec);

            // Decide state
            let overallSuccess = true;
            let analyzeDisplay, androidDisplay, iosDisplay;

            // Analyze state
            if (analyzeStatus === 'success') {
              analyzeDisplay = t('flutter_ci.status.success');
            } else {
              analyzeDisplay = t('flutter_ci.status.failure');
              overallSuccess = false;
            }

            // Android state
            if (analyzeOnly) {
              androidDisplay = t('flutter_ci.status.skipped');
            } else if (!enableAndroid) {
              androidDisplay = t('flutter_ci.status.disabled');
            } else if (androidStatus === 'success') {
              androidDisplay = t('flutter_ci.status.success');
            } else {
              androidDisplay = t('flutter_ci.status.failure');
              overallSuccess = false;
            }

            // iOS state
            if (analyzeOnly) {
              iosDisplay = t('flutter_ci.status.skipped');
            } else if (!enableIos) {
              iosDisplay = t('flutter_ci.status.disabled');
            } else if (iosStatus === 'success') {
              iosDisplay = t('flutter_ci.status.success');
            } else {
              iosDisplay = t('flutter_ci.status.failure');
              overallSuccess = false;
            }

            // Decide the header
            let header;
            if (analyzeOnly) {
              header = overallSuccess
                ? t('flutter_ci.result.heading_analyze_only_success')
                : t('flutter_ci.result.heading_analyze_only_failure');
            } else {
              header = overallSuccess
                ? t('flutter_ci.result.heading_success')
                : t('flutter_ci.result.heading_failure');
            }

            // Build the comment body
            const bodyParts = [
              header,
              '',
              t('flutter_ci.table.checks_header'),
              '|----------|------|----------|',
              t('flutter_ci.table.row_analyze', { status: analyzeDisplay, duration: analyzeDuration }),
              t('flutter_ci.table.row_android', { status: androidDisplay, duration: analyzeOnly || !enableAndroid ? '-' : androidDuration }),
              t('flutter_ci.table.row_ios', { status: iosDisplay, duration: analyzeOnly || !enableIos ? '-' : iosDuration }),
              '',
              t('flutter_ci.table.info_header'),
              '|------|-----|',
              t('flutter_ci.table.branch', { branch: branchName }),
              t('flutter_ci.table.commit', { commit: commitHash }),
              t('flutter_ci.table.total', { duration: totalDuration }),
              ''
            ];

            // Analyze Only mode notice
            if (analyzeOnly && overallSuccess) {
              bodyParts.push(t('flutter_ci.result.analyze_only_note'));
              bodyParts.push('');
            }

            // Extra guidance on failure
            if (!overallSuccess) {
              bodyParts.push(
                t('flutter_ci.result.check_heading'),
                ''
              );

              if (analyzeStatus !== 'success') {
                bodyParts.push(t('flutter_ci.result.analyze_failed'));
                bodyParts.push('');
              }

              if (!analyzeOnly && enableAndroid && androidStatus !== 'success') {
                bodyParts.push(t('flutter_ci.result.android_failed'));
                bodyParts.push('');
              }

              if (!analyzeOnly && enableIos && iosStatus !== 'success') {
                bodyParts.push(t('flutter_ci.result.ios_failed'));
                bodyParts.push('');
              }
            }

            bodyParts.push(t('flutter_ci.result.workflow_log', { url: runUrl }));

            const body = bodyParts.join('\n');

            // Update the comment
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
              console.log(`✅ Result comment updated`);
            } else {
              console.log('⚠️ No comment ID, skipping the update.');
            }
