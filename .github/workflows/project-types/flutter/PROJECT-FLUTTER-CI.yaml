# ==========================================================================================
# Flutter CI (코드 분석 및 빌드 검증) 워크플로우
# ==========================================================================================
#
# 이 워크플로우는 PR 생성 또는 main 브랜치 푸시 시
# 코드 정적 분석(flutter analyze)과 Android/iOS 앱 빌드를 검증합니다.
#
# 주요 특징:
# - PR 생성/업데이트 시 자동 실행
# - main 브랜치 푸시 시 자동 실행
# - flutter analyze로 코드 품질 검사
# - Android/iOS 빌드 개별 활성화/비활성화 가능
# - Analyze Only 모드: 빌드 없이 코드 분석만 실행 가능
# - PR인 경우 진행 상황을 댓글로 실시간 업데이트
# - 빌드 실패 시 상세 에러 정보 제공
# - Analyze와 빌드 병렬 실행으로 시간 단축
#
# 사용 방법:
# 1. 프로젝트에 맞게 상단 env 섹션의 값들을 수정하세요
# 2. ANALYZE_ONLY를 true로 설정하면 빌드 없이 코드 분석만 실행
# 3. ENABLE_ANDROID, ENABLE_IOS로 빌드 대상 플랫폼 선택
# 4. ENV_FILE_PATH로 환경변수 파일 경로 커스터마이징
#
# ==========================================================================================
# 🔧 프로젝트별 설정
# ==========================================================================================
#
# ANALYZE_ONLY    : true면 analyze만 실행, 빌드 스킵 (기본: false)
# ENABLE_ANDROID  : Android 빌드 활성화 여부 (ANALYZE_ONLY=false일 때)
# ENABLE_IOS      : iOS 빌드 활성화 여부 (ANALYZE_ONLY=false일 때)
# FLUTTER_VERSION : Flutter SDK 버전
# JAVA_VERSION    : Java 버전 (Android 빌드용)
# XCODE_VERSION   : Xcode 버전 (iOS 빌드용, 빈 값 = 러너에 설치된 최신 버전)
# ENV_FILE_PATH   : .env 파일 경로 (기본값: 루트의 .env)
#
# ==========================================================================================
# 🔑 필수 GitHub Secrets
# ==========================================================================================
# ENV_FILE (선택): .env 파일 내용
# GOOGLE_SERVICES_JSON (선택): android/app/google-services.json 내용 (Firebase 사용 시)
# GOOGLE_SERVICE_INFO_PLIST (선택): ios/Runner/GoogleService-Info.plist 내용 (원문 또는 base64)
#
# ※ CI는 빌드 검증 목적이므로 서명/배포 관련 Secrets 불필요
# ==========================================================================================

name: PROJECT-Flutter-CI

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      analyze_only:
        description: 'Analyze Only mode (code analysis only, no builds)'
        type: boolean
        default: false
      enable_android:
        description: 'Enable the Android build (when Analyze Only=false)'
        type: boolean
        default: true
      enable_ios:
        description: 'Enable the iOS build (when Analyze Only=false)'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: write

# ==========================================================================================
# 🔧 프로젝트별 설정 (아래 값들을 수정하세요)
# ==========================================================================================
env:
  # 🎯 CI 모드 설정
  ANALYZE_ONLY: "false"     # true: analyze만 실행 (빌드 스킵), false: analyze + 빌드

  # 🎯 빌드 대상 플랫폼 설정 (ANALYZE_ONLY=false일 때만 적용)
  ENABLE_ANDROID: "true"    # Android 빌드 활성화 (true/false)
  ENABLE_IOS: "true"        # iOS 빌드 활성화 (true/false)

  # 🔧 프로젝트별 설정
  # 레포 변수 FLUTTER_VERSION·JAVA_VERSION 이 있으면 아래 값보다 먼저 쓴다 (템플릿 업데이트에도 유지, #758)
  FLUTTER_VERSION: "3.38.9"
  JAVA_VERSION: "__JAVA_VERSION__"  # @wizard ask:17
  XCODE_VERSION: ""  # 빈 값 = 러너 최신 Xcode 자동 선택, 고정할 때만 "26.6" 처럼 입력 (#758)
  ENV_FILE_PATH: ".env"     # 환경변수 파일 경로 (커스터마이징 가능)

  # Flutter 루트 경로(레포 루트 기준). 단일레포면 ".", 모노레포면 "app" 등.
  # 통합 시점에 integrator의 flutter-root resolver가 project_paths.flutter 값으로 1회 치환.
  # FLUTTER_ROOT는 Flutter SDK 경로용 공식 변수라 충돌 — APP_ROOT로 분리
  APP_ROOT: "."  # @wizard auto:flutter-root
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===================================================================
  # Job 1: 준비 단계
  # ===================================================================
  prepare:
    # 잡 이름은 브랜치 보호의 필수 상태 체크 이름이 될 수 있어 번역하지 않는다 (#769)
    name: CI 준비
    runs-on: ubuntu-latest

    outputs:
      comment_id: ${{ steps.comment.outputs.comment_id }}
      start_time: ${{ steps.comment.outputs.start_time }}
      branch_name: ${{ steps.info.outputs.branch_name }}
      commit_hash: ${{ steps.info.outputs.commit_hash }}
      analyze_only: ${{ steps.config.outputs.analyze_only }}
      enable_android: ${{ steps.config.outputs.enable_android }}
      enable_ios: ${{ steps.config.outputs.enable_ios }}

    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js flutter_ci. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      # 설정 값 outputs으로 전달
      # workflow_dispatch 입력값이 있으면 우선 사용, 없으면 env 값 사용
      - name: Pass settings to outputs
        id: config
        run: |
          # workflow_dispatch 입력값 확인
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ANALYZE_ONLY="${{ github.event.inputs.analyze_only }}"
            ENABLE_ANDROID="${{ github.event.inputs.enable_android }}"
            ENABLE_IOS="${{ github.event.inputs.enable_ios }}"
          else
            ANALYZE_ONLY="${{ env.ANALYZE_ONLY }}"
            ENABLE_ANDROID="${{ env.ENABLE_ANDROID }}"
            ENABLE_IOS="${{ env.ENABLE_IOS }}"
          fi

          echo "analyze_only=$ANALYZE_ONLY" >> $GITHUB_OUTPUT
          echo "enable_android=$ENABLE_ANDROID" >> $GITHUB_OUTPUT
          echo "enable_ios=$ENABLE_IOS" >> $GITHUB_OUTPUT
          echo "📋 CI settings:"
          echo "  Analyze Only: $ANALYZE_ONLY"
          echo "  Android: $ENABLE_ANDROID"
          echo "  iOS: $ENABLE_IOS"
          echo "  Trigger: ${{ github.event_name }}"

      # 빌드 정보 수집
      - name: Collect build info
        id: info
        env:
          REF_NAME: ${{ github.ref_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BRANCH_NAME="$HEAD_REF"
          else
            BRANCH_NAME="$REF_NAME"
          fi
          COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-7)

          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT

          echo "📋 Build info:"
          echo "  Branch: $BRANCH_NAME"
          echo "  Commit: $COMMIT_HASH"

      # PR인 경우 진행 상황 댓글 생성
      - name: Create progress comment
        id: comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.info.outputs.branch_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;
            const branchName = process.env.BRANCH_NAME;
            const commitHash = '${{ steps.info.outputs.commit_hash }}';
            const analyzeOnly = '${{ steps.config.outputs.analyze_only }}' === 'true';
            const enableAndroid = '${{ steps.config.outputs.enable_android }}' === 'true';
            const enableIos = '${{ steps.config.outputs.enable_ios }}' === 'true';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const startTime = Date.now();
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);

            // 헤더 결정
            const header = analyzeOnly
              ? t('flutter_ci.progress.heading_analyze_only')
              : t('flutter_ci.progress.heading');

            // 플랫폼 상태 결정
            let androidStatus, iosStatus;
            if (analyzeOnly) {
              androidStatus = t('flutter_ci.status.skipped');
              iosStatus = t('flutter_ci.status.skipped');
            } else {
              androidStatus = enableAndroid ? t('flutter_ci.status.in_progress') : t('flutter_ci.status.disabled');
              iosStatus = enableIos ? t('flutter_ci.status.in_progress') : t('flutter_ci.status.disabled');
            }

            const bodyParts = [
              header,
              '',
              t('flutter_ci.table.checks_header'),
              '|----------|------|----------|',
              t('flutter_ci.table.row_analyze', { status: t('flutter_ci.status.in_progress'), duration: '-' }),
              t('flutter_ci.table.row_android', { status: androidStatus, duration: '-' }),
              t('flutter_ci.table.row_ios', { status: iosStatus, duration: '-' }),
              '',
              t('flutter_ci.table.info_header'),
              '|------|-----|',
              t('flutter_ci.table.branch', { branch: branchName }),
              t('flutter_ci.table.commit', { commit: commitHash })
            ];

            if (analyzeOnly) {
              bodyParts.push('');
              bodyParts.push(t('flutter_ci.progress.analyze_only_note'));
            }

            bodyParts.push('');
            bodyParts.push(t('flutter_ci.progress.live_log', { url: runUrl }));
            bodyParts.push('');
            bodyParts.push('---');
            bodyParts.push(t('flutter_ci.progress.auto_update'));

            const body = bodyParts.join('\n');

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

            console.log(`✅ Progress comment created: #${comment.id}`);
            core.setOutput('comment_id', comment.id);
            core.setOutput('start_time', startTime);

  # ===================================================================
  # Job 2: 코드 분석 (병렬)
  # ===================================================================
  analyze:
    # 잡 이름은 브랜치 보호의 필수 상태 체크 이름이 될 수 있어 번역하지 않는다 (#769)
    name: 코드 분석
    runs-on: ubuntu-latest
    needs: prepare

    outputs:
      status: ${{ steps.result.outputs.status }}
      duration: ${{ steps.result.outputs.duration }}

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Record analyze start time
        id: analyze_start
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('time', Date.now().toString());

      - name: Checkout repository
        uses: actions/checkout@v5

      # 템플릿 고정 Flutter·Java 버전 <-> 레포(pubspec·.fvmrc·Gradle) 대조 — 어긋나면 경고만 (#758)
      - name: Check toolchain versions
        continue-on-error: true
        env:
          FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          JAVA_VERSION: ${{ vars.JAVA_VERSION || env.JAVA_VERSION }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/toolchain_versions.py" check --app-root .

      # .env 파일 생성
      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > ${{ env.ENV_FILE_PATH }}
          echo "✅ ${{ env.ENV_FILE_PATH }} file created"

      # Flutter 설정
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Flutter version
        run: |
          echo "✅ Flutter setup completed"
          flutter --version

      # Flutter 캐시
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      # 프로젝트 의존성 설치
      - name: Install dependencies
        run: |
          flutter pub get
          echo "✅ Dependencies installed"

      # Flutter Analyze 실행
      - name: Run Flutter Analyze
        id: analyze
        run: |
          echo "🔍 Starting Flutter code analysis..."
          flutter analyze --no-fatal-infos
          echo "✅ Code analysis done"

      # 분석 결과 기록
      - name: Record analyze result
        id: result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { elapsed: formatElapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const analyzeStart = parseInt('${{ steps.analyze_start.outputs.time }}');
            const now = Date.now();
            const elapsed = now - analyzeStart;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const duration = formatElapsed(minutes, seconds);

            const status = '${{ steps.analyze.outcome }}' === 'success' ? 'success' : 'failure';

            core.setOutput('status', status);
            core.setOutput('duration', duration);
            console.log(`📋 Code analysis result: ${status} (${duration})`);

  # ===================================================================
  # Job 3: Android 빌드 (조건부, 병렬)
  # ===================================================================
  build-android:
    # 잡 이름은 브랜치 보호의 필수 상태 체크 이름이 될 수 있어 번역하지 않는다 (#769)
    name: Android 빌드
    if: |
      needs.prepare.outputs.analyze_only != 'true' &&
      needs.prepare.outputs.enable_android == 'true'
    runs-on: ubuntu-latest
    needs: prepare

    outputs:
      status: ${{ steps.result.outputs.status }}
      duration: ${{ steps.result.outputs.duration }}

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Record build start time
        id: build_start
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('time', Date.now().toString());

      - name: Checkout repository
        uses: actions/checkout@v5

      # .env 파일 생성
      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > ${{ env.ENV_FILE_PATH }}
          echo "✅ ${{ env.ENV_FILE_PATH }} file created"

      # Secret 이 있을 때만 쓴다 — 없으면 커밋된 파일을 그대로 두고, 필요한데 없으면 원인을 ::error 로 (#785)
      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/firebase_config_files.py" restore --platform android --app-root .

      # Flutter 설정
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Flutter version
        run: |
          echo "✅ Flutter setup completed"
          flutter --version

      # Flutter 캐시
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      # Gradle 캐시
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 프로젝트 의존성 설치
      - name: Install dependencies
        run: |
          flutter pub get
          echo "✅ Dependencies installed"

      # Java 설정
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ vars.JAVA_VERSION || env.JAVA_VERSION }}

      - name: Verify Java version
        run: |
          echo "✅ Java setup completed"
          java -version

      # Gradle 셋업
      - name: Setup Gradle
        working-directory: ${{ env.APP_ROOT }}/android
        run: |
          # Flutter 기본 .gitignore가 gradlew를 제외하므로 CI 체크아웃 시 없을 수 있다.
          # flutter build가 자체 Gradle을 쓰므로 없어도 빌드는 진행된다.
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "✅ Gradle wrapper permissions set"
          else
            echo "ℹ️ No gradlew - using the Gradle bundled with Flutter"
          fi

      # APK 빌드
      - name: Build APK
        id: build
        run: |
          echo "📦 Starting the Flutter APK build..."
          # CI는 컴파일 검증이 목적이라 서명이 필요 없다.
          # --release는 signingConfig(keystore)를 요구하는데 CI에는 keystore가 없어
          # 'SigningConfig release is missing storeFile'로 실패한다.
          # iOS의 --no-codesign에 해당하는 옵션이 Android에는 없으므로 --debug를 쓴다.
          flutter build apk --debug
          echo "✅ APK build done"
          ls -la ./build/app/outputs/flutter-apk/ || true

      # 빌드 결과 기록
      - name: Record build result
        id: result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { elapsed: formatElapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const buildStart = parseInt('${{ steps.build_start.outputs.time }}');
            const now = Date.now();
            const elapsed = now - buildStart;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const duration = formatElapsed(minutes, seconds);

            const status = '${{ steps.build.outcome }}' === 'success' ? 'success' : 'failure';

            core.setOutput('status', status);
            core.setOutput('duration', duration);
            console.log(`📋 Android build result: ${status} (${duration})`);

  # ===================================================================
  # Job 4: iOS 빌드 (조건부, 병렬)
  # ===================================================================
  build-ios:
    # 잡 이름은 브랜치 보호의 필수 상태 체크 이름이 될 수 있어 번역하지 않는다 (#769)
    name: iOS 빌드
    if: |
      needs.prepare.outputs.analyze_only != 'true' &&
      needs.prepare.outputs.enable_ios == 'true'
    runs-on: macos-26
    needs: prepare

    outputs:
      status: ${{ steps.result.outputs.status }}
      duration: ${{ steps.result.outputs.duration }}

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Record build start time
        id: build_start
        uses: actions/github-script@v7
        with:
          script: |
            core.setOutput('time', Date.now().toString());

      - name: Checkout repository
        uses: actions/checkout@v5

      # 빈 값이면 러너에 설치된 최신 정식 Xcode, 고정한 버전이 러너에 없으면 설치 목록을 찍고 실패 (#758)
      # 레포 변수 XCODE_VERSION 으로도 고정 가능 (템플릿 업데이트에도 유지)
      - name: Select Xcode version
        working-directory: ${{ github.workspace }}
        env:
          XCODE_VERSION: ${{ env.XCODE_VERSION || vars.XCODE_VERSION }}
        run: python3 .github/scripts/select_xcode.py select --apply

      # Xcode 26부터 iOS 플랫폼 SDK가 기본 포함되지 않아 별도 설치가 필요하다.
      # 없으면 'iOS 26.0 Platform Not Installed'로 빌드가 실패한다.
      - name: Install iOS device platform
        env:
          # xcode-select만으로는 서브프로세스에 전파되지 않아 명시적으로 지정
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: |
          sudo installer -pkg "$XCODE_APP_PATH/Contents/Resources/Packages/MobileDevice.pkg" -target / || true
          sudo installer -pkg "$XCODE_APP_PATH/Contents/Resources/Packages/MobileDeviceDevelopment.pkg" -target / || true
          sudo xcodebuild -license accept || true

          # ⚠️ 설치 여부를 미리 판정해 건너뛰면 안 된다.
          #    xcodebuild -showsdks가 잡는 SDK와 기기 빌드에 필요한 '디바이스 플랫폼'은
          #    별개다. SDK가 보여도 'iOS 26.0 is not installed'로 빌드가 실패한다.
          #    따라서 조건 없이 항상 다운로드한다 (이미 있으면 즉시 반환된다).
          xcrun simctl list >/dev/null 2>&1 || true
          for i in 1 2 3; do
            xcodebuild -downloadPlatform iOS && break
            echo "⚠️ Attempt $i failed - retrying"
            sleep 15
          done
          xcodebuild -showsdks | grep iphoneos || true

      # .env 파일 생성
      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > ${{ env.ENV_FILE_PATH }}
          echo "✅ ${{ env.ENV_FILE_PATH }} file created"

      # Firebase iOS 설정: Secret 이 있을 때만 복원, 필요한데 없으면 원인을 ::error 로 (#785)
      - name: Create GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/firebase_config_files.py" restore --platform ios --app-root .

      # Flutter 설정
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Verify Flutter version
        run: |
          echo "✅ Flutter setup completed"
          flutter --version

      # Flutter 캐시
      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      # 프로젝트 의존성 설치
      - name: Install dependencies
        run: |
          flutter pub get
          echo "✅ Dependencies installed"

      # Ruby 및 CocoaPods 설정
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          # 플러그인 의존성이 없으면 Flutter가 Podfile을 만들지 않으므로 건너뛴다
          if [ -f ios/Podfile ]; then
            cd ios && pod install --repo-update || pod install
            echo "✅ CocoaPods installed"
          else
            echo "ℹ️ No ios/Podfile - the project has no CocoaPods dependencies, skipping"
          fi

      # iOS 빌드 (서명 없이)
      - name: Build iOS
        id: build
        env:
          # xcode-select만으로는 Flutter가 만드는 서브프로세스에 전파되지 않아
          # 다른 Xcode를 보게 된다. 그 결과 SDK가 설치돼 있어도
          # 'iOS 26.0 Platform Not Installed'가 발생하므로 명시적으로 지정한다.
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: |
          set -o pipefail   # tee 뒤에서도 빌드 실패를 그대로 전달
          echo "📦 Starting the Flutter iOS build..."
          flutter build ios --release --no-codesign 2>&1 | tee "$RUNNER_TEMP/flutter-ios-build.log"
          echo "✅ iOS build done"

      # SDK 심볼 누락 오류면 Xcode 가 낡았을 가능성 안내 (#758)
      - name: Diagnose iOS build failure
        if: failure() && steps.build.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/select_xcode.py hint --log "$RUNNER_TEMP/flutter-ios-build.log"

      # 빌드 결과 기록
      - name: Record build result
        id: result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { elapsed: formatElapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const buildStart = parseInt('${{ steps.build_start.outputs.time }}');
            const now = Date.now();
            const elapsed = now - buildStart;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const duration = formatElapsed(minutes, seconds);

            const status = '${{ steps.build.outcome }}' === 'success' ? 'success' : 'failure';

            core.setOutput('status', status);
            core.setOutput('duration', duration);
            console.log(`📋 iOS build result: ${status} (${duration})`);

  # ===================================================================
  # Job 5: 결과 보고
  # ===================================================================
  report:
    # 잡 이름은 브랜치 보호의 필수 상태 체크 이름이 될 수 있어 번역하지 않는다 (#769)
    name: 결과 보고
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [prepare, analyze, build-android, build-ios]

    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js flutter_ci. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Update the final result comment
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.prepare.outputs.branch_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt('${{ needs.prepare.outputs.comment_id }}');
            const startTime = parseInt('${{ needs.prepare.outputs.start_time }}');
            const branchName = process.env.BRANCH_NAME;
            const commitHash = '${{ needs.prepare.outputs.commit_hash }}';
            const analyzeOnly = '${{ needs.prepare.outputs.analyze_only }}' === 'true';
            const enableAndroid = '${{ needs.prepare.outputs.enable_android }}' === 'true';
            const enableIos = '${{ needs.prepare.outputs.enable_ios }}' === 'true';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            // 결과 수집
            const analyzeStatus = '${{ needs.analyze.outputs.status }}';
            const analyzeDuration = '${{ needs.analyze.outputs.duration }}' || '-';
            const androidStatus = '${{ needs.build-android.outputs.status }}';
            const androidDuration = '${{ needs.build-android.outputs.duration }}' || '-';
            const iosStatus = '${{ needs.build-ios.outputs.status }}';
            const iosDuration = '${{ needs.build-ios.outputs.duration }}' || '-';

            // 전체 소요 시간 계산
            const now = Date.now();
            const totalElapsed = now - startTime;
            const totalMin = Math.floor(totalElapsed / 60000);
            const totalSec = Math.floor((totalElapsed % 60000) / 1000);
            const totalDuration = elapsed(totalMin, totalSec);

            // 상태 결정
            let overallSuccess = true;
            let analyzeDisplay, androidDisplay, iosDisplay;

            // Analyze 상태
            if (analyzeStatus === 'success') {
              analyzeDisplay = t('flutter_ci.status.success');
            } else {
              analyzeDisplay = t('flutter_ci.status.failure');
              overallSuccess = false;
            }

            // Android 상태
            if (analyzeOnly) {
              androidDisplay = t('flutter_ci.status.skipped');
            } else if (!enableAndroid) {
              androidDisplay = t('flutter_ci.status.disabled');
            } else if (androidStatus === 'success') {
              androidDisplay = t('flutter_ci.status.success');
            } else {
              androidDisplay = t('flutter_ci.status.failure');
              overallSuccess = false;
            }

            // iOS 상태
            if (analyzeOnly) {
              iosDisplay = t('flutter_ci.status.skipped');
            } else if (!enableIos) {
              iosDisplay = t('flutter_ci.status.disabled');
            } else if (iosStatus === 'success') {
              iosDisplay = t('flutter_ci.status.success');
            } else {
              iosDisplay = t('flutter_ci.status.failure');
              overallSuccess = false;
            }

            // 헤더 결정
            let header;
            if (analyzeOnly) {
              header = overallSuccess
                ? t('flutter_ci.result.heading_analyze_only_success')
                : t('flutter_ci.result.heading_analyze_only_failure');
            } else {
              header = overallSuccess
                ? t('flutter_ci.result.heading_success')
                : t('flutter_ci.result.heading_failure');
            }

            // 댓글 본문 생성
            const bodyParts = [
              header,
              '',
              t('flutter_ci.table.checks_header'),
              '|----------|------|----------|',
              t('flutter_ci.table.row_analyze', { status: analyzeDisplay, duration: analyzeDuration }),
              t('flutter_ci.table.row_android', { status: androidDisplay, duration: analyzeOnly || !enableAndroid ? '-' : androidDuration }),
              t('flutter_ci.table.row_ios', { status: iosDisplay, duration: analyzeOnly || !enableIos ? '-' : iosDuration }),
              '',
              t('flutter_ci.table.info_header'),
              '|------|-----|',
              t('flutter_ci.table.branch', { branch: branchName }),
              t('flutter_ci.table.commit', { commit: commitHash }),
              t('flutter_ci.table.total', { duration: totalDuration }),
              ''
            ];

            // Analyze Only 모드 안내
            if (analyzeOnly && overallSuccess) {
              bodyParts.push(t('flutter_ci.result.analyze_only_note'));
              bodyParts.push('');
            }

            // 실패 시 추가 안내
            if (!overallSuccess) {
              bodyParts.push(
                t('flutter_ci.result.check_heading'),
                ''
              );

              if (analyzeStatus !== 'success') {
                bodyParts.push(t('flutter_ci.result.analyze_failed'));
                bodyParts.push('');
              }

              if (!analyzeOnly && enableAndroid && androidStatus !== 'success') {
                bodyParts.push(t('flutter_ci.result.android_failed'));
                bodyParts.push('');
              }

              if (!analyzeOnly && enableIos && iosStatus !== 'success') {
                bodyParts.push(t('flutter_ci.result.ios_failed'));
                bodyParts.push('');
              }
            }

            bodyParts.push(t('flutter_ci.result.workflow_log', { url: runUrl }));

            const body = bodyParts.join('\n');

            // 댓글 업데이트
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
              console.log(`✅ Result comment updated`);
            } else {
              console.log('⚠️ No comment ID, skipping the update.');
            }
