# ===================================================================
# Flutter 테스트 앱 빌드 트리거 워크플로우 (projectops)
# ===================================================================
#
# 이 워크플로우는 PR 또는 이슈에 댓글로 빌드 명령어를 작성하면
# Android와 iOS 테스트 앱 빌드를 자동으로 트리거합니다.
#
# 주요 특징:
# - PR/이슈 댓글 감지: "@projectops app build / apk build / ios build" 키워드 감지 (어순 무관: build app 도 동작)
# - repository_dispatch 이벤트로 빌드 워크플로우 트리거
# - PR/이슈 번호 + 빌드 횟수로 만든 번호를 payload 의 build_number 로 보낸다 (예: 38700, 38701...)
#   ⚠️ 옛 빌드 워크플로 호환용이다 (#643). 새 빌드 워크플로는 이 값을 읽지 않고 스스로 번호를 정한다.
#   마법사는 사용자가 수정한 워크플로를 덮어쓰지 않아 트리거만 새 것이고 빌더는 옛 수정본인
#   저장소가 생긴다. 옛 빌더는 이 값을 빌드 번호로 그대로 쓰므로 비우거나 지우면 그 저장소의
#   테스트 빌드가 깨진다. 다음 minor 에서 옛 빌더가 사라진 뒤 제거한다.
# - 브랜치명에서 이슈 번호 자동 추출 (YYYYMMDD_#이슈번호_내용 형식)
# - 테스트 버전은 version.yml에서 동적으로 읽어 사용 (빌드 번호로 운영/테스트 구분)
#
# ⚠️ 브랜치 규칙 의존:
# 이 워크플로우는 브랜치명 `YYYYMMDD_#이슈번호_제목` 형식에서 이슈 번호를 추출합니다.
# 이슈 생성 시 SUH-ISSUE-HELPER 댓글이 제안하는 브랜치명을 그대로 사용하세요.
# 형식이 다르면: 이슈 댓글 빌드에서 브랜치를 찾지 못합니다.
# 또한 이슈의 "Guide by SUH-LAB" 댓글(### 브랜치 코드블록)을 파싱하므로
# SUH-ISSUE-HELPER 워크플로우가 활성화되어 있어야 이슈 댓글 빌드가 동작합니다.
# 상세: docs/BRANCH-CONVENTION.md (템플릿 레포)
#
# 사용 방법:
# - PR에 댓글 작성: "@projectops app build" (Android + iOS 모두 빌드)
# - PR에 댓글 작성: "@projectops apk build" (Android만 빌드)
# - PR에 댓글 작성: "@projectops ios build" (iOS만 빌드)
# - 이슈에 댓글 작성: 위 명령어 동일 (Guide by SUH-LAB 댓글 필요)
# - 어순은 무관: "build app" / "build apk" / "build ios"로 적어도 동일하게 동작
# - 특정 브랜치 지정: "@projectops app build <브랜치명>" (명령어 뒤에 브랜치명을 적으면 해당 브랜치를 빌드)
#   예: "@projectops apk build 20260609_#349_feature" → 해당 브랜치로 Android 빌드
#   브랜치명을 생략하면 PR head 또는 이슈의 Guide by SUH-LAB 댓글 브랜치를 사용
#
# 트리거되는 워크플로우:
# - PROJECT-FLUTTER-ANDROID-TEST-APK.yaml (event_type: build-android-app)
# - PROJECT-FLUTTER-IOS-TEST-TESTFLIGHT.yaml (event_type: build-ios-app)
#
# ===================================================================

name: PROJECT-Flutter-Projectops-App-Build-Trigger

on:
  issue_comment:
    types: [created]

# ⚠️ repository_dispatch 는 **기본 브랜치(main)의 워크플로 정의**로 실행된다 (#595).
#    이 파일을 develop 에서 고치고 테스트 빌드를 다시 걸면 **여전히 옛 정의가 돈다** —
#    고친 게 안 먹은 것처럼 보여 원인을 엉뚱한 데서 찾게 된다.
#    반드시 기본 브랜치에 반영된 뒤에 확인할 것. (build 대상 브랜치와는 별개다)

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  trigger-builds:
    name: 빌드 워크플로우 트리거
    # @projectops app build / @projectops apk build / @projectops ios build 키워드 감지 (어순 무관)
    # ⚠️ 봇이 만든 안내 댓글에는 반응하지 않는다 (#576).
    # SUH-ISSUE-HELPER가 새 이슈에 다는 안내문에 사용법으로 `@projectops app build`가 적혀 있어,
    # 그 문구가 아래 조건을 그대로 만족했다. 이슈를 만들기만 해도 빌드가 발동하고,
    # 브랜치가 아직 없으니 "브랜치를 찾을 수 없습니다" 실패 댓글이 달렸다.
    # 사람이 직접 다는 댓글에는 이 마커가 없으므로 기존 동작에는 영향이 없다.
    #
    # ⚠️ 댓글 작성자 권한 검사 (#645).
    # 공개 저장소에서는 누구나 댓글을 달 수 있고, 이 트리거는 서명 키와 스토어 시크릿이
    # 들어가는 빌드를 깨운다. 그래서 author_association 이 허용 목록에 있어야 한다.
    # - 기본 허용: OWNER, MEMBER, COLLABORATOR
    # - 비공개 저장소는 검사하지 않는다: 댓글을 달 수 있는 사람이 이미 협업자이고,
    #   비공개 조직 멤버는 MEMBER 가 아닌 값으로 나오는 경우가 있어 기존 사용자가 막힐 수 있다.
    # - 공개 저장소에서 팀원이 막히면 저장소 변수 PROJECTOPS_TRIGGER_ASSOCIATIONS 로 덮어쓴다.
    #   예: ["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]
    #   ⚠️ 값은 반드시 올바른 JSON 배열이어야 한다. 잘못된 JSON 이면 fromJSON 이 실패해
    #   조건 평가 오류로 이 워크플로가 모든 댓글에서 실패 처리된다. 변수를 지우면 기본값으로 돌아간다.
    # - 허용되지 않은 작성자의 댓글은 job 이 실행되지 않아 조용히 무시된다.
    # ⚠️ 위 permissions.contents: write 는 줄이지 않는다. 아래에서 GITHUB_TOKEN 으로
    #   repos.createDispatchEvent 를 호출하는데 그 API 가 contents: write 를 요구한다.
    if: |
      !contains(github.event.comment.body, '<!-- SUH-ISSUE-HELPER -->') &&
      (
        github.event.repository.private == true ||
        contains(fromJSON(vars.PROJECTOPS_TRIGGER_ASSOCIATIONS || '["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      ) &&
      contains(github.event.comment.body, '@projectops') &&
      (
        (contains(github.event.comment.body, 'build') && contains(github.event.comment.body, 'app')) ||
        (contains(github.event.comment.body, 'apk') && contains(github.event.comment.body, 'build')) ||
        (contains(github.event.comment.body, 'ios') && contains(github.event.comment.body, 'build'))
      )
    runs-on: ubuntu-latest

    steps:
      - name: 댓글에 👀 리액션 추가
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const commentId = context.payload.comment.id;

            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              content: 'eyes'
            });

            console.log('👀 댓글에 확인 리액션 추가 완료');

      - name: 빌드 타입 판별
        id: build_type
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 키워드 판별은 소문자로(대소문자 무관 인식), 브랜치명 캡처는 원본 본문에서(대소문자 보존)
            const comment = context.payload.comment.body.toLowerCase();
            const rawComment = context.payload.comment.body;

            let buildAndroid = false;
            let buildIos = false;
            let buildType = '';
            let customBranch = '';
            let m;

            // 명령어 키워드 뒤의 같은 줄 토큰을 옵셔널 브랜치 인자로 캡처
            // (줄바꿈 너머 단어가 브랜치로 오인되지 않도록 [^\S\r\n]+ 로 같은 줄 공백만 허용)
            // 브랜치명은 rawComment에서 i 플래그로 다시 추출 → Feature/MyBranch 같은 대문자 브랜치 보존
            //
            // 어순은 양방향 지원: "{타입} build"(app/apk/ios build)와 "build {타입}"(build app 등) 모두 허용.
            // apk가 app으로 오인되지 않도록 app 토큰은 \b 단어경계로 정확히 끊는다(apk·application 제외).
            // apk/ios를 app보다 먼저 검사해, "apk build"가 app 분기로 새지 않게 한다.
            if (comment.match(/@projectops[^\S\r\n]+apk[^\S\r\n]+build/) || comment.match(/@projectops[^\S\r\n]+build[^\S\r\n]+apk/)) {
              // @projectops apk build [브랜치] (또는 build apk) → Android만
              buildAndroid = true;
              buildType = 'apk';
              m = rawComment.match(/@projectops[^\S\r\n]+apk[^\S\r\n]+build(?:[^\S\r\n]+(\S+))?/i)
                || rawComment.match(/@projectops[^\S\r\n]+build[^\S\r\n]+apk(?:[^\S\r\n]+(\S+))?/i);
              customBranch = (m && m[1]) || '';
            } else if (comment.match(/@projectops[^\S\r\n]+ios[^\S\r\n]+build/) || comment.match(/@projectops[^\S\r\n]+build[^\S\r\n]+ios/)) {
              // @projectops ios build [브랜치] (또는 build ios) → iOS만
              buildIos = true;
              buildType = 'ios';
              m = rawComment.match(/@projectops[^\S\r\n]+ios[^\S\r\n]+build(?:[^\S\r\n]+(\S+))?/i)
                || rawComment.match(/@projectops[^\S\r\n]+build[^\S\r\n]+ios(?:[^\S\r\n]+(\S+))?/i);
              customBranch = (m && m[1]) || '';
            } else if (comment.match(/@projectops[^\S\r\n]+app\b[^\S\r\n]+build/) || comment.match(/@projectops[^\S\r\n]+build[^\S\r\n]+app\b/)) {
              // @projectops app build [브랜치] (또는 build app) → Android + iOS 모두
              buildAndroid = true;
              buildIos = true;
              buildType = 'app';
              m = rawComment.match(/@projectops[^\S\r\n]+app\b[^\S\r\n]+build(?:[^\S\r\n]+(\S+))?/i)
                || rawComment.match(/@projectops[^\S\r\n]+build[^\S\r\n]+app\b(?:[^\S\r\n]+(\S+))?/i);
              customBranch = (m && m[1]) || '';
            }

            core.setOutput('buildAndroid', buildAndroid.toString());
            core.setOutput('buildIos', buildIos.toString());
            core.setOutput('buildType', buildType);
            core.setOutput('customBranch', customBranch);

            console.log(`📱 빌드 타입: ${buildType} (Android=${buildAndroid}, iOS=${buildIos})`);
            if (customBranch) {
              console.log(`🌿 댓글에서 지정된 브랜치: ${customBranch}`);
            }

      - name: PR/이슈 정보 확인 및 추출
        id: source_info
        uses: actions/github-script@v7
        env:
          CUSTOM_BRANCH: ${{ steps.build_type.outputs.customBranch }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const customBranch = (process.env.CUSTOM_BRANCH || '').trim();
            const issueNumber = context.payload.issue.number;
            let sourceType = '';
            let sourceNumber = '';
            let branchName = '';
            let headSha = '';
            let relatedIssueNumber = '';

            // 1. 먼저 PR인지 확인
            try {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: issueNumber
              });

              sourceType = 'PR';
              sourceNumber = pr.data.number.toString();
              branchName = customBranch || pr.data.head.ref;
              headSha = pr.data.head.sha;

              if (customBranch) {
                console.log(`🌿 댓글 지정 브랜치 우선 적용: ${customBranch} (PR head=${pr.data.head.ref})`);
              }

              console.log(`✅ PR 확인: #${sourceNumber}`);
              console.log(`🌿 브랜치명: ${branchName}`);
              console.log(`📝 커밋 해시: ${headSha}`);

              // 브랜치명에서 이슈 번호 추출 (#280 형식)
              const issueMatch = branchName.match(/#(\d+)/);
              relatedIssueNumber = issueMatch ? issueMatch[1] : '';

              if (relatedIssueNumber) {
                console.log(`📌 추출된 이슈 번호: #${relatedIssueNumber}`);
              }

            } catch (error) {
              console.log('ℹ️ PR이 아닙니다. 이슈에서 브랜치 정보를 찾습니다...');

              // 2. PR이 아니면 이슈에서 "Guide by SUH-LAB" 댓글 찾기
              sourceType = 'ISSUE';
              sourceNumber = issueNumber.toString();
              relatedIssueNumber = issueNumber.toString();

              // 댓글에서 브랜치를 직접 지정한 경우 Guide 댓글 탐색을 건너뛴다
              if (customBranch) {
                branchName = customBranch;
                console.log(`🌿 댓글 지정 브랜치 사용 (Guide 댓글 건너뜀): ${branchName}`);
                console.log(`📌 관련 이슈 번호: #${relatedIssueNumber}`);

                core.setOutput('found', 'true');
                core.setOutput('sourceType', sourceType);
                core.setOutput('sourceNumber', sourceNumber);
                core.setOutput('branchName', branchName);
                core.setOutput('headSha', headSha);
                core.setOutput('relatedIssueNumber', relatedIssueNumber);
                return;
              }

              try {
                const comments = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  per_page: 100
                });

                // "Guide by SUH-LAB" 댓글 찾기
                const guideComment = comments.data.find(c =>
                  c.body.includes('Guide by SUH-LAB')
                );

                if (!guideComment) {
                  console.log('❌ "Guide by SUH-LAB" 댓글을 찾을 수 없습니다.');
                  core.setOutput('found', 'false');
                  core.setOutput('errorMessage', '이슈에서 "Guide by SUH-LAB" 댓글을 찾을 수 없습니다. 브랜치 정보가 포함된 댓글이 필요합니다.');
                  return;
                }

                console.log('✅ "Guide by SUH-LAB" 댓글 발견');

                // 브랜치명 추출 (### 브랜치 다음 ``` 블록 내용)
                const branchMatch = guideComment.body.match(/### 브랜치\s*```\s*([\s\S]*?)\s*```/);

                if (!branchMatch) {
                  console.log('❌ 브랜치 정보를 파싱할 수 없습니다.');
                  core.setOutput('found', 'false');
                  core.setOutput('errorMessage', '"Guide by SUH-LAB" 댓글에서 브랜치 정보를 파싱할 수 없습니다. 댓글 형식을 확인해주세요.');
                  return;
                }

                branchName = branchMatch[1].trim();
                console.log(`🌿 추출된 브랜치명: ${branchName}`);
                console.log(`✅ 이슈 #${sourceNumber}에서 빌드 정보 추출 완료`);

              } catch (commentError) {
                console.log('❌ 이슈 댓글 조회 중 오류 발생:', commentError.message);
                core.setOutput('found', 'false');
                core.setOutput('errorMessage', `이슈 댓글 조회 중 오류가 발생했습니다: ${commentError.message}`);
                return;
              }
            }

            // 결과 출력
            core.setOutput('found', 'true');
            core.setOutput('sourceType', sourceType);
            core.setOutput('sourceNumber', sourceNumber);
            core.setOutput('branchName', branchName);
            core.setOutput('headSha', headSha);
            core.setOutput('relatedIssueNumber', relatedIssueNumber);

      - name: 브랜치 정보를 찾을 수 없는 경우 에러 댓글 작성
        if: steps.source_info.outputs.found != 'true'
        uses: actions/github-script@v7
        env:
          # 댓글/브랜치명에서 온 문자열이 섞일 수 있어 스크립트 소스에 넣지 않고 env 로 전달 (#646)
          ERROR_MESSAGE: ${{ steps.source_info.outputs.errorMessage }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const errorMessage = process.env.ERROR_MESSAGE;

            const body = `❌ **앱 빌드 트리거 실패**

            ${errorMessage}

            **해결 방법:**
            - PR에서 빌드하는 경우: PR 페이지에서 댓글을 작성해주세요.
            - 이슈에서 빌드하는 경우: "Guide by SUH-LAB" 댓글이 있어야 합니다.
              - 댓글에 \`### 브랜치\` 섹션과 브랜치명이 포함되어 있어야 합니다.
            - 또는 댓글에 브랜치명을 직접 지정할 수 있습니다: \`@projectops app build <브랜치명>\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

            core.setFailed(errorMessage);

      - name: 브랜치 존재 여부 확인
        id: check_branch
        if: steps.source_info.outputs.found == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.source_info.outputs.branchName }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const branchName = process.env.BRANCH_NAME;
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            console.log(`🔍 브랜치 존재 여부 확인: ${branchName}`);

            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: branchName
              });
              console.log(`✅ 브랜치 존재 확인됨: ${branchName}`);
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status === 404) {
                console.log(`❌ 브랜치를 찾을 수 없음: ${branchName}`);
                core.setOutput('exists', 'false');
                core.setOutput('errorMessage', `브랜치 \`${branchName}\`를 찾을 수 없습니다.`);
              } else {
                console.log(`❌ 브랜치 확인 중 오류: ${error.message}`);
                core.setOutput('exists', 'false');
                core.setOutput('errorMessage', `브랜치 확인 중 오류가 발생했습니다: ${error.message}`);
              }
            }

      - name: 브랜치가 존재하지 않는 경우 에러 댓글 작성
        if: steps.source_info.outputs.found == 'true' && steps.check_branch.outputs.exists == 'false'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ steps.source_info.outputs.branchName }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const branchName = process.env.BRANCH_NAME;
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const body = [
              '❌ **앱 빌드 트리거 실패 - 브랜치를 찾을 수 없습니다**',
              '',
              '| 항목 | 값 |',
              '|------|-----|',
              `| **요청된 브랜치** | \`${branchName}\` |`,
              `| **이슈/PR** | #${issueNumber} |`,
              '',
              '### 💡 확인 사항',
              '1. 브랜치가 원격 저장소에 push되었는지 확인하세요',
              '2. "Guide by SUH-LAB" 댓글의 브랜치명이 올바른지 확인하세요',
              '3. 브랜치명에 오타가 없는지 확인하세요',
              '',
              `🔗 [워크플로우 로그](${runUrl})`
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

            core.setFailed(`브랜치를 찾을 수 없습니다: ${branchName}`);

      - name: 빌드 횟수 조회 및 빌드 번호 생성
        id: build_number_calc
        if: steps.source_info.outputs.found == 'true' && steps.check_branch.outputs.exists == 'true'
        uses: actions/github-script@v7
        env:
          SOURCE_NUMBER: ${{ steps.source_info.outputs.sourceNumber }}
          SOURCE_TYPE: ${{ steps.source_info.outputs.sourceType }}
          BUILD_TYPE: ${{ steps.build_type.outputs.buildType }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sourceNumber = parseInt(process.env.SOURCE_NUMBER);
            const sourceType = process.env.SOURCE_TYPE;
            const buildType = process.env.BUILD_TYPE;

            console.log(`📊 ${sourceType} #${sourceNumber}의 빌드 횟수 조회 중...`);
            console.log(`📱 빌드 타입: ${buildType}`);

            // PR/이슈의 모든 댓글 조회
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: sourceNumber,
              per_page: 100
            });

            // 빌드 타입에 따라 해당 플랫폼의 빌드 횟수 카운트
            // 어순 무관 카운트: includes('build') && includes('{타입}') 로 "ios build"·"build ios" 모두 잡는다.
            // iOS:  ios 빌드 + app(공용) 빌드 통합 (App Store Connect는 앱 전체에서 빌드 번호 unique)
            // Android: apk 빌드 + app(공용) 빌드 통합 (Play Store도 동일)
            // App: 모든 빌드 명령어 통합 카운트
            let buildCount = 0;

            if (buildType === 'ios') {
              // iOS 빌드: ios 빌드 + app 공용 빌드 둘 다 카운트 (어순 무관)
              buildCount = comments.data.filter(c => {
                const body = c.body.toLowerCase();
                return body.includes('@projectops') && body.includes('build') && (
                  body.includes('ios') || body.includes('app')
                );
              }).length;
              console.log(`📊 iOS 빌드 카운트: ios + app(공용) 통합`);

            } else if (buildType === 'apk') {
              // Android 빌드: apk 빌드 + app 공용 빌드 둘 다 카운트 (어순 무관)
              buildCount = comments.data.filter(c => {
                const body = c.body.toLowerCase();
                return body.includes('@projectops') && body.includes('build') && (
                  body.includes('apk') || body.includes('app')
                );
              }).length;
              console.log(`📊 Android 빌드 카운트: apk + app(공용) 통합`);

            } else if (buildType === 'app') {
              // 전체 앱 빌드: 모든 빌드 명령어 카운트 (어순 무관)
              buildCount = comments.data.filter(c => {
                const body = c.body.toLowerCase();
                return body.includes('@projectops') && body.includes('build') && (
                  body.includes('ios') ||
                  body.includes('apk') ||
                  body.includes('app')
                );
              }).length;
              console.log(`📊 전체 앱 빌드 카운트: 모든 빌드 명령어 통합`);
            }

            // 빌드 번호: 소스번호 + 2자리 카운트 (38800, 38801, 38802...)
            const buildNumber = `${sourceNumber}${String(buildCount).padStart(2, '0')}`;

            console.log(`📊 ${sourceType} #${sourceNumber}: ${buildType} ${buildCount}번째 빌드`);
            console.log(`📦 생성된 빌드 번호: ${buildNumber}`);

            core.setOutput('buildCount', buildCount.toString());
            core.setOutput('buildNumber', buildNumber);

      - name: Android 빌드 워크플로우 트리거
        if: |
          steps.source_info.outputs.found == 'true' &&
          steps.check_branch.outputs.exists == 'true' &&
          steps.build_type.outputs.buildAndroid == 'true'
        uses: actions/github-script@v7
        env:
          SOURCE_TYPE: ${{ steps.source_info.outputs.sourceType }}
          SOURCE_NUMBER: ${{ steps.source_info.outputs.sourceNumber }}
          BRANCH_NAME: ${{ steps.source_info.outputs.branchName }}
          RELATED_ISSUE_NUMBER: ${{ steps.source_info.outputs.relatedIssueNumber }}
          BUILD_NUMBER: ${{ steps.build_number_calc.outputs.buildNumber }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sourceType = process.env.SOURCE_TYPE;
            const sourceNumber = process.env.SOURCE_NUMBER;
            const branchName = process.env.BRANCH_NAME;
            const relatedIssueNumber = process.env.RELATED_ISSUE_NUMBER;
            const buildNumber = process.env.BUILD_NUMBER;

            console.log(`🚀 Android 빌드 워크플로우 트리거 시작...`);
            console.log(`   ${sourceType} 번호: #${sourceNumber}`);
            console.log(`   빌드 번호: ${buildNumber}`);
            console.log(`   브랜치: ${branchName}`);
            console.log(`   관련 이슈 번호: ${relatedIssueNumber || '없음'}`);

            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'build-android-app',
              client_payload: {
                pr_number: sourceNumber,
                build_number: buildNumber,
                branch_name: branchName,
                issue_number: relatedIssueNumber || '',
                triggered_by: `${sourceType.toLowerCase()}-comment`,
                comment_id: context.payload.comment.id.toString(),
                source_type: sourceType
              }
            });

            console.log('✅ Android 빌드 워크플로우 트리거 완료');

      - name: iOS 빌드 워크플로우 트리거
        if: |
          steps.source_info.outputs.found == 'true' &&
          steps.check_branch.outputs.exists == 'true' &&
          steps.build_type.outputs.buildIos == 'true'
        uses: actions/github-script@v7
        env:
          SOURCE_TYPE: ${{ steps.source_info.outputs.sourceType }}
          SOURCE_NUMBER: ${{ steps.source_info.outputs.sourceNumber }}
          BRANCH_NAME: ${{ steps.source_info.outputs.branchName }}
          RELATED_ISSUE_NUMBER: ${{ steps.source_info.outputs.relatedIssueNumber }}
          BUILD_NUMBER: ${{ steps.build_number_calc.outputs.buildNumber }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sourceType = process.env.SOURCE_TYPE;
            const sourceNumber = process.env.SOURCE_NUMBER;
            const branchName = process.env.BRANCH_NAME;
            const relatedIssueNumber = process.env.RELATED_ISSUE_NUMBER;
            const buildNumber = process.env.BUILD_NUMBER;

            console.log(`🚀 iOS 빌드 워크플로우 트리거 시작...`);
            console.log(`   ${sourceType} 번호: #${sourceNumber}`);
            console.log(`   빌드 번호: ${buildNumber}`);
            console.log(`   브랜치: ${branchName}`);
            console.log(`   관련 이슈 번호: ${relatedIssueNumber || '없음'}`);

            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'build-ios-app',
              client_payload: {
                pr_number: sourceNumber,
                build_number: buildNumber,
                branch_name: branchName,
                issue_number: relatedIssueNumber || '',
                triggered_by: `${sourceType.toLowerCase()}-comment`,
                comment_id: context.payload.comment.id.toString(),
                source_type: sourceType
              }
            });

            console.log('✅ iOS 빌드 워크플로우 트리거 완료');

      # 트리거 완료 댓글은 제거됨 - Android/iOS 각각의 진행상황 댓글이 이 역할을 대체
      - name: 트리거 완료 로그
        if: steps.source_info.outputs.found == 'true' && steps.check_branch.outputs.exists == 'true'
        env:
          BUILD_NUMBER: ${{ steps.build_number_calc.outputs.buildNumber }}
          BRANCH_NAME: ${{ steps.source_info.outputs.branchName }}
        run: |
          echo "✅ Android 및 iOS 빌드 워크플로우 트리거 완료"
          echo "📦 빌드 번호: $BUILD_NUMBER"
          echo "🌿 브랜치: $BRANCH_NAME"
          echo "📋 각 플랫폼별 진행상황 댓글이 자동으로 생성됩니다."
