# ===================================================================
# Flutter iOS TestFlight automatic deploy workflow
# ===================================================================
#
# Builds the Flutter iOS app and deploys it to TestFlight automatically.
#
# ★ Wizard-first architecture ★
# - The web wizard generates the config files the build needs
# - The workflow uses the files generated by the wizard as is
# - Wizard path: .github/util/flutter/testflight-wizard/testflight-wizard.html
#   (open it in a browser)
#
# Build pipeline:
#   0. Prep job: if the version.yml version is already released and closed on the App Store, stop as failed before building
#      (a release never changes the version behind your back. Bump the version.yml version and run again)
#   1. flutter build ios --no-codesign (Flutter build, temporary build number)
#   2. ios_release.py archive-upload --phase build (decide number, archive, create IPA, verify bundle numbers)
#   3. ios_release.py archive-upload --phase upload (calls fastlane deploy with the wizard-generated Fastfile,
#      TestFlight/review submission depending on DEPLOY_MODE, retries with a new number when the number is rejected.
#      A rejection because the version is closed is not retried for releases and fails)
#
# The build number follows .github/scripts/build_number.py (time-based, always increasing), decided just before archiving;
# version_code in version.yml is not used (#643).
#
# ===================================================================
# 🔑 Required GitHub Secrets
# ===================================================================
#
# 🔐 Apple certificate & provisioning profile:
# APPLE_CERTIFICATE_BASE64: .p12 certificate (base64 encoded)
# APPLE_CERTIFICATE_PASSWORD: .p12 certificate password
# APPLE_PROVISIONING_PROFILE_BASE64: .mobileprovision file (base64 encoded)
# IOS_PROVISIONING_PROFILE_NAME: provisioning profile name
#
# 🔑 App Store Connect API:
# APP_STORE_CONNECT_API_KEY_ID: API Key ID (10 characters)
# APP_STORE_CONNECT_ISSUER_ID: Issuer ID (UUID format)
# APP_STORE_CONNECT_API_KEY_BASE64: AuthKey_XXXXXX.p8 file (base64 encoded)
#
# 📝 Environment (optional):
# ENV_FILE (optional): contents of the .env file
# GOOGLE_SERVICE_INFO_PLIST (optional): contents of ios/Runner/GoogleService-Info.plist (raw or base64, when using Firebase)
# SECRETS_XCCONFIG (optional): contents of ios/Flutter/Secrets.xcconfig
#
# ===================================================================
# 🛠️ Initial setup
# ===================================================================
#
# 1. Run the web wizard:
#    open .github/util/flutter/testflight-wizard/testflight-wizard.html in a browser
#    → enter the required info and download the config files
#
# 2. Set GitHub Secrets (see the list above)
#
# 3. Commit the generated files:
#    git add ios/
#    git commit -m "chore: iOS TestFlight deploy setup"
#
# 4. Push to main to start the deploy
#
# ===================================================================

name: PROJECT-iOS-TestFlight-Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "Deploy mode (store_only = up to TestFlight / store_prepare = ready to submit in App Store Connect / store_submit = submit for review automatically)"
        required: false
        default: "store_only"
        type: choice
        options:
          - store_only
          - store_prepare
          - store_submit
      # Changes the release mode for this run only. default = repo variable STORE_RELEASE_MODE → auto (#1125)
      store_release_mode:
        description: "Release after review (store_submit only): auto = goes live when approved / manual = a person releases the approved version in App Store Connect. default = repo variable STORE_RELEASE_MODE, then auto"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - auto
          - manual
      whats_new_override:
        description: "Use this App Store \"What's New\" text for this run only (empty = follow the STORE_WHATS_NEW_OVERRIDE env rule)"
        required: false
        default: ""
        type: string

permissions:
  # GITHUB_TOKEN only reads. Declaring it keeps this workflow from gaining more permissions than needed
  # even if the repo default later changes to write (#595).
  contents: read

# ============================================
# 🔧 Per-project settings (edit the values below)
# ============================================
env:
  # FLUTTER_ROOT is the official Flutter SDK path variable and would clash — hence APP_ROOT
  APP_ROOT: "."  # @wizard auto:flutter-root
  # Repo variables FLUTTER_VERSION/JAVA_VERSION take precedence over the values below (kept across template updates, #758)
  FLUTTER_VERSION: "3.38.9"
  XCODE_VERSION: ""  # empty = auto-select the runner's latest Xcode; enter something like "26.6" only to pin (#758)
  PROJECT_TYPE: "flutter"

  # ============================================
  # 📝 Env file settings
  # ============================================
  # Path for the .env file (relative to the project root)
  ENV_FILE_PATH: ".env"

  # ============================================
  # 📝 Deploy mode — how far into the App Store a main deploy goes
  # ============================================
  #   store_only    : up to the TestFlight upload (default)
  #   store_prepare : + creates the App Store Connect version, attaches the build, fills in text (a person presses submit)
  #   store_submit  : + submits for review automatically, releases automatically on approval
  # Read in order: .github/config/store-deploy.json (code, kept in git) → repo variable IOS_DEPLOY_MODE (#767).
  # The expression below is the value when the file is missing; with the file, the Resolve store deploy config step overrides it.
  # Change repo variables in Settings → Secrets and variables → Actions → Variables.
  # Why a repo variable and not code: in an emergency, automatic submission must be switchable off at once without a deploy (set store_only).
  # A value chosen in a manual run (workflow_dispatch) wins.
  # ⚠️ push (automatic deploy) goes only as far as TestFlight (#816). Even if the value below is store_prepare/store_submit, push
  #    drops it to store_only. App Store review goes up via a manual run (deploy_mode) in Actions.
  #    To do it automatically on every push, set "ios": {"auto_submit_on_push": true} in .github/config/store-deploy.json.
  DEPLOY_MODE: ${{ github.event.inputs.deploy_mode || vars.IOS_DEPLOY_MODE || 'store_only' }}

  # ============================================
  # 📝 Release mode (#1125) — who releases after approval in store_submit
  # ============================================
  #   auto   : released automatically on approval (default, current behavior — deliver automatic_release: true)
  #   manual : after approval a person presses 'Release this version' in App Store Connect (automatic_release: false)
  # Priority: manual run input store_release_mode > repo variable STORE_RELEASE_MODE > auto
  # The repo variable is shared with Android (PROJECT-FLUTTER-ANDROID-PLAYSTORE-CICD.yaml) — for opening both stores at the same moment.
  STORE_RELEASE_MODE: ${{ (github.event.inputs.store_release_mode != 'default' && github.event.inputs.store_release_mode) || vars.STORE_RELEASE_MODE || 'auto' }}

  # ============================================
  # 📝 Override for the store 'What's New' text
  # ============================================
  # The text that goes into the App Store 'What's New in This Version' field for store_prepare / store_submit.
  #   With a value → that text is used every time regardless of version.
  #   ""(empty string) → no override; the matching version entry from CHANGELOG.json is used.
  # App Review reviewers see this field as well as users. Detailed changes lead reviewers to pick those features to check,
  # so use a fixed one-line text if you do not want to reveal more than needed. Also, the App Store ships several versions at once since the last 'release',
  # so a single CHANGELOG version entry easily disagrees with the actual changes.
  # This value does not affect TestFlight 'What to Test' (for internal testers) — that always uses CHANGELOG.
  # Giving a value to the manual run input whats_new_override makes that text win for that run only.
  # Android (PROJECT-FLUTTER-ANDROID-PLAYSTORE-CICD.yaml) has a setting with the same name. Change both together.
  STORE_WHATS_NEW_OVERRIDE: ""

jobs:
  prepare-build:
    name: Set up and prepare
    runs-on: ${{ vars.IOS_RUNNER || 'macos-26' }}  # repo variable IOS_RUNNER=xcode-27 builds with the iOS 27 SDK (ITMS-90725)
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.APP_ROOT }}
    timeout-minutes: 30

    outputs:
      version: ${{ steps.current_version.outputs.version }}
      project_type: ${{ steps.current_version.outputs.project_type }}
      # The build runs in another job, so compile-time flags go through outputs (#603)
      build_flags: ${{ steps.build_profile.outputs.build_flags }}
      # Pass the SHA so later jobs check out the same commit (consistent even if main moves between prep and build)
      commit_sha: ${{ steps.commit.outputs.commit_sha }}

    steps:
      # Preflight (#666)
      # Right after a fresh install, missing deploy Secrets are normal. Left alone, the build runs to the end and then
      # fails at signing or upload with an error whose cause is hard to see, so report what is missing before the build.
      # With every Secret present this step passes unchanged and later behavior does not change.
      - name: Preflight check of deploy secrets
        working-directory: ${{ github.workspace }}   # before checkout APP_ROOT may not exist yet
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          fail=0
          for name in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 APP_STORE_CONNECT_API_KEY_BASE64 APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error title=Deploy preflight check::Secret ${name} is missing. It is required for iOS signing and upload. Create it with the guide in .github/util/flutter/testflight-wizard and add it under Settings > Secrets and variables > Actions."
              fail=1
            fi
          done
          # A typo in the release mode stops before the build — silently going auto would cause an unwanted automatic release (#1125)
          case "$STORE_RELEASE_MODE" in
            auto|manual) ;;
            *)
              echo "::error title=Deploy preflight check::STORE_RELEASE_MODE='${STORE_RELEASE_MODE}' is not valid. Use auto or manual (repo variable STORE_RELEASE_MODE or the store_release_mode input)."
              fail=1
              ;;
          esac
          [ "$fail" = "0" ] || exit 1
          echo "✅ Preflight check passed"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main

      # Pin HEAD after the pull. Later jobs check out this SHA, not the branch name.
      - name: Pin HEAD SHA
        id: commit
        run: |
          SHA=$(git rev-parse HEAD)
          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "📌 Commit to build: $SHA"

      # Empty = latest stable Xcode on the runner; if the pinned version is missing on the runner, print the installed list and fail (#758)
      # Can also be pinned with the repo variable XCODE_VERSION (kept across template updates)
      - name: Select Xcode version
        working-directory: ${{ github.workspace }}
        env:
          XCODE_VERSION: ${{ env.XCODE_VERSION || vars.XCODE_VERSION }}
        run: python3 .github/scripts/select_xcode.py select --apply

      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > ${{ env.ENV_FILE_PATH }}
          echo "✅ ${{ env.ENV_FILE_PATH }} file created"

      # Build profile — runtime (.env) and compile time (dart-define) decided in one place (#603)
      # The fixed .env goes to the build job as an artifact, flags via job output.
      # Repos without the config (.github/config/build-profile.json) are left untouched.
      - name: Apply build profile (release)
        id: build_profile
        run: |
          python3 "${{ github.workspace }}/.github/scripts/apply_build_profile.py" \
            release "${{ env.ENV_FILE_PATH }}" \
            --config "${{ github.workspace }}/.github/config/build-profile.json"

      - name: Create Secrets.xcconfig file
        env:
          SECRETS_XCCONFIG_CONTENT: ${{ secrets.SECRETS_XCCONFIG }}
        run: |
          mkdir -p ios/Flutter
          if [ -n "$SECRETS_XCCONFIG_CONTENT" ]; then
            echo "$SECRETS_XCCONFIG_CONTENT" > ios/Flutter/Secrets.xcconfig
            echo "Secrets.xcconfig created"
          else
            echo "// No secrets provided" > ios/Flutter/Secrets.xcconfig
          fi

      - name: Make the version script executable
        working-directory: ${{ github.workspace }}   # repo-root assets (.github/scripts) are relative to the repo root, not APP_ROOT
        run: |
          chmod +x ./.github/scripts/version_manager.sh
          chmod +x ./.github/scripts/changelog_manager.py

      # App Store Connect key for the precheck. A missing or broken key does not block preparation
      # (the check falls back to the version.yml version, and the build stage installs it again).
      - name: Setup App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [ -n "$API_KEY_BASE64" ] && [ -n "$API_KEY_ID" ]; then
            KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
            mkdir -p "$(dirname "$KEY_PATH")"
            if echo "$API_KEY_BASE64" | base64 --decode > "$KEY_PATH"; then
              echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
            else
              echo "::warning::Could not decode the App Store Connect key, continuing with the version.yml version"
            fi
          else
            echo "ℹ️ No App Store Connect key secret, continuing with the version.yml version"
          fi

      - name: Get the current version
        id: current_version
        working-directory: ${{ github.workspace }}   # version_manager.sh must read the repo-root version.yml
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_IDENTIFIER: ${{ secrets.IOS_BUNDLE_ID || vars.IOS_BUNDLE_ID }}
        run: |
          VERSION=$(./.github/scripts/version_manager.sh get | tail -n 1)

          echo "project_type=${{ env.PROJECT_TYPE }}" >> $GITHUB_OUTPUT

          echo "📋 Version: $VERSION"

          # If the version is already released and closed, this step fails and stops the job (avoids Apple rejecting after a 12-18 minute build).
          # A release never bumps the version for you. The build number is not decided here but just before archiving.
          python3 .github/scripts/ios_release.py precheck-version --mode release \
            --version "$VERSION" --bundle-id "$APP_IDENTIFIER"

      - name: Create release notes
        id: release_notes
        working-directory: ${{ github.workspace }}   # CHANGELOG.json, changelog_manager.py, final_release_notes.txt (upload pair) are relative to the repo root
        run: |
          VERSION="${{ steps.current_version.outputs.version }}"
          # Default text shown to stores/testers, so it follows the repo language (#769). English if the catalog cannot be read
          DEFAULT_NOTES=$(python3 .github/scripts/i18n/messages.py get test_testflight.notes.version_update --var "version=$VERSION" 2>/dev/null) \
            || DEFAULT_NOTES="v$VERSION update"

          if [ -f "CHANGELOG.json" ]; then
            python3 ./.github/scripts/changelog_manager.py generate-md
            python3 ./.github/scripts/changelog_manager.py export --version $VERSION --output final_release_notes.txt

            # Use the default text when the extraction is empty
            if [ ! -s final_release_notes.txt ]; then
              echo "$DEFAULT_NOTES" > final_release_notes.txt
            fi
          else
            echo "$DEFAULT_NOTES" > final_release_notes.txt
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: final_release_notes.txt
          retention-days: 1

      - name: Upload project files
        uses: actions/upload-artifact@v4
        with:
          name: project-files
          # Monorepo support: outputs are relative to APP_ROOT, so the path prefix is needed.
          # (Without it, it looks at the repo root, finds 0 files and passes silently with the if-no-files-found default warn)
          path: |
            ${{ env.APP_ROOT }}/${{ env.ENV_FILE_PATH }}
            ${{ env.APP_ROOT }}/ios/Flutter/Secrets.xcconfig
            ${{ env.APP_ROOT }}/pubspec.yaml
            ${{ env.APP_ROOT }}/lib/
            ${{ env.APP_ROOT }}/assets/
          retention-days: 1
          include-hidden-files: true   # .env is a hidden file and would be missed with the default false
          # Some paths such as assets/ may not exist in every project, so keep warn.
          # (It passes even with 0 files, but the path prefix fix resolves real omissions)
          if-no-files-found: warn

  # ============================================
  # iOS build and TestFlight deploy (signing through upload in one job)
  # ============================================
  # A rejected number requires redoing everything from the archive, so build and deploy share one job (#643).
  build-upload-ios:
    name: iOS build and TestFlight upload
    runs-on: ${{ vars.IOS_RUNNER || 'macos-26' }}  # repo variable IOS_RUNNER=xcode-27 builds with the iOS 27 SDK (ITMS-90725)
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.APP_ROOT }}
    timeout-minutes: 120
    needs: prepare-build

    steps:
      # Check out the commit pinned by the prep job (no pull)
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare-build.outputs.commit_sha }}
          fetch-depth: 0

      # Empty = latest stable Xcode on the runner; if the pinned version is missing on the runner, print the installed list and fail (#758)
      # Can also be pinned with the repo variable XCODE_VERSION (kept across template updates)
      - name: Select Xcode version
        working-directory: ${{ github.workspace }}
        env:
          XCODE_VERSION: ${{ env.XCODE_VERSION || vars.XCODE_VERSION }}
        run: python3 .github/scripts/select_xcode.py select --apply

      - name: Install iOS device platform
        env:
          # xcode-select alone does not propagate to subprocesses, so set it explicitly
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: |
          echo "=== iPhoneOS.platform check ==="
          ls "$DEVELOPER_DIR/Platforms/iPhoneOS.platform/" 2>/dev/null && echo "iPhoneOS.platform EXISTS" || echo "iPhoneOS.platform NOT FOUND"
          echo "=== Installing MobileDevice packages ==="
          sudo installer -pkg "$XCODE_APP_PATH/Contents/Resources/Packages/MobileDevice.pkg" -target /
          sudo installer -pkg "$XCODE_APP_PATH/Contents/Resources/Packages/MobileDeviceDevelopment.pkg" -target /
          echo "=== Accepting Xcode license ==="
          sudo xcodebuild -license accept
          echo "=== Initializing Xcode components ==="
          xcrun simctl list >/dev/null 2>&1 || true
          echo "=== Downloading iOS platform ==="
          # ⚠️ Do not decide in advance whether it is installed and skip (the SDK showsdks reports and
          #    the device platform for device builds are separate). Always download, unconditionally.
          for i in 1 2 3; do
            xcodebuild -downloadPlatform iOS && break
            echo "⚠️ Attempt $i failed - retrying"
            sleep 15
          done

      - name: Download project files
        uses: actions/download-artifact@v4
        with:
          name: project-files
          # Uploads add the APP_ROOT prefix, so extracting at the repo root restores the original location
          path: .

      - name: Ensure .env file exists
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          if [ ! -f "${{ env.ENV_FILE_PATH }}" ]; then
            printf '%s\n' "$ENV_CONTENT" > ${{ env.ENV_FILE_PATH }}
            echo "✅ ${{ env.ENV_FILE_PATH }} file created (fallback)"
          fi

      # Firebase iOS config: restore only when the Secret exists; if needed but missing, cause goes to ::error (#785)
      - name: Create GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/firebase_config_files.py" restore --platform ios --app-root .

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          # Projects without plugin dependencies get no Podfile from Flutter.
          # Then pod install is unnecessary, so skip it (it used to fail without one).
          if [ -f ios/Podfile ]; then
            cd ios && pod install
          else
            echo "ℹ️ No ios/Podfile - the project has no CocoaPods dependencies, skipping"
          fi

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          uuid=$(grep -A1 -a "UUID" profile.mobileprovision | grep string | sed -e "s/<string>//" -e "s/<\/string>//" -e "s/[[:space:]]//g")
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision

      # Per-app files the wizard creates — if missing, explain what to create and how, then stop (#785)
      - name: Verify ExportOptions.plist
        run: |
          if [ ! -f "ios/ExportOptions.plist" ]; then
            echo "::error title=Missing ios/ExportOptions.plist::${APP_ROOT}/ios/ExportOptions.plist is required to export the IPA (export method, team ID, provisioning profile). Generate it once and commit it: open .github/util/flutter/testflight-wizard/testflight-wizard.html in a browser, or run: python3 .github/util/flutter/testflight-wizard/testflight-wizard.py setup <flutter project path> <bundle id> <team id> \"<provisioning profile name>\""
            exit 1
          fi
          echo "✅ ExportOptions.plist found: ${APP_ROOT}/ios/ExportOptions.plist"

      - name: Flutter build (no codesign)
        id: flutter_build
        env:
          # xcode-select alone does not propagate to subprocesses, so set it explicitly
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: |
          set -o pipefail   # pass build failures through even after tee
          BUILD_FLAGS="${{ needs.prepare-build.outputs.build_flags }}"
          echo "📦 Flutter build... ${BUILD_FLAGS:+(flags: $BUILD_FLAGS)}"
          # Build number 1 is a placeholder. archive-upload decides the final number at archive time and injects it.
          # shellcheck disable=SC2086  # flags must split on spaces
          flutter build ios --release --no-codesign \
            --build-name="${{ needs.prepare-build.outputs.version }}" \
            --build-number=1 \
            $BUILD_FLAGS 2>&1 | tee "$RUNNER_TEMP/flutter-ios-build.log"

      # On a missing SDK symbol error, suggest that Xcode may be stale (#758)
      - name: Diagnose iOS build failure
        if: failure() && steps.flutter_build.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/select_xcode.py hint --log "$RUNNER_TEMP/flutter-ios-build.log"

      # App Store Connect key used to look up recent build numbers when deciding the number and for upload (fastlane uses the same file)
      - name: Setup App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Verify Fastfile exists
        run: |
          if [ ! -f "ios/fastlane/Fastfile" ]; then
            echo "::error title=Missing ios/fastlane/Fastfile::${APP_ROOT}/ios/fastlane/Fastfile is required to upload to TestFlight (lane: deploy). Generate it once and commit it: open .github/util/flutter/testflight-wizard/testflight-wizard.html in a browser, or run: python3 .github/util/flutter/testflight-wizard/testflight-wizard.py setup <flutter project path> <bundle id> <team id> \"<provisioning profile name>\""
            exit 1
          fi
          # Old wizard Fastfiles only have upload_testflight and fail only at the upload stage (warning only, in case a hand-made Fastfile is a false positive)
          if ! grep -qE '^[[:space:]]*lane[[:space:](]*:deploy([[:space:],)]|$)' ios/fastlane/Fastfile; then
            echo "::warning title=Fastfile has no deploy lane::${APP_ROOT}/ios/fastlane/Fastfile does not define 'lane :deploy', which this workflow calls. If upload fails with \"Could not find lane 'ios deploy'\", regenerate the Fastfile with the TestFlight wizard (.github/util/flutter/testflight-wizard/)."
          fi
          # With manual, an old Fastfile that ignores the value releases automatically on approval (irreversible) — stop instead of warning (#1125)
          if [ "$STORE_RELEASE_MODE" = "manual" ] && ! grep -q "STORE_RELEASE_MODE" ios/fastlane/Fastfile; then
            echo "::error title=Fastfile does not read STORE_RELEASE_MODE::Release mode is manual, but ${APP_ROOT}/ios/fastlane/Fastfile never reads STORE_RELEASE_MODE, so an approved version would still be released automatically. Regenerate the Fastfile with the TestFlight wizard (.github/util/flutter/testflight-wizard/), or set the release mode back to auto."
            exit 1
          fi
          echo "✅ Fastfile found: ${APP_ROOT}/ios/fastlane/Fastfile"

      - name: Install Fastlane
        working-directory: ${{ env.APP_ROOT }}/ios
        run: |
          # multi_json: works around an upstream bug where a google-apis transitive dependency is undeclared (missing in gemspec → Gem::LoadError)
          printf 'source "https://rubygems.org"\ngem "fastlane"\ngem "multi_json"\n' > Gemfile
          bundle install
          echo "✅ Fastlane installed (Bundler)"

      # Archive, IPA export and bundle number verification. The build number is decided here (build_number.py rule).
      # APP_ROOT is a path relative to the repo root, so the script runs at the repo root.
      - name: Build IPA
        id: build_phase
        working-directory: ${{ github.workspace }}
        env:
          VERSION: ${{ needs.prepare-build.outputs.version }}
          # A release with a closed version fails without retrying
          MODE: release
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          APP_IDENTIFIER: ${{ secrets.IOS_BUNDLE_ID || vars.IOS_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # xcode-select alone does not propagate to subprocesses, so set it explicitly
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/ios_release.py" archive-upload --phase build

      # Read deploy settings from code (.github/config/store-deploy.json) (#767).
      # Priority: manual run input > config file > repo variable IOS_DEPLOY_MODE > store_only.
      - name: Resolve store deploy config
        working-directory: ${{ github.workspace }}
        env:
          INPUT_DEPLOY_MODE: ${{ github.event.inputs.deploy_mode }}
        run: python3 .github/scripts/store_deploy_config.py resolve --platform ios

      # Record this run's release mode in the summary — so the run list alone shows what kind of release it was (#1125)
      - name: Summarize store release mode
        working-directory: ${{ github.workspace }}
        run: |
          case "$DEPLOY_MODE" in
            store_submit|appstore_submit)
              if [ "$STORE_RELEASE_MODE" = "manual" ]; then
                effect="Submits for review with manual release: after approval, a person releases the version in App Store Connect."
              else
                effect="Submits for review and releases automatically when approved."
              fi ;;
            *) effect="No effect on this run: deploy mode is ${DEPLOY_MODE}, and only store_submit uses the release mode." ;;
          esac
          {
            echo "### Store release mode: \`${STORE_RELEASE_MODE}\`"
            echo ""
            echo "- Deploy mode: \`${DEPLOY_MODE}\`"
            echo "- ${effect}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "🚦 Store release mode: ${STORE_RELEASE_MODE} / deploy mode: ${DEPLOY_MODE} — ${effect}"

      # TestFlight upload (deploy lane of the wizard-generated Fastfile; up to review submission depending on DEPLOY_MODE).
      # If the number is rejected, ios_release.py redoes everything from the archive with a new number (up to 5 times).
      - name: Upload to TestFlight (+ App Store Submit if store_submit)
        id: upload_phase
        working-directory: ${{ github.workspace }}
        env:
          APP_IDENTIFIER_VALUE: ${{ secrets.IOS_BUNDLE_ID || vars.IOS_BUNDLE_ID }}
          VERSION: ${{ needs.prepare-build.outputs.version }}
          MODE: release
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # Retries archive again, so xcodebuild needs it too
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_ROOT: ${{ env.APP_ROOT }}   # the script below references it as a shell variable
          STORE_WHATS_NEW_OVERRIDE: ${{ env.STORE_WHATS_NEW_OVERRIDE }}
          INPUT_WHATS_NEW_OVERRIDE: ${{ github.event.inputs.whats_new_override }}
        run: |
          # Prepare release notes (final_release_notes.txt and the truncate script are relative to the repo root — working-directory is APP_ROOT, so use absolute paths)
          if [ -f "$GITHUB_WORKSPACE/final_release_notes.txt" ]; then
            # Truncate to the App Store Connect "What to Test" limit (4000 bytes; 3800 bytes with margin)
            bash "$GITHUB_WORKSPACE/.github/scripts/truncate_release_notes.sh" "$GITHUB_WORKSPACE/final_release_notes.txt" 3800 byte
            RELEASE_NOTES=$(cat "$GITHUB_WORKSPACE/final_release_notes.txt")
            echo "📝 Release Notes:"
            echo "$RELEASE_NOTES"
          else
            # Default text shown in the store, so it uses the repo language (#769)
            RELEASE_NOTES=$(cd "$GITHUB_WORKSPACE" && python3 .github/scripts/i18n/messages.py get test_testflight.notes.version_update --var "version=${{ needs.prepare-build.outputs.version }}" 2>/dev/null) \
              || RELEASE_NOTES="v${{ needs.prepare-build.outputs.version }} update"
            echo "📝 Default release notes: $RELEASE_NOTES"
          fi

          # The script fills IPA_PATH, BUILD_NUMBER and APP_VERSION with final values.
          export APP_STORE_CONNECT_API_KEY_ID="$APP_STORE_CONNECT_API_KEY_ID"
          export APP_STORE_CONNECT_ISSUER_ID="$APP_STORE_CONNECT_ISSUER_ID"
          export API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          export RELEASE_NOTES="$RELEASE_NOTES"
          export APP_IDENTIFIER="$APP_IDENTIFIER_VALUE"
          # Values set by the config file (GITHUB_ENV) arrive as shell env vars. No ${{ env }} expressions — do not rely on when they update.
          export DEPLOY_MODE="${DEPLOY_MODE}"
          # A manual run input wins for that run only. Values come via step env to prevent shell injection.
          if [ -n "$(printf '%s' "$INPUT_WHATS_NEW_OVERRIDE" | tr -d '[:space:]')" ]; then
            export STORE_WHATS_NEW_OVERRIDE="$INPUT_WHATS_NEW_OVERRIDE"
          fi

          # Per-language What's New (#829) — the folder is created only when version.yml has store_locales.
          # Without the folder, STORE_NOTES_DIR is empty and the Fastfile keeps the old behavior (one text for every language).
          # Languages without a translation get the default-language text (App Store Connect rejects review submission if any language is empty).
          export STORE_NOTES_DIR=""
          NOTES_OUT="$RUNNER_TEMP/store-notes-ios"
          rm -rf "$NOTES_OUT"
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/store-default-notes.txt"
          python3 "$GITHUB_WORKSPACE/.github/scripts/store_notes.py" write --platform ios \
            --workspace "$GITHUB_WORKSPACE" --version "${{ needs.prepare-build.outputs.version }}" \
            --out-dir "$NOTES_OUT" --default-file "$RUNNER_TEMP/store-default-notes.txt" \
            --override "${STORE_WHATS_NEW_OVERRIDE:-}" || echo "⚠️ Could not prepare per-language What's New, continuing with the default text"
          if [ -n "$(ls -A "$NOTES_OUT" 2>/dev/null)" ]; then
            export STORE_NOTES_DIR="$NOTES_OUT"
          fi

          echo "🔧 DEPLOY_MODE: $DEPLOY_MODE / STORE_RELEASE_MODE: $STORE_RELEASE_MODE / APP_IDENTIFIER: $APP_IDENTIFIER"
          # The script below calls `bundle exec fastlane deploy` from ios/ (called again on every retry).
          python3 "$GITHUB_WORKSPACE/.github/scripts/ios_release.py" archive-upload --phase upload

      - name: Notify TestFlight Upload Success
        if: success()
        run: |
          echo "✅ TestFlight upload succeeded!"
          echo "📱 Version: ${{ steps.upload_phase.outputs.version || needs.prepare-build.outputs.version }}"
          echo "🔢 Build number: ${{ steps.upload_phase.outputs.build_number || steps.build_phase.outputs.build_number }}"
          echo "📝 Commit: ${{ needs.prepare-build.outputs.commit_sha }}"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ TestFlight upload failed!"
          echo "Check the log."

      # This workflow posts no comments, so the failure reason goes into the run summary and an error annotation.
      # The reason comes via env (inlining it in script source lets quotes in the value break the shell).
      - name: Summarize the failure reason
        if: failure()
        env:
          REASON: ${{ steps.upload_phase.outputs.reason_line || steps.build_phase.outputs.reason_line }}
        run: |
          if [ -n "$REASON" ]; then
            {
              echo "## iOS release failed"
              echo ""
              echo "$REASON"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$REASON"
          fi
