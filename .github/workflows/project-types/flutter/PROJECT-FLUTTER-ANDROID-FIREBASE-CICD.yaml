# ===================================================================
# Flutter Android Firebase App Distribution deploy
# ===================================================================
#
# On a push to main, builds the Android APK and
# deploys it to Firebase App Distribution automatically.
#
# Goes through the same version checks as the PlayStore CICD,
# then uploads to Firebase App Distribution instead of the Play Store.
#
# ===================================================================
# 🔑 Required GitHub Secrets
# ===================================================================
#
# 🔐 Release Keystore:
# RELEASE_KEYSTORE_BASE64: signing keystore (base64)
# RELEASE_KEYSTORE_PASSWORD: keystore password
# RELEASE_KEY_ALIAS: key alias
# RELEASE_KEY_PASSWORD: key password
#
# 🔥 Firebase:
# FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: Firebase service account JSON (base64)
#
# 📝 Environment (optional):
# ENV_FILE or ENV: contents of the .env file (either; ENV_FILE first)
# GOOGLE_SERVICES_JSON: Firebase google-services.json
#
# 🪄 Quick setup: open .github/util/flutter/firebase-wizard/firebase-wizard.html
#    in a browser to set up Firebase distribution with the 5-step wizard.
#
# ===================================================================
#
# 🔧 Per-project settings (edit in the env section)
# ===================================================================
# APP_ARTIFACT_NAME       : project name
# FLUTTER_VERSION    : Flutter SDK version
# JAVA_VERSION       : Java version
# FIREBASE_APP_ID    : Firebase app ID (see Firebase Console)
# FIREBASE_TESTER_GROUP : Firebase tester group name
# ===================================================================
#
# 🛠️ Prerequisites:
# 1. Firebase Console → App Distribution → create a tester group
# 2. Create a Firebase service account JSON (base64 encoded)
# 3. Register FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 in GitHub Secrets
# 4. Edit FIREBASE_APP_ID and FIREBASE_TESTER_GROUP in the env section
#
# ===================================================================

name: PROJECT-FLUTTER-ANDROID-FIREBASE-APPDIST-CICD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  # GITHUB_TOKEN only reads. Declaring it keeps this workflow from gaining more permissions than needed
  # even if the repo default later changes to write (#595).
  contents: read

env:
  # ============================================
  # 🔧 Per-project settings (edit the values below)
  # ============================================
  # Project name
  APP_ARTIFACT_NAME: "__APP_ARTIFACT_NAME__"  # @wizard ask:@repo
  # Flutter/Java versions
  # Repo variables FLUTTER_VERSION/JAVA_VERSION take precedence over the values below (kept across template updates, #758)
  FLUTTER_VERSION: "3.38.9"
  JAVA_VERSION: "__JAVA_VERSION__"  # @wizard ask:17
  PROJECT_TYPE: "flutter"
  # Firebase App Distribution settings
  FIREBASE_APP_ID: "your-firebase-app-id"
  FIREBASE_TESTER_GROUP: "testers"

  # Flutter root path (relative to repo root). "." for a single repo, "app" etc. for a monorepo.
  # At integration, the integrator's flutter-root resolver substitutes it once with project_paths.flutter.
  # FLUTTER_ROOT is the official Flutter SDK path variable and would clash — hence APP_ROOT
  APP_ROOT: "."  # @wizard auto:flutter-root
jobs:
  prepare-build:
    name: Prepare environment
    runs-on: ubuntu-latest
    # Run only when the CHANGELOG workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}

    outputs:
      version: ${{ steps.current_version.outputs.version }}
      version_code: ${{ steps.current_version.outputs.version_code }}
      project_type: ${{ steps.current_version.outputs.project_type }}

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      # Preflight (#666)
      # Right after a fresh install, missing deploy Secrets are normal. Left alone, the build runs to the end and then
      # fails at signing or upload with an error whose cause is hard to see, so report what is missing before the build.
      # With every Secret present this step passes unchanged and later behavior does not change.
      - name: Preflight check of deploy secrets
        working-directory: ${{ github.workspace }}   # before checkout APP_ROOT may not exist yet
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          fail=0
          for name in FIREBASE_SERVICE_ACCOUNT_JSON_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error title=Deploy preflight::Secret ${name} is missing. It is the Firebase service account JSON (base64). Create it with the .github/util/flutter/firebase-wizard guide and add it under Settings > Secrets and variables > Actions."
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "✅ Preflight check passed"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main

      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > .env
          echo ".env file created"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Install dependencies
        run: flutter pub get

      # Make the version script executable
      - name: Make version scripts executable
        working-directory: ${{ github.workspace }}   # repo-root assets (.github/scripts, version.yml) are relative to the repo root, not APP_ROOT
        run: |
          chmod +x ./.github/scripts/version_manager.sh
          chmod +x ./.github/scripts/changelog_manager.py

      # Get the current version info with version_manager.sh
      - name: Read current version
        working-directory: ${{ github.workspace }}   # repo-root assets (.github/scripts, version.yml) are relative to the repo root, not APP_ROOT
        id: current_version
        run: |
          # Get VERSION (x.y.z format)
          VERSION=$(./.github/scripts/version_manager.sh get | tail -n 1)

          # Get VERSION_CODE (a simple increasing number managed in version.yml)
          VERSION_CODE=$(./.github/scripts/version_manager.sh get-code)

          # Print the result
          echo "✅ VERSION: $VERSION"
          echo "✅ VERSION_CODE: $VERSION_CODE"
          echo "🔧 Project type: ${{ env.PROJECT_TYPE }}"

          # Set GitHub outputs
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "project_type=${{ env.PROJECT_TYPE }}" >> $GITHUB_OUTPUT

          # Also set as env vars (used by scripts)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TODAY=$(date '+%Y-%m-%d')" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "PROJECT_TYPE=${{ env.PROJECT_TYPE }}" >> $GITHUB_ENV

      # Extract release notes from CHANGELOG.json - uses changelog_manager.py
      - name: Generate release notes
        working-directory: ${{ github.workspace }}   # repo-root assets (.github/scripts, version.yml) are relative to the repo root, not APP_ROOT
        id: release_notes
        run: |
          VERSION="${{ steps.current_version.outputs.version }}"

          if [ -f "CHANGELOG.json" ]; then
            echo "📄 Extracting v$VERSION release notes from CHANGELOG.json..."
            # Generate CHANGELOG.md
            python3 ./.github/scripts/changelog_manager.py generate-md

            # Extract release notes with changelog_manager.py export
            python3 ./.github/scripts/changelog_manager.py export --version $VERSION --output final_release_notes.txt

            if [ -s final_release_notes.txt ]; then
              echo "✅ Release notes extracted"
              echo "📋 Extracted release notes:"
              echo "----------------------------------------"
              cat final_release_notes.txt
              echo "----------------------------------------"
              echo "RELEASE_NOTES_FOUND=true" >> $GITHUB_ENV
            else
              echo "❌ Could not extract release notes"
              echo "RELEASE_NOTES_FOUND=false" >> $GITHUB_ENV
              # Default text testers see, so it follows the repo language (#769)
              NOTE=$(python3 ./.github/scripts/i18n/messages.py get flutter_ci.release_notes.fallback --var version="$VERSION" 2>/dev/null) || NOTE="v$VERSION update"
              echo "$NOTE" > final_release_notes.txt
            fi
          else
            echo "⚠️ No CHANGELOG.json file. Using the default release notes."
            echo "RELEASE_NOTES_FOUND=false" >> $GITHUB_ENV
            NOTE=$(python3 ./.github/scripts/i18n/messages.py get flutter_ci.release_notes.fallback --var version="$VERSION" 2>/dev/null) || NOTE="v$VERSION update"
            echo "$NOTE" > final_release_notes.txt
          fi

      # Upload release notes as an artifact
      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: final_release_notes.txt
          retention-days: 1

      # Upload project files as an artifact
      # .env is not in the artifact for security; each job recreates it from secrets
      - name: Upload project files
        uses: actions/upload-artifact@v4
        with:
          name: project-files
          # Artifact actions ignore defaults and always use the repo root, so the APP_ROOT prefix is needed
          path: |
            ${{ env.APP_ROOT }}/pubspec.yaml
            ${{ env.APP_ROOT }}/lib/
            ${{ env.APP_ROOT }}/assets/
          retention-days: 1

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: prepare-build

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main

      # Download project files
      - name: Download project files
        uses: actions/download-artifact@v4
        with:
          name: project-files
          path: .

      # Create the .env file (from secrets, not the artifact, for security)
      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > .env
          echo "✅ .env file created (size: $(wc -c < .env) bytes)"

      # Build profile — runtime (.env) and compile time (dart-define) decided in one place (#603)
      #
      # A release build must never ship with dev keys on. This step cleans .env and
      # confirms both layers are off — if either leaks, it stops the build.
      #
      # Repos without the config (.github/config/build-profile.json) are left untouched.
      - name: Apply build profile (release)
        id: build_profile
        run: |
          python3 "${{ github.workspace }}/.github/scripts/apply_build_profile.py" \
            release .env \
            --config "${{ github.workspace }}/.github/config/build-profile.json"

      # Set up the release keystore
      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore/key.jks
          echo "✅ Release keystore created"
          ls -la android/app/keystore/

      # Create key.properties (release signing info)
      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storeFile=app/keystore/key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          # File holding signing passwords — never print its contents (#785)
          echo "✅ key.properties created"

      # Written only when the Secret exists — otherwise the committed file stays, and if needed but missing the cause goes to ::error (#785)
      - name: Create Google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/firebase_config_files.py" restore --platform android --app-root .

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ vars.JAVA_VERSION || env.JAVA_VERSION }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Edit Android build.gradle.kts (release signing config)
      - name: Configure Android build for release
        run: |
          # Add the release signing config to build.gradle.kts if missing
          if ! grep -q "signingConfigs" android/app/build.gradle.kts; then
            echo "⚠️ build.gradle.kts needs a signing config"
            # Assumes signing is already configured (must be set up by hand beforehand)
          fi
          echo "✅ Android build settings checked"

      # pubspec.yaml keeps the x.y.z format
      # The --build-name and --build-number flags of flutter build override pubspec.yaml

      # Flutter build apk (creates the APK)
      # Firebase App Distribution requires a Google Play link for AAB uploads, so APK is used
      - name: Build Android APK
        run: |
          VERSION_NAME="${{ needs.prepare-build.outputs.version }}"
          VERSION_CODE="${{ needs.prepare-build.outputs.version_code }}"

          echo "=========================================="
          echo "🚀 Starting the APK build"
          echo "=========================================="
          echo "🎯 Build version: $VERSION_NAME"
          echo "🎯 Build code: $VERSION_CODE"

          # Validate input
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "❌ VERSION_NAME or VERSION_CODE is empty!"
            exit 1
          fi

          # Print Flutter environment info
          echo "🔍 Flutter environment:"
          flutter --version
          flutter doctor -v | head -20

          # Clean the build directory
          echo "🧹 Cleaning previous build outputs..."
          rm -rf build/app/outputs/flutter-apk/
          mkdir -p build/app/outputs/flutter-apk/

          # Flutter clean and pub get
          echo "🔄 Running flutter clean and reinstalling dependencies..."
          flutter clean
          flutter pub get

          # Add version info to local.properties (works around Flutter flags being ignored)
          echo "🔧 Writing version info to local.properties..."

          # Remove version info from an existing local.properties
          if [ -f "android/local.properties" ]; then
            grep -v "flutter.versionName\|flutter.versionCode" android/local.properties > android/local.properties.tmp || true
            mv android/local.properties.tmp android/local.properties
          else
            touch android/local.properties
          fi

          # Add version info
          echo "flutter.versionName=$VERSION_NAME" >> android/local.properties
          echo "flutter.versionCode=$VERSION_CODE" >> android/local.properties

          echo "✅ local.properties updated"
          echo "📋 Version info: VERSION_NAME=$VERSION_NAME, VERSION_CODE=$VERSION_CODE"

          # Gradle performance settings
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4"
          export JAVA_OPTS="-Xmx4g"
          echo "✅ Gradle optimization settings applied"

          # Pass version info to flutter build
          # The --build-name and --build-number flags override version in pubspec.yaml
          # pubspec.yaml keeps x.y.z; VERSION_CODE is managed automatically in version.yml
          echo "🔨 Running flutter build..."
          echo "📋 Command: flutter build apk --release --build-name=$VERSION_NAME --build-number=$VERSION_CODE --verbose"
          echo "⏱️ Build start time: $(date '+%Y-%m-%d %H:%M:%S')"

          BUILD_FLAGS="${{ steps.build_profile.outputs.build_flags }}"
          # shellcheck disable=SC2086  # flags must split on spaces
          flutter build apk \
            --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --verbose $BUILD_FLAGS

          BUILD_EXIT_CODE=$?

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ flutter build failed! Exit code: $BUILD_EXIT_CODE"
            echo "🔍 Build directory state:"
            find build/ -name "*.aab" -o -name "*.apk" 2>/dev/null || echo "No AAB/APK file found"
            exit 1
          fi

          echo "✅ flutter build succeeded!"

          # Check the build output
          echo "🔍 Checking build output:"
          ls -lah build/app/outputs/flutter-apk/

          # Check that the APK file exists
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "❌ The APK file was not created!"
            echo "🔍 Full build directory contents:"
            find build/ -type f -name "*.aab" -o -name "*.apk" 2>/dev/null || echo "No AAB/APK file found"
            echo "🔍 outputs directory tree:"
            find build/app/outputs/ -type f 2>/dev/null || echo "No outputs directory"
            exit 1
          fi

          echo "✅ APK file created"
          echo "📱 APK file size: $(du -h "$APK_FILE" | cut -f1)"
          echo "📋 APK file info: $(ls -lah "$APK_FILE")"

          # APK manifest verification uses aapt2 from the Android SDK
          # (unlike bundletool for AAB, no separate download — already on the runner)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT2" ]; then
            echo "❌ aapt2 not found"; exit 1
          fi
          echo "✅ aapt2 found: $AAPT2"

          # Check the actual version info inside the APK
          # Verify the VERSION_CODE passed via Flutter CLI flags was applied
          echo "=========================================="
          echo "🔍 Verifying the version inside the APK file"
          echo "=========================================="

          # Extract version info from AndroidManifest.xml
          echo "📋 Extracting the actual version from the APK..."
          echo "📋 Command to run: $AAPT2 dump badging '$APK_FILE'"

          MANIFEST_OUTPUT=$("$AAPT2" dump badging "$APK_FILE" 2>&1)
          MANIFEST_EXIT_CODE=$?

          echo "📋 aapt2 output (exit code: $MANIFEST_EXIT_CODE):"
          echo "$MANIFEST_OUTPUT"

          if [ $MANIFEST_EXIT_CODE -eq 0 ]; then
            echo "✅ Manifest extracted"

            # Extract the actual version code and version name
            ACTUAL_VERSION_CODE=$(echo "$MANIFEST_OUTPUT" | grep -o "versionCode='[0-9]*'" | grep -o '[0-9]*' | head -1)
            ACTUAL_VERSION_NAME=$(echo "$MANIFEST_OUTPUT" | grep -o "versionName='[^']*'" | sed "s/versionName='//;s/'//" | head -1)

            echo "🎯 Version comparison:"
            echo "  Expected VERSION_CODE: '$VERSION_CODE'"
            echo "  Actual VERSION_CODE: '$ACTUAL_VERSION_CODE'"
            echo "  Expected VERSION_NAME: '$VERSION_NAME'"
            echo "  Actual VERSION_NAME: '$ACTUAL_VERSION_NAME'"

            # Verify VERSION_CODE - a simple increasing number managed in version.yml
            if [ -z "$ACTUAL_VERSION_CODE" ]; then
              echo "❌ Fatal: could not extract VERSION_CODE from the APK!"
              echo "🔍 Full manifest:"
              echo "$MANIFEST_OUTPUT"
              exit 1
            elif [ "$ACTUAL_VERSION_CODE" != "$VERSION_CODE" ]; then
              echo "❌ Fatal: the APK VERSION_CODE does not match the expected value!"
              echo "   Google Play rejects this with a 'version code already used' error."
              echo ""
              echo "🔍 Debug info:"
              echo "   VERSION_CODE in version.yml: $VERSION_CODE"
              echo "   VERSION_CODE inside the APK: $ACTUAL_VERSION_CODE"
              echo ""
              echo "   Flags passed to flutter build:"
              echo "   --build-name='$VERSION_NAME'"
              echo "   --build-number='$VERSION_CODE'"
              echo ""
              echo "   Full manifest:"
              echo "$MANIFEST_OUTPUT" | grep -E "versionCode|versionName|package"
              exit 1
            else
              echo "✅ VERSION_CODE verified: $ACTUAL_VERSION_CODE"
            fi

            # Check the version name too (warning only)
            if [ -z "$ACTUAL_VERSION_NAME" ]; then
              echo "⚠️ Warning: could not extract VERSION_NAME from the APK"
            elif [ "$ACTUAL_VERSION_NAME" != "$VERSION_NAME" ]; then
              echo "⚠️ Warning: VERSION_NAME does not match the expected value (not fatal)"
              echo "   Expected: '$VERSION_NAME', actual: '$ACTUAL_VERSION_NAME'"
            else
              echo "✅ VERSION_NAME verified: $ACTUAL_VERSION_NAME"
            fi

          else
            echo "❌ aapt2 could not extract the manifest"
            echo "🔄 Trying a fallback check..."

            # Try checking directly with unzip
            echo "📋 Trying direct extraction with unzip..."
            UNZIP_OUTPUT=$(unzip -p "$APK_FILE" base/manifest/AndroidManifest.xml 2>/dev/null | strings | grep -E "versionCode|versionName")

            if [ -n "$UNZIP_OUTPUT" ]; then
              echo "✅ Version extracted with unzip:"
              echo "$UNZIP_OUTPUT"
            else
              echo "❌ Direct extraction with unzip also failed"
              echo "⚠️ Skipping APK verification and continuing."
            fi
          fi

          echo "=========================================="
          echo "✅ APK built and verified"
          echo "🎯 Final APK: $APK_FILE"
          echo "📱 File size: $(du -h "$APK_FILE" | cut -f1)"
          echo "=========================================="

      # Upload the APK as an artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          # Artifact actions ignore defaults and always use the repo root, so the APP_ROOT prefix is needed
          path: ${{ env.APP_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  deploy-firebase:
    name: Deploy to Firebase App Distribution
    runs-on: ubuntu-latest
    needs: [prepare-build, build-android]

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # Download the APK
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          # ⚠️ When the upload path is a single file, upload-artifact flattens the path.
          #    Extracting at the repo root would not restore the original location, so name the original directory.
          path: ${{ env.APP_ROOT }}/build/app/outputs/flutter-apk/

      # Download release notes
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      # Set up the Firebase service account
      - name: Setup Firebase credentials file
        env:
          SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          echo "$SERVICE_ACCOUNT_BASE64" | base64 --decode > firebase-service-account.json
          echo "✅ Firebase service account JSON file created"

      # Firebase App Distribution release notes length limit (safety net)
      - name: Truncate release notes
        working-directory: ${{ github.workspace }}   # repo-root assets (.github/scripts, version.yml) are relative to the repo root, not APP_ROOT
        run: |
          if [ -f "final_release_notes.txt" ]; then
            # Firebase App Distribution release notes length limit safety net (4000 characters)
            bash ./.github/scripts/truncate_release_notes.sh final_release_notes.txt 4000 char
          fi

      # Upload the APK to Firebase App Distribution
      - name: Upload to Firebase App Distribution
        id: firebase_upload
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          # ⚠️ uses: actions ignore the job's defaults.working-directory
          #    and always resolve paths from the repo root.
          #    Credentials and the APK are created in APP_ROOT, so the prefix is needed.
          serviceCredentialsFile: ${{ env.APP_ROOT }}/firebase-service-account.json
          groups: ${{ env.FIREBASE_TESTER_GROUP }}
          file: ${{ env.APP_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          releaseNotesFile: final_release_notes.txt

      # Delete the Firebase auth file (security)
      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f firebase-service-account.json

      # Success notice
      - name: Notify Firebase Upload Success
        if: success()
        run: |
          echo "✅ Deployed to Firebase App Distribution!"
          echo "Version: ${{ needs.prepare-build.outputs.version }} (${{ needs.prepare-build.outputs.version_code }})"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "📱 How testers get it:"
          echo "1. Open the Firebase App Tester app"
          echo "2. Select the app"
          echo "3. Download the latest build"

      - name: Notify on Failure
        if: failure()
