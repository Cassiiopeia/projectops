# ===================================================================
# Flutter Android Firebase App Distribution 배포
# ===================================================================
#
# main 브랜치 푸시 시 Android APK를 빌드하고
# Firebase App Distribution에 자동 배포합니다.
#
# PlayStore CICD와 동일한 버전 검증 과정을 거친 후
# Play Store 대신 Firebase App Distribution에 업로드합니다.
#
# ===================================================================
# 🔑 필수 GitHub Secrets
# ===================================================================
#
# 🔐 Release Keystore:
# RELEASE_KEYSTORE_BASE64: 서명용 keystore (base64)
# RELEASE_KEYSTORE_PASSWORD: keystore 비밀번호
# RELEASE_KEY_ALIAS: key alias
# RELEASE_KEY_PASSWORD: key 비밀번호
#
# 🔥 Firebase:
# FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: Firebase 서비스 계정 JSON (base64)
#
# 📝 환경 설정 (선택):
# ENV_FILE 또는 ENV: .env 파일 내용 (둘 중 하나, ENV_FILE 우선)
# GOOGLE_SERVICES_JSON: Firebase google-services.json
#
# 🪄 빠른 설정: .github/util/flutter/firebase-wizard/firebase-wizard.html을
#    브라우저에서 열어 5단계 마법사로 Firebase 배포를 자동 설정할 수 있습니다.
#
# ===================================================================
#
# 🔧 프로젝트별 설정 (env 섹션에서 수정)
# ===================================================================
# APP_ARTIFACT_NAME       : 프로젝트 이름
# FLUTTER_VERSION    : Flutter SDK 버전
# JAVA_VERSION       : Java 버전
# FIREBASE_APP_ID    : Firebase 앱 ID (Firebase Console에서 확인)
# FIREBASE_TESTER_GROUP : Firebase 테스터 그룹명
# ===================================================================
#
# 🛠️ 사전 설정:
# 1. Firebase Console → App Distribution → 테스터 그룹 생성
# 2. Firebase 서비스 계정 JSON 생성 (base64 인코딩)
# 3. GitHub Secrets에 FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 등록
# 4. env 섹션의 FIREBASE_APP_ID, FIREBASE_TESTER_GROUP 수정
#
# ===================================================================

name: PROJECT-FLUTTER-ANDROID-FIREBASE-APPDIST-CICD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  # GITHUB_TOKEN 으로는 읽기만 한다. 명시해 두면 레포 기본값이 나중에 write 로 바뀌어도
  # 이 워크플로우가 필요 이상의 권한을 갖지 않는다 (#595).
  contents: read

env:
  # ============================================
  # 🔧 프로젝트별 설정 (아래 값들을 수정하세요)
  # ============================================
  # 프로젝트 이름
  APP_ARTIFACT_NAME: "__APP_ARTIFACT_NAME__"  # @wizard ask:@repo
  # Flutter/Java 버전
  # 레포 변수 FLUTTER_VERSION·JAVA_VERSION 이 있으면 아래 값보다 먼저 쓴다 (템플릿 업데이트에도 유지, #758)
  FLUTTER_VERSION: "3.38.9"
  JAVA_VERSION: "__JAVA_VERSION__"  # @wizard ask:17
  PROJECT_TYPE: "flutter"
  # Firebase App Distribution 설정
  FIREBASE_APP_ID: "your-firebase-app-id"
  FIREBASE_TESTER_GROUP: "testers"

  # Flutter 루트 경로(레포 루트 기준). 단일레포면 ".", 모노레포면 "app" 등.
  # 통합 시점에 integrator의 flutter-root resolver가 project_paths.flutter 값으로 1회 치환.
  # FLUTTER_ROOT는 Flutter SDK 경로용 공식 변수라 충돌 — APP_ROOT로 분리
  APP_ROOT: "."  # @wizard auto:flutter-root
jobs:
  prepare-build:
    name: Prepare environment
    runs-on: ubuntu-latest
    # CHANGELOG 워크플로우가 성공한 경우에만 실행
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}

    outputs:
      version: ${{ steps.current_version.outputs.version }}
      version_code: ${{ steps.current_version.outputs.version_code }}
      project_type: ${{ steps.current_version.outputs.project_type }}

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      # 사전 점검 (#666)
      # 신규 설치 직후에는 배포용 Secret 이 없는 것이 정상이다. 그대로 두면 빌드를 끝까지 돌린 뒤
      # 서명, 업로드 단계에서 원인을 짚기 어려운 에러로 실패하므로, 빌드 전에 무엇이 없는지 알린다.
      # Secret 이 모두 있으면 이 step 은 그대로 통과하며 이후 동작은 달라지지 않는다.
      - name: Preflight check of deploy secrets
        working-directory: ${{ github.workspace }}   # 체크아웃 전이라 APP_ROOT 가 아직 없을 수 있다
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          fail=0
          for name in FIREBASE_SERVICE_ACCOUNT_JSON_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error title=Deploy preflight::Secret ${name} is missing. It is the Firebase service account JSON (base64). Create it with the .github/util/flutter/firebase-wizard guide and add it under Settings > Secrets and variables > Actions."
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "✅ Preflight check passed"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main

      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > .env
          echo ".env file created"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Install dependencies
        run: flutter pub get

      # 버전 관리 스크립트 권한 설정
      - name: Make version scripts executable
        working-directory: ${{ github.workspace }}   # 레포 루트 자산(.github/scripts·version.yml)은 APP_ROOT가 아닌 레포 루트 기준
        run: |
          chmod +x ./.github/scripts/version_manager.sh
          chmod +x ./.github/scripts/changelog_manager.py

      # version_manager.sh를 사용하여 현재 버전 정보 가져오기
      - name: Read current version
        working-directory: ${{ github.workspace }}   # 레포 루트 자산(.github/scripts·version.yml)은 APP_ROOT가 아닌 레포 루트 기준
        id: current_version
        run: |
          # VERSION 가져오기 (x.y.z 형식)
          VERSION=$(./.github/scripts/version_manager.sh get | tail -n 1)

          # VERSION_CODE 가져오기 (version.yml에서 관리되는 단순 증가 번호)
          VERSION_CODE=$(./.github/scripts/version_manager.sh get-code)

          # 결과 출력
          echo "✅ VERSION: $VERSION"
          echo "✅ VERSION_CODE: $VERSION_CODE"
          echo "🔧 Project type: ${{ env.PROJECT_TYPE }}"

          # GitHub outputs 설정
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "project_type=${{ env.PROJECT_TYPE }}" >> $GITHUB_OUTPUT

          # 환경변수로도 설정 (스크립트에서 사용)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TODAY=$(date '+%Y-%m-%d')" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "PROJECT_TYPE=${{ env.PROJECT_TYPE }}" >> $GITHUB_ENV

      # CHANGELOG.json에서 릴리즈 노트 추출 - changelog_manager.py 사용
      - name: Generate release notes
        working-directory: ${{ github.workspace }}   # 레포 루트 자산(.github/scripts·version.yml)은 APP_ROOT가 아닌 레포 루트 기준
        id: release_notes
        run: |
          VERSION="${{ steps.current_version.outputs.version }}"

          if [ -f "CHANGELOG.json" ]; then
            echo "📄 Extracting v$VERSION release notes from CHANGELOG.json..."
            # CHANGELOG.md 생성
            python3 ./.github/scripts/changelog_manager.py generate-md

            # changelog_manager.py export로 릴리즈 노트 추출
            python3 ./.github/scripts/changelog_manager.py export --version $VERSION --output final_release_notes.txt

            if [ -s final_release_notes.txt ]; then
              echo "✅ Release notes extracted"
              echo "📋 Extracted release notes:"
              echo "----------------------------------------"
              cat final_release_notes.txt
              echo "----------------------------------------"
              echo "RELEASE_NOTES_FOUND=true" >> $GITHUB_ENV
            else
              echo "❌ Could not extract release notes"
              echo "RELEASE_NOTES_FOUND=false" >> $GITHUB_ENV
              # 테스터가 보는 기본 문구라 레포 언어를 따른다 (#769)
              NOTE=$(python3 ./.github/scripts/i18n/messages.py get flutter_ci.release_notes.fallback --var version="$VERSION" 2>/dev/null) || NOTE="v$VERSION update"
              echo "$NOTE" > final_release_notes.txt
            fi
          else
            echo "⚠️ No CHANGELOG.json file. Using the default release notes."
            echo "RELEASE_NOTES_FOUND=false" >> $GITHUB_ENV
            NOTE=$(python3 ./.github/scripts/i18n/messages.py get flutter_ci.release_notes.fallback --var version="$VERSION" 2>/dev/null) || NOTE="v$VERSION update"
            echo "$NOTE" > final_release_notes.txt
          fi

      # 릴리즈 노트를 아티팩트로 업로드
      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: final_release_notes.txt
          retention-days: 1

      # 프로젝트 파일들을 아티팩트로 업로드
      # .env는 보안상 아티팩트에 포함하지 않고, 각 job에서 secrets로 재생성
      - name: Upload project files
        uses: actions/upload-artifact@v4
        with:
          name: project-files
          # 아티팩트 액션은 defaults를 따르지 않고 항상 레포 루트 기준이라 APP_ROOT prefix가 필요
          path: |
            ${{ env.APP_ROOT }}/pubspec.yaml
            ${{ env.APP_ROOT }}/lib/
            ${{ env.APP_ROOT }}/assets/
          retention-days: 1

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: prepare-build

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main

      # 프로젝트 파일들 다운로드
      - name: Download project files
        uses: actions/download-artifact@v4
        with:
          name: project-files
          path: .

      # .env 파일 생성 (보안을 위해 아티팩트가 아닌 시크릿에서 생성)
      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > .env
          echo "✅ .env file created (size: $(wc -c < .env) bytes)"

      # 빌드 프로파일 — 런타임(.env)과 컴파일타임(dart-define)을 한 곳에서 정한다 (#603)
      #
      # 배포 빌드는 개발 키가 켜진 채로 나가면 안 된다. 이 스텝이 .env 를 정리하고
      # 양쪽 층이 모두 꺼진 것을 확인한다 — 한쪽이라도 뚫려 있으면 빌드를 세운다.
      #
      # 설정(.github/config/build-profile.json)이 없는 저장소에서는 아무 일도 하지 않는다.
      - name: Apply build profile (release)
        id: build_profile
        run: |
          python3 "${{ github.workspace }}/.github/scripts/apply_build_profile.py" \
            release .env \
            --config "${{ github.workspace }}/.github/config/build-profile.json"

      # Release Keystore 설정
      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore/key.jks
          echo "✅ Release keystore created"
          ls -la android/app/keystore/

      # key.properties 생성 (Release 서명 정보)
      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storeFile=app/keystore/key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          # 서명 비밀번호가 담긴 파일 — 내용 출력 금지 (#785)
          echo "✅ key.properties created"

      # Secret 이 있을 때만 쓴다 — 없으면 커밋된 파일을 그대로 두고, 필요한데 없으면 원인을 ::error 로 (#785)
      - name: Create Google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/firebase_config_files.py" restore --platform android --app-root .

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ vars.JAVA_VERSION || env.JAVA_VERSION }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Android build.gradle.kts 수정 (release 서명 설정)
      - name: Configure Android build for release
        run: |
          # build.gradle.kts에 release 서명 설정이 없으면 추가
          if ! grep -q "signingConfigs" android/app/build.gradle.kts; then
            echo "⚠️ build.gradle.kts needs a signing config"
            # 서명 설정은 이미 되어있다고 가정 (수동으로 미리 설정해야 함)
          fi
          echo "✅ Android build settings checked"

      # pubspec.yaml은 x.y.z 형식 그대로 유지
      # Flutter build 명령어의 --build-name, --build-number 플래그가 pubspec.yaml을 오버라이드함

      # Flutter build apk (APK 생성)
      # Firebase App Distribution은 AAB 업로드 시 Google Play 연동을 요구하므로 APK를 쓴다
      - name: Build Android APK
        run: |
          VERSION_NAME="${{ needs.prepare-build.outputs.version }}"
          VERSION_CODE="${{ needs.prepare-build.outputs.version_code }}"

          echo "=========================================="
          echo "🚀 Starting the APK build"
          echo "=========================================="
          echo "🎯 Build version: $VERSION_NAME"
          echo "🎯 Build code: $VERSION_CODE"

          # 입력 검증
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "❌ VERSION_NAME or VERSION_CODE is empty!"
            exit 1
          fi

          # Flutter 환경 정보 출력
          echo "🔍 Flutter environment:"
          flutter --version
          flutter doctor -v | head -20

          # 빌드 디렉토리 정리
          echo "🧹 Cleaning previous build outputs..."
          rm -rf build/app/outputs/flutter-apk/
          mkdir -p build/app/outputs/flutter-apk/

          # Flutter clean 및 pub get
          echo "🔄 Running flutter clean and reinstalling dependencies..."
          flutter clean
          flutter pub get

          # local.properties에 버전 정보 추가 (Flutter 플래그가 무시되는 문제 해결)
          echo "🔧 Writing version info to local.properties..."

          # 기존 local.properties가 있으면 버전 정보 제거
          if [ -f "android/local.properties" ]; then
            grep -v "flutter.versionName\|flutter.versionCode" android/local.properties > android/local.properties.tmp || true
            mv android/local.properties.tmp android/local.properties
          else
            touch android/local.properties
          fi

          # 버전 정보 추가
          echo "flutter.versionName=$VERSION_NAME" >> android/local.properties
          echo "flutter.versionCode=$VERSION_CODE" >> android/local.properties

          echo "✅ local.properties updated"
          echo "📋 Version info: VERSION_NAME=$VERSION_NAME, VERSION_CODE=$VERSION_CODE"

          # Gradle 성능 최적화 설정
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4"
          export JAVA_OPTS="-Xmx4g"
          echo "✅ Gradle optimization settings applied"

          # Flutter build 명령어에 버전 정보 전달
          # --build-name과 --build-number 플래그가 pubspec.yaml의 version을 오버라이드함
          # pubspec.yaml은 x.y.z 형식 유지, VERSION_CODE는 version.yml에서 자동 관리
          echo "🔨 Running flutter build..."
          echo "📋 Command: flutter build apk --release --build-name=$VERSION_NAME --build-number=$VERSION_CODE --verbose"
          echo "⏱️ Build start time: $(date '+%Y-%m-%d %H:%M:%S')"

          BUILD_FLAGS="${{ steps.build_profile.outputs.build_flags }}"
          # shellcheck disable=SC2086  # 플래그는 공백으로 갈라져야 한다
          flutter build apk \
            --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --verbose $BUILD_FLAGS

          BUILD_EXIT_CODE=$?

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ flutter build failed! Exit code: $BUILD_EXIT_CODE"
            echo "🔍 Build directory state:"
            find build/ -name "*.aab" -o -name "*.apk" 2>/dev/null || echo "No AAB/APK file found"
            exit 1
          fi

          echo "✅ flutter build succeeded!"

          # 빌드 결과 확인
          echo "🔍 Checking build output:"
          ls -lah build/app/outputs/flutter-apk/

          # APK 파일 존재 확인
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "❌ The APK file was not created!"
            echo "🔍 Full build directory contents:"
            find build/ -type f -name "*.aab" -o -name "*.apk" 2>/dev/null || echo "No AAB/APK file found"
            echo "🔍 outputs directory tree:"
            find build/app/outputs/ -type f 2>/dev/null || echo "No outputs directory"
            exit 1
          fi

          echo "✅ APK file created"
          echo "📱 APK file size: $(du -h "$APK_FILE" | cut -f1)"
          echo "📋 APK file info: $(ls -lah "$APK_FILE")"

          # APK 매니페스트 검증에는 Android SDK의 aapt2를 사용한다
          # (AAB용 bundletool과 달리 별도 다운로드 불필요 — 러너에 이미 설치됨)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT2" ]; then
            echo "❌ aapt2 not found"; exit 1
          fi
          echo "✅ aapt2 found: $AAPT2"

          # APK 파일 내부의 실제 버전 정보 확인
          # Flutter CLI 플래그로 전달한 VERSION_CODE가 제대로 적용되었는지 검증
          echo "=========================================="
          echo "🔍 Verifying the version inside the APK file"
          echo "=========================================="

          # AndroidManifest.xml에서 버전 정보 추출
          echo "📋 Extracting the actual version from the APK..."
          echo "📋 Command to run: $AAPT2 dump badging '$APK_FILE'"

          MANIFEST_OUTPUT=$("$AAPT2" dump badging "$APK_FILE" 2>&1)
          MANIFEST_EXIT_CODE=$?

          echo "📋 aapt2 output (exit code: $MANIFEST_EXIT_CODE):"
          echo "$MANIFEST_OUTPUT"

          if [ $MANIFEST_EXIT_CODE -eq 0 ]; then
            echo "✅ Manifest extracted"

            # 실제 버전 코드와 버전 이름 추출
            ACTUAL_VERSION_CODE=$(echo "$MANIFEST_OUTPUT" | grep -o "versionCode='[0-9]*'" | grep -o '[0-9]*' | head -1)
            ACTUAL_VERSION_NAME=$(echo "$MANIFEST_OUTPUT" | grep -o "versionName='[^']*'" | sed "s/versionName='//;s/'//" | head -1)

            echo "🎯 Version comparison:"
            echo "  Expected VERSION_CODE: '$VERSION_CODE'"
            echo "  Actual VERSION_CODE: '$ACTUAL_VERSION_CODE'"
            echo "  Expected VERSION_NAME: '$VERSION_NAME'"
            echo "  Actual VERSION_NAME: '$ACTUAL_VERSION_NAME'"

            # VERSION_CODE 검증 - version.yml에서 관리되는 단순 증가 번호
            if [ -z "$ACTUAL_VERSION_CODE" ]; then
              echo "❌ Fatal: could not extract VERSION_CODE from the APK!"
              echo "🔍 Full manifest:"
              echo "$MANIFEST_OUTPUT"
              exit 1
            elif [ "$ACTUAL_VERSION_CODE" != "$VERSION_CODE" ]; then
              echo "❌ Fatal: the APK VERSION_CODE does not match the expected value!"
              echo "   Google Play rejects this with a 'version code already used' error."
              echo ""
              echo "🔍 Debug info:"
              echo "   VERSION_CODE in version.yml: $VERSION_CODE"
              echo "   VERSION_CODE inside the APK: $ACTUAL_VERSION_CODE"
              echo ""
              echo "   Flags passed to flutter build:"
              echo "   --build-name='$VERSION_NAME'"
              echo "   --build-number='$VERSION_CODE'"
              echo ""
              echo "   Full manifest:"
              echo "$MANIFEST_OUTPUT" | grep -E "versionCode|versionName|package"
              exit 1
            else
              echo "✅ VERSION_CODE verified: $ACTUAL_VERSION_CODE"
            fi

            # 버전 이름도 확인 (경고만)
            if [ -z "$ACTUAL_VERSION_NAME" ]; then
              echo "⚠️ Warning: could not extract VERSION_NAME from the APK"
            elif [ "$ACTUAL_VERSION_NAME" != "$VERSION_NAME" ]; then
              echo "⚠️ Warning: VERSION_NAME does not match the expected value (not fatal)"
              echo "   Expected: '$VERSION_NAME', actual: '$ACTUAL_VERSION_NAME'"
            else
              echo "✅ VERSION_NAME verified: $ACTUAL_VERSION_NAME"
            fi

          else
            echo "❌ aapt2 could not extract the manifest"
            echo "🔄 Trying a fallback check..."

            # unzip으로 직접 확인 시도
            echo "📋 Trying direct extraction with unzip..."
            UNZIP_OUTPUT=$(unzip -p "$APK_FILE" base/manifest/AndroidManifest.xml 2>/dev/null | strings | grep -E "versionCode|versionName")

            if [ -n "$UNZIP_OUTPUT" ]; then
              echo "✅ Version extracted with unzip:"
              echo "$UNZIP_OUTPUT"
            else
              echo "❌ Direct extraction with unzip also failed"
              echo "⚠️ Skipping APK verification and continuing."
            fi
          fi

          echo "=========================================="
          echo "✅ APK built and verified"
          echo "🎯 Final APK: $APK_FILE"
          echo "📱 File size: $(du -h "$APK_FILE" | cut -f1)"
          echo "=========================================="

      # APK 파일을 아티팩트로 업로드
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          # 아티팩트 액션은 defaults를 따르지 않고 항상 레포 루트 기준이라 APP_ROOT prefix가 필요
          path: ${{ env.APP_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  deploy-firebase:
    name: Deploy to Firebase App Distribution
    runs-on: ubuntu-latest
    needs: [prepare-build, build-android]

    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # APK 파일 다운로드
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          # ⚠️ 업로드 path가 '단일 파일'이면 upload-artifact가 경로를 평탄화한다.
          #    레포 루트에 풀면 원위치가 복원되지 않으므로 원래 디렉터리를 명시한다.
          path: ${{ env.APP_ROOT }}/build/app/outputs/flutter-apk/

      # 릴리즈 노트 다운로드
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      # Firebase 서비스 계정 설정
      - name: Setup Firebase credentials file
        env:
          SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          echo "$SERVICE_ACCOUNT_BASE64" | base64 --decode > firebase-service-account.json
          echo "✅ Firebase service account JSON file created"

      # Firebase App Distribution release notes 길이 제한 (안전망)
      - name: Truncate release notes
        working-directory: ${{ github.workspace }}   # 레포 루트 자산(.github/scripts·version.yml)은 APP_ROOT가 아닌 레포 루트 기준
        run: |
          if [ -f "final_release_notes.txt" ]; then
            # Firebase App Distribution release notes 길이 제한 안전망 (4000자)
            bash ./.github/scripts/truncate_release_notes.sh final_release_notes.txt 4000 char
          fi

      # Firebase App Distribution에 APK 업로드
      - name: Upload to Firebase App Distribution
        id: firebase_upload
        uses: wzieba/Firebase-Distribution-Github-Action@bd494989dd4bec0343f78adee87fe66e48279ad6 # v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          # ⚠️ uses: 액션은 job의 defaults.working-directory를 따르지 않고
          #    항상 레포 루트 기준으로 경로를 해석한다.
          #    자격증명·APK는 APP_ROOT에서 생성되므로 prefix가 필요하다.
          serviceCredentialsFile: ${{ env.APP_ROOT }}/firebase-service-account.json
          groups: ${{ env.FIREBASE_TESTER_GROUP }}
          file: ${{ env.APP_ROOT }}/build/app/outputs/flutter-apk/app-release.apk
          releaseNotesFile: final_release_notes.txt

      # Firebase 인증 파일 삭제 (보안)
      - name: Cleanup Firebase credentials
        if: always()
        run: rm -f firebase-service-account.json

      # 성공 알림
      - name: Notify Firebase Upload Success
        if: success()
        run: |
          echo "✅ Deployed to Firebase App Distribution!"
          echo "Version: ${{ needs.prepare-build.outputs.version }} (${{ needs.prepare-build.outputs.version_code }})"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "📱 How testers get it:"
          echo "1. Open the Firebase App Tester app"
          echo "2. Select the app"
          echo "3. Download the latest build"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Firebase App Distribution deploy failed!"
          echo "Check the logs."
