# ===================================================================
# Flutter iOS 테스트용 TestFlight 배포 워크플로우
# ===================================================================
#
# 이 워크플로우는 기능 브랜치에서 수동으로 실행하여
# 테스트용 iOS 빌드를 TestFlight에 배포합니다.
#
# ★ 마법사 우선 아키텍처 ★
# - 빌드에 필요한 설정 파일들은 웹 마법사가 생성합니다
# - 워크플로우는 마법사가 생성한 파일들을 그대로 사용합니다
# - 마법사 경로: .github/util/flutter/testflight-wizard/testflight-wizard.html
#
# 주요 특징:
# - workflow_dispatch로 수동 실행 또는 repository_dispatch로 트리거
# - 버전은 version.yml에서 읽되, App Store에서 출시되어 닫힌 버전이면 다음 패치 버전으로 빌드
#   (닫힌 버전으로 올리면 12~18분 빌드 뒤 Apple이 거부하므로 빌드 전에 미리 피한다)
# - 빌드 번호는 .github/scripts/build_number.py 규칙(시각 기반, 항상 증가)으로 아카이브 직전에 결정
# - 번호나 버전이 거부되면 ios_release.py가 원인을 분류해 최대 5회 자동 재시도 (#643)
# - 브랜치명에서 이슈 번호 자동 추출 (YYYYMMDD_#이슈번호_내용 형식)
# - GitHub API로 이슈 정보 가져와서 릴리즈 노트에 포함
#
# ⚠️ 브랜치 규칙 의존:
# 이 워크플로우는 브랜치명 `YYYYMMDD_#이슈번호_제목` 형식에서 이슈 번호를 추출합니다.
# 이슈 생성 시 SUH-ISSUE-HELPER 댓글이 제안하는 브랜치명을 그대로 사용하세요.
# 형식이 다르면: 이슈 연동 빌드 정보가 누락됩니다 (빌드 자체는 진행).
# 상세: docs/BRANCH-CONVENTION.md (템플릿 레포)
#
# 빌드 파이프라인:
#   1. flutter build ios --no-codesign (Flutter 빌드, 임시 빌드 번호)
#   2. ios_release.py archive-upload --phase build (번호 결정, 아카이브, IPA 생성, 번들 번호 검증)
#   3. ios_release.py archive-upload --phase upload (fastlane deploy 호출, 마법사 생성 Fastfile 사용,
#      DEPLOY_MODE=store_only 고정, 번호나 버전 거부 시 재시도)
#
# ===================================================================
# 🔑 필수 GitHub Secrets
# ===================================================================
#
# 🔐 Apple 인증서 & 프로비저닝 프로파일:
# APPLE_CERTIFICATE_BASE64: .p12 인증서 (base64 인코딩)
# APPLE_CERTIFICATE_PASSWORD: .p12 인증서 비밀번호
# APPLE_PROVISIONING_PROFILE_BASE64: .mobileprovision 파일 (base64 인코딩)
# IOS_PROVISIONING_PROFILE_NAME: 프로비저닝 프로파일 이름
#
# 🔐 App Store Connect API:
# APP_STORE_CONNECT_API_KEY_ID: API Key ID (10자리)
# APP_STORE_CONNECT_ISSUER_ID: Issuer ID (UUID 형식)
# APP_STORE_CONNECT_API_KEY_BASE64: AuthKey_XXXXXX.p8 파일 (base64 인코딩)
#
# 📝 환경 설정 (선택):
# ENV_FILE (선택): .env 파일 내용
# GOOGLE_SERVICE_INFO_PLIST (선택): ios/Runner/GoogleService-Info.plist 내용 (원문 또는 base64, Firebase 사용 시)
# SECRETS_XCCONFIG (선택): ios/Flutter/Secrets.xcconfig 내용
#
# ===================================================================

name: PROJECT-Flutter-iOS-Test-TestFlight

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-ios-app]

# ⚠️ repository_dispatch 는 **기본 브랜치(main)의 워크플로 정의**로 실행된다 (#595).
#    이 파일을 develop 에서 고치고 테스트 빌드를 다시 걸면 **여전히 옛 정의가 돈다** —
#    고친 게 안 먹은 것처럼 보여 원인을 엉뚱한 데서 찾게 된다.
#    반드시 기본 브랜치에 반영된 뒤에 확인할 것. (build 대상 브랜치와는 별개다)

permissions:
  # 이슈·PR에 진행 상황 댓글을 단다. 명시하지 않으면 레포 기본값을 따르는데,
  # GitHub 신규 레포 기본값은 read 라서 **댓글 다는 순간 실패**한다 (#595).
  #   RequestError [HttpError]: Resource not accessible by integration
  contents: read
  issues: write
  pull-requests: write

# ===================================================================
# 🔧 프로젝트별 설정 (아래 값들을 수정하세요)
# ===================================================================
env:
  # 레포 변수 FLUTTER_VERSION·JAVA_VERSION 이 있으면 아래 값보다 먼저 쓴다 (템플릿 업데이트에도 유지, #758)
  FLUTTER_VERSION: "3.38.9"
  XCODE_VERSION: ""  # 빈 값 = 러너 최신 Xcode 자동 선택, 고정할 때만 "26.6" 처럼 입력 (#758)
  PROJECT_TYPE: "flutter"
  ENV_FILE_PATH: ".env"
  # Flutter 루트 경로(레포 루트 기준). 단일레포면 ".", 모노레포면 "app" 등.
  # 통합 시점에 integrator의 flutter-root resolver가 project_paths.flutter 값으로 1회 치환.
  # FLUTTER_ROOT는 Flutter SDK 경로용 공식 변수라 충돌 — APP_ROOT로 분리
  APP_ROOT: "."  # @wizard auto:flutter-root

jobs:
  # ===================================================================
  # 즉시 댓글 생성 (ubuntu-latest로 빠르게 실행)
  # ===================================================================
  notify-start:
    name: Progress notification
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch'

    outputs:
      comment_id: ${{ steps.progress.outputs.comment_id }}
      start_time: ${{ steps.progress.outputs.start_time }}
      branch_valid: ${{ steps.verify_branch.outputs.valid }}

    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js test_testflight. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Check that the branch exists
        id: verify_branch
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: elapsedText } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const branchName = process.env.BRANCH_NAME;
            const prNumber = '${{ github.event.client_payload.pr_number }}';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            console.log(`🔍 Checking that the branch exists: ${branchName}`);

            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: branchName
              });
              console.log(`✅ Branch exists: ${branchName}`);
              core.setOutput('valid', 'true');
            } catch (error) {
              if (error.status === 404) {
                console.log(`❌ Branch not found: ${branchName}`);

                const body = [
                  t('test_testflight.branch_missing.title'),
                  '',
                  t('test_testflight.table.item_header'),
                  '|------|-----|',
                  t('test_testflight.row.requested_branch', { branch: branchName }),
                  t('test_testflight.row.issue_pr', { number: prNumber }),
                  '',
                  t('test_testflight.branch_missing.check_heading'),
                  t('test_testflight.branch_missing.check_pushed'),
                  // 서명은 계약 문자열이라 카탈로그에 넣지 않고 값으로 넘긴다
                  t('test_testflight.branch_missing.check_guide', { signature: 'Guide by ProjectOps' }),
                  t('test_testflight.branch_missing.check_typo'),
                  '',
                  t('test_testflight.link.workflow_log', { url: runUrl })
                ].join('\n');

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: parseInt(prNumber),
                  body: body
                });

                core.setFailed(`Branch not found: ${branchName}`);
              } else {
                core.setFailed(`Error while checking the branch: ${error.message}`);
              }
            }

      - name: Create progress comment
        id: progress
        if: github.event.client_payload.pr_number != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: elapsedText } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const prNumber = parseInt('${{ github.event.client_payload.pr_number }}');
            const branchName = process.env.BRANCH_NAME;
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const startTime = Date.now();

            const body = [
              t('test_testflight.heading.in_progress'),
              '',
              t('test_testflight.table.stage_header'),
              '|------|------|----------|',
              t('test_testflight.row.prepare', { status: t('test_testflight.status.in_progress'), elapsed: '-' }),
              t('test_testflight.row.build', { status: t('test_testflight.status.waiting'), elapsed: '-' }),
              t('test_testflight.row.deploy', { status: t('test_testflight.status.waiting'), elapsed: '-' }),
              '',
              t('test_testflight.table.item_header'),
              '|------|-----|',
              t('test_testflight.row.build_number_pending'),
              t('test_testflight.row.branch', { branch: branchName }),
              '',
              t('test_testflight.link.live_log', { url: runUrl }),
              '',
              '---',
              t('test_testflight.footer.auto_update')
            ].join('\n');

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

            console.log(`✅ Progress comment created: #${comment.id}`);
            core.setOutput('comment_id', comment.id);
            core.setOutput('start_time', startTime);

      # 취소 처리 (#648): 댓글을 만든 job 이 아직 실행 중일 때 취소된 경우. cancelled() 스텝은 그 job 이 취소돼야 돈다.
      - name: Update progress - cancelled (notify job)
        if: cancelled() && github.event_name == 'repository_dispatch' && steps.progress.outputs.comment_id != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          COMMENT_ID: ${{ steps.progress.outputs.comment_id }}
          START_TIME: ${{ steps.progress.outputs.start_time }}
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: elapsedText } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt(process.env.COMMENT_ID, 10);
            const startTime = parseInt(process.env.START_TIME, 10);
            const branchName = process.env.BRANCH_NAME;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}`;

            // 성공/실패 스텝이 이미 최종 상태를 쓴 댓글은 덮어쓰지 않는다
            const { data: current } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId
            });
            if (!(current.body || '').startsWith(t('test_testflight.heading.in_progress'))) {
              console.log('The comment already shows a final state, skipping the cancel update');
              return;
            }

            let duration = '-';
            if (!Number.isNaN(startTime)) {
              const elapsed = Date.now() - startTime;
              const minutes = Math.floor(elapsed / 60000);
              const seconds = Math.floor((elapsed % 60000) / 1000);
              duration = elapsedText(minutes, seconds);
            }

            const body = [
              t('test_testflight.heading.cancelled'),
              '',
              t('test_testflight.table.stage_header'),
              '|------|------|----------|',
              t('test_testflight.row.prepare', { status: t('test_testflight.status.cancelled'), elapsed: '-' }),
              t('test_testflight.row.build', { status: t('test_testflight.status.cancelled'), elapsed: '-' }),
              t('test_testflight.row.deploy', { status: t('test_testflight.status.cancelled'), elapsed: '-' }),
              '',
              t('test_testflight.cancelled.branch', { branch: branchName }),
              t('test_testflight.cancelled.total', { duration }),
              '',
              t('test_testflight.cancelled.message'),
              '',
              t('test_testflight.link.run_log_check', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log('🚫 Progress updated: cancelled');

  # ===================================================================
  # 테스트 빌드 준비 (macOS 환경 설정)
  # ===================================================================
  prepare-test-build:
    name: Prepare test build
    runs-on: macos-26
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.APP_ROOT }}
    timeout-minutes: 30
    needs: notify-start
    if: |
      always() &&
      (needs.notify-start.result == 'skipped' || needs.notify-start.outputs.branch_valid == 'true')

    outputs:
      version: ${{ steps.test_version.outputs.version }}
      version_changed: ${{ steps.test_version.outputs.changed }}
      version_reason: ${{ steps.test_version.outputs.reason }}
      version_stale: ${{ steps.test_version.outputs.stale }}
      version_stale_reason: ${{ steps.test_version.outputs.stale_reason }}
      issue_url: ${{ steps.issue_info.outputs.issue_url }}
      issue_title: ${{ steps.issue_info.outputs.issue_title }}
      issue_number: ${{ steps.issue_info.outputs.issue_number }}
      branch_name: ${{ steps.issue_info.outputs.branch_name }}
      pr_number: ${{ steps.test_version.outputs.pr_number }}
      # 뒤 job 이 같은 커밋을 체크아웃하도록 SHA 를 넘긴다 (표시와 실제 빌드가 어긋나지 않게)
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      commit_hash: ${{ steps.commit.outputs.commit_hash }}
      # 빌드가 다른 job 에서 돌므로 컴파일타임 플래그를 output 으로 넘긴다 (#603)
      build_flags: ${{ steps.build_profile.outputs.build_flags }}

    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js test_testflight. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref }}

      - name: Pull latest changes
        env:
          # 외부에서 온 브랜치명은 스크립트 소스가 아니라 env 로 전달 (#646)
          BRANCH_NAME: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref_name }}
        run: git pull origin "$BRANCH_NAME"

      # pull 이후의 HEAD 를 고정한다. 뒤 job 은 브랜치명이 아니라 이 SHA 로 체크아웃한다.
      - name: Pin HEAD SHA
        id: commit
        run: |
          SHA=$(git rev-parse HEAD)
          echo "commit_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "commit_hash=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "📌 Commit to build: $SHA"

      # 빈 값이면 러너에 설치된 최신 정식 Xcode, 고정한 버전이 러너에 없으면 설치 목록을 찍고 실패 (#758)
      # 레포 변수 XCODE_VERSION 으로도 고정 가능 (템플릿 업데이트에도 유지)
      - name: Select Xcode version
        working-directory: ${{ github.workspace }}
        env:
          XCODE_VERSION: ${{ env.XCODE_VERSION || vars.XCODE_VERSION }}
        run: python3 .github/scripts/select_xcode.py select --apply

      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > ${{ env.ENV_FILE_PATH }}
          echo "✅ ${{ env.ENV_FILE_PATH }} file created"

      # 빌드 프로파일 — 런타임(.env)과 컴파일타임(dart-define)을 한 곳에서 정한다 (#603)
      # 고쳐진 .env 는 project-files 아티팩트로, 플래그는 job output 으로 빌드 job 에 간다.
      # 설정(.github/config/build-profile.json)이 없는 저장소에서는 아무 일도 하지 않는다.
      - name: Apply build profile (test)
        id: build_profile
        run: |
          python3 "${{ github.workspace }}/.github/scripts/apply_build_profile.py" \
            test "${{ env.ENV_FILE_PATH }}" \
            --config "${{ github.workspace }}/.github/config/build-profile.json"

      - name: Create Secrets.xcconfig file
        env:
          SECRETS_XCCONFIG_CONTENT: ${{ secrets.SECRETS_XCCONFIG }}
        run: |
          mkdir -p ios/Flutter
          if [ -n "$SECRETS_XCCONFIG_CONTENT" ]; then
            echo "$SECRETS_XCCONFIG_CONTENT" > ios/Flutter/Secrets.xcconfig
            echo "✅ Secrets.xcconfig created"
          else
            echo "// No secrets provided" > ios/Flutter/Secrets.xcconfig
            echo "ℹ️ Empty Secrets.xcconfig created (no secrets provided)"
          fi

      # 테스트 빌드 버전 설정 (version.yml에서 동적 읽기)
      - name: Make the version script executable
        working-directory: ${{ github.workspace }}   # 레포 루트 자산(.github/scripts)은 APP_ROOT가 아닌 레포 루트 기준
        run: chmod +x ./.github/scripts/version_manager.sh

      # 사전 점검용 App Store Connect 키. 키가 없거나 깨져도 준비 단계를 막지 않는다
      # (점검이 version.yml 버전으로 폴백하고, 업로드 단계에서 다시 설치한다).
      - name: Setup App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [ -n "$API_KEY_BASE64" ] && [ -n "$API_KEY_ID" ]; then
            KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
            mkdir -p "$(dirname "$KEY_PATH")"
            if echo "$API_KEY_BASE64" | base64 --decode > "$KEY_PATH"; then
              echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
            else
              echo "::warning::Could not decode the App Store Connect key, continuing with the version.yml version"
            fi
          else
            echo "ℹ️ No App Store Connect key secret, continuing with the version.yml version"
          fi

      # Decision scripts come from the default branch (#1006): a branch that has not merged it yet carries
      # an old ios_release.py that rejects new options, which broke or skipped the version check.
      - name: Load default-branch scripts
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --depth=1 origin "$BASE_BRANCH"
          mkdir -p "$RUNNER_TEMP/ci-scripts"
          git archive "origin/$BASE_BRANCH" .github/scripts | tar -x -C "$RUNNER_TEMP/ci-scripts"
          echo "CI_SCRIPTS_DIR=$RUNNER_TEMP/ci-scripts/.github/scripts" >> "$GITHUB_ENV"
          # Default-branch version for the stale-branch warning (empty = no warning). The catalog checkout is deleted by now.
          BASE_VERSION=$(git show "origin/$BASE_BRANCH:version.yml" 2>/dev/null \
            | sed -n 's/^version:[[:space:]]*"\{0,1\}\([0-9][0-9.]*\)"\{0,1\}.*/\1/p' | head -n 1) || true
          echo "BASE_VERSION=$BASE_VERSION" >> "$GITHUB_ENV"

      - name: Set test build version
        id: test_version
        working-directory: ${{ github.workspace }}   # version_manager.sh가 레포 루트 version.yml을 읽어야 함
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_IDENTIFIER: ${{ secrets.IOS_BUNDLE_ID || vars.IOS_BUNDLE_ID }}
        run: |
          # version_manager.sh로 버전 가져오기 (프로덕션 워크플로우와 동일한 방식)
          VERSION=$(./.github/scripts/version_manager.sh get | tail -n 1)

          # repository_dispatch 이벤트인 경우 진행 댓글을 달 PR 번호를 받는다
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            PR_NUMBER="${{ github.event.client_payload.pr_number }}"
            echo "📋 repository_dispatch event"
            echo "  PR number: #$PR_NUMBER"
          else
            PR_NUMBER=""
            echo "📋 workflow_dispatch event"
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

          # 출시되어 닫힌 버전이면 다음 패치 버전으로 바꾼다 (version, changed, reason 을 출력).
          # 빌드 번호는 여기서 정하지 않고 아카이브 직전에 archive-upload 가 정한다.
          # Scripts: default branch copy (previous step), else the branch's own. A script that does not know
          # --base-version is run again without it; if that fails too, keep the version.yml version.
          SCRIPTS_DIR="${CI_SCRIPTS_DIR:-.github/scripts}"
          precheck() { python3 "$SCRIPTS_DIR/ios_release.py" precheck-version --mode test \
            --version "$VERSION" --bundle-id "$APP_IDENTIFIER" "$@"; }
          precheck --base-version "${BASE_VERSION:-}" || precheck || {
            echo "::warning::Version precheck failed, continuing with the version.yml version"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"; }

      # 브랜치명에서 이슈 번호 추출 및 GitHub API로 이슈 정보 가져오기
      - name: Extract issue info from the branch name
        id: issue_info
        env:
          # 브랜치명은 스크립트 소스에 직접 넣지 않고 env 로 받는다 (#646)
          DISPATCH_BRANCH: ${{ github.event.client_payload.branch_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # repository_dispatch인 경우 client_payload에서 브랜치명 가져오기
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            BRANCH_NAME="$DISPATCH_BRANCH"
            ISSUE_NUMBER="${{ github.event.client_payload.issue_number }}"
          else
            BRANCH_NAME="$REF_NAME"
            # 브랜치명에서 이슈 번호 추출 (#387 형식)
            # 브랜치 이름의 **첫** `#번호` 를 쓴다. 탐욕 매칭(`.*#`)은 제목에 `#` 이 또 있으면 마지막 번호를 잡았다.
            ISSUE_NUMBER=$(echo "$BRANCH_NAME" | sed -n 's/^[^#]*#\([0-9][0-9]*\).*/\1/p')
          fi

          echo "🌿 Branch: $BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

          if [ -z "$ISSUE_NUMBER" ]; then
            echo "⚠️ No issue number found in the branch name."
            echo "issue_url=" >> $GITHUB_OUTPUT
            echo "issue_title=" >> $GITHUB_OUTPUT
            echo "issue_number=" >> $GITHUB_OUTPUT
          else
            echo "✅ Issue number: #$ISSUE_NUMBER"
            ISSUE_URL="https://github.com/${{ github.repository }}/issues/$ISSUE_NUMBER"
            echo "issue_url=$ISSUE_URL" >> $GITHUB_OUTPUT
            echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

            # GitHub API로 이슈 정보 가져오기
            echo "🔍 Fetching the issue from the GitHub API..."
            ISSUE_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER")

            ISSUE_TITLE=$(echo "$ISSUE_RESPONSE" | jq -r '.title // "no issue info"')
            ISSUE_STATE=$(echo "$ISSUE_RESPONSE" | jq -r '.state // "unknown"')

            if [ "$ISSUE_TITLE" = "null" ] || [ "$ISSUE_TITLE" = "no issue info" ]; then
              echo "⚠️ Issue #$ISSUE_NUMBER not found."
              echo "issue_title=" >> $GITHUB_OUTPUT
            else
              echo "📋 Issue title: $ISSUE_TITLE"
              echo "📌 Issue state: $ISSUE_STATE"
              echo "issue_title=$ISSUE_TITLE" >> $GITHUB_OUTPUT
            fi
          fi

      # 릴리즈 노트 생성
      - name: Create release notes
        id: release_notes
        # ⚠️ heredoc 을 쓰지 않는다 (#597).
        #    `<< EOF` 의 종료자는 **컬럼 0** 이어야 하는데, if 블록 안에 두면 들여쓰게 된다.
        #    그러면 셸이 종료자를 못 찾고 스크립트 끝까지 읽어 `syntax error: unexpected
        #    end of file` 로 죽는다. `<<-` 로 바꿔도 탭만 허용해 해결되지 않는다.
        #    (딸려 있던 `sed -E 's/^ {10}//'` 도 실은 아무 일도 안 했다 — YAML의 `run: |`
        #     이 공통 들여쓰기를 이미 걷어내기 때문이다.)
        env:
          # 이슈 제목을 셸 소스에 직접 박으면 큰따옴표나 $(...) 가 들어왔을 때
          # 문자열이 깨지거나 명령이 실행된다. 값으로 넘겨 "$VAR" 로 받는다.
          ISSUE_NUMBER: ${{ steps.issue_info.outputs.issue_number }}
          ISSUE_TITLE: ${{ steps.issue_info.outputs.issue_title }}
          ISSUE_URL: ${{ steps.issue_info.outputs.issue_url }}
          BRANCH_NAME: ${{ steps.issue_info.outputs.branch_name }}
        run: |
          COMMIT_SHA="${{ steps.commit.outputs.commit_sha }}"
          COMMIT_SHORT=$(echo "$COMMIT_SHA" | cut -c1-7)
          BUILD_DATE=$(date '+%Y-%m-%d %H:%M:%S')

          # 테스터에게 보이는 문구라 레포 언어를 따른다 (#769). version.yml 은 레포 루트 기준, 못 읽으면 영문
          msg() { (cd "$GITHUB_WORKSPACE" && python3 .github/scripts/i18n/messages.py get "$@" 2>/dev/null); }
          NOTES_TITLE=$(msg test_testflight.notes.title) || NOTES_TITLE="Test build"
          NOTES_BRANCH=$(msg test_testflight.notes.branch --var "branch=$BRANCH_NAME") || NOTES_BRANCH="Branch: $BRANCH_NAME"
          NOTES_COMMIT=$(msg test_testflight.notes.commit --var "commit=$COMMIT_SHORT") || NOTES_COMMIT="Commit: $COMMIT_SHORT"
          NOTES_DATE=$(msg test_testflight.notes.date --var "date=$BUILD_DATE") || NOTES_DATE="Date: $BUILD_DATE"
          NOTES_ISSUE=$(msg test_testflight.notes.related_issue) || NOTES_ISSUE="Related issue:"

          # 빌드 번호는 아카이브 시점에 정해지므로 여기에 적지 않는다 (TestFlight 가 번호를 자체 표시)
          {
            echo "$NOTES_TITLE"
            echo ""
            echo "$NOTES_BRANCH"
            echo "$NOTES_COMMIT"
            echo "$NOTES_DATE"
            echo ""
          } > final_release_notes.txt

          # 이슈 정보가 있으면 추가
          if [ -n "$ISSUE_NUMBER" ]; then
            {
              echo "$NOTES_ISSUE"
              echo "- #$ISSUE_NUMBER: $ISSUE_TITLE"
              echo "- URL: $ISSUE_URL"
              echo ""
            } >> final_release_notes.txt
          fi

          echo "📋 Release notes:"
          echo "----------------------------------------"
          cat final_release_notes.txt
          echo "----------------------------------------"

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          # 릴리즈 노트는 APP_ROOT에서 생성되지만 아티팩트 액션은 레포 루트 기준이라 prefix 필요
          path: ${{ env.APP_ROOT }}/final_release_notes.txt
          retention-days: 1

      - name: Upload project files
        uses: actions/upload-artifact@v4
        with:
          name: project-files
          # 아티팩트 액션은 defaults(working-directory)를 따르지 않고 항상 레포 루트 기준이라 APP_ROOT prefix가 필요하다
          path: |
            ${{ env.APP_ROOT }}/${{ env.ENV_FILE_PATH }}
            ${{ env.APP_ROOT }}/ios/Flutter/Secrets.xcconfig
            ${{ env.APP_ROOT }}/pubspec.yaml
            ${{ env.APP_ROOT }}/lib/
            ${{ env.APP_ROOT }}/assets/
          include-hidden-files: true   # .env가 숨김 파일이라 기본값 false면 누락된다
          retention-days: 1
          # assets/ 등 일부 경로는 프로젝트마다 없을 수 있어 warn 유지.
          # (전체 0건이어도 통과하지만, 경로 prefix 수정으로 실제 누락은 해소됨)
          if-no-files-found: warn

      # 진행 상황 업데이트 - 준비 실패
      - name: Update progress - preparation failed
        if: failure() && github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.notify-start.outputs.comment_id != ''
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: elapsedText } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt('${{ needs.notify-start.outputs.comment_id }}');
            const startTime = parseInt('${{ needs.notify-start.outputs.start_time }}');
            const branchName = process.env.BRANCH_NAME;
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();
            const elapsed = now - startTime;
            const minutes = Math.floor(elapsed / 60000);
            const seconds = Math.floor((elapsed % 60000) / 1000);
            const duration = elapsedText(minutes, seconds);

            const body = [
              t('test_testflight.heading.build_failed'),
              '',
              t('test_testflight.table.stage_header'),
              '|------|------|----------|',
              t('test_testflight.row.prepare', { status: t('test_testflight.status.failed'), elapsed: duration }),
              t('test_testflight.row.build', { status: t('test_testflight.status.cancelled'), elapsed: '-' }),
              t('test_testflight.row.deploy', { status: t('test_testflight.status.cancelled'), elapsed: '-' }),
              '',
              t('test_testflight.table.item_header'),
              '|------|-----|',
              t('test_testflight.row.branch', { branch: branchName }),
              '',
              t('test_testflight.failed.prepare_message'),
              '',
              t('test_testflight.link.run_log_check', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(`❌ Progress updated: preparation failed`);

      # 취소 처리 (#648): 준비 job 은 댓글을 만든 job 이 아니라 needs 출력으로 ID 를 받는다. 준비 job 이 취소되면 뒤의 빌드 job 은 시작조차 못 한다.
      - name: Update progress - cancelled (prepare job)
        if: cancelled() && github.event_name == 'repository_dispatch' && needs.notify-start.outputs.comment_id != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          COMMENT_ID: ${{ needs.notify-start.outputs.comment_id }}
          START_TIME: ${{ needs.notify-start.outputs.start_time }}
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: elapsedText } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt(process.env.COMMENT_ID, 10);
            const startTime = parseInt(process.env.START_TIME, 10);
            const branchName = process.env.BRANCH_NAME;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}`;

            // 성공/실패 스텝이 이미 최종 상태를 쓴 댓글은 덮어쓰지 않는다
            const { data: current } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId
            });
            if (!(current.body || '').startsWith(t('test_testflight.heading.in_progress'))) {
              console.log('The comment already shows a final state, skipping the cancel update');
              return;
            }

            let duration = '-';
            if (!Number.isNaN(startTime)) {
              const elapsed = Date.now() - startTime;
              const minutes = Math.floor(elapsed / 60000);
              const seconds = Math.floor((elapsed % 60000) / 1000);
              duration = elapsedText(minutes, seconds);
            }

            const body = [
              t('test_testflight.heading.cancelled'),
              '',
              t('test_testflight.table.stage_header'),
              '|------|------|----------|',
              t('test_testflight.row.prepare', { status: t('test_testflight.status.cancelled'), elapsed: '-' }),
              t('test_testflight.row.build', { status: t('test_testflight.status.cancelled'), elapsed: '-' }),
              t('test_testflight.row.deploy', { status: t('test_testflight.status.cancelled'), elapsed: '-' }),
              '',
              t('test_testflight.cancelled.branch', { branch: branchName }),
              t('test_testflight.cancelled.total', { duration }),
              '',
              t('test_testflight.cancelled.message'),
              '',
              t('test_testflight.link.run_log_check', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log('🚫 Progress updated: cancelled');

  # ===================================================================
  # iOS 빌드 + TestFlight 배포 (한 job)
  # ===================================================================
  # 서명과 업로드를 한 job 에서 하는 이유 (#643):
  #   번호나 버전이 Apple 에 거부되면 번호를 새로 정해 아카이브부터 다시 해야 하는데,
  #   job 이 나뉘어 있으면 IPA 를 아티팩트로 넘긴 뒤라 재시도할 수 없다.
  #   아카이브부터 업로드까지를 ios_release.py 가 맡아 번호 결정, 번들 번호 검증, 재시도를 한다.
  build-upload-ios-test:
    name: iOS test build and TestFlight upload
    runs-on: macos-26
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.APP_ROOT }}
    timeout-minutes: 120
    needs: [notify-start, prepare-test-build]
    if: |
      !cancelled() &&
      needs.prepare-test-build.result == 'success'

    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages
          ref: ${{ github.event.repository.default_branch }}

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js test_testflight. comment. test_build. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      # 진행 상황 업데이트 - 준비 완료 (job 시작 시점에 업데이트해야 준비 시간이 정확히 표시됨)
      - name: Update progress - preparation done
        id: progress_step1
        if: github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.notify-start.outputs.comment_id != ''
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          # 사유 문구는 따옴표나 백틱이 섞일 수 있어 스크립트 소스에 박지 않고 env 로 읽는다
          VERSION_CHANGED: ${{ needs.prepare-test-build.outputs.version_changed }}
          VERSION_REASON: ${{ needs.prepare-test-build.outputs.version_reason }}
          VERSION_STALE: ${{ needs.prepare-test-build.outputs.version_stale }}
          VERSION_STALE_REASON: ${{ needs.prepare-test-build.outputs.version_stale_reason }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: elapsedText } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt('${{ needs.notify-start.outputs.comment_id }}');
            const startTime = parseInt('${{ needs.notify-start.outputs.start_time }}');
            const branchName = process.env.BRANCH_NAME;
            const version = '${{ needs.prepare-test-build.outputs.version }}';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();
            const elapsed = Math.round((now - startTime) / 1000);
            const minutes = Math.floor(elapsed / 60);
            const seconds = elapsed % 60;
            const elapsedStr = elapsedText(minutes, seconds);

            // 버전 조정·오래된 브랜치 안내 (닫힌 버전을 피해 version.yml 과 다른 버전으로 빌드하면 이유를 알린다)
            const versionNotes = [
              ...(process.env.VERSION_CHANGED === 'true' ? ['', t('test_build.version_note', { reason: process.env.VERSION_REASON })] : []),
              ...(process.env.VERSION_STALE === 'true' ? ['', t('test_build.stale_note', { reason: process.env.VERSION_STALE_REASON })] : []),
            ];

            const body = [
              t('test_testflight.heading.in_progress'),
              '',
              t('test_testflight.table.stage_header'),
              '|------|------|----------|',
              t('test_testflight.row.prepare', { status: t('test_testflight.status.done'), elapsed: elapsedStr }),
              t('test_testflight.row.build', { status: t('test_testflight.status.in_progress'), elapsed: '-' }),
              t('test_testflight.row.deploy', { status: t('test_testflight.status.waiting'), elapsed: '-' }),
              '',
              t('test_testflight.table.item_header'),
              '|------|-----|',
              t('test_testflight.row.app_version', { version }),
              t('test_testflight.row.build_number_pending'),
              t('test_testflight.row.branch', { branch: branchName }),
              ...versionNotes,
              '',
              t('test_testflight.link.live_log', { url: runUrl }),
              '',
              '---',
              t('test_testflight.footer.auto_update')
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(`✅ Progress updated: preparation done (${elapsedStr})`);
            core.setOutput('elapsed', elapsedStr);
            core.setOutput('end_time', now.toString());

      # 준비 job 이 고정한 SHA 로 체크아웃한다. 브랜치명으로 받으면 그 사이 push 된 커밋이 섞여
      # 댓글에 표시한 커밋과 실제 빌드한 코드가 달라지므로 pull 도 하지 않는다.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-test-build.outputs.commit_sha }}

      # 빈 값이면 러너에 설치된 최신 정식 Xcode, 고정한 버전이 러너에 없으면 설치 목록을 찍고 실패 (#758)
      # 레포 변수 XCODE_VERSION 으로도 고정 가능 (템플릿 업데이트에도 유지)
      - name: Select Xcode version
        working-directory: ${{ github.workspace }}
        env:
          XCODE_VERSION: ${{ env.XCODE_VERSION || vars.XCODE_VERSION }}
        run: python3 .github/scripts/select_xcode.py select --apply

      - name: Install iOS device platform
        env:
          # xcode-select만으로는 서브프로세스에 전파되지 않아 명시적으로 지정
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: |
          echo "=== iPhoneOS.platform check ==="
          ls "$DEVELOPER_DIR/Platforms/iPhoneOS.platform/" 2>/dev/null && echo "iPhoneOS.platform EXISTS" || echo "iPhoneOS.platform NOT FOUND"
          echo "=== Installing MobileDevice packages ==="
          sudo installer -pkg "$XCODE_APP_PATH/Contents/Resources/Packages/MobileDevice.pkg" -target /
          sudo installer -pkg "$XCODE_APP_PATH/Contents/Resources/Packages/MobileDeviceDevelopment.pkg" -target /
          echo "=== Accepting Xcode license ==="
          sudo xcodebuild -license accept
          echo "=== Initializing Xcode components ==="
          xcrun simctl list >/dev/null 2>&1 || true
          echo "=== Downloading iOS platform ==="
          # ⚠️ 설치 여부를 미리 판정해 건너뛰면 안 된다 (showsdks가 잡는 SDK와
          #    기기 빌드용 디바이스 플랫폼은 별개). 조건 없이 항상 다운로드한다.
          for i in 1 2 3; do
            xcodebuild -downloadPlatform iOS && break
            echo "⚠️ Attempt $i failed - retrying"
            sleep 15
          done

      - name: Download project files
        uses: actions/download-artifact@v4
        with:
          name: project-files
          path: .

      - name: Ensure .env file exists
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          if [ ! -f "${{ env.ENV_FILE_PATH }}" ]; then
            printf '%s\n' "$ENV_CONTENT" > ${{ env.ENV_FILE_PATH }}
            echo "✅ ${{ env.ENV_FILE_PATH }} file created (fallback)"
          fi

      # Firebase iOS 설정: Secret 이 있을 때만 복원, 필요한데 없으면 원인을 ::error 로 (#785)
      - name: Create GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/firebase_config_files.py" restore --platform ios --app-root .

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          gem install cocoapods
          # 플러그인 의존성이 없는 프로젝트는 Flutter가 Podfile을 만들지 않는다.
          # 이 경우 pod install은 불필요하므로 건너뛴다 (없으면 실패하던 문제).
          if [ -f ios/Podfile ]; then
            cd ios && pod install
          else
            echo "ℹ️ No ios/Podfile - the project has no CocoaPods dependencies, skipping"
          fi

      - name: Import Code-Signing Certificates
        uses: Apple-Actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install Provisioning Profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          uuid=$(grep -A1 -a "UUID" profile.mobileprovision | grep string | sed -e "s/<string>//" -e "s/<\/string>//" -e "s/[[:space:]]//g")
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision

      # 마법사가 만드는 앱별 파일 — 없으면 무엇을 어떻게 만들지 안내하고 중단 (#785)
      - name: Verify ExportOptions.plist
        run: |
          if [ ! -f "ios/ExportOptions.plist" ]; then
            echo "::error title=Missing ios/ExportOptions.plist::${APP_ROOT}/ios/ExportOptions.plist is required to export the IPA (export method, team ID, provisioning profile). Generate it once and commit it: open .github/util/flutter/testflight-wizard/testflight-wizard.html in a browser, or run: python3 .github/util/flutter/testflight-wizard/testflight-wizard.py setup <flutter project path> <bundle id> <team id> \"<provisioning profile name>\""
            exit 1
          fi
          echo "✅ ExportOptions.plist found: ${APP_ROOT}/ios/ExportOptions.plist"

      - name: Flutter build (no codesign)
        id: flutter_build
        env:
          # xcode-select만으로는 서브프로세스에 전파되지 않아 명시적으로 지정
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: |
          set -o pipefail   # tee 뒤에서도 빌드 실패를 그대로 전달
          BUILD_FLAGS="${{ needs.prepare-test-build.outputs.build_flags }}"
          echo "📦 Flutter build... ${BUILD_FLAGS:+(flags: $BUILD_FLAGS)}"
          # 빌드 번호 1 은 임시값이다. 최종 번호는 archive-upload 가 아카이브 시점에 정해 주입한다.
          # shellcheck disable=SC2086  # 플래그는 공백으로 갈라져야 한다
          flutter build ios --release --no-codesign \
            --build-name="${{ needs.prepare-test-build.outputs.version }}" \
            --build-number=1 \
            $BUILD_FLAGS 2>&1 | tee "$RUNNER_TEMP/flutter-ios-build.log"

      # SDK 심볼 누락 오류면 Xcode 가 낡았을 가능성 안내 (#758)
      - name: Diagnose iOS build failure
        if: failure() && steps.flutter_build.outcome == 'failure'
        working-directory: ${{ github.workspace }}
        run: python3 .github/scripts/select_xcode.py hint --log "$RUNNER_TEMP/flutter-ios-build.log"

      # 번호 결정 시 최근 빌드 번호 조회와 업로드에 쓰는 App Store Connect 키 (fastlane 도 같은 파일을 쓴다)
      - name: Setup App Store Connect API Key
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$API_KEY_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          # ⚠️ 업로드 path가 '단일 파일'이면 upload-artifact가 경로를 평탄화한다.
          #    레포 루트에 풀면 원위치가 복원되지 않으므로 원래 디렉터리를 명시한다.
          path: ${{ env.APP_ROOT }}/

      - name: Verify Fastfile exists
        run: |
          if [ ! -f "ios/fastlane/Fastfile" ]; then
            echo "::error title=Missing ios/fastlane/Fastfile::${APP_ROOT}/ios/fastlane/Fastfile is required to upload to TestFlight (lane: deploy). Generate it once and commit it: open .github/util/flutter/testflight-wizard/testflight-wizard.html in a browser, or run: python3 .github/util/flutter/testflight-wizard/testflight-wizard.py setup <flutter project path> <bundle id> <team id> \"<provisioning profile name>\""
            exit 1
          fi
          # 옛 마법사 Fastfile 은 upload_testflight 만 있어 업로드 단계에서야 실패한다 (직접 만든 Fastfile 오탐 대비 경고만)
          if ! grep -qE '^[[:space:]]*lane[[:space:](]*:deploy([[:space:],)]|$)' ios/fastlane/Fastfile; then
            echo "::warning title=Fastfile has no deploy lane::${APP_ROOT}/ios/fastlane/Fastfile does not define 'lane :deploy', which this workflow calls. If upload fails with \"Could not find lane 'ios deploy'\", regenerate the Fastfile with the TestFlight wizard (.github/util/flutter/testflight-wizard/)."
          fi
          echo "✅ Fastfile found: ${APP_ROOT}/ios/fastlane/Fastfile"

      - name: Install Fastlane
        working-directory: ${{ env.APP_ROOT }}/ios
        run: |
          # multi_json: google-apis transitive 의존성이 선언 누락한 upstream 버그 회피 (gemspec 미선언 → Gem::LoadError)
          printf 'source "https://rubygems.org"\ngem "fastlane"\ngem "multi_json"\n' > Gemfile
          bundle install
          echo "✅ Fastlane installed (Bundler)"

      # 아카이브, IPA export, 번들 번호 검증까지. 빌드 번호는 여기서 정해진다 (build_number.py 규칙).
      # APP_ROOT 가 레포 루트 기준 상대 경로라 스크립트는 레포 루트에서 실행한다.
      - name: Build IPA
        id: build_phase
        working-directory: ${{ github.workspace }}
        env:
          VERSION: ${{ needs.prepare-test-build.outputs.version }}
          MODE: test
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          APP_IDENTIFIER: ${{ secrets.IOS_BUNDLE_ID || vars.IOS_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # xcode-select만으로는 서브프로세스에 전파되지 않아 명시적으로 지정
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/ios_release.py" archive-upload --phase build

      # 진행 상황 업데이트 - IPA 빌드 완료
      - name: Update progress - IPA build done
        id: progress_step2
        if: success() && github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.notify-start.outputs.comment_id != ''
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          VERSION_CHANGED: ${{ needs.prepare-test-build.outputs.version_changed }}
          VERSION_REASON: ${{ needs.prepare-test-build.outputs.version_reason }}
          VERSION_STALE: ${{ needs.prepare-test-build.outputs.version_stale }}
          VERSION_STALE_REASON: ${{ needs.prepare-test-build.outputs.version_stale_reason }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: elapsedText } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt('${{ needs.notify-start.outputs.comment_id }}');
            const step1EndTime = parseInt('${{ steps.progress_step1.outputs.end_time }}');
            const step1Elapsed = '${{ steps.progress_step1.outputs.elapsed }}';
            const branchName = process.env.BRANCH_NAME;
            const buildNumber = '${{ steps.build_phase.outputs.build_number }}';
            const version = '${{ steps.build_phase.outputs.version || needs.prepare-test-build.outputs.version }}';
            // 버전 조정·오래된 브랜치 안내 (진행·성공·실패 댓글이 본문을 다시 쓰므로 매번 함께 남긴다)
            const versionNotes = [
              ...(process.env.VERSION_CHANGED === 'true' ? ['', t('test_build.version_note', { reason: process.env.VERSION_REASON })] : []),
              ...(process.env.VERSION_STALE === 'true' ? ['', t('test_build.stale_note', { reason: process.env.VERSION_STALE_REASON })] : []),
            ];
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();

            // 빌드 단계 소요 시간 (step1 종료 ~ 현재)
            const elapsed = Math.round((now - step1EndTime) / 1000);
            const buildMin = Math.floor(elapsed / 60);
            const buildSec = elapsed % 60;
            const elapsedStr = elapsedText(buildMin, buildSec);

            const body = [
              t('test_testflight.heading.build_done'),
              '',
              t('test_testflight.table.stage_header'),
              '|------|------|----------|',
              t('test_testflight.row.prepare', { status: t('test_testflight.status.done'), elapsed: step1Elapsed || '-' }),
              t('test_testflight.row.build', { status: t('test_testflight.status.done'), elapsed: elapsedStr }),
              t('test_testflight.row.deploy', { status: t('test_testflight.status.in_progress'), elapsed: '-' }),
              '',
              t('test_testflight.table.item_header'),
              '|------|-----|',
              t('test_testflight.row.app_version', { version: `${version}(${buildNumber})` }),
              t('test_testflight.row.branch', { branch: branchName }),
              ...versionNotes,
              '',
              t('test_testflight.link.live_log', { url: runUrl }),
              '',
              '---',
              t('test_testflight.footer.auto_update')
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(`✅ Progress updated: IPA build done (${elapsedStr})`);
            core.setOutput('elapsed', elapsedStr);
            core.setOutput('end_time', now.toString());

      # IPA 빌드 단계(또는 그 앞)에서 실패했을 때만. 이 스텝은 업로드 스텝보다 앞이라
      # 아직 실행 전인 upload_phase 대신 이미 결과가 나온 build_phase 로 판단한다.
      - name: Update progress comment on build failure
        if: failure() && steps.build_phase.outcome != 'success' && github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.notify-start.outputs.comment_id != ''
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          VERSION_CHANGED: ${{ needs.prepare-test-build.outputs.version_changed }}
          VERSION_REASON: ${{ needs.prepare-test-build.outputs.version_reason }}
          VERSION_STALE: ${{ needs.prepare-test-build.outputs.version_stale }}
          VERSION_STALE_REASON: ${{ needs.prepare-test-build.outputs.version_stale_reason }}
          REASON_LINE: ${{ steps.build_phase.outputs.reason_line }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: elapsedText } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt('${{ needs.notify-start.outputs.comment_id }}');
            const startTime = parseInt('${{ needs.notify-start.outputs.start_time }}');
            const step1EndTime = parseInt('${{ steps.progress_step1.outputs.end_time }}') || 0;
            const step1Elapsed = '${{ steps.progress_step1.outputs.elapsed }}';
            const branchName = process.env.BRANCH_NAME;
            const buildNumber = '${{ steps.build_phase.outputs.build_number }}';
            const version = '${{ steps.build_phase.outputs.version || needs.prepare-test-build.outputs.version }}';
            // 버전 조정·오래된 브랜치 안내 (진행·성공·실패 댓글이 본문을 다시 쓰므로 매번 함께 남긴다)
            const versionNotes = [
              ...(process.env.VERSION_CHANGED === 'true' ? ['', t('test_build.version_note', { reason: process.env.VERSION_REASON })] : []),
              ...(process.env.VERSION_STALE === 'true' ? ['', t('test_build.stale_note', { reason: process.env.VERSION_STALE_REASON })] : []),
            ];
            const commitHash = '${{ needs.prepare-test-build.outputs.commit_hash }}';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const reason = (process.env.REASON_LINE || '').trim();

            const now = Date.now();

            // 빌드 단계 소요 시간 (step1 종료 ~ 현재)
            let step2ElapsedStr = '-';
            if (step1EndTime > 0) {
              const step2_s = Math.round((now - step1EndTime) / 1000);
              const s2Min = Math.floor(step2_s / 60);
              const s2Sec = step2_s % 60;
              step2ElapsedStr = elapsedText(s2Min, s2Sec);
            }

            // 번호는 아카이브 직전에 정해지므로 그 전에 실패하면 아직 없다
            const appVersion = buildNumber ? `${version}(${buildNumber})` : version;

            const body = [
              t('test_testflight.heading.build_failed'),
              '',
              t('test_testflight.table.stage_header'),
              '|------|------|----------|',
              t('test_testflight.row.prepare', { status: t('test_testflight.status.done'), elapsed: step1Elapsed || '-' }),
              t('test_testflight.row.build', { status: t('test_testflight.status.failed'), elapsed: step2ElapsedStr }),
              t('test_testflight.row.deploy', { status: t('test_testflight.status.cancelled'), elapsed: '-' }),
              '',
              t('test_testflight.table.item_header'),
              '|------|-----|',
              t('test_testflight.row.app_version', { version: appVersion }),
              t('test_testflight.row.branch', { branch: branchName }),
              t('test_testflight.row.commit', { commit: commitHash }),
              ...versionNotes,
              '',
              t('test_testflight.failed.build_message'),
              ...(reason ? ['', t('test_testflight.reason', { reason })] : []),
              '',
              t('test_testflight.link.run_log_check', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(`❌ Progress updated: IPA build failed`);

      # TestFlight 업로드 (마법사 생성 Fastfile 의 deploy lane). 번호나 버전이 거부되면
      # ios_release.py 가 원인을 분류해 새 번호로 아카이브부터 다시 한다 (최대 5회).
      - name: Upload to TestFlight
        id: upload_phase
        working-directory: ${{ github.workspace }}
        env:
          APP_IDENTIFIER_VALUE: ${{ secrets.IOS_BUNDLE_ID || vars.IOS_BUNDLE_ID }}
          VERSION: ${{ needs.prepare-test-build.outputs.version }}
          MODE: test
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          # 재시도 시 다시 아카이브하므로 xcodebuild 에도 필요하다
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: |
          # Release notes 준비 (APP_ROOT 는 레포 루트 기준 경로)
          if [ -f "$APP_ROOT/final_release_notes.txt" ]; then
            RELEASE_NOTES=$(cat "$APP_ROOT/final_release_notes.txt")
            echo "📝 Release Notes:"
            echo "$RELEASE_NOTES"
          else
            # 테스터에게 보이는 기본 문구라 레포 언어 (#769)
            RELEASE_NOTES=$(python3 .github/scripts/i18n/messages.py get test_testflight.notes.title 2>/dev/null) || RELEASE_NOTES="Test build"
            echo "📝 Default release notes: $RELEASE_NOTES"
          fi

          # 환경변수 설정 (Fastfile에서 사용). IPA_PATH, BUILD_NUMBER, APP_VERSION 은 스크립트가 최종값으로 채운다.
          export API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          export RELEASE_NOTES="$RELEASE_NOTES"
          # Fastfile 의 deploy lane 이 요구한다. 없으면 lane 안에서 멈춘다.
          export APP_IDENTIFIER="$APP_IDENTIFIER_VALUE"
          # 🔴 테스트 빌드는 **TestFlight 까지만** 간다.
          #    deploy lane 은 DEPLOY_MODE 에 따라 심사 자동 제출(store_submit)까지 가므로,
          #    기본값에 기대지 않고 여기서 못을 박는다. Fastfile 기본값이 바뀌어도
          #    테스트 빌드가 앱 심사에 올라가는 일은 없어야 한다 (#601).
          export DEPLOY_MODE="store_only"

          echo "🔧 Working directory: $(pwd)"
          echo "🔧 API_KEY_PATH: $API_KEY_PATH"
          echo "🔧 DEPLOY_MODE: $DEPLOY_MODE / APP_IDENTIFIER: $APP_IDENTIFIER"

          # ⚠️ 마법사가 까는 Fastfile 에 있는 lane 만 부른다 (#601).
          #    전에는 `upload_testflight` 를 불렀는데 그런 lane 이 없어 **한 번도 성공한
          #    적이 없었다.** Fastfile 은 마법사가 덮어쓰므로 lane 을 손으로 더하면
          #    다시 깔 때 사라진다 — 워크플로를 있는 lane 에 맞춘다.
          # `bundle exec fastlane deploy` 는 아래 스크립트가 ios/ 에서 호출한다 (재시도 때마다 다시 부름).
          python3 "$GITHUB_WORKSPACE/.github/scripts/ios_release.py" archive-upload --phase upload

      - name: Notify TestFlight Upload Success
        if: success()
        env:
          BUILD_BRANCH: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || github.ref_name }}
        run: |
          echo "✅ TestFlight test build uploaded!"
          echo "Version: ${{ steps.upload_phase.outputs.version || needs.prepare-test-build.outputs.version }}"
          echo "Build number: ${{ steps.upload_phase.outputs.build_number || steps.build_phase.outputs.build_number }}"
          if [ -n "${{ needs.prepare-test-build.outputs.pr_number }}" ]; then
            echo "PR number: ${{ needs.prepare-test-build.outputs.pr_number }}"
          fi
          echo "Branch: $BUILD_BRANCH"
          echo "Commit: ${{ needs.prepare-test-build.outputs.commit_sha }}"
          if [ -n "${{ needs.prepare-test-build.outputs.issue_url }}" ]; then
            echo "Related issue: ${{ needs.prepare-test-build.outputs.issue_url }}"
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ TestFlight test build upload failed!"
          echo "Check the log."

      # 진행 상황 최종 업데이트 - 성공
      - name: Final progress update - success
        if: success() && github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.notify-start.outputs.comment_id != ''
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          VERSION_CHANGED: ${{ needs.prepare-test-build.outputs.version_changed }}
          VERSION_REASON: ${{ needs.prepare-test-build.outputs.version_reason }}
          VERSION_STALE: ${{ needs.prepare-test-build.outputs.version_stale }}
          VERSION_STALE_REASON: ${{ needs.prepare-test-build.outputs.version_stale_reason }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: elapsedText } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt('${{ needs.notify-start.outputs.comment_id }}');
            const startTime = parseInt('${{ needs.notify-start.outputs.start_time }}');
            const step2EndTime = parseInt('${{ steps.progress_step2.outputs.end_time }}');
            const step1Elapsed = '${{ steps.progress_step1.outputs.elapsed }}';
            const step2Elapsed = '${{ steps.progress_step2.outputs.elapsed }}';
            const branchName = process.env.BRANCH_NAME;
            const buildNumber = '${{ steps.upload_phase.outputs.build_number || steps.build_phase.outputs.build_number }}';
            const version = '${{ steps.upload_phase.outputs.version || needs.prepare-test-build.outputs.version }}';
            // 버전 조정·오래된 브랜치 안내 (진행·성공·실패 댓글이 본문을 다시 쓰므로 매번 함께 남긴다)
            const versionNotes = [
              ...(process.env.VERSION_CHANGED === 'true' ? ['', t('test_build.version_note', { reason: process.env.VERSION_REASON })] : []),
              ...(process.env.VERSION_STALE === 'true' ? ['', t('test_build.stale_note', { reason: process.env.VERSION_STALE_REASON })] : []),
            ];
            const commitHash = '${{ needs.prepare-test-build.outputs.commit_hash }}';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;

            const now = Date.now();

            // 배포 단계 소요 시간 (step2 종료 ~ 현재)
            const step3_s = Math.round((now - step2EndTime) / 1000);
            const s3Min = Math.floor(step3_s / 60);
            const s3Sec = step3_s % 60;
            const step3Elapsed = elapsedText(s3Min, s3Sec);

            // 전체 소요 시간
            const total_s = Math.round((now - startTime) / 1000);
            const tMin = Math.floor(total_s / 60);
            const tSec = total_s % 60;
            const totalElapsed = elapsedText(tMin, tSec);

            const body = [
              t('test_testflight.heading.deployed'),
              '',
              t('test_testflight.table.stage_header'),
              '|------|------|----------|',
              t('test_testflight.row.prepare', { status: t('test_testflight.status.done'), elapsed: step1Elapsed || '-' }),
              t('test_testflight.row.build', { status: t('test_testflight.status.done'), elapsed: step2Elapsed || '-' }),
              t('test_testflight.row.deploy', { status: t('test_testflight.status.done'), elapsed: step3Elapsed }),
              '',
              t('test_testflight.table.item_header'),
              '|------|-----|',
              t('test_testflight.row.app_version', { version: `${version}(${buildNumber})` }),
              t('test_testflight.row.branch', { branch: branchName }),
              t('test_testflight.row.commit', { commit: commitHash }),
              t('test_testflight.row.total_elapsed', { elapsed: totalElapsed }),
              ...versionNotes,
              '',
              t('test_testflight.deployed.message'),
              '',
              t('test_testflight.link.run_log', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(`✅ Final progress update: all steps succeeded (${totalElapsed})`);

      # 진행 상황 최종 업데이트 - 실패 (업로드 단계에서 실패한 경우)
      - name: Final progress update - failure
        if: failure() && steps.upload_phase.outcome == 'failure' && github.event_name == 'repository_dispatch' && github.event.client_payload.pr_number != '' && needs.notify-start.outputs.comment_id != ''
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          VERSION_CHANGED: ${{ needs.prepare-test-build.outputs.version_changed }}
          VERSION_REASON: ${{ needs.prepare-test-build.outputs.version_reason }}
          VERSION_STALE: ${{ needs.prepare-test-build.outputs.version_stale }}
          VERSION_STALE_REASON: ${{ needs.prepare-test-build.outputs.version_stale_reason }}
          REASON_LINE: ${{ steps.upload_phase.outputs.reason_line || steps.build_phase.outputs.reason_line }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: elapsedText } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt('${{ needs.notify-start.outputs.comment_id }}');
            const startTime = parseInt('${{ needs.notify-start.outputs.start_time }}');
            const step2EndTime = parseInt('${{ steps.progress_step2.outputs.end_time }}') || 0;
            const step1Elapsed = '${{ steps.progress_step1.outputs.elapsed }}';
            const step2Elapsed = '${{ steps.progress_step2.outputs.elapsed }}';
            const branchName = process.env.BRANCH_NAME;
            const buildNumber = '${{ steps.upload_phase.outputs.build_number || steps.build_phase.outputs.build_number }}';
            const version = '${{ steps.upload_phase.outputs.version || needs.prepare-test-build.outputs.version }}';
            // 버전 조정·오래된 브랜치 안내 (진행·성공·실패 댓글이 본문을 다시 쓰므로 매번 함께 남긴다)
            const versionNotes = [
              ...(process.env.VERSION_CHANGED === 'true' ? ['', t('test_build.version_note', { reason: process.env.VERSION_REASON })] : []),
              ...(process.env.VERSION_STALE === 'true' ? ['', t('test_build.stale_note', { reason: process.env.VERSION_STALE_REASON })] : []),
            ];
            const commitHash = '${{ needs.prepare-test-build.outputs.commit_hash }}';
            const runId = '${{ github.run_id }}';
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const reason = (process.env.REASON_LINE || '').trim();

            const now = Date.now();

            // 배포 단계 소요 시간 (step2 종료 ~ 현재)
            let step3Elapsed = '-';
            if (step2EndTime > 0) {
              const step3_s = Math.round((now - step2EndTime) / 1000);
              const s3Min = Math.floor(step3_s / 60);
              const s3Sec = step3_s % 60;
              step3Elapsed = elapsedText(s3Min, s3Sec);
            }

            const body = [
              t('test_testflight.heading.deploy_failed'),
              '',
              t('test_testflight.table.stage_header'),
              '|------|------|----------|',
              t('test_testflight.row.prepare', { status: t('test_testflight.status.done'), elapsed: step1Elapsed || '-' }),
              t('test_testflight.row.build', { status: t('test_testflight.status.done'), elapsed: step2Elapsed || '-' }),
              t('test_testflight.row.deploy', { status: t('test_testflight.status.failed'), elapsed: step3Elapsed }),
              '',
              t('test_testflight.table.item_header'),
              '|------|-----|',
              t('test_testflight.row.app_version', { version: `${version}(${buildNumber})` }),
              t('test_testflight.row.branch', { branch: branchName }),
              t('test_testflight.row.commit', { commit: commitHash }),
              ...versionNotes,
              '',
              t('test_testflight.failed.deploy_message'),
              ...(reason ? ['', t('test_testflight.reason', { reason })] : []),
              '',
              t('test_testflight.link.run_log_check', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log(`❌ Final progress update: TestFlight upload failed`);

      # 취소 처리 (#648): 빌드 job 이 실행 중일 때 취소된 경우. success()/failure() 스텝은 취소 시 돌지 않아 이 스텝이 유일한 정리 경로다. 준비 job 은 이미 끝났으므로 준비는 완료로 표시한다.
      - name: Update progress - cancelled (build job)
        if: cancelled() && github.event_name == 'repository_dispatch' && needs.notify-start.outputs.comment_id != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          COMMENT_ID: ${{ needs.notify-start.outputs.comment_id }}
          START_TIME: ${{ needs.notify-start.outputs.start_time }}
          BRANCH_NAME: ${{ github.event.client_payload.branch_name }}
          RUN_ID: ${{ github.run_id }}
          STEP1_ELAPSED: ${{ steps.progress_step1.outputs.elapsed }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { t, elapsed: elapsedText } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = parseInt(process.env.COMMENT_ID, 10);
            const startTime = parseInt(process.env.START_TIME, 10);
            const branchName = process.env.BRANCH_NAME;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.RUN_ID}`;
            const step1Elapsed = process.env.STEP1_ELAPSED;
            // 성공/실패 스텝이 이미 최종 상태를 쓴 댓글은 덮어쓰지 않는다
            const { data: current } = await github.rest.issues.getComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId
            });
            if (!(current.body || '').startsWith(t('test_testflight.heading.in_progress'))) {
              console.log('The comment already shows a final state, skipping the cancel update');
              return;
            }

            let duration = '-';
            if (!Number.isNaN(startTime)) {
              const elapsed = Date.now() - startTime;
              const minutes = Math.floor(elapsed / 60000);
              const seconds = Math.floor((elapsed % 60000) / 1000);
              duration = elapsedText(minutes, seconds);
            }

            const body = [
              t('test_testflight.heading.cancelled'),
              '',
              t('test_testflight.table.stage_header'),
              '|------|------|----------|',
              t('test_testflight.row.prepare', { status: t('test_testflight.status.done'), elapsed: step1Elapsed || '-' }),
              t('test_testflight.row.build', { status: t('test_testflight.status.cancelled'), elapsed: '-' }),
              t('test_testflight.row.deploy', { status: t('test_testflight.status.cancelled'), elapsed: '-' }),
              '',
              t('test_testflight.cancelled.branch', { branch: branchName }),
              t('test_testflight.cancelled.total', { duration }),
              '',
              t('test_testflight.cancelled.message'),
              '',
              t('test_testflight.link.run_log_check', { url: runUrl })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            console.log('🚫 Progress updated: cancelled');
