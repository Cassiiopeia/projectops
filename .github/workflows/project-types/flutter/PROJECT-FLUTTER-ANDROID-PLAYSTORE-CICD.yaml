# ===================================================================
# Flutter Android Play Store internal testing deploy workflow
# ===================================================================
#
# On a push to main, builds the Android AAB and
# deploys it to Play Store internal testing automatically.
#
# ===================================================================
# 🔑 Required GitHub Secrets
# ===================================================================
# ENV_FILE or ENV: contents of the .env file (either; ENV_FILE first)
# RELEASE_KEYSTORE_BASE64: signing keystore (base64)
# RELEASE_KEYSTORE_PASSWORD: keystore password
# RELEASE_KEY_ALIAS: key alias
# RELEASE_KEY_PASSWORD: key password
# GOOGLE_SERVICES_JSON: Firebase google-services.json
# GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: Play Console service account (base64)
# ===================================================================

name: PROJECT-FLUTTER-ANDROID-PLAYSTORE-INTERNAL-CICD
# A manual run records the chosen mode in the run name — push deploys use this name to tell "whether production was submitted recently" (#816).
run-name: ${{ github.event_name == 'workflow_dispatch' && format('PLAYSTORE deploy_mode={0} closed_testing={1}', inputs.deploy_mode, inputs.promote_to_closed_testing) || github.event.head_commit.message }}

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      deploy_mode:
        description: "Deploy mode (store_only = up to internal / store_prepare = production draft / store_submit = submit for review automatically)"
        required: false
        default: "store_only"
        type: choice
        options:
          - store_only
          - store_prepare
          - store_submit
      # Changes the release mode for this run only. default = repo variable STORE_RELEASE_MODE → auto (#1125)
      store_release_mode:
        description: "Release after review (store_submit only): auto = goes live when approved / manual = production stays a draft and a person starts the rollout in Play Console. default = repo variable STORE_RELEASE_MODE, then auto"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - auto
          - manual
      # default = manual runs also follow store-deploy.json → repo variable → default (#1005)
      promote_to_closed_testing:
        description: "Also upload to the closed testing (alpha) track, needed for production access on personal accounts (12 testers, 14 days). default = store-deploy.json, then repo variable ANDROID_PROMOTE_TO_CLOSED_TESTING, then true"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - "true"
          - "false"
      promote_to_open_testing:
        description: "Also upload to the open testing (beta) track. default = repo variable ANDROID_PROMOTE_TO_OPEN_TESTING, then false"
        required: false
        default: "default"
        type: choice
        options:
          - default
          - "true"
          - "false"
      # Turns off in-review protection (review-guard) for this run only — promotion restarts the production review in progress (#1005)
      force_promote_during_review:
        description: "Promote to closed/open testing even if a manual production submission (store_submit) ran recently. This restarts a production review in progress"
        required: false
        default: false
        type: boolean
      whats_new_override:
        description: "Use this as the Play release notes for this run only (empty = follow the env STORE_WHATS_NEW_OVERRIDE rule)"
        required: false
        default: ""
        type: string

permissions:
  # GITHUB_TOKEN only reads. Declaring it keeps this workflow from gaining more permissions than needed
  # even if the repo default later changes to write (#595).
  contents: read
  # Find recent manual production submissions (store_deploy_config.py review-guard, #816)
  actions: read

# ============================================
# 🔧 Per-project settings (edit the values below)
# ============================================
env:
  # Project name
  APP_ARTIFACT_NAME: "__APP_ARTIFACT_NAME__"  # @wizard ask:@repo
  # Flutter/Java versions
  # Repo variables FLUTTER_VERSION/JAVA_VERSION take precedence over the values below (kept across template updates, #758)
  FLUTTER_VERSION: "3.38.9"
  JAVA_VERSION: "__JAVA_VERSION__"  # @wizard ask:17
  PROJECT_TYPE: "flutter"
  # Flutter root path (relative to repo root). "." for a single repo, "app" etc. for a monorepo.
  # At integration, the integrator's flutter-root resolver substitutes it once with project_paths.flutter.
  # FLUTTER_ROOT is the official Flutter SDK path variable and would clash — hence APP_ROOT
  APP_ROOT: "."  # @wizard auto:flutter-root
  # ⚠️ push (automatic deploy) skips production stages (#816). Even if the value below is store_prepare/store_submit,
  #    push drops it to store_only — Google Play merges new changes arriving during review into that review and reviews again,
  #    so submitting on every deploy means review never ends (measured). Production goes up via a manual run (deploy_mode) in Actions.
  #    To do it automatically on every push, set "android": {"auto_submit_on_push": true} in .github/config/store-deploy.json.
  # Deploy mode — how far into Play production stages a main deploy goes
  #   store_only    : up to the internal testing upload (default)
  #   store_prepare : + uploads to production as a draft (a person presses 'Start rollout' in Play Console)
  #   store_submit  : + submits for production review automatically
  # Read in order: .github/config/store-deploy.json (code, kept in git) → repo variable ANDROID_DEPLOY_MODE (#767).
  # The expression below is the value when the file is missing; with the file, the Resolve store deploy config step overrides it.
  # Change repo variables in Settings → Secrets and variables → Actions → Variables.
  # Why a repo variable and not code: in an emergency, automatic submission must be switchable off at once without a deploy (set store_only).
  # Leave it empty (store_only) while you have no production access — production stages would fail every time.
  # A value chosen in a manual run (workflow_dispatch) wins. Intermediate tracks are handled by the PROMOTE_* switches below.
  DEPLOY_MODE: ${{ github.event.inputs.deploy_mode || vars.ANDROID_DEPLOY_MODE || 'store_only' }}
  # Override for the store 'What's new' text — the 'Release notes' field in Play Console.
  #   With a value → that text is used every time regardless of version.
  #   ""(empty string) → no override; the matching version entry from CHANGELOG.json is used.
  # Reviewers see this field as well as users. If you do not want to detail changes, use a fixed one-line text.
  # Release notes are set once on upload to internal testing and carry over when promoted to closed testing/production.
  # So this value applies to every track (internal, closed, open, production).
  # Giving a value to the manual run input whats_new_override makes that text win for that run only.
  # iOS (PROJECT-FLUTTER-IOS-TESTFLIGHT.yaml) has a setting with the same name. Change both together.
  STORE_WHATS_NEW_OVERRIDE: ""
  # Track promotion switches — independent of DEPLOY_MODE (#618).
  # Since 2023-11-13, closed testing is the condition for personal accounts to get production access,
  # so running only internal testing never meets that condition.
  # Closed testing is on by default (#816) — testers get the latest build on every push. To turn it off, set the repo variable
  # ANDROID_PROMOTE_TO_CLOSED_TESTING=false or store-deploy.json "promote_closed_testing": false.
  # After a manual production submission, push promotions are skipped for review_cooldown_hours (default 48) — the review-guard step below.
  # If the manual run input is default it falls through to the repo variable (push has an empty input, same path) (#1005).
  # Manual runs also skip promotion during review — force it with the force_promote_during_review input.
  # Once you have production access, closed promotion is unnecessary, so turning it off is recommended (every promotion is a review submission).
  PROMOTE_TO_CLOSED_TESTING: ${{ (github.event.inputs.promote_to_closed_testing != 'default' && github.event.inputs.promote_to_closed_testing) || vars.ANDROID_PROMOTE_TO_CLOSED_TESTING || 'true' }}
  PROMOTE_TO_OPEN_TESTING: ${{ (github.event.inputs.promote_to_open_testing != 'default' && github.event.inputs.promote_to_open_testing) || vars.ANDROID_PROMOTE_TO_OPEN_TESTING || 'false' }}
  # Track names can be renamed in the console, so they are values (hard-coding them makes uploads silently fail).
  CLOSED_TESTING_TRACK: ${{ vars.ANDROID_CLOSED_TESTING_TRACK || 'alpha' }}
  OPEN_TESTING_TRACK: ${{ vars.ANDROID_OPEN_TESTING_TRACK || 'beta' }}
  # Production rollout fraction (above 0, up to 1.0). 1.0 = full release as soon as review passes (irreversible), 0.1 = 10% staged rollout.
  # Raising the fraction after a staged rollout is not automated — a person raises it in Play Console Production > Release management,
  # and halts the rollout on the same screen if something goes wrong. Change it with the repo variable ANDROID_PRODUCTION_ROLLOUT.
  PRODUCTION_ROLLOUT: ${{ vars.ANDROID_PRODUCTION_ROLLOUT || '1.0' }}
  # Release mode (#1125) — who releases after review passes in store_submit. Priority: manual run input > repo variable > auto
  #   auto   : production promoted as completed → released as soon as review passes (default, current behavior)
  #   manual : production promoted as draft → a person presses 'Start rollout' in the console (the Play API has no "review only, hold" state)
  # The repo variable STORE_RELEASE_MODE is shared with iOS (PROJECT-FLUTTER-IOS-TESTFLIGHT.yaml).
  STORE_RELEASE_MODE: ${{ (github.event.inputs.store_release_mode != 'default' && github.event.inputs.store_release_mode) || vars.STORE_RELEASE_MODE || 'auto' }}

jobs:
  prepare-build:
    name: Prepare environment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}
    # Run only when the CHANGELOG workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name != 'workflow_run' }}

    outputs:
      version: ${{ steps.current_version.outputs.version }}
      version_code: ${{ steps.current_version.outputs.version_code }}
      project_type: ${{ steps.current_version.outputs.project_type }}

    steps:
      # Preflight (#666)
      # Right after a fresh install, missing deploy Secrets are normal. Left alone, the build runs to the end and then
      # fails at signing or upload with an error whose cause is hard to see, so report what is missing before the build.
      # With every Secret present this step passes unchanged and later behavior does not change.
      - name: Preflight check of deploy secrets
        working-directory: ${{ github.workspace }}   # before checkout APP_ROOT may not exist yet
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          fail=0
          for name in GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error title=Deploy preflight::Secret ${name} is missing. It is the Google Play service account JSON (base64). Create it with the .github/util/flutter/playstore-wizard guide and add it under Settings > Secrets and variables > Actions."
              fail=1
            fi
          done
          # A typo in the release mode stops before the build — silently going auto would cause an unwanted automatic release (#1125)
          case "$STORE_RELEASE_MODE" in
            auto|manual) ;;
            *)
              echo "::error title=Deploy preflight::STORE_RELEASE_MODE='${STORE_RELEASE_MODE}' is not valid. Use auto or manual (repo variable STORE_RELEASE_MODE or the store_release_mode input)."
              fail=1
              ;;
          esac
          [ "$fail" = "0" ] || exit 1
          echo "✅ Preflight check passed"

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main

      # Preflight (#666) — check in advance that the Fastfile the deploy job copies exists in the repo
      - name: Preflight check of Fastfile.playstore
        run: |
          if [ ! -f android/fastlane/Fastfile.playstore ]; then
            echo "::error title=Deploy preflight::android/fastlane/Fastfile.playstore is missing. Run .github/util/flutter/playstore-wizard to create it, then commit it."
            exit 1
          fi
          # With manual, an old Fastfile that ignores the value releases as soon as review passes (irreversible) — stop instead of warning (#1125)
          if [ "$STORE_RELEASE_MODE" = "manual" ] && ! grep -q "STORE_RELEASE_MODE" android/fastlane/Fastfile.playstore; then
            echo "::error title=Deploy preflight::Release mode is manual, but android/fastlane/Fastfile.playstore never reads STORE_RELEASE_MODE, so production would still go live when approved. Regenerate it with .github/util/flutter/playstore-wizard, or set the release mode back to auto."
            exit 1
          fi

      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > .env
          echo ".env file created"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Install dependencies
        run: flutter pub get

      # Make the version script executable
      - name: Make version scripts executable
        working-directory: ${{ github.workspace }}   # repo-root assets (.github/scripts) are relative to the repo root, not APP_ROOT
        run: |
          chmod +x ./.github/scripts/version_manager.sh
          chmod +x ./.github/scripts/changelog_manager.py

      # Get the current version info with version_manager.sh
      - name: Read current version
        id: current_version
        working-directory: ${{ github.workspace }}   # version_manager.sh must read the repo-root version.yml
        run: |
          # Get VERSION (x.y.z format)
          VERSION=$(./.github/scripts/version_manager.sh get | tail -n 1)

          # Get VERSION_CODE (a simple increasing number managed in version.yml)
          VERSION_CODE=$(./.github/scripts/version_manager.sh get-code)

          # Print the result
          echo "✅ VERSION: $VERSION"
          echo "✅ VERSION_CODE: $VERSION_CODE"
          echo "🔧 Project type: ${{ env.PROJECT_TYPE }}"

          # Set GitHub outputs
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "project_type=${{ env.PROJECT_TYPE }}" >> $GITHUB_OUTPUT

          # Also set as env vars (used by scripts)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "TODAY=$(date '+%Y-%m-%d')" >> $GITHUB_ENV
          echo "TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "PROJECT_TYPE=${{ env.PROJECT_TYPE }}" >> $GITHUB_ENV

      # Extract release notes from CHANGELOG.json - uses changelog_manager.py
      - name: Generate release notes
        id: release_notes
        working-directory: ${{ github.workspace }}   # CHANGELOG.json, changelog_manager.py, final_release_notes.txt (upload pair) are relative to the repo root
        run: |
          VERSION="${{ steps.current_version.outputs.version }}"

          if [ -f "CHANGELOG.json" ]; then
            echo "📄 Extracting v$VERSION release notes from CHANGELOG.json..."
            # Generate CHANGELOG.md
            python3 ./.github/scripts/changelog_manager.py generate-md

            # Extract release notes with changelog_manager.py export
            python3 ./.github/scripts/changelog_manager.py export --version $VERSION --output final_release_notes.txt

            if [ -s final_release_notes.txt ]; then
              echo "✅ Release notes extracted"
              echo "📋 Extracted release notes:"
              echo "----------------------------------------"
              cat final_release_notes.txt
              echo "----------------------------------------"
              echo "RELEASE_NOTES_FOUND=true" >> $GITHUB_ENV
            else
              echo "❌ Could not extract release notes"
              echo "RELEASE_NOTES_FOUND=false" >> $GITHUB_ENV
              # This text goes into the ko-KR store release notes, so it follows the store language, not the repo language (#769)
              echo "v$VERSION 업데이트" > final_release_notes.txt
            fi
          else
            echo "⚠️ No CHANGELOG.json file. Using the default release notes."
            echo "RELEASE_NOTES_FOUND=false" >> $GITHUB_ENV
            echo "v$VERSION 업데이트" > final_release_notes.txt
          fi

      # Upload release notes as an artifact
      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: final_release_notes.txt
          retention-days: 1

      # Upload project files as an artifact
      # .env is not in the artifact for security; each job recreates it from secrets
      - name: Upload project files
        uses: actions/upload-artifact@v4
        with:
          name: project-files
          # Artifact actions ignore defaults and always use the repo root, so the APP_ROOT prefix is needed
          path: |
            ${{ env.APP_ROOT }}/pubspec.yaml
            ${{ env.APP_ROOT }}/lib/
            ${{ env.APP_ROOT }}/assets/
          retention-days: 1

  build-android:
    name: Build Android AAB
    runs-on: ubuntu-latest
    needs: prepare-build
    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main

      # Download project files
      - name: Download project files
        uses: actions/download-artifact@v4
        with:
          name: project-files
          path: .

      # Create the .env file (from secrets, not the artifact, for security)
      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > .env
          echo "✅ .env file created (size: $(wc -c < .env) bytes)"

      # Build profile — runtime (.env) and compile time (dart-define) decided in one place (#603)
      #
      # A release build must never ship with dev keys on. This step cleans .env and
      # confirms both layers are off — if either leaks, it stops the build.
      #
      # Repos without the config (.github/config/build-profile.json) are left untouched.
      - name: Apply build profile (release)
        id: build_profile
        run: |
          python3 "${{ github.workspace }}/.github/scripts/apply_build_profile.py" \
            release .env \
            --config "${{ github.workspace }}/.github/config/build-profile.json"

      # Set up the release keystore
      - name: Setup Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/keystore/key.jks
          echo "✅ Release keystore created"
          ls -la android/app/keystore/

      # Create key.properties (release signing info)
      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storeFile=app/keystore/key.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          # File holding signing passwords — never print its contents (#785)
          echo "✅ key.properties created"

      # Written only when the Secret exists — otherwise the committed file stays, and if needed but missing the cause goes to ::error (#785)
      - name: Create Google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: python3 "$GITHUB_WORKSPACE/.github/scripts/firebase_config_files.py" restore --platform android --app-root .

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ vars.FLUTTER_VERSION || env.FLUTTER_VERSION }}
          cache: true

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-flutter-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ vars.JAVA_VERSION || env.JAVA_VERSION }}

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Edit Android build.gradle.kts (release signing config)
      - name: Configure Android build for release
        run: |
          # Add the release signing config to build.gradle.kts if missing
          if ! grep -q "signingConfigs" android/app/build.gradle.kts; then
            echo "⚠️ build.gradle.kts needs a signing config"
            # Assumes signing is already configured (must be set up by hand beforehand)
          fi
          echo "✅ Android build settings checked"

      # pubspec.yaml keeps the x.y.z format
      # The --build-name and --build-number flags of flutter build override pubspec.yaml

      # Flutter build appbundle (creates the AAB)
      - name: Build Android App Bundle (AAB)
        run: |
          VERSION_NAME="${{ needs.prepare-build.outputs.version }}"
          VERSION_CODE="${{ needs.prepare-build.outputs.version_code }}"

          echo "=========================================="
          echo "🚀 Starting the AAB build"
          echo "=========================================="
          echo "🎯 Build version: $VERSION_NAME"
          echo "🎯 Build code: $VERSION_CODE"

          # Validate input
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "❌ VERSION_NAME or VERSION_CODE is empty!"
            exit 1
          fi
          
          # Print Flutter environment info
          echo "🔍 Flutter environment:"
          flutter --version
          flutter doctor -v | head -20
          
          # Clean the build directory
          echo "🧹 Cleaning previous build outputs..."
          rm -rf build/app/outputs/bundle/release/
          mkdir -p build/app/outputs/bundle/release/
          
          # Flutter clean and pub get
          echo "🔄 Running flutter clean and reinstalling dependencies..."
          flutter clean
          flutter pub get

          # Add version info to local.properties (works around Flutter flags being ignored)
          echo "🔧 Writing version info to local.properties..."

          # Remove version info from an existing local.properties
          if [ -f "android/local.properties" ]; then
            grep -v "flutter.versionName\|flutter.versionCode" android/local.properties > android/local.properties.tmp || true
            mv android/local.properties.tmp android/local.properties
          else
            touch android/local.properties
          fi

          # Add version info
          echo "flutter.versionName=$VERSION_NAME" >> android/local.properties
          echo "flutter.versionCode=$VERSION_CODE" >> android/local.properties

          echo "✅ local.properties updated"
          echo "📋 Version info: VERSION_NAME=$VERSION_NAME, VERSION_CODE=$VERSION_CODE"

          # Gradle performance settings
          export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4"
          export JAVA_OPTS="-Xmx4g"
          echo "✅ Gradle optimization settings applied"

          # Pass version info to flutter build
          # The --build-name and --build-number flags override version in pubspec.yaml
          # pubspec.yaml keeps x.y.z; VERSION_CODE is managed automatically in version.yml
          echo "🔨 Running flutter build..."
          echo "📋 Command: flutter build appbundle --release --build-name=$VERSION_NAME --build-number=$VERSION_CODE --verbose"
          echo "⏱️ Build start time: $(date '+%Y-%m-%d %H:%M:%S')"

          BUILD_FLAGS="${{ steps.build_profile.outputs.build_flags }}"
          # shellcheck disable=SC2086  # flags must split on spaces
          flutter build appbundle \
            --release \
            --build-name="$VERSION_NAME" \
            --build-number="$VERSION_CODE" \
            --verbose $BUILD_FLAGS
          
          BUILD_EXIT_CODE=$?
          
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "❌ flutter build failed! Exit code: $BUILD_EXIT_CODE"
            echo "🔍 Build directory state:"
            find build/ -name "*.aab" -o -name "*.apk" 2>/dev/null || echo "No AAB/APK file found"
            exit 1
          fi
          
          echo "✅ flutter build succeeded!"
          
          # Check the build output
          echo "🔍 Checking build output:"
          ls -lah build/app/outputs/bundle/release/
          
          # Check that the AAB file exists
          AAB_FILE="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_FILE" ]; then
            echo "❌ The AAB file was not created!"
            echo "🔍 Full build directory contents:"
            find build/ -type f -name "*.aab" -o -name "*.apk" 2>/dev/null || echo "No AAB/APK file found"
            echo "🔍 outputs directory tree:"
            find build/app/outputs/ -type f 2>/dev/null || echo "No outputs directory"
            exit 1
          fi
          
          echo "✅ AAB file created"
          echo "📱 AAB file size: $(du -h "$AAB_FILE" | cut -f1)"
          echo "📋 AAB file info: $(ls -lah "$AAB_FILE")"
          
          # Download and install bundletool
          echo "📦 Downloading bundletool..."
          BUNDLETOOL_VERSION="1.15.6"
          BUNDLETOOL_URL="https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          
          echo "📋 Download URL: $BUNDLETOOL_URL"
          wget -q "$BUNDLETOOL_URL" -O bundletool.jar
          
          if [ ! -f "bundletool.jar" ]; then
            echo "❌ bundletool download failed"
            echo "🔄 Retrying with the fallback URL..."
            wget -q "https://github.com/google/bundletool/releases/latest/download/bundletool-all-1.15.6.jar" -O bundletool.jar
            
            if [ ! -f "bundletool.jar" ]; then
              echo "❌ bundletool download failed on every URL"
              exit 1
            fi
          fi
          
          echo "✅ bundletool downloaded"
          echo "📋 bundletool file size: $(du -h bundletool.jar | cut -f1)"
          
          # Check the Java environment
          echo "🔍 Java environment:"
          java -version
          
          # Check the actual version info inside the AAB
          # Verify the VERSION_CODE passed via Flutter CLI flags was applied
          echo "=========================================="
          echo "🔍 Verifying the version inside the AAB file"
          echo "=========================================="

          # Extract version info from AndroidManifest.xml
          echo "📋 Extracting the actual version from the AAB..."
          echo "📋 Command to run: java -jar bundletool.jar dump manifest --bundle='$AAB_FILE'"
          
          MANIFEST_OUTPUT=$(java -jar bundletool.jar dump manifest --bundle="$AAB_FILE" 2>&1)
          MANIFEST_EXIT_CODE=$?
          
          echo "📋 bundletool output (exit code: $MANIFEST_EXIT_CODE):"
          echo "$MANIFEST_OUTPUT"
          
          if [ $MANIFEST_EXIT_CODE -eq 0 ]; then
            echo "✅ Manifest extracted"
            
            # Extract the actual version code and version name
            ACTUAL_VERSION_CODE=$(echo "$MANIFEST_OUTPUT" | grep -o 'android:versionCode="[0-9]*"' | grep -o '[0-9]*' | head -1)
            ACTUAL_VERSION_NAME=$(echo "$MANIFEST_OUTPUT" | grep -o 'android:versionName="[^"]*"' | sed 's/android:versionName="//;s/"//' | head -1)
            
            echo "🎯 Version comparison:"
            echo "  Expected VERSION_CODE: '$VERSION_CODE'"
            echo "  Actual VERSION_CODE: '$ACTUAL_VERSION_CODE'"
            echo "  Expected VERSION_NAME: '$VERSION_NAME'"
            echo "  Actual VERSION_NAME: '$ACTUAL_VERSION_NAME'"
            
            # Verify VERSION_CODE - a simple increasing number managed in version.yml
            if [ -z "$ACTUAL_VERSION_CODE" ]; then
              echo "❌ Fatal: could not extract VERSION_CODE from the AAB!"
              echo "🔍 Full manifest:"
              echo "$MANIFEST_OUTPUT"
              exit 1
            elif [ "$ACTUAL_VERSION_CODE" != "$VERSION_CODE" ]; then
              echo "❌ Fatal: the AAB VERSION_CODE does not match the expected value!"
              echo "   Google Play rejects this with a 'version code already used' error."
              echo ""
              echo "🔍 Debug info:"
              echo "   VERSION_CODE in version.yml: $VERSION_CODE"
              echo "   VERSION_CODE inside the AAB: $ACTUAL_VERSION_CODE"
              echo ""
              echo "   Flags passed to flutter build:"
              echo "   --build-name='$VERSION_NAME'"
              echo "   --build-number='$VERSION_CODE'"
              echo ""
              echo "   Full manifest:"
              echo "$MANIFEST_OUTPUT" | grep -E "versionCode|versionName|package"
              exit 1
            else
              echo "✅ VERSION_CODE verified: $ACTUAL_VERSION_CODE"
            fi
            
            # Check the version name too (warning only)
            if [ -z "$ACTUAL_VERSION_NAME" ]; then
              echo "⚠️ Warning: could not extract VERSION_NAME from the AAB"
            elif [ "$ACTUAL_VERSION_NAME" != "$VERSION_NAME" ]; then
              echo "⚠️ Warning: VERSION_NAME does not match the expected value (not fatal)"
              echo "   Expected: '$VERSION_NAME', actual: '$ACTUAL_VERSION_NAME'"
            else
              echo "✅ VERSION_NAME verified: $ACTUAL_VERSION_NAME"
            fi
            
          else
            echo "❌ bundletool could not extract the manifest"
            echo "🔄 Trying a fallback check..."
            
            # Try checking directly with unzip
            echo "📋 Trying direct extraction with unzip..."
            UNZIP_OUTPUT=$(unzip -p "$AAB_FILE" base/manifest/AndroidManifest.xml 2>/dev/null | strings | grep -E "versionCode|versionName")
            
            if [ -n "$UNZIP_OUTPUT" ]; then
              echo "✅ Version extracted with unzip:"
              echo "$UNZIP_OUTPUT"
            else
              echo "❌ Direct extraction with unzip also failed"
              echo "⚠️ Skipping AAB verification and continuing."
            fi
          fi
          
          echo "=========================================="
          echo "✅ AAB built and verified"
          echo "🎯 Final AAB: $AAB_FILE"
          echo "📱 File size: $(du -h "$AAB_FILE" | cut -f1)"
          echo "=========================================="

      # Upload the AAB as an artifact
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          # Artifact actions ignore defaults and always use the repo root, so the APP_ROOT prefix is needed
          path: ${{ env.APP_ROOT }}/build/app/outputs/bundle/release/app-release.aab
          retention-days: 1

  deploy-playstore:
    name: Deploy to Play Store internal testing
    runs-on: ubuntu-latest
    needs: [prepare-build, build-android]
    defaults:
      run:
        working-directory: ${{ env.APP_ROOT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      # Set up the Service Account JSON
      - name: Setup Google Play Service Account
        env:
          SERVICE_ACCOUNT_BASE64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          mkdir -p ~/.config/gcloud
          echo "$SERVICE_ACCOUNT_BASE64" | base64 --decode > ~/.config/gcloud/service-account.json
          echo "✅ Service account JSON set up"

      # Download the AAB
      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: android-aab
          # ⚠️ When the upload path is a single file, upload-artifact uses that file's directory as root
          #    and flattens the path (artifact content = just app-release.aab).
          #    So extracting at the repo root would not restore the original location;
          #    name the same directory as the build job to put it back in place.
          path: ${{ env.APP_ROOT }}/build/app/outputs/bundle/release/

      # Download release notes
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      # Install Ruby and Fastlane
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.4.1"

      - name: Install Fastlane
        working-directory: ${{ env.APP_ROOT }}/android
        run: |
          # multi_json: works around an upstream bug where a google-apis transitive dependency is undeclared (missing in gemspec → Gem::LoadError)
          printf 'source "https://rubygems.org"\ngem "fastlane"\ngem "multi_json"\n' > Gemfile
          bundle install
          echo "✅ Fastlane installed (Bundler)"
          bundle exec fastlane --version

      # Read deploy settings from code (.github/config/store-deploy.json) (#767).
      # Priority: manual run input > config file > repo variable ANDROID_DEPLOY_MODE > store_only.
      # Without the file it does nothing, keeping existing behavior. A mistyped value fails here.
      - name: Resolve store deploy config
        working-directory: ${{ github.workspace }}   # .github/scripts and .github/config are relative to the repo root, not APP_ROOT (#1288)
        env:
          INPUT_DEPLOY_MODE: ${{ github.event.inputs.deploy_mode }}
          # Only a manual run choosing true/false wins over the file (default and push let the file win, #1005)
          INPUT_PROMOTE_TO_CLOSED_TESTING: ${{ github.event.inputs.promote_to_closed_testing }}
        run: python3 .github/scripts/store_deploy_config.py resolve --platform android

      # Keep closed/open promotions from restarting a manually submitted production review in progress (#816).
      # Applies to manual runs too — only runs with force_promote_during_review on skip it (#1005).
      # If the check fails, only warn and proceed as configured — never block the deploy.
      - name: Guard production review in progress
        working-directory: ${{ github.workspace }}   # .github/scripts and .github/config are relative to the repo root, not APP_ROOT (#1288)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PROMOTE_DURING_REVIEW: ${{ github.event.inputs.force_promote_during_review }}
        run: python3 .github/scripts/store_deploy_config.py review-guard

      # Record this run's release mode in the summary — so the run list alone shows what kind of release it was (#1125)
      - name: Summarize store release mode
        run: |
          case "$DEPLOY_MODE" in
            store_submit|appstore_submit)
              if [ "$STORE_RELEASE_MODE" = "manual" ]; then
                effect="Promotes production as a draft: start the rollout in Play Console (that also sends it for review)."
              else
                effect="Sends production for review; it goes live when approved (rollout ${PRODUCTION_ROLLOUT})."
              fi ;;
            *) effect="No effect on this run: deploy mode is ${DEPLOY_MODE}, and only store_submit uses the release mode." ;;
          esac
          {
            echo "### Store release mode: \`${STORE_RELEASE_MODE}\`"
            echo ""
            echo "- Deploy mode: \`${DEPLOY_MODE}\`"
            echo "- ${effect}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "🚦 Store release mode: ${STORE_RELEASE_MODE} / deploy mode: ${DEPLOY_MODE} — ${effect}"

      # Copy the Fastfile (for Play Store deploy)
      # Uses android/fastlane/Fastfile.playstore for consistency
      - name: Copy Fastfile for Play Store
        run: |
          mkdir -p android/fastlane
          cp android/fastlane/Fastfile.playstore android/fastlane/Fastfile
          echo "✅ Fastfile copied (Fastfile.playstore → Fastfile)"

          # If the Fastfile does not read a value the workflow passes, the setting is silently ignored (#766).
          # This really happened with a hand-edited Fastfile, so when a non-default value is passed
          # but the Fastfile lacks that name, warn about it. Not blocking.
          for pair in "DEPLOY_MODE:store_only" "PROMOTE_TO_CLOSED_TESTING:true" "PROMOTE_TO_OPEN_TESTING:false" "PRODUCTION_ROLLOUT:1.0"; do
            name="${pair%%:*}"; default="${pair#*:}"
            eval "value=\"\${$name:-}\""
            if [ -n "$value" ] && [ "$value" != "$default" ] && ! grep -q "$name" android/fastlane/Fastfile.playstore; then
              echo "::warning title=Fastfile does not read $name::The workflow passes $name=$value, but android/fastlane/Fastfile.playstore never mentions this name, so the value is ignored. If you edited the Fastfile yourself, make it read the value."
            fi
          done
          echo "📋 Fastfile contents:"
          cat android/fastlane/Fastfile

      # Upload to the Play Store
      - name: Upload to Play Store Internal Testing
        env:
          PROMOTE_TO_CLOSED_TESTING: ${{ env.PROMOTE_TO_CLOSED_TESTING }}
          PROMOTE_TO_OPEN_TESTING: ${{ env.PROMOTE_TO_OPEN_TESTING }}
          CLOSED_TESTING_TRACK: ${{ env.CLOSED_TESTING_TRACK }}
          OPEN_TESTING_TRACK: ${{ env.OPEN_TESTING_TRACK }}
          STORE_WHATS_NEW_OVERRIDE: ${{ env.STORE_WHATS_NEW_OVERRIDE }}
          # Manual run inputs come in via step env to prevent shell injection
          INPUT_WHATS_NEW_OVERRIDE: ${{ github.event.inputs.whats_new_override }}
        run: |
          echo "=========================================="
          echo "🚀 Starting the Play Store deploy"
          echo "=========================================="
          echo "🕐 Deploy start time: $(date '+%Y-%m-%d %H:%M:%S')"
          echo "🔍 GitHub Run Number: ${{ github.run_number }}"
          echo "🔍 GitHub SHA: ${{ github.sha }}"
          
          # Initialize and validate env vars
          VERSION_CODE="${{ needs.prepare-build.outputs.version_code }}"
          VERSION_NAME="${{ needs.prepare-build.outputs.version }}"
          
          echo "📋 Version to deploy:"
          echo "  VERSION_NAME: '$VERSION_NAME'"
          echo "  VERSION_CODE: '$VERSION_CODE'"
          
          # Validate input
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "❌ Fatal: VERSION_NAME or VERSION_CODE is empty!"
            echo "VERSION_NAME: '$VERSION_NAME'"
            echo "VERSION_CODE: '$VERSION_CODE'"
            echo "This means the prepare-build job outputs were not passed through."
            exit 1
          fi
          
          # Find the absolute AAB path
          AAB_PATH=$(realpath build/app/outputs/bundle/release/app-release.aab)
          echo "📦 AAB file path: $AAB_PATH"

          if [ ! -f "$AAB_PATH" ]; then
            echo "❌ AAB file not found!"
            echo "🔍 Build directory contents:"
            ls -la build/app/outputs/bundle/release/ || echo "Directory does not exist"
            echo "🔍 Full build directory tree:"
            find build/ -name "*.aab" -o -name "*.apk" 2>/dev/null || echo "No AAB/APK file found"
            exit 1
          fi
          
          echo "✅ AAB file exists"
          echo "📋 AAB file info: $(ls -lah "$AAB_PATH")"
          echo "📱 AAB file size: $(du -h "$AAB_PATH" | cut -f1)"
          
          # Verify the AAB version before deploying
          echo "=========================================="
          echo "🔍 Verifying the AAB version..."
          echo "=========================================="
          
          # Download bundletool
          if [ ! -f "bundletool.jar" ]; then
            wget -q "https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar" -O bundletool.jar
          fi
          
          if [ -f "bundletool.jar" ]; then
            MANIFEST_OUTPUT=$(java -jar bundletool.jar dump manifest --bundle="$AAB_PATH" 2>&1)
            
            if [ $? -eq 0 ]; then
              FINAL_VERSION_CODE=$(echo "$MANIFEST_OUTPUT" | grep -o 'android:versionCode="[0-9]*"' | grep -o '[0-9]*' | head -1)
              FINAL_VERSION_NAME=$(echo "$MANIFEST_OUTPUT" | grep -o 'android:versionName="[^"]*"' | sed 's/android:versionName="//;s/"//' | head -1)
              
              echo "📋 AAB version: $FINAL_VERSION_NAME (code: $FINAL_VERSION_CODE)"
              
              # Verify VERSION_CODE
              if [ "$FINAL_VERSION_CODE" != "$VERSION_CODE" ]; then
                echo "❌ Error: the AAB version code does not match! (expected: $VERSION_CODE, actual: $FINAL_VERSION_CODE)"
                exit 1
              fi
              
              echo "✅ Version verified"
            else
              echo "⚠️ Version check failed, continuing the deploy"
            fi
          fi

          # Prepare release notes
          CHANGELOG_DIR="android/fastlane/metadata/android/ko-KR/changelogs"
          mkdir -p "$CHANGELOG_DIR"

          # >>> whats-new — decides where the release notes come from. A test (test_store_whats_new.py) runs only this block.
          # Priority: manual run input → env STORE_WHATS_NEW_OVERRIDE → CHANGELOG. A whitespace-only value counts as missing.
          WHATS_NEW_OVERRIDE="$INPUT_WHATS_NEW_OVERRIDE"
          if [ -z "$(printf '%s' "$WHATS_NEW_OVERRIDE" | tr -d '[:space:]')" ]; then
            WHATS_NEW_OVERRIDE="$STORE_WHATS_NEW_OVERRIDE"
          fi
          if [ -n "$(printf '%s' "$WHATS_NEW_OVERRIDE" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$WHATS_NEW_OVERRIDE" > "$GITHUB_WORKSPACE/final_release_notes.txt"
            echo "📝 Release notes source: STORE_WHATS_NEW_OVERRIDE override"
          else
            echo "📝 Release notes source: CHANGELOG"
          fi
          # <<< whats-new

          if [ -f "$GITHUB_WORKSPACE/final_release_notes.txt" ]; then
            # Truncate to the Google Play release notes limit (500 characters; 480 with margin)
            # final_release_notes.txt and the truncate script are relative to the repo root — working-directory is APP_ROOT, so use absolute paths
            bash "$GITHUB_WORKSPACE/.github/scripts/truncate_release_notes.sh" "$GITHUB_WORKSPACE/final_release_notes.txt" 480 char
            cp "$GITHUB_WORKSPACE/final_release_notes.txt" "$CHANGELOG_DIR/${VERSION_CODE}.txt"
            echo "✅ Changelog ready (version code: $VERSION_CODE)"
          else
            # Default text for the ko-KR store release notes (store language, #769)
            echo "v$VERSION_NAME 업데이트" > "$CHANGELOG_DIR/${VERSION_CODE}.txt"
            echo "⚠️ Created the default changelog (version code: $VERSION_CODE)"
          fi

          # Per-language release notes (#829) — only when version.yml has store_locales.
          # Otherwise it does nothing and the single ko-KR file made above is uploaded (existing behavior).
          # Languages without a translation are filled with the default-language text (never left empty).
          python3 "$GITHUB_WORKSPACE/.github/scripts/store_notes.py" write --platform play \
            --workspace "$GITHUB_WORKSPACE" --app-root "$PWD" --version "$VERSION_NAME" --version-code "$VERSION_CODE" \
            --default-file "$CHANGELOG_DIR/${VERSION_CODE}.txt" || echo "⚠️ Could not prepare per-language release notes, continuing with the default changelog"
          
          # Check the Service Account JSON file
          GOOGLE_PLAY_JSON_KEY="$HOME/.config/gcloud/service-account.json"
          if [ ! -f "$GOOGLE_PLAY_JSON_KEY" ]; then
            echo "❌ Service account JSON file not found"
            exit 1
          fi
          
          # Set env vars
          export AAB_PATH="$AAB_PATH"
          export GOOGLE_PLAY_JSON_KEY="$GOOGLE_PLAY_JSON_KEY"
          export VERSION_NAME="$VERSION_NAME"
          export VERSION_CODE="$VERSION_CODE"
          
          # Deploy
          echo "=========================================="
          echo "🚀 Running the Play Store deploy"
          echo "🎯 Version: $VERSION_NAME (code: $VERSION_CODE)"
          echo "=========================================="
          
          cd android
          bundle exec fastlane deploy_internal

      # Success notice
      - name: Notify Play Store Upload Success
        if: success()
        run: |
          echo "✅ Deployed to Play Store internal testing!"
          echo "Version: ${{ needs.prepare-build.outputs.version }} (${{ needs.prepare-build.outputs.version_code }})"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "📱 How testers get it:"
          echo "1. Play Console → Test and release → Internal testing"
          echo "2. Share the test link with testers"
          # The Play Console URL differs per project, so it needs separate setup

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Play Store deploy failed!"
          echo "Check the logs."
