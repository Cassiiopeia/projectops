# ===================================================================
# React CI/CD deploy
# ===================================================================
#
# Builds and deploys the Docker image on a push to main.
#
# ===================================================================
# 🔑 Required GitHub Secrets
# ===================================================================
# ENV_FILE: contents of the .env file
# DOCKERHUB_USERNAME: DockerHub user name
# DOCKERHUB_TOKEN: DockerHub access token
# SERVER_HOST: deploy server address
# SERVER_USER: SSH user name
# SERVER_PASSWORD: SSH password
# PROJECT_DEPLOY_PORT (optional): deploy port (default: 3000)
# ===================================================================

name: PROJECT-REACT-CICD

on:
  push:
    branches:
      - main
    # @wizard paths-anchor (for monorepos the integrator injects the paths filter here)
  workflow_dispatch:

permissions:
  # GITHUB_TOKEN only reads. Declaring it keeps this workflow from gaining more permissions than needed
  # even if the repo default later changes to write (#595).
  contents: read

env:
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo
  DOCKER_IMAGE_PREFIX: "front-container"
  NODE_VERSION: "20.15.0"
  ENV_FILE_NAME: ".env"

jobs:
  build:
    name: Build React/Next.js application
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source
      - name: Check out code
        uses: actions/checkout@v5

      # Preflight (#666)
      # Right after a fresh install, a missing Secret or Dockerfile is normal. Left alone, after the build it fails at
      # login, docker build or SSH with a single line whose cause is hard to see, so the first step reports it.
      # The deploy job depends on build, so SERVER_* is checked here too. Repos with every prerequisite pass unchanged.
      - name: Preflight check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          fail=0
          # Dockerfile check: without it, docker build only says "failed to read dockerfile"
          if [ ! -f "./Dockerfile" ]; then
            echo "::error title=Preflight check::Dockerfile (./Dockerfile) is missing. Add a Dockerfile to the project root and commit it."
            fail=1
          fi
          # Secret check: empty values cause unclear errors at login and SSH (this workflow uses password SSH only)
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN SERVER_HOST SERVER_USER SERVER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Preflight check::Secret ${name} is missing. Add it under Settings > Secrets and variables > Actions > New repository secret"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "✅ Preflight check passed"

      # Detect the package manager (#669)
      # setup-node's cache fails from the first step with "Dependencies lock file is not found" when there is no lock file or with pnpm.
      # The npm (package-lock.json) path that already worked comes first,
      # then pnpm, then yarn; with no lock file at all it falls back to npm install without cache.
      - name: Detect package manager
        id: pm
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            manager=npm; cache=npm
          elif [ -f pnpm-lock.yaml ]; then
            manager=pnpm; cache=pnpm
          elif [ -f yarn.lock ]; then
            manager=yarn; cache=yarn
          else
            manager=none; cache=""
            echo "::notice::No lock file (package-lock.json, pnpm-lock.yaml, yarn.lock), installing with npm install. Commit a lock file for reproducible builds."
          fi
          echo "manager=$manager" >> "$GITHUB_OUTPUT"
          echo "cache=$cache" >> "$GITHUB_OUTPUT"
          echo "📦 Package manager: $manager"

      # pnpm and yarn must be available before setup-node's cache setting (uses Node's bundled corepack)
      - name: Enable Corepack
        if: steps.pm.outputs.manager == 'pnpm' || steps.pm.outputs.manager == 'yarn'
        run: corepack enable

      # 2. Set up the Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.pm.outputs.cache }}

      # 3. Create the env file
      - name: Create environment file (${{ env.ENV_FILE_NAME }})
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > ./${{ env.ENV_FILE_NAME }}
          echo "✅ ${{ env.ENV_FILE_NAME }} file created"

      # 4. Cache npm dependencies
      - name: Cache npm dependencies
        if: steps.pm.outputs.manager == 'npm' || steps.pm.outputs.manager == 'none'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 5. Cache node_modules
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          # Without a lock file the hash is empty, the key is fixed, and old caches are used even if package.json changes — use the package.json hash only then
          key: ${{ runner.os }}-node-modules-${{ steps.pm.outputs.manager == 'none' && hashFiles('**/package.json') || hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # 6. Install dependencies
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        env:
          PM: ${{ steps.pm.outputs.manager }}
        run: |
          echo "📦 Installing dependencies... ($PM)"
          case "$PM" in
            npm)  npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn)
              # Yarn Berry (.yarnrc.yml) uses --immutable, Classic uses --frozen-lockfile
              if [ -f .yarnrc.yml ]; then yarn install --immutable; else yarn install --frozen-lockfile; fi ;;
            *)    npm install ;;
          esac
          echo "✅ Dependencies installed"

      # 7. Cache the Next.js build
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      # 8. Build the project
      - name: Build with npm
        run: npm run build

      # 9. Set up the Docker build environment
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 10. Log in to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 11. Cache Docker layers
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # 12. Build and push the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-${{ env.DOCKER_IMAGE_PREFIX }}:${{ github.ref_name }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # 13. Clean up the Docker cache
      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy:
    name: Deploy to remote server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 2022
          envs: SERVER_PASSWORD
          script: |
            set -e

            # ============================================================
            # Deploy environment variables
            # ============================================================
            echo "🔧 Setting environment variables.."
            export PATH=$PATH:/usr/local/bin
            export PW="${SERVER_PASSWORD}"
            SUDO() { echo "$PW" | sudo -S "$@"; }

            # Branch name passed from GitHub
            BRANCH=${{ github.ref_name }}

            # Project settings
            PROJECT_NAME="${{ env.PROJECT_NAME }}"

            # ============================================================
            # Port and container name per branch
            # ============================================================
            # Defaults
            PORT=3000
            CONTAINER_NAME="${PROJECT_NAME}-front"

            # Settings per branch
            if [ "$BRANCH" == "main" ]; then
              # 🚀 Deploy environment (main branch)
              # Uses the PROJECT_DEPLOY_PORT value from GitHub Secrets
              # Defaults to 3000 if unset
              PORT=${{ secrets.PROJECT_DEPLOY_PORT || '3000' }}
              CONTAINER_NAME="${PROJECT_NAME}-front-deploy"
              echo "🚀 Deploying to the deploy environment (branch: $BRANCH)"

            else
              # ⚠️ Other branches (unexpected branch)
              echo "⚠️ Unsupported branch: $BRANCH"
              echo "This workflow supports the main branch only."
              echo "Set the branches to support in on.push.branches."
              exit 1
            fi

            # Print settings
            echo "📋 Deploy settings:"
            echo "  - Branch: $BRANCH"
            echo "  - Project: $PROJECT_NAME"
            echo "  - Container name: $CONTAINER_NAME"
            echo "  - Port: $PORT"
            echo "  - Docker image: ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}-${{ env.DOCKER_IMAGE_PREFIX }}:${BRANCH}"

            # ============================================================
            # Pull the Docker image
            # ============================================================
            echo "⬇️ Pulling Docker image: ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}-${{ env.DOCKER_IMAGE_PREFIX }}:${BRANCH}"
            echo $PW | sudo -S docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}-${{ env.DOCKER_IMAGE_PREFIX }}:${BRANCH}

            # Container start lives in a function so a failed deploy can restore the previous image with the same options (#730)
            start_container() {
              # Also covers Next.js SSR containers (next type merged in — includes NODE_ENV/restart policy)
              SUDO docker run -d \
                -p ${PORT}:3000 \
                --name $CONTAINER_NAME \
                -e TZ=Asia/Seoul \
                -e NODE_ENV=production \
                -v /etc/localtime:/etc/localtime:ro \
                --restart unless-stopped \
                "$1"
            }

            # If the swap fails, remove the failed container and restore the previous image (#730)
            PREV_IMAGE=""
            REPLACING=false
            DEPLOY_OK=false
            rollback_on_failure() {
              status=$?
              if [ "$REPLACING" = "true" ] && [ "$DEPLOY_OK" != "true" ]; then
                echo "⚠️ Deploy failed: removing the failed container"
                SUDO docker rm -f $CONTAINER_NAME >/dev/null 2>&1 || true
                if [ -n "$PREV_IMAGE" ]; then
                  echo "↩️ Restoring the previous version: $PREV_IMAGE"
                  if start_container "$PREV_IMAGE"; then
                    echo "✅ Previous version restored (this deploy is still marked as failed)"
                  else
                    echo "❌ Failed to restore the previous version"
                  fi
                else
                  echo "ℹ️ No container was running before, so there is no version to restore"
                fi
              fi
              exit $status
            }
            trap rollback_on_failure EXIT

            # ============================================================
            # Clean up the existing container
            # ============================================================
            echo "🧹 Checking whether container $CONTAINER_NAME exists..."

            # Check whether a container with the same name exists
            # Remember the previous image ID (it can be restored by ID even after the tag moves to the new image)
            PREV_IMAGE=$(SUDO docker inspect --format '{{.Image}}' $CONTAINER_NAME 2>/dev/null || true)
            REPLACING=true
            if sudo docker ps -a --format '{{.Names}}' | grep -Eq "^${CONTAINER_NAME}\$"; then
              echo "⚠️ Container $CONTAINER_NAME exists. Stopping and removing it..."
              echo $PW | sudo -S docker rm -f $CONTAINER_NAME
              echo "✅ Container $CONTAINER_NAME removed."
            else
              echo "ℹ️ No existing container $CONTAINER_NAME."
            fi

            # ============================================================
            # Run the new container
            # ============================================================
            echo "🚀 Starting new container $CONTAINER_NAME..."

            start_container ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}-${{ env.DOCKER_IMAGE_PREFIX }}:${BRANCH}

            # Startup check: if the container dies at once or keeps restarting, mark the deploy failed and restore (#730)
            echo "⏳ Checking that the container started... (10s)"
            sleep 10
            if [ "$(SUDO docker inspect -f '{{.State.Running}}' $CONTAINER_NAME 2>/dev/null)" != "true" ] \
               || [ "$(SUDO docker inspect -f '{{.State.Restarting}}' $CONTAINER_NAME 2>/dev/null)" = "true" ]; then
              echo "❌ Container $CONTAINER_NAME did not start correctly"
              SUDO docker logs --tail 50 $CONTAINER_NAME || true
              exit 1
            fi
            echo "✅ Container is running"

            # ============================================================
            # Confirm the deploy
            # ============================================================
            DEPLOY_OK=true
            echo "✅ Deploy completed successfully!"
            echo ""
            echo "📋 Deploy summary:"
            echo "  🎯 Project: $PROJECT_NAME"
            echo "  🌿 Branch: $BRANCH"
            echo "  🐳 Container: $CONTAINER_NAME"
            echo "  🌐 Port: $PORT"
            echo "  ⏰ Deployed at: $(date '+%Y-%m-%d %H:%M:%S')"
            echo ""
            echo "🔗 URL: http://${{ secrets.SERVER_HOST }}:${PORT}"

# ===================================================================
# Usage example - main branch
# ===================================================================
#
# Current setting: deploy automatically on a push to main
#
# Port per branch:
# - main: 3000 (changeable with the PROJECT_DEPLOY_PORT secret)
#
# Required Secrets:
# - REACT_ENV_FILE, DOCKERHUB_*, SERVER_* (required)
# - PROJECT_DEPLOY_PORT (optional, default: 3000)
#
# ===================================================================

