# ===================================================================
# React CI/CD 배포
# ===================================================================
#
# main 브랜치 푸시 시 Docker 이미지를 빌드하고 배포합니다.
#
# ===================================================================
# 🔑 필수 GitHub Secrets
# ===================================================================
# ENV_FILE: .env 파일 내용
# DOCKERHUB_USERNAME: DockerHub 사용자명
# DOCKERHUB_TOKEN: DockerHub 액세스 토큰
# SERVER_HOST: 배포 서버 주소
# SERVER_USER: SSH 사용자명
# SERVER_PASSWORD: SSH 비밀번호
# PROJECT_DEPLOY_PORT (선택): 배포 포트 (기본: 3000)
# ===================================================================

name: PROJECT-REACT-CICD

on:
  push:
    branches:
      - main
    # @wizard paths-anchor (모노레포일 때 integrator가 paths 필터를 여기 주입)
  workflow_dispatch:

permissions:
  # GITHUB_TOKEN 으로는 읽기만 한다. 명시해 두면 레포 기본값이 나중에 write 로 바뀌어도
  # 이 워크플로우가 필요 이상의 권한을 갖지 않는다 (#595).
  contents: read

env:
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo
  DOCKER_IMAGE_PREFIX: "front-container"
  NODE_VERSION: "20.15.0"
  ENV_FILE_NAME: ".env"

jobs:
  build:
    name: Build React/Next.js application
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Check out code
        uses: actions/checkout@v5

      # 사전 점검 (#666)
      # 신규 설치 직후에는 Secret, Dockerfile 이 없는 것이 정상이다. 그대로 두면 빌드가 끝난 뒤
      # 로그인, docker build, SSH 접속 단계에서 원인을 짚기 어려운 한 줄로 실패하므로 첫 step 에서 알린다.
      # deploy job 은 build 에 의존하므로 SERVER_* 도 여기서 함께 본다. 전제가 갖춰진 레포는 그대로 통과한다.
      - name: Preflight check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          fail=0
          # Dockerfile 점검: 없으면 docker build 단계에서 "failed to read dockerfile" 로만 알려준다
          if [ ! -f "./Dockerfile" ]; then
            echo "::error title=Preflight check::Dockerfile (./Dockerfile) is missing. Add a Dockerfile to the project root and commit it."
            fail=1
          fi
          # Secret 점검: 빈 값이면 로그인, SSH 접속 단계에서 원인 불명 에러가 난다 (이 워크플로는 비밀번호 방식 SSH 만 쓴다)
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN SERVER_HOST SERVER_USER SERVER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Preflight check::Secret ${name} is missing. Add it under Settings > Secrets and variables > Actions > New repository secret"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "✅ Preflight check passed"

      # 패키지 매니저 감지 (#669)
      # setup-node 의 cache 는 lock 파일이 없거나 pnpm 이면 "Dependencies lock file is not found" 로
      # 첫 step 부터 실패한다. 기존에 동작하던 npm(package-lock.json) 경로가 최우선이고,
      # 그 다음 pnpm, yarn 순으로 보며 lock 이 전혀 없으면 캐시 없이 npm install 로 폴백한다.
      - name: Detect package manager
        id: pm
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            manager=npm; cache=npm
          elif [ -f pnpm-lock.yaml ]; then
            manager=pnpm; cache=pnpm
          elif [ -f yarn.lock ]; then
            manager=yarn; cache=yarn
          else
            manager=none; cache=""
            echo "::notice::No lock file (package-lock.json, pnpm-lock.yaml, yarn.lock), installing with npm install. Commit a lock file for reproducible builds."
          fi
          echo "manager=$manager" >> "$GITHUB_OUTPUT"
          echo "cache=$cache" >> "$GITHUB_OUTPUT"
          echo "📦 Package manager: $manager"

      # pnpm, yarn 은 setup-node 의 캐시 설정보다 먼저 사용 가능해야 한다 (Node 번들 corepack 사용)
      - name: Enable Corepack
        if: steps.pm.outputs.manager == 'pnpm' || steps.pm.outputs.manager == 'yarn'
        run: corepack enable

      # 2. Node.js 개발 환경 설정
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.pm.outputs.cache }}

      # 3. 환경변수 파일 생성
      - name: Create environment file (${{ env.ENV_FILE_NAME }})
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > ./${{ env.ENV_FILE_NAME }}
          echo "✅ ${{ env.ENV_FILE_NAME }} file created"

      # 4. npm 의존성 캐싱
      - name: Cache npm dependencies
        if: steps.pm.outputs.manager == 'npm' || steps.pm.outputs.manager == 'none'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 5. node_modules 캐싱
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          # lock 파일이 없으면 해시가 빈 값이라 키가 고정되어 package.json 이 바뀌어도 옛 캐시를 쓴다 — 그 경우만 package.json 해시를 쓴다
          key: ${{ runner.os }}-node-modules-${{ steps.pm.outputs.manager == 'none' && hashFiles('**/package.json') || hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # 6. 의존성 설치
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        env:
          PM: ${{ steps.pm.outputs.manager }}
        run: |
          echo "📦 Installing dependencies... ($PM)"
          case "$PM" in
            npm)  npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn)
              # Yarn Berry(.yarnrc.yml)는 --immutable, Classic 은 --frozen-lockfile
              if [ -f .yarnrc.yml ]; then yarn install --immutable; else yarn install --frozen-lockfile; fi ;;
            *)    npm install ;;
          esac
          echo "✅ Dependencies installed"

      # 7. Next.js 빌드 캐싱
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      # 8. 프로젝트 빌드
      - name: Build with npm
        run: npm run build

      # 9. Docker 빌드 환경 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 10. DockerHub 로그인
      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 11. Docker 레이어 캐싱
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # 12. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-${{ env.DOCKER_IMAGE_PREFIX }}:${{ github.ref_name }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # 13. Docker 캐시 정리
      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy:
    name: Deploy to remote server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 2022
          envs: SERVER_PASSWORD
          script: |
            set -e

            # ============================================================
            # 배포 환경 변수 설정
            # ============================================================
            echo "🔧 Setting environment variables.."
            export PATH=$PATH:/usr/local/bin
            export PW="${SERVER_PASSWORD}"
            SUDO() { echo "$PW" | sudo -S "$@"; }

            # GitHub에서 전달받은 브랜치명
            BRANCH=${{ github.ref_name }}

            # 프로젝트 설정
            PROJECT_NAME="${{ env.PROJECT_NAME }}"

            # ============================================================
            # 브랜치별 포트 및 컨테이너명 설정
            # ============================================================
            # 기본값 설정
            PORT=3000
            CONTAINER_NAME="${PROJECT_NAME}-front"

            # 브랜치에 따른 환경별 설정
            if [ "$BRANCH" == "main" ]; then
              # 🚀 배포 환경 (main 브랜치)
              # GitHub Secrets의 PROJECT_DEPLOY_PORT 환경변수 사용
              # 설정되어 있지 않으면 기본값 3000 사용
              PORT=${{ secrets.PROJECT_DEPLOY_PORT || '3000' }}
              CONTAINER_NAME="${PROJECT_NAME}-front-deploy"
              echo "🚀 Deploying to the deploy environment (branch: $BRANCH)"

            else
              # ⚠️ 기타 브랜치 (예상치 못한 브랜치)
              echo "⚠️ Unsupported branch: $BRANCH"
              echo "This workflow supports the main branch only."
              echo "Set the branches to support in on.push.branches."
              exit 1
            fi

            # 설정 정보 출력
            echo "📋 Deploy settings:"
            echo "  - Branch: $BRANCH"
            echo "  - Project: $PROJECT_NAME"
            echo "  - Container name: $CONTAINER_NAME"
            echo "  - Port: $PORT"
            echo "  - Docker image: ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}-${{ env.DOCKER_IMAGE_PREFIX }}:${BRANCH}"

            # ============================================================
            # Docker 이미지 풀 (Pull)
            # ============================================================
            echo "⬇️ Pulling Docker image: ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}-${{ env.DOCKER_IMAGE_PREFIX }}:${BRANCH}"
            echo $PW | sudo -S docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}-${{ env.DOCKER_IMAGE_PREFIX }}:${BRANCH}

            # 컨테이너 시작을 함수로 둬서 배포 실패 시 이전 이미지로 같은 옵션으로 복구할 수 있게 한다 (#730)
            start_container() {
              # Next.js SSR 컨테이너도 커버 (next 타입 흡수 — NODE_ENV/restart 정책 포함)
              SUDO docker run -d \
                -p ${PORT}:3000 \
                --name $CONTAINER_NAME \
                -e TZ=Asia/Seoul \
                -e NODE_ENV=production \
                -v /etc/localtime:/etc/localtime:ro \
                --restart unless-stopped \
                "$1"
            }

            # 교체 중 실패하면 실패한 컨테이너를 지우고 이전 이미지로 복구한다 (#730)
            PREV_IMAGE=""
            REPLACING=false
            DEPLOY_OK=false
            rollback_on_failure() {
              status=$?
              if [ "$REPLACING" = "true" ] && [ "$DEPLOY_OK" != "true" ]; then
                echo "⚠️ Deploy failed: removing the failed container"
                SUDO docker rm -f $CONTAINER_NAME >/dev/null 2>&1 || true
                if [ -n "$PREV_IMAGE" ]; then
                  echo "↩️ Restoring the previous version: $PREV_IMAGE"
                  if start_container "$PREV_IMAGE"; then
                    echo "✅ Previous version restored (this deploy is still marked as failed)"
                  else
                    echo "❌ Failed to restore the previous version"
                  fi
                else
                  echo "ℹ️ No container was running before, so there is no version to restore"
                fi
              fi
              exit $status
            }
            trap rollback_on_failure EXIT

            # ============================================================
            # 기존 컨테이너 정리
            # ============================================================
            echo "🧹 Checking whether container $CONTAINER_NAME exists..."

            # 동일한 이름의 컨테이너가 존재하는지 확인
            # 이전 이미지 ID 를 기억해 둔다 (태그가 새 이미지로 옮겨가도 ID 로 복구할 수 있다)
            PREV_IMAGE=$(SUDO docker inspect --format '{{.Image}}' $CONTAINER_NAME 2>/dev/null || true)
            REPLACING=true
            if sudo docker ps -a --format '{{.Names}}' | grep -Eq "^${CONTAINER_NAME}\$"; then
              echo "⚠️ Container $CONTAINER_NAME exists. Stopping and removing it..."
              echo $PW | sudo -S docker rm -f $CONTAINER_NAME
              echo "✅ Container $CONTAINER_NAME removed."
            else
              echo "ℹ️ No existing container $CONTAINER_NAME."
            fi

            # ============================================================
            # 새 컨테이너 실행
            # ============================================================
            echo "🚀 Starting new container $CONTAINER_NAME..."

            start_container ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}-${{ env.DOCKER_IMAGE_PREFIX }}:${BRANCH}

            # 기동 확인: 컨테이너가 바로 죽거나 재시작을 반복하면 배포를 실패로 처리하고 복구한다 (#730)
            echo "⏳ Checking that the container started... (10s)"
            sleep 10
            if [ "$(SUDO docker inspect -f '{{.State.Running}}' $CONTAINER_NAME 2>/dev/null)" != "true" ] \
               || [ "$(SUDO docker inspect -f '{{.State.Restarting}}' $CONTAINER_NAME 2>/dev/null)" = "true" ]; then
              echo "❌ Container $CONTAINER_NAME did not start correctly"
              SUDO docker logs --tail 50 $CONTAINER_NAME || true
              exit 1
            fi
            echo "✅ Container is running"

            # ============================================================
            # 배포 완료 확인
            # ============================================================
            DEPLOY_OK=true
            echo "✅ Deploy completed successfully!"
            echo ""
            echo "📋 Deploy summary:"
            echo "  🎯 Project: $PROJECT_NAME"
            echo "  🌿 Branch: $BRANCH"
            echo "  🐳 Container: $CONTAINER_NAME"
            echo "  🌐 Port: $PORT"
            echo "  ⏰ Deployed at: $(date '+%Y-%m-%d %H:%M:%S')"
            echo ""
            echo "🔗 URL: http://${{ secrets.SERVER_HOST }}:${PORT}"

# ===================================================================
# 사용 예시 - main 브랜치 사용
# ===================================================================
#
# 현재 설정: main 브랜치에 push할 때 자동 배포
#
# 브랜치별 포트:
# - main: 3000 (PROJECT_DEPLOY_PORT secret으로 변경 가능)
#
# 필요한 Secrets:
# - REACT_ENV_FILE, DOCKERHUB_*, SERVER_* (필수)
# - PROJECT_DEPLOY_PORT (선택, 기본값: 3000)
#
# ===================================================================

