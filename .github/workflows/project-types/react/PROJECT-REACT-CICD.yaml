# ===================================================================
# React CI/CD 배포
# ===================================================================
#
# main 브랜치 푸시 시 Docker 이미지를 빌드하고 배포합니다.
#
# ===================================================================
# 🔑 필수 GitHub Secrets
# ===================================================================
# ENV_FILE: .env 파일 내용
# DOCKERHUB_USERNAME: DockerHub 사용자명
# DOCKERHUB_TOKEN: DockerHub 액세스 토큰
# SERVER_HOST: 배포 서버 주소
# SERVER_USER: SSH 사용자명
# SERVER_PASSWORD: SSH 비밀번호
# PROJECT_DEPLOY_PORT (선택): 배포 포트 (기본: 3000)
# ===================================================================

name: PROJECT-REACT-CICD

on:
  push:
    branches:
      - main
    # @wizard paths-anchor (모노레포일 때 integrator가 paths 필터를 여기 주입)
  workflow_dispatch:

permissions:
  # GITHUB_TOKEN 으로는 읽기만 한다. 명시해 두면 레포 기본값이 나중에 write 로 바뀌어도
  # 이 워크플로우가 필요 이상의 권한을 갖지 않는다 (#595).
  contents: read

env:
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo
  DOCKER_IMAGE_PREFIX: "front-container"
  NODE_VERSION: "20.15.0"
  ENV_FILE_NAME: ".env"

jobs:
  build:
    name: React/Next.js 애플리케이션 빌드
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      # 사전 점검 (#666)
      # 신규 설치 직후에는 Secret, Dockerfile 이 없는 것이 정상이다. 그대로 두면 빌드가 끝난 뒤
      # 로그인, docker build, SSH 접속 단계에서 원인을 짚기 어려운 한 줄로 실패하므로 첫 step 에서 알린다.
      # deploy job 은 build 에 의존하므로 SERVER_* 도 여기서 함께 본다. 전제가 갖춰진 레포는 그대로 통과한다.
      - name: 배포 전제 사전 점검
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          fail=0
          # Dockerfile 점검: 없으면 docker build 단계에서 "failed to read dockerfile" 로만 알려준다
          if [ ! -f "./Dockerfile" ]; then
            echo "::error title=배포 사전 점검::Dockerfile(./Dockerfile)이 없습니다. 프로젝트 루트에 Dockerfile 을 추가하고 커밋하세요."
            fail=1
          fi
          # Secret 점검: 빈 값이면 로그인, SSH 접속 단계에서 원인 불명 에러가 난다 (이 워크플로는 비밀번호 방식 SSH 만 쓴다)
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN SERVER_HOST SERVER_USER SERVER_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=배포 사전 점검::Secret ${name} 이(가) 없습니다. Settings > Secrets and variables > Actions > New repository secret 에서 등록하세요"
              fail=1
            fi
          done
          [ "$fail" = "0" ] || exit 1
          echo "✅ 사전 점검 통과"

      # 패키지 매니저 감지 (#669)
      # setup-node 의 cache 는 lock 파일이 없거나 pnpm 이면 "Dependencies lock file is not found" 로
      # 첫 step 부터 실패한다. 기존에 동작하던 npm(package-lock.json) 경로가 최우선이고,
      # 그 다음 pnpm, yarn 순으로 보며 lock 이 전혀 없으면 캐시 없이 npm install 로 폴백한다.
      - name: 패키지 매니저 감지
        id: pm
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            manager=npm; cache=npm
          elif [ -f pnpm-lock.yaml ]; then
            manager=pnpm; cache=pnpm
          elif [ -f yarn.lock ]; then
            manager=yarn; cache=yarn
          else
            manager=none; cache=""
            echo "::notice::lock 파일(package-lock.json, pnpm-lock.yaml, yarn.lock)이 없어 npm install 로 설치합니다. 재현 가능한 빌드를 위해 lock 파일을 커밋하세요."
          fi
          echo "manager=$manager" >> "$GITHUB_OUTPUT"
          echo "cache=$cache" >> "$GITHUB_OUTPUT"
          echo "📦 패키지 매니저: $manager"

      # pnpm, yarn 은 setup-node 의 캐시 설정보다 먼저 사용 가능해야 한다 (Node 번들 corepack 사용)
      - name: Corepack 활성화
        if: steps.pm.outputs.manager == 'pnpm' || steps.pm.outputs.manager == 'yarn'
        run: corepack enable

      # 2. Node.js 개발 환경 설정
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.pm.outputs.cache }}

      # 3. 환경변수 파일 생성
      - name: 환경변수 파일 생성 (${{ env.ENV_FILE_NAME }})
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > ./${{ env.ENV_FILE_NAME }}
          echo "✅ ${{ env.ENV_FILE_NAME }} 파일 생성 완료"

      # 4. npm 의존성 캐싱
      - name: npm 의존성 캐싱
        if: steps.pm.outputs.manager == 'npm' || steps.pm.outputs.manager == 'none'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 5. node_modules 캐싱
      - name: node_modules 캐싱
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          # lock 파일이 없으면 해시가 빈 값이라 키가 고정되어 package.json 이 바뀌어도 옛 캐시를 쓴다 — 그 경우만 package.json 해시를 쓴다
          key: ${{ runner.os }}-node-modules-${{ steps.pm.outputs.manager == 'none' && hashFiles('**/package.json') || hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # 6. 의존성 설치
      - name: 의존성 설치
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        env:
          PM: ${{ steps.pm.outputs.manager }}
        run: |
          echo "📦 의존성 설치 중... ($PM)"
          case "$PM" in
            npm)  npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn)
              # Yarn Berry(.yarnrc.yml)는 --immutable, Classic 은 --frozen-lockfile
              if [ -f .yarnrc.yml ]; then yarn install --immutable; else yarn install --frozen-lockfile; fi ;;
            *)    npm install ;;
          esac
          echo "✅ 의존성 설치 완료"

      # 7. Next.js 빌드 캐싱
      - name: Next.js 빌드 캐싱
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      # 8. 프로젝트 빌드
      - name: Build with npm
        run: npm run build

      # 9. Docker 빌드 환경 설정
      - name: Docker 빌드환경 설정
        uses: docker/setup-buildx-action@v3

      # 10. DockerHub 로그인
      - name: DockerHub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 11. Docker 레이어 캐싱
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ hashFiles('Dockerfile') }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      # 12. Docker 이미지 빌드 및 푸시
      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}-${{ env.DOCKER_IMAGE_PREFIX }}:${{ github.ref_name }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # 13. Docker 캐시 정리
      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy:
    name: 원격 서버 배포
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 2022
          script: |
            set -e

            # ============================================================
            # 배포 환경 변수 설정
            # ============================================================
            echo "🔧 환경변수 설정.."
            export PATH=$PATH:/usr/local/bin
            export PW=${{ secrets.SERVER_PASSWORD }}

            # GitHub에서 전달받은 브랜치명
            BRANCH=${{ github.ref_name }}

            # 프로젝트 설정
            PROJECT_NAME="${{ env.PROJECT_NAME }}"

            # ============================================================
            # 브랜치별 포트 및 컨테이너명 설정
            # ============================================================
            # 기본값 설정
            PORT=3000
            CONTAINER_NAME="${PROJECT_NAME}-front"

            # 브랜치에 따른 환경별 설정
            if [ "$BRANCH" == "main" ]; then
              # 🚀 배포 환경 (main 브랜치)
              # GitHub Secrets의 PROJECT_DEPLOY_PORT 환경변수 사용
              # 설정되어 있지 않으면 기본값 3000 사용
              PORT=${{ secrets.PROJECT_DEPLOY_PORT || '3000' }}
              CONTAINER_NAME="${PROJECT_NAME}-front-deploy"
              echo "🚀 배포 환경으로 배포합니다 (브랜치: $BRANCH)"

            else
              # ⚠️ 기타 브랜치 (예상치 못한 브랜치)
              echo "⚠️ 지원하지 않는 브랜치입니다: $BRANCH"
              echo "이 워크플로우는 main 브랜치만 지원합니다."
              echo "on.push.branches에서 지원할 브랜치를 설정하세요."
              exit 1
            fi

            # 설정 정보 출력
            echo "📋 배포 설정 정보:"
            echo "  - 브랜치: $BRANCH"
            echo "  - 프로젝트: $PROJECT_NAME"
            echo "  - 컨테이너 이름: $CONTAINER_NAME"
            echo "  - 포트: $PORT"
            echo "  - Docker 이미지: ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}-${{ env.DOCKER_IMAGE_PREFIX }}:${BRANCH}"

            # ============================================================
            # Docker 이미지 풀 (Pull)
            # ============================================================
            echo "⬇️ Docker 이미지 풀: ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}-${{ env.DOCKER_IMAGE_PREFIX }}:${BRANCH}"
            echo $PW | sudo -S docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}-${{ env.DOCKER_IMAGE_PREFIX }}:${BRANCH}

            # ============================================================
            # 기존 컨테이너 정리
            # ============================================================
            echo "🧹 컨테이너 $CONTAINER_NAME 존재 여부 확인 중..."

            # 동일한 이름의 컨테이너가 존재하는지 확인
            if sudo docker ps -a --format '{{.Names}}' | grep -Eq "^${CONTAINER_NAME}\$"; then
              echo "⚠️ 컨테이너 $CONTAINER_NAME 이(가) 존재합니다. 중지 및 삭제 중..."
              echo $PW | sudo -S docker rm -f $CONTAINER_NAME
              echo "✅ 컨테이너 $CONTAINER_NAME 이(가) 삭제되었습니다."
            else
              echo "ℹ️ 존재하는 컨테이너 $CONTAINER_NAME 이(가) 없습니다."
            fi

            # ============================================================
            # 새 컨테이너 실행
            # ============================================================
            echo "🚀 새로운 컨테이너 $CONTAINER_NAME 실행 중..."

            # Next.js SSR 컨테이너도 커버 (next 타입 흡수 — NODE_ENV/restart 정책 포함)
              # 서버 재부팅·Docker 재시작 뒤에도 서비스가 자동으로 올라오도록 한다 (#727)
            echo $PW | sudo -S docker run -d \
              -p ${PORT}:3000 \
              --name $CONTAINER_NAME \
              --restart unless-stopped \
              -e TZ=Asia/Seoul \
              -e NODE_ENV=production \
              -v /etc/localtime:/etc/localtime:ro \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}-${{ env.DOCKER_IMAGE_PREFIX }}:${BRANCH}

            # ============================================================
            # 배포 완료 확인
            # ============================================================
            echo "✅ 배포가 성공적으로 완료되었습니다!"
            echo ""
            echo "📋 배포 결과 요약:"
            echo "  🎯 프로젝트: $PROJECT_NAME"
            echo "  🌿 브랜치: $BRANCH"
            echo "  🐳 컨테이너: $CONTAINER_NAME"
            echo "  🌐 포트: $PORT"
            echo "  ⏰ 배포 시간: $(date '+%Y-%m-%d %H:%M:%S')"
            echo ""
            echo "🔗 접속 URL: http://${{ secrets.SERVER_HOST }}:${PORT}"

# ===================================================================
# 사용 예시 - main 브랜치 사용
# ===================================================================
#
# 현재 설정: main 브랜치에 push할 때 자동 배포
#
# 브랜치별 포트:
# - main: 3000 (PROJECT_DEPLOY_PORT secret으로 변경 가능)
#
# 필요한 Secrets:
# - REACT_ENV_FILE, DOCKERHUB_*, SERVER_* (필수)
# - PROJECT_DEPLOY_PORT (선택, 기본값: 3000)
#
# ===================================================================

