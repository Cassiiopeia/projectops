# ===================================================================
# React CI (code analysis and build verification)
# ===================================================================
#
# Verifies the React app build on a push to main.
#
# Key points:
# - installs dependencies with npm ci
# - verifies the build with npm run build
# - caches node_modules and build output
#
# ===================================================================
# 🔑 Required GitHub Secrets
# ===================================================================
# ENV_FILE (optional): contents of the .env file
#
# * CI only verifies the build, so no deploy Secrets are needed
# ===================================================================
#
# 🔧 Per-project settings (env section)
# ===================================================================
# PROJECT_NAME : project name
# NODE_VERSION : Node.js version (default: 20.15.0)
# ENV_FILE     : env file name (default: .env)
# ===================================================================

name: PROJECT-REACT-CI

on:
  push:
    branches: ["develop"]
  workflow_dispatch:

env:
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo
  NODE_VERSION: "20.15.0"
  ENV_FILE: ".env"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build:
    name: Build React/Next.js application
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source
      - name: Check out code
        uses: actions/checkout@v5

      # 2. Create the env file
      - name: Create environment file (${{ env.ENV_FILE }})
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE || secrets.ENV }}
        run: |
          echo -e "$ENV_CONTENT" > ${{ env.ENV_FILE }}
          echo "✅ ${{ env.ENV_FILE }} file created"

      # Detect the package manager (#669)
      # setup-node's cache fails from the first step with "Dependencies lock file is not found" when there is no lock file or with pnpm.
      # The npm (package-lock.json) path that already worked comes first,
      # then pnpm, then yarn; with no lock file at all it falls back to npm install without cache.
      - name: Detect package manager
        id: pm
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            manager=npm; cache=npm
          elif [ -f pnpm-lock.yaml ]; then
            manager=pnpm; cache=pnpm
          elif [ -f yarn.lock ]; then
            manager=yarn; cache=yarn
          else
            manager=none; cache=""
            echo "::notice::No lock file (package-lock.json, pnpm-lock.yaml, yarn.lock), installing with npm install. Commit a lock file for reproducible builds."
          fi
          echo "manager=$manager" >> "$GITHUB_OUTPUT"
          echo "cache=$cache" >> "$GITHUB_OUTPUT"
          echo "📦 Package manager: $manager"

      # pnpm and yarn must be available before setup-node's cache setting (uses Node's bundled corepack)
      - name: Enable Corepack
        if: steps.pm.outputs.manager == 'pnpm' || steps.pm.outputs.manager == 'yarn'
        run: corepack enable

      # 3. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: ${{ steps.pm.outputs.cache }}

      # 4. Cache npm dependencies
      - name: Cache npm dependencies
        if: steps.pm.outputs.manager == 'npm' || steps.pm.outputs.manager == 'none'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      # 5. Cache node_modules
      # Skip npm ci when package-lock.json has not changed
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v4
        with:
          path: "**/node_modules"
          # Without a lock file the hash is empty, the key is fixed, and old caches are used even if package.json changes — use the package.json hash only then
          key: ${{ runner.os }}-node-modules-${{ steps.pm.outputs.manager == 'none' && hashFiles('**/package.json') || hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # 6. Install dependencies
      # Runs only without a cache (npm ci installs exact versions from package-lock.json)
      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        env:
          PM: ${{ steps.pm.outputs.manager }}
        run: |
          echo "📦 Installing dependencies... ($PM)"
          case "$PM" in
            npm)  npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            yarn)
              # Yarn Berry (.yarnrc.yml) uses --immutable, Classic uses --frozen-lockfile
              if [ -f .yarnrc.yml ]; then yarn install --immutable; else yarn install --frozen-lockfile; fi ;;
            *)    npm install ;;
          esac
          echo "✅ Dependencies installed"

      # 7. Cache the Next.js build (for Next.js projects)
      # Cache the .next/cache folder to speed up incremental builds
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      # 8. Build the project
      # Collect error logs without stopping the workflow when the build fails
      - name: Build project
        id: build
        run: |
          echo "🔨 Starting build..."
          echo "Project: ${{ env.PROJECT_NAME }}"
          echo "Node.js: ${{ env.NODE_VERSION }}"
          echo ""
          
          # Run the build and save the log
          # On build failure, exit 0 so the workflow continues (to collect error logs)
          npm run build > build_log.txt 2>&1 || {
            echo "build_failed=true" >> $GITHUB_OUTPUT
            echo "status=failed" >> $GITHUB_OUTPUT
            echo ""
            echo "❌ Build failed"
            exit 0
          }
          
          echo "build_failed=false" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          echo "✅ Build complete"

      # 9. Print error logs when the build failed
      # Runs only when the build failed
      - name: Print build error log
        if: steps.build.outputs.build_failed == 'true'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "❌ Build failed - error log"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Print only the last 50 lines of the log (the full log is in the artifact)
          if [ -f "build_log.txt" ]; then
            tail -n 50 build_log.txt
          else
            echo "Could not find the error log file."
          fi
          
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # End the workflow as failed
          exit 1

      # 10. Upload the build log artifact
      # Save the log whether the build succeeded or not
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt
          retention-days: 7  # keep for 7 days

      # 11. Build result summary
      # Summarize the workflow result for easy reading
      - name: Build summary
        if: always()
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ "${{ steps.build.outputs.status }}" = "success" ]; then
            echo "🎉 Build workflow complete!"
          else
            echo "❌ Build workflow failed"
          fi
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📊 Build result:"
          echo "  📦 Project: ${{ env.PROJECT_NAME }}"
          echo "  📌 Node.js version: ${{ env.NODE_VERSION }}"
          echo "  🆙 Build status: ${{ steps.build.outputs.status }}"
          echo "  🌿 Branch: $GITHUB_REF_NAME"
          echo "  📝 Commit: ${{ github.sha }}"
          echo "  🕐 Time: $(date '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          if [ "${{ steps.build.outputs.status }}" = "success" ]; then
            echo "✅ All steps completed successfully."
          else
            echo "❌ An error occurred during the build."
            echo "💡 Download the 'build-log' artifact from the Actions tab to see the full log."
          fi
