# ==========================================================================================
# React Native Expo iOS TestFlight: expo prebuild > signed archive > IPA > TestFlight upload
# ==========================================================================================
#
# Triggers 3:
#   - push to main (the deploy trigger branch when version.yml sets one) : release build
#   - `@projectops app build` / `@projectops ios build` comment              : test build of that branch
#     (PROJECT-REACT-NATIVE-EXPO-PROJECTOPS-APP-BUILD-TRIGGER > repository_dispatch build-ios-app)
#   - manual run (workflow_dispatch: branch, mode test | release)
# Goes as far as TestFlight only. App Store review is submitted by a person in App Store Connect.
#
# No EAS and no committed fastlane files: ios/ is regenerated by prebuild on every run, so
# .github/scripts/expo_app.py writes ExportOptions.plist, the Fastfile (lane deploy = pilot upload) and the Gemfile
# from the provisioning profile, then the shared .github/scripts/ios_release.py does what it does for Flutter:
#   build number (build_number.py, time-based) > archive > IPA export > bundle number check > upload > retry on rejection.
# Version: version.yml version. A test build on a version already released moves to the next patch (precheck-version);
#          a release on a released version fails before building (bump version.yml).
# Team ID: read from the provisioning profile and written to app.json ios.appleTeamId before prebuild.
#
# ⚠️ repository_dispatch runs with the workflow definition on the default branch (#595).
#
# ==========================================================================================
# 🔑 Required GitHub Secrets (same names as the Flutter TestFlight workflows)
# ==========================================================================================
# APPLE_CERTIFICATE_BASE64          : Apple Distribution .p12 (base64)
# APPLE_CERTIFICATE_PASSWORD        : .p12 password
# APPLE_PROVISIONING_PROFILE_BASE64 : App Store provisioning profile .mobileprovision (base64)
# APP_STORE_CONNECT_API_KEY_ID      : App Store Connect API key ID
# APP_STORE_CONNECT_ISSUER_ID       : issuer ID
# APP_STORE_CONNECT_API_KEY_BASE64  : AuthKey_XXXX.p8 (base64)
# IOS_BUNDLE_ID (optional)          : overrides expo.ios.bundleIdentifier (secret or repository variable)
# ENV_FILE (optional)               : contents of the app .env file
# GOOGLE_SERVICE_INFO_PLIST (optional): GoogleService-Info.plist contents (raw or base64), written to the app folder
# ==========================================================================================
# 🔧 Per-project settings
# ==========================================================================================
# APP_ROOT      : Expo app folder relative to the repo root
# NODE_VERSION  : repo variable NODE_VERSION wins
# XCODE_VERSION : empty = latest Xcode on the runner (repo variable XCODE_VERSION pins it)
# Runner        : repo variable IOS_RUNNER (default macos-26; xcode-27 builds with the iOS 27 SDK, ITMS-90725)
# ==========================================================================================

name: PROJECT-REACT-NATIVE-EXPO-IOS-TESTFLIGHT
run-name: >-
  ${{ github.event_name == 'repository_dispatch'
      && format('TEST TESTFLIGHT {0} (#{1})', github.event.client_payload.branch_name, github.event.client_payload.pr_number)
      || github.event_name == 'workflow_dispatch'
      && format('TESTFLIGHT {0} {1}', inputs.mode, inputs.branch || github.ref_name)
      || github.event.head_commit.message }}

on:
  push:
    branches: ["main"]
    # @wizard paths-anchor (for monorepos the integrator injects the paths filter here)
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build (empty = the branch this run starts from)"
        required: false
        default: ""
        type: string
      mode:
        description: "test = test build (moves past a released version) / release = version.yml version as is"
        required: false
        default: "test"
        type: choice
        options: ["test", "release"]
  repository_dispatch:
    types: [build-ios-app]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'repository_dispatch' && github.event.client_payload.branch_name || inputs.branch || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  APP_ROOT: "."  # @wizard auto:expo-root
  NODE_VERSION: "22"
  XCODE_VERSION: ""
  ENV_FILE_PATH: ".env"

jobs:
  testflight:
    name: iOS build and TestFlight upload
    runs-on: ${{ vars.IOS_RUNNER || 'macos-26' }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - name: Resolve the build target
        id: target
        env:
          DISPATCH_BRANCH: ${{ github.event.client_payload.branch_name }}
          DISPATCH_NUMBER: ${{ github.event.client_payload.pr_number }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            repository_dispatch) BRANCH="$DISPATCH_BRANCH"; MODE="test"; NUMBER="$DISPATCH_NUMBER" ;;
            workflow_dispatch)   BRANCH="${INPUT_BRANCH:-$GITHUB_REF_NAME}"; MODE="${INPUT_MODE:-test}"; NUMBER="" ;;
            *)                   BRANCH="$GITHUB_REF_NAME"; MODE="release"; NUMBER="" ;;
          esac
          {
            echo "branch=$BRANCH"
            echo "mode=$MODE"
            echo "comment_number=$NUMBER"
            echo "started_at=$(date +%s)"
          } >> "$GITHUB_OUTPUT"
          echo "branch $BRANCH, mode $MODE"

      # Missing secrets are reported before a long build (values are never printed)
      - name: Check deploy secrets
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          MISSING_NAMES=""
          for NAME in APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_PROVISIONING_PROFILE_BASE64 \
                      APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            if [ -z "${!NAME}" ]; then MISSING_NAMES="$MISSING_NAMES $NAME"; fi
          done
          if [ -n "$MISSING_NAMES" ]; then
            echo "::error title=Missing deploy secrets::[testflight deploy] rejected : missing secrets :$MISSING_NAMES"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.branch }}

      # Comment text follows version.yml options.language (#769)
      - name: Load comment messages
        if: steps.target.outputs.comment_number != ''
        run: |
          python3 .github/scripts/i18n/messages.py js test_testflight. --version-yml version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"

      - name: Post the progress comment
        id: progress
        if: steps.target.outputs.comment_number != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          COMMENT_NUMBER: ${{ steps.target.outputs.comment_number }}
          BRANCH_NAME: ${{ steps.target.outputs.branch }}
        with:
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [t('test_testflight.heading.in_progress'), '', `- \`${process.env.BRANCH_NAME}\``, '', `🔗 ${runUrl}`].join('\n');
            const { data } = await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: Number(process.env.COMMENT_NUMBER), body,
            });
            core.setOutput('comment_id', String(data.id));

      # Before prebuild ios/ does not exist, so the UIScene check is skipped; Expo's template handles the lifecycle
      - name: Select Xcode version
        env:
          XCODE_VERSION: ${{ env.XCODE_VERSION || vars.XCODE_VERSION }}
        run: python3 .github/scripts/select_xcode.py select --apply --app-root "$APP_ROOT"

      - name: Install iOS device platform
        env:
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: |
          sudo xcodebuild -license accept
          xcrun simctl list >/dev/null 2>&1 || true
          # Always download: the device platform for archives is separate from what showsdks reports
          for attempt in 1 2 3; do
            xcodebuild -downloadPlatform iOS && break
            echo "::warning::iOS platform download attempt $attempt failed, retrying"
            sleep 10
          done

      - name: Detect package manager
        id: project
        run: python3 .github/scripts/expo_app.py detect --app-root "$APP_ROOT" --repo-root .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || env.NODE_VERSION }}
          cache: ${{ steps.project.outputs.setup_node_cache }}
          cache-dependency-path: ${{ steps.project.outputs.lockfile }}

      - name: Install dependencies
        working-directory: ${{ env.APP_ROOT }}
        run: ${{ steps.project.outputs.install_command }}

      - name: Write .env and Firebase files (when set)
        working-directory: ${{ env.APP_ROOT }}
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$ENV_FILE" ]; then printf '%s\n' "$ENV_FILE" > "$ENV_FILE_PATH"; fi
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            # Raw XML or base64
            if printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | head -c 64 | grep -q '<'; then
              printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > GoogleService-Info.plist
            else
              printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > GoogleService-Info.plist
            fi
          fi

      - name: Install signing certificate and profile
        uses: Apple-Actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93 # v2
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile and App Store Connect key
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          PROFILE_PATH="$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -o - -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          {
            echo "PROFILE_PATH=$PROFILE_PATH"
            echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          } >> "$GITHUB_ENV"

      # Bundle ID: secret or variable > app config (app.config.js included). Team ID: provisioning profile
      - name: Read bundle ID and team ID
        id: app
        env:
          BUNDLE_OVERRIDE: ${{ secrets.IOS_BUNDLE_ID || vars.IOS_BUNDLE_ID }}
        run: |
          BUNDLE_ID="$BUNDLE_OVERRIDE"
          if [ -z "$BUNDLE_ID" ]; then
            BUNDLE_ID=$(python3 .github/scripts/expo_app.py read-config --app-root "$APP_ROOT" | tail -n 1 \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("ios_bundle_id", ""))')
          fi
          if [ -z "$BUNDLE_ID" ]; then
            echo "::error title=No iOS bundle ID::Set expo.ios.bundleIdentifier in app.json (or the IOS_BUNDLE_ID secret or variable)."
            exit 1
          fi
          TEAM_ID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract TeamIdentifier.0 raw -o - -)
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "team_id=$TEAM_ID" >> "$GITHUB_OUTPUT"
          echo "bundle $BUNDLE_ID, team $TEAM_ID"

      # test: a released version moves to the next patch / release: a released version stops here
      - name: Decide the version
        id: version
        env:
          MODE: ${{ steps.target.outputs.mode }}
          APP_IDENTIFIER: ${{ steps.app.outputs.bundle_id }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          VERSION=$(python3 .github/scripts/version_manager.py get 2>/dev/null | tail -n 1)
          if ! python3 .github/scripts/ios_release.py precheck-version --mode "$MODE" --version "$VERSION" --bundle-id "$APP_IDENTIFIER"; then
            if [ "$MODE" = "release" ]; then exit 1; fi
            echo "::warning::Version precheck failed, continuing with the version.yml version"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the version and team into app.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TEAM_ID: ${{ steps.app.outputs.team_id }}
        run: python3 .github/scripts/expo_app.py set-version --app-root "$APP_ROOT" --version "$VERSION" --apple-team-id "$TEAM_ID"

      # Committed ios/ (prebuild not used) is built as is
      - name: Generate the native iOS project
        working-directory: ${{ env.APP_ROOT }}
        run: |
          if [ -n "$(git ls-files ios/Podfile)" ]; then
            echo "ios/ is committed, skipping expo prebuild"
            cd ios && pod install
          else
            # prebuild also runs pod install
            npx expo prebuild --platform ios
          fi

      - name: Prepare signing, export and upload files
        env:
          BUNDLE_ID: ${{ steps.app.outputs.bundle_id }}
        run: |
          python3 .github/scripts/expo_app.py ios-prepare --app-root "$APP_ROOT"
          python3 .github/scripts/expo_app.py ios-signing --app-root "$APP_ROOT" --profile "$PROFILE_PATH" --bundle-id "$BUNDLE_ID" | tail -n 1 \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print("IOS_PROVISIONING_PROFILE_NAME=" + d.get("profile_name", ""))' >> "$GITHUB_ENV"

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: "3.3"  # fastlane 2.240+ needs Ruby 3.2+

      - name: Install fastlane
        working-directory: ${{ env.APP_ROOT }}/ios
        run: bundle install

      # Build number decided here (build_number.py rule, above the latest App Store Connect build)
      - name: Build IPA
        id: build_phase
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MODE: ${{ steps.target.outputs.mode }}
          APP_IDENTIFIER: ${{ steps.app.outputs.bundle_id }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
        run: python3 .github/scripts/ios_release.py archive-upload --phase build

      - name: Upload to TestFlight
        id: upload_phase
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MODE: ${{ steps.target.outputs.mode }}
          APP_IDENTIFIER: ${{ steps.app.outputs.bundle_id }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          DEVELOPER_DIR: ${{ env.XCODE_DEVELOPER_DIR }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          BRANCH_NAME: ${{ steps.target.outputs.branch }}
        run: |
          export API_KEY_PATH="$ASC_KEY_PATH"
          # "What to Test": branch and commit for test builds, the version for releases
          if [ "$MODE" = "test" ]; then
            export RELEASE_NOTES="Test build · $BRANCH_NAME · ${GITHUB_SHA:0:7}"
          else
            export RELEASE_NOTES="v$VERSION"
          fi
          python3 .github/scripts/ios_release.py archive-upload --phase upload

      - name: Remove signing files (success or failure)
        if: always()
        run: rm -f "$RUNNER_TEMP/app.mobileprovision" "$HOME/.appstoreconnect/private_keys/"AuthKey_*.p8

      - name: Update the progress comment
        if: always() && steps.progress.outputs.comment_id != ''
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          COMMENT_ID: ${{ steps.progress.outputs.comment_id }}
          JOB_STATUS: ${{ job.status }}
          BRANCH_NAME: ${{ steps.target.outputs.branch }}
          STARTED_AT: ${{ steps.target.outputs.started_at }}
          VERSION: ${{ steps.upload_phase.outputs.version || steps.build_phase.outputs.version || steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.upload_phase.outputs.build_number || steps.build_phase.outputs.build_number }}
          REASON_LINE: ${{ steps.upload_phase.outputs.reason_line || steps.build_phase.outputs.reason_line }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const seconds = Math.max(0, Math.floor(Date.now() / 1000) - Number(process.env.STARTED_AT || 0));
            const status = process.env.JOB_STATUS;
            const heading = status === 'success' ? t('test_testflight.heading.deployed')
              : status === 'cancelled' ? t('test_testflight.heading.cancelled') : t('test_testflight.heading.deploy_failed');
            const lines = [heading, '',
              `- \`${process.env.BRANCH_NAME}\` · \`${context.sha.substring(0, 7)}\``,
              `- ${process.env.VERSION || '-'} (${process.env.BUILD_NUMBER || '-'})`,
              `- ${elapsed(Math.floor(seconds / 60), seconds % 60)}`];
            if (status === 'failure' && process.env.REASON_LINE) lines.push('', `> ${process.env.REASON_LINE}`);
            lines.push('', `🔗 ${runUrl}`);
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo, comment_id: Number(process.env.COMMENT_ID), body: lines.join('\n'),
            });

      - name: Summary
        if: always()
        env:
          MODE: ${{ steps.target.outputs.mode }}
          BRANCH_NAME: ${{ steps.target.outputs.branch }}
          BUNDLE_ID: ${{ steps.app.outputs.bundle_id }}
          VERSION: ${{ steps.upload_phase.outputs.version || steps.build_phase.outputs.version || steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.upload_phase.outputs.build_number || steps.build_phase.outputs.build_number }}
          REASON_LINE: ${{ steps.upload_phase.outputs.reason_line || steps.build_phase.outputs.reason_line }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "### Expo iOS TestFlight ($MODE): $JOB_STATUS"
            echo "- Branch: \`$BRANCH_NAME\`"
            echo "- Bundle: $BUNDLE_ID"
            echo "- Version: ${VERSION:--} (${BUILD_NUMBER:--})"
            if [ -n "$REASON_LINE" ]; then echo "- Reason: $REASON_LINE"; fi
          } >> "$GITHUB_STEP_SUMMARY"
