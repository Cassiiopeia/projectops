# ===================================================================
# PROJECT-COMMON-VERCEL-DEPLOY.yaml
# Vercel 배포 워크플로우 v1.0
# ===================================================================
#
# 프론트엔드 프로젝트(React/Next.js/Vite 등)를 Vercel 프로덕션으로 배포합니다.
# 타입 비종속 배포 타겟 — 마법사에서 배포 방식으로 vercel을 선택하면 설치됩니다.
# 필요 Secrets:
# - VERCEL_TOKEN      : Vercel Access Token (https://vercel.com/account/tokens)
# - VERCEL_ORG_ID     : 프로젝트의 .vercel/project.json의 orgId
# - VERCEL_PROJECT_ID : 프로젝트의 .vercel/project.json의 projectId
#   (로컬에서 `vercel link` 1회 실행하면 .vercel/project.json이 생성됩니다)
#
# PROJECT_PATH: 프론트 프로젝트가 서브폴더에 있으면 그 경로로 수정 (예: "client")
# ===================================================================

name: PROJECT-COMMON-VERCEL-DEPLOY

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    # @wizard paths-anchor (모노레포일 때 integrator가 paths 필터를 여기 주입)
  workflow_dispatch:

permissions:
  # GITHUB_TOKEN 으로는 읽기만 한다. 명시해 두면 레포 기본값이 나중에 write 로 바뀌어도
  # 이 워크플로우가 필요 이상의 권한을 갖지 않는다 (#595).
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  PROJECT_PATH: "."      # 프론트 프로젝트 경로 (모노레포면 서브폴더, 예: "client")
  NODE_VERSION: "20"

jobs:
  deploy-production:
    name: Vercel production deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build project
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" 2>&1 | grep -oE "https://[^[:space:]]*\.vercel\.app" | tail -1)
          echo "deployment_url=${URL}" >> $GITHUB_OUTPUT

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Vercel deployment result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Deployed**" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 **URL**: ${{ steps.deploy.outputs.deployment_url }}" >> $GITHUB_STEP_SUMMARY
            echo "- 📅 **Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build or deployment failed**" >> $GITHUB_STEP_SUMMARY
            echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Branch: \`$GITHUB_REF_NAME\`" >> $GITHUB_STEP_SUMMARY
          fi
