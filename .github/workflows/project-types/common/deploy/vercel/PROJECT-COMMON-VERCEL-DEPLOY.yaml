# ===================================================================
# PROJECT-COMMON-VERCEL-DEPLOY.yaml
# Vercel deploy workflow v1.0
# ===================================================================
#
# Deploys a frontend project (React/Next.js/Vite, etc.) to Vercel production.
# A type-independent deploy target — installed when vercel is chosen as the deploy method in the wizard.
# Required Secrets:
# - VERCEL_TOKEN      : Vercel Access Token (https://vercel.com/account/tokens)
# - VERCEL_ORG_ID     : orgId in the project's .vercel/project.json
# - VERCEL_PROJECT_ID : projectId in the project's .vercel/project.json
#   (running `vercel link` once locally creates .vercel/project.json)
#
# PROJECT_PATH: if the frontend project is in a subfolder, set that path (e.g. "client")
# ===================================================================

name: PROJECT-COMMON-VERCEL-DEPLOY

concurrency:
  group: vercel-deploy
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    # @wizard paths-anchor (for monorepos the integrator injects the paths filter here)
  workflow_dispatch:

permissions:
  # GITHUB_TOKEN only reads. Declaring it keeps this workflow from gaining more permissions than needed
  # even if the repo default later changes to write (#595).
  contents: read

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  PROJECT_PATH: "."      # frontend project path (subfolder for monorepos, e.g. "client")
  NODE_VERSION: "20"

jobs:
  deploy-production:
    name: Vercel production deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build project
        working-directory: ${{ env.PROJECT_PATH }}
        run: npm run build

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        working-directory: ${{ env.PROJECT_PATH }}
        run: |
          URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" 2>&1 | grep -oE "https://[^[:space:]]*\.vercel\.app" | tail -1)
          echo "deployment_url=${URL}" >> $GITHUB_OUTPUT

      - name: Deployment summary
        if: always()
        run: |
          echo "## 🚀 Vercel deployment result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Deployed**" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 **URL**: ${{ steps.deploy.outputs.deployment_url }}" >> $GITHUB_STEP_SUMMARY
            echo "- 📅 **Time**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build or deployment failed**" >> $GITHUB_STEP_SUMMARY
            echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- Branch: \`$GITHUB_REF_NAME\`" >> $GITHUB_STEP_SUMMARY
          fi
