# ===================================================================
# PROJECT-COMMON-AI-PR-SUMMARY.yaml
# Automatically comment a change summary on regular work PRs (#553)
# ===================================================================
#
# When a work PR targeting the default branch is opened or updated, it summarizes the commits as a comment.
# It reuses **the same provider ladder** as release notes (.github/scripts/changelog_providers/ladder.py)
# — a separate generator would split the two paths and cause drift.
#
# 🔑 GitHub Secrets — all optional
#   MODEL_API_KEY: if registered, summarizes with external AI. Otherwise Copilot -> commit analysis.
#   (GitHub Models works with permissions models: read + the default token alone)
#
# When it does not comment:
#   - Release PRs (head is the development branch): the changelog already does that
#   - PRs from forks: this workflow does not run external code
#   - **Repos using CodeRabbit** (.coderabbit.yaml exists): that bot already posts a summary.
#     Commenting here too would mean two summaries — only one of them runs.
#
# Comments are updated, not stacked. It finds the existing comment by its marker (<!-- PROJECTOPS-AI-SUMMARY -->)
# and replaces only the content, so pushing commits many times keeps a single summary comment.
#
# This workflow never blocks a PR (failed summary = exit quietly).
# ===================================================================

name: AI PR SUMMARY

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # branches filters by **base** (where the PR points). Regular work PRs target the development branch, so
    # putting main here misses work PRs. In fact base=main + head!=develop could not
    # exist, so this workflow never ran once (#565).
    # Release PRs (develop->main) have base main and are naturally excluded, which also removes
    # runs cut off at merge time and left as failures.
    branches: ["develop"]

permissions:
  contents: read
  pull-requests: write
  # For Copilot CLI auth — GitHub Models shut down, so models:read became useless (#566)
  copilot-requests: write

concurrency:
  # When commits land on the same PR in a row, summarize only the last
  group: ai-pr-summary-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-pr-summary:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: PR 변경 요약 댓글
    # Exclude fork PRs + release PRs (head=develop)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'develop'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Read options
        id: options
        run: |
          # Do not guess CodeRabbit usage from the config file's existence (#566).
          # If the file exists but the app is not actually installed, CodeRabbit posts no summary and this one
          # drops out too, leaving "nobody summarizes" — such repos really existed.
          # Now the existence of this workflow is itself the user's choice (the wizard decides whether to copy it).
          echo "skip=false" >> $GITHUB_OUTPUT

          if [ -f ".github/scripts/version_manager.py" ]; then
            PROVIDER=$(python3 .github/scripts/version_manager.py get-option changelog.provider 2>/dev/null || true)
            # #851 — version_manager interprets block lists, nested keys and comments in one place
          else
            PROVIDER=$(grep -A5 "changelog:" version.yml 2>/dev/null | grep "provider:" | head -1 | sed -E 's/.*provider: *"?([a-z-]+)"?.*/\1/' || true)
          fi
          # coderabbit is an external bot this workflow cannot reproduce, and github-ai's service
          # shut down. Both are replaced with the default path (commit) — the ladder picks up a registered AI key
          # by itself, else goes to commit analysis. No billed step on the default path (#569).
          case "$PROVIDER" in
            ""|coderabbit|github-ai) PROVIDER="commit" ;;
          esac
          echo "provider=$PROVIDER" >> $GITHUB_OUTPUT

          # Project kind (#553) — repos that lead to app review get a notice appended to the summary.
          APP_RELEASE=$(python3 -c 'import re; t=open("version.yml",encoding="utf-8").read(); m=re.search(r"metadata:.*?template:.*?options:.*?app_release:\s*\"?(true|false)", t, re.S); print(m.group(1) if m else "false")' 2>/dev/null || echo "false")
          echo "app_release=$APP_RELEASE" >> $GITHUB_OUTPUT
          echo "ℹ️ provider=$PROVIDER / app_release=$APP_RELEASE"

      # CLI used by the copilot provider. Not blocking if install fails, since the ladder drops to the next step.
      - name: Install Copilot CLI
        continue-on-error: true
        run: npm install -g @github/copilot

      - name: Generate change summary
        id: summary
        if: steps.options.outputs.skip != 'true'
        continue-on-error: true
        env:
          CHANGELOG_PROVIDER: ${{ steps.options.outputs.provider }}
          # Dedicated per-service names — only registered ones get values. The ladder picks (#569).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}   # old name — backward compatible
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF"
          # Three dots (...) use the common ancestor — commits newly landed on base are not mixed into the summary
          export COMMIT_RANGE="origin/${BASE_REF}...HEAD"
          echo "ℹ️ Summary range: $COMMIT_RANGE"

          python3 .github/scripts/changelog_providers/ladder.py
          if [ -f pr_body.md ]; then
            echo "generated=true" >> $GITHUB_OUTPUT
          else
            echo "generated=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or update summary comment
        if: steps.options.outputs.skip != 'true' && steps.summary.outputs.generated == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          APP_RELEASE: ${{ steps.options.outputs.app_release }}
        run: |
          python3 .github/scripts/pr_summary_comment.py \
            --repo "$REPO" \
            --pr "$PR_NUMBER" \
            --body-file pr_body.md \
            --app-release "$APP_RELEASE"
