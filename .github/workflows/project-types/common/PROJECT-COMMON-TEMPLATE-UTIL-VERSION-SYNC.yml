# ===================================================================
# Template util module version sync workflow
# ===================================================================
#
# For SUH-DEVOPS-TEMPLATE only:
# when a version.json under .github/util/ changes, it automatically
# runs that directory's version-sync.sh script
# to sync the version info in the HTML file.
#
# Triggers:
# - changes to .github/util/**/version.json
# - manual run (workflow_dispatch)
#
# How it works:
# 1. Finds every version-sync.sh script under .github/util/
# 2. Runs each script (version.json -> HTML sync)
# 3. Commits & pushes automatically if anything changed
#
# Notes:
# - concurrency is set to avoid clashing with the VERSION-CONTROL workflow
# - a [skip ci] commit message prevents infinite loops
#
# ===================================================================

name: TEMPLATE-UTIL-VERSION-SYNC

on:
  push:
    branches: [ develop ]
    paths:
      - '.github/util/**/version.json'
  workflow_dispatch:

# Avoid clashing with the VERSION-CONTROL workflow
concurrency:
  group: version-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version-sync:
    name: Sync Version JSON to HTML
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Find and Execute All version-sync.sh Scripts
      run: |
        echo "🔍 Looking for version-sync.sh scripts under .github/util/..."

        # Find the version-sync.sh scripts
        SYNC_SCRIPTS=$(find .github/util -name "version-sync.sh" -type f 2>/dev/null || true)

        if [ -z "$SYNC_SCRIPTS" ]; then
          echo "⚠️ No version-sync.sh script found."
          exit 0
        fi

        echo "📋 Found scripts:"
        echo "$SYNC_SCRIPTS"
        echo ""

        # Run each script
        SCRIPT_COUNT=0
        SUCCESS_COUNT=0

        for SCRIPT in $SYNC_SCRIPTS; do
          SCRIPT_COUNT=$((SCRIPT_COUNT + 1))
          SCRIPT_DIR=$(dirname "$SCRIPT")
          SCRIPT_NAME=$(basename "$SCRIPT_DIR")

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 [$SCRIPT_COUNT] Syncing $SCRIPT_NAME"
          echo "   Path: $SCRIPT"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Make the script executable
          chmod +x "$SCRIPT"

          # Run the script
          if bash "$SCRIPT"; then
            echo "✅ $SCRIPT_NAME synced"
            SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
          else
            echo "❌ $SCRIPT_NAME sync failed (continuing)"
          fi

          echo ""
        done

        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📊 Result: $SUCCESS_COUNT / $SCRIPT_COUNT succeeded"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    - name: Check for Changes
      id: changes
      run: |
        git diff --quiet || echo "has_changes=true" >> $GITHUB_OUTPUT

    - name: Commit and Push Changes
      if: steps.changes.outputs.has_changes == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git add .
        git commit -m "chore: github workflow util module version sync [skip ci]"

        # Prevent race conditions: pull-rebase, then push (up to 3 retries)
        MAX_RETRIES=3
        RETRY_COUNT=0
        PUSH_SUCCESS=false

        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          RETRY_COUNT=$((RETRY_COUNT + 1))
          echo "🔄 Push attempt $RETRY_COUNT/$MAX_RETRIES..."

          if git push; then
            PUSH_SUCCESS=true
            echo "✅ Changes committed."
            break
          else
            echo "⚠️ Push failed, syncing remote changes..."

            if git pull --rebase origin "$GITHUB_REF_NAME"; then
              echo "✅ Rebase succeeded, retrying push..."
            else
              echo "❌ Rebase failed, resolve the conflict"
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
          fi
        done

        if [ "$PUSH_SUCCESS" = false ]; then
          echo "❌ Push failed after $MAX_RETRIES attempts"
          exit 1
        fi

    - name: No Changes
      if: steps.changes.outputs.has_changes != 'true'
      run: |
        echo "ℹ️ Nothing to sync (already in sync)."

    - name: Summary
      if: always()
      run: |
        echo ""
        echo "🎉 Version sync workflow done"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "📝 Trigger: ${{ github.event_name }}"
        echo "🌿 Branch: $GITHUB_REF_NAME"
        echo "📌 Commit: ${{ github.sha }}"
        echo "🕐 Time: $(date '+%Y-%m-%d %H:%M:%S UTC')"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
