# ===================================================================
# PROJECT-COMMON-SYNC-ISSUE-LABELS.yaml
# Issue label sync
# ===================================================================
#
# Syncs the GitHub repository's labels
# based on .github/config/issue-labels.yml.
#
# ===================================================================
# Triggers:
# - changes to .github/config/issue-labels.yml (including adding/editing this workflow file itself)
# - manual run (workflow_dispatch)
# ===================================================================

name: "PROJECT-SYNC-GITHUB-LABELS"

on:
  workflow_dispatch:
  push:
    # The paths filter is not evaluated on a new repo's first push (#668 measured: no labels in org or personal repos),
    # so labels were never created right after install. Keep only the branch condition and run on every main push.
    # The sync is idempotent (skip-delete) and serialized by concurrency, so repeated runs are safe.
    branches: [main]

# If main and develop are pushed at once, both try to create the same label and one fails — run in order (wait)
concurrency:
  group: sync-issue-labels
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  label-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sync labels from config
        uses: crazy-max/ghaction-github-labeler@24d110aa46a59976b8a7f35518cb7f14f434c916 # v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/config/issue-labels.yml
          # Do not delete labels users created themselves (the default deletes labels not in the list)
          skip-delete: true