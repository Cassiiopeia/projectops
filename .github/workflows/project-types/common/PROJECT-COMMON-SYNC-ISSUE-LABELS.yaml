# ===================================================================
# PROJECT-COMMON-SYNC-ISSUE-LABELS.yaml
# Issue Labels 동기화
# ===================================================================
#
# .github/config/issue-labels.yml 파일을 기준으로
# GitHub 레포지토리의 Labels를 동기화합니다.
#
# ===================================================================
# 트리거:
# - .github/config/issue-labels.yml 파일 변경 시 (이 워크플로우 파일 자체의 추가·수정 포함)
# - 수동 실행 (workflow_dispatch)
# ===================================================================

name: "PROJECT-SYNC-GITHUB-LABELS"

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/config/issue-labels.yml'
      # 설치 직후 첫 push 에서 라벨이 한 번도 안 만들어지는 경우가 실측돼(#668) 이 워크플로우 파일 자체의
      # 추가·수정에도 실행한다. 기존 동작은 그대로이고 라벨 동기화는 멱등이라 재실행해도 안전하다.
      - '.github/workflows/PROJECT-COMMON-SYNC-ISSUE-LABELS.yaml'

# main, develop 이 동시에 push 되면 같은 라벨을 동시에 만들려다 한쪽이 실패한다 — 순서대로 실행(대기)한다
concurrency:
  group: sync-issue-labels
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  label-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Sync labels from config
        uses: crazy-max/ghaction-github-labeler@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          yaml-file: .github/config/issue-labels.yml
          # 사용자가 직접 만든 라벨은 지우지 않는다 (기본값은 목록에 없는 라벨 삭제)
          skip-delete: true