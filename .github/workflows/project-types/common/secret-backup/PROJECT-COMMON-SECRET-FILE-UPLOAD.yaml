# ===================================================================
# PROJECT-COMMON-SECRET-FILE-UPLOAD.yaml
# Automatic upload of GitHub Secret files to a server (SSH)
# ===================================================================
#
# Uploads config files stored in GitHub Secrets to a server (a host reachable over SSH)
# automatically to track change history.
# Timestamped backups preserve the history of changes.
#
# ===================================================================
# 🤖 Customization guide for AI agents
# ===================================================================
# To adapt this workflow to your project,
# give the prompt below to an AI agent:
#
# 📋 Prompt:
# "Adapt PROJECT-COMMON-SECRET-FILE-UPLOAD.yaml
#  to my project.
#  - Project name: {project name}
#  - ROLE: {backend/frontend, etc.}
#  - Server storage path: {server storage path}
#  - SSH port: {port number}
#  - GitHub Secrets to upload:
#    SECRET_KEY → file_name_to_save.ext
#  Add them to the existing file list section,
#  and skip Secrets that do not exist."
#
# 💡 Example:
# "- APPLICATION_PROD_YML → application-prod.yml
#  - FIREBASE_KEY_JSON → firebase-admin-sdk.json
#  - VERTEX_SA_KEY → vertex-sa-key.json
#  - ENV_FILE → .env
#  - ADMIN_YML → admin.yml"
# ===================================================================
#
# ===================================================================
# 🔑 Required GitHub Secrets
# ===================================================================
# SERVER_HOST: server host (SSH address)
# SERVER_USER: SSH user name
# SERVER_PASSWORD: SSH password
# ===================================================================
#
# 🔧 Environment settings (set in the env section)
# ===================================================================
#
# 📦 Project settings:
# PROJECT_NAME: project name (used in the server path)
# ROLE: role (backend, frontend, etc.)
# SERVER_BASE_PATH: server base path (default: /volume1/projects, e.g. AWS EC2 /home/ubuntu/projects)
#
# 🔌 SSH connection:
# SSH_PORT: SSH port (default: 2022)
# ===================================================================

name: PROJECT-COMMON-SECRET-FILE-UPLOAD

# ===================================================================
# Trigger settings
# ===================================================================
# Runs automatically on a push to main.
# Can also be run manually with workflow_dispatch.
on:
  push:
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: secret-file-upload-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # GITHUB_TOKEN only reads. Declaring it keeps this workflow from gaining more permissions than needed
  # even if the repo default later changes to write (#595).
  contents: read

# ===================================================================
# Environment variables
# ===================================================================
env:
  # 🔧 Project settings - adjust to your project
  PROJECT_NAME: "__PROJECT_NAME__"  # filled with the repo name at install (server paths must differ per project)
  ROLE: "backend"
  SERVER_BASE_PATH: "/volume1/projects"
  SSH_PORT: "2022"

jobs:
  upload-secret-files:
    name: Upload secret files
    runs-on: ubuntu-latest
    # Do not run when the commit message contains [skip ci]
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Build timestamp and commit info
        run: |
          export TZ='Asia/Seoul'
          TIMESTAMP=$(date '+%Y-%m-%d_%H-%M-%S')
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date '+%Y-%m-%d %H:%M')" >> $GITHUB_ENV
          echo "SHORT_COMMIT_HASH=$(echo "${{ github.sha }}" | cut -c1-7)" >> $GITHUB_ENV
          echo "Timestamp: $TIMESTAMP"

      - name: Upload secret files
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ env.SSH_PORT }}
          envs: SERVER_PASSWORD
          script: |
            set -e

            # Set GitHub Actions env vars directly
            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            ROLE="${{ env.ROLE }}"
            SERVER_BASE_PATH="${{ env.SERVER_BASE_PATH }}"
            TIMESTAMP="${{ env.TIMESTAMP }}"
            SHORT_COMMIT_HASH="${{ env.SHORT_COMMIT_HASH }}"
            BUILD_DATE="${{ env.BUILD_DATE }}"

            # Path settings
            BASE_DIR="${SERVER_BASE_PATH}/${PROJECT_NAME}/github_secret/${ROLE}"

            echo "=== Uploading secret files ==="
            echo "Project: ${PROJECT_NAME} (${ROLE})"
            echo "Path: ${BASE_DIR}"
            echo "Timestamp: ${TIMESTAMP}"

            # Create directories
            export PW="${SERVER_PASSWORD}"
            echo "$PW" | sudo -S mkdir -p "${BASE_DIR}/${TIMESTAMP}"

            # ============================================
            # 📦 File upload section
            # Empty Secrets are skipped automatically.
            # Add files to this section with an AI agent.
            # ============================================

            # --- ENV_FILE → .env ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.ENV_FILE }}
            __SUH_SECRET_CHECK_EOF__
            if [ -s /tmp/_secret_check ] && [ -n "$(tr -d '[:space:]' < /tmp/_secret_check)" ]; then
              echo "Uploading ENV_FILE → .env..."
              cat << '__SUH_FILE_CONTENT_EOF__' | sudo tee "${BASE_DIR}/.env" > /dev/null
            ${{ secrets.ENV_FILE }}
            __SUH_FILE_CONTENT_EOF__
              cat << '__SUH_FILE_CONTENT_EOF__' | sudo tee "${BASE_DIR}/${TIMESTAMP}/.env" > /dev/null
            ${{ secrets.ENV_FILE }}
            __SUH_FILE_CONTENT_EOF__
              echo ".env uploaded"
            else
              echo "Skipping ENV_FILE (secret not set)"
            fi
            rm -f /tmp/_secret_check

            # --- APPLICATION_PROD_YML → application-prod.yml ---
            cat << '__SUH_SECRET_CHECK_EOF__' > /tmp/_secret_check
            ${{ secrets.APPLICATION_PROD_YML }}
            __SUH_SECRET_CHECK_EOF__
            if [ -s /tmp/_secret_check ] && [ -n "$(tr -d '[:space:]' < /tmp/_secret_check)" ]; then
              echo "Uploading APPLICATION_PROD_YML → application-prod.yml..."
              cat << '__SUH_FILE_CONTENT_EOF__' | sudo tee "${BASE_DIR}/application-prod.yml" > /dev/null
            ${{ secrets.APPLICATION_PROD_YML }}
            __SUH_FILE_CONTENT_EOF__
              cat << '__SUH_FILE_CONTENT_EOF__' | sudo tee "${BASE_DIR}/${TIMESTAMP}/application-prod.yml" > /dev/null
            ${{ secrets.APPLICATION_PROD_YML }}
            __SUH_FILE_CONTENT_EOF__
              echo "application-prod.yml uploaded"
            else
              echo "Skipping APPLICATION_PROD_YML (secret not set)"
            fi
            rm -f /tmp/_secret_check

            # ============================================
            # 📋 Build metadata JSON
            # ============================================
            cat << EOF | sudo tee "${BASE_DIR}/${TIMESTAMP}/cicd-gitignore-file.json" > /dev/null
            {
              "build_info": {
                "timestamp": "$TIMESTAMP",
                "workflow": "Secret file auto upload",
                "run_id": "${{ github.run_id }}",
                "run_number": "${{ github.run_number }}",
                "event": "${{ github.event_name }}",
                "repository": "${{ github.repository }}",
                "branch": "${{ github.ref_name }}",
                "commit_hash": "${{ github.sha }}",
                "short_hash": "$SHORT_COMMIT_HASH",
                "commit_url": "https://github.com/${{ github.repository }}/commit/${{ github.sha }}",
                "actor": "${{ github.actor }}",
                "build_date": "$BUILD_DATE"
              },
              "files": [
                {
                  "secret_name": "ENV_FILE",
                  "file_name": ".env",
                  "last_updated": "$BUILD_DATE"
                },
                {
                  "secret_name": "APPLICATION_PROD_YML",
                  "file_name": "application-prod.yml",
                  "last_updated": "$BUILD_DATE"
                }
              ]
            }
            EOF

            # Update the timestamp index
            echo "{\"last_updated\": \"${TIMESTAMP}\", \"commit\": \"${SHORT_COMMIT_HASH}\", \"actor\": \"${{ github.actor }}\", \"status\": \"completed\"}" | sudo tee "${BASE_DIR}/timestamp_index.json" > /dev/null

            echo "=== All files uploaded ==="
