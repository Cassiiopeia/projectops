# ===================================================================
# PROJECT-COMMON-PROJECTS-SYNC-MANAGER.yaml
# Issue Label → GitHub Projects Status 동기화
# ===================================================================
#
# GitHub Projects Status → Issue Label은 Cloudflare Worker가 담당합니다.
# (projects-sync-wizard로 설정)
#
# ===================================================================
# 🔑 필수 GitHub Secrets
# ===================================================================
# _GITHUB_PAT_TOKEN: Projects API용 PAT (권한: repo, project)
# ===================================================================
#
# 🚀 빠른 시작 (워크플로우 파일은 수정하지 않습니다):
# 1. _GITHUB_PAT_TOKEN Secret 설정
# 2. Settings → Secrets and variables → Actions → Variables 탭
# 3. PROJECT_URL 변수에 GitHub Projects URL 등록
# 4. 끝!
#
# 지원 URL 형식:
# - Organization: https://github.com/orgs/{org}/projects/{number}
# - User: https://github.com/users/{user}/projects/{number}
# - /views/{id} 경로가 포함되어도 됩니다
#
# ⚠️ Organization 프로젝트 사용 시 주의사항:
# - 이 워크플로우를 사용하는 모든 레포에 동일한 Status Label이 필요합니다
# - 라벨은 .github/config/issue-labels.yml 파일로 관리됩니다
# - 자세한 내용: docs/PROJECTS-SYNC.md
#
# 트리거:
# - Issue Label 변경 시
# - 수동 실행 (workflow_dispatch)
# ===================================================================

name: 🔄 Projects Sync - Label to Status

on:
  issues:
    types: [labeled]

  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to sync'
        required: true
        type: string

concurrency:
  group: projects-sync-${{ github.event.issue.number || github.event.inputs.issue_number }}
  cancel-in-progress: true

permissions:
  # GITHUB_TOKEN 으로는 읽기만 한다. 명시해 두면 레포 기본값이 나중에 write 로 바뀌어도
  # 이 워크플로우가 필요 이상의 권한을 갖지 않는다 (#595).
  contents: read

env:
  # 동기화할 Status Label 목록 (JSON 배열)
  # projects-sync-wizard에서 설정한 값과 동일해야 합니다
  # 한글(기존)과 영문(#776 표준) 라벨을 둘 다 인식한다 — 이름 변경 전환 기간 동안 자동화가 멈추지 않게 한다
  STATUS_LABELS: '["작업전", "작업중", "담당자확인", "피드백", "작업완료", "보류", "취소", "status: todo", "status: in progress", "status: needs review", "status: feedback", "status: done", "status: on hold", "status: cancelled"]'

  # ===================================================================
  # GitHub Projects 연동 설정
  # ===================================================================
  #
  # 사용하려면 레포 설정에 변수를 등록하세요 (파일 수정 불필요):
  #   Settings → Secrets and variables → Actions → Variables → New repository variable
  #   Name: PROJECT_URL   /   Value: 아래 형식의 보드 URL
  #
  # 변수를 등록하지 않으면 이 워크플로우는 안내 로그만 남기고 조용히 종료됩니다.
  # (워크플로우 파일에 URL을 직접 적지 마세요 — 커밋되어 레포 간에 섞입니다)
  #
  # 지원 URL 형식:
  # - Organization: https://github.com/orgs/{org}/projects/{number}
  # - User: https://github.com/users/{user}/projects/{number}
  # - /views/{id} 경로가 포함되어도 됩니다
  #
  # 예시:
  # - https://github.com/orgs/{조직}/projects/1
  # - https://github.com/orgs/{조직}/projects/6/views/2
  # - https://github.com/users/{사용자}/projects/2
  #
  # ⚠️ Organization 프로젝트 사용 시:
  # - 이 워크플로우를 사용하는 모든 레포에 동일한 라벨이 필요합니다
  # - .github/config/issue-labels.yml 파일로 라벨을 관리하세요
  # - 자세한 내용: docs/PROJECTS-SYNC.md
  # ===================================================================

  PROJECT_URL: ${{ vars.PROJECT_URL }}

jobs:
  sync-label-to-status:
    runs-on: ubuntu-latest
    # 조건: Status Label이 변경된 경우에만 실행
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       contains(fromJSON('["작업전", "작업중", "담당자확인", "피드백", "작업완료", "보류", "취소", "status: todo", "status: in progress", "status: needs review", "status: feedback", "status: done", "status: on hold", "status: cancelled"]'), github.event.label.name))

    steps:
      # Projects 연동은 선택 기능이다. PAT Secret 과 PROJECT_URL 변수가 둘 다 있어야만 동작하고,
      # 하나라도 없으면 안내만 남기고 성공으로 끝낸다 (미설정 레포에서 라벨마다 실패 메일이 가는 것을 막는다, #667).
      # secrets 는 job-level if 에서 읽을 수 없어 첫 step 에서 판정해 outputs 로 넘긴다.
      - name: 🔎 Check Projects sync settings
        id: config
        env:
          HAS_PAT: ${{ secrets._GITHUB_PAT_TOKEN != '' }}
          HAS_PROJECT_URL: ${{ vars.PROJECT_URL != '' }}
        run: |
          if [ "$HAS_PAT" = "true" ] && [ "$HAS_PROJECT_URL" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Projects sync is not configured, skipping (optional feature). To use it, add both the secret _GITHUB_PAT_TOKEN and the variable PROJECT_URL."
            [ "$HAS_PAT" = "true" ] || echo "  - Missing: secret _GITHUB_PAT_TOKEN (scopes: repo, project)"
            [ "$HAS_PROJECT_URL" = "true" ] || echo "  - Missing: variable PROJECT_URL (Settings > Secrets and variables > Actions > Variables)"
          fi

      - name: 🔍 Get Issue Info
        id: issue
        if: steps.config.outputs.enabled == 'true'
        env:
          INPUT_ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "issue_number=$INPUT_ISSUE_NUMBER" >> $GITHUB_OUTPUT
          else
            echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
          fi

      - name: 🏷️ Get Current Labels
        id: labels
        if: steps.config.outputs.enabled == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets._GITHUB_PAT_TOKEN }}
          script: |
            const statusLabels = JSON.parse(process.env.STATUS_LABELS);
            const issueNumber = parseInt('${{ steps.issue.outputs.issue_number }}');

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            // Status Label 찾기
            const currentStatusLabel = issue.labels
              .map(l => typeof l === 'string' ? l : l.name)
              .find(name => statusLabels.includes(name));

            if (currentStatusLabel) {
              core.setOutput('status_label', currentStatusLabel);
              console.log(`📌 Current status label: ${currentStatusLabel}`);
            } else {
              core.setOutput('status_label', '');
              console.log('⏭️ No status label.');
            }

      - name: 📋 Update Projects Status
        if: steps.config.outputs.enabled == 'true' && steps.labels.outputs.status_label != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets._GITHUB_PAT_TOKEN }}
          script: |
            const statusLabel = '${{ steps.labels.outputs.status_label }}';
            const issueNumber = parseInt('${{ steps.issue.outputs.issue_number }}');

            // ============================================
            // URL 파싱 함수
            // ============================================
            function parseProjectUrl(url) {
              if (!url) return null;

              // 지원 패턴:
              // - https://github.com/orgs/{owner}/projects/{number}
              // - https://github.com/orgs/{owner}/projects/{number}/views/{view_id}
              // - https://github.com/users/{owner}/projects/{number}
              // - https://github.com/users/{owner}/projects/{number}/views/{view_id}
              const orgPattern = /github\.com\/orgs\/([^\/]+)\/projects\/(\d+)/;
              const userPattern = /github\.com\/users\/([^\/]+)\/projects\/(\d+)/;

              let match = url.match(orgPattern);
              if (match) {
                return {
                  type: 'organization',
                  owner: match[1],
                  number: parseInt(match[2])
                };
              }

              match = url.match(userPattern);
              if (match) {
                return {
                  type: 'user',
                  owner: match[1],
                  number: parseInt(match[2])
                };
              }

              return null;
            }

            // ============================================
            // 프로젝트 URL 파싱
            // ============================================
            const projectUrl = process.env.PROJECT_URL;

            if (!projectUrl) {
              console.log('⚠️ PROJECT_URL is not set.');
              console.log('   Add the PROJECT_URL variable in');
              console.log('   Settings → Secrets and variables → Actions → Variables (no workflow edit needed).');
              console.log('');
              console.log('💡 Supported URL formats:');
              console.log('   - Organization: https://github.com/orgs/{org}/projects/{number}');
              console.log('   - User: https://github.com/users/{user}/projects/{number}');
              return;
            }

            const projectInfo = parseProjectUrl(projectUrl);

            if (!projectInfo) {
              console.log('❌ PROJECT_URL has an invalid format.');
              console.log(`   Given URL: ${projectUrl}`);
              console.log('');
              console.log('💡 Supported URL formats:');
              console.log('   - Organization: https://github.com/orgs/{org}/projects/{number}');
              console.log('   - User: https://github.com/users/{user}/projects/{number}');
              console.log('   - a /views/{id} path is allowed');
              return;
            }

            const isOrgProject = projectInfo.type === 'organization';
            console.log(`📌 Project type: ${isOrgProject ? 'Organization' : 'User'}`);
            console.log(`📌 Owner: ${projectInfo.owner}`);
            console.log(`📌 Project number: ${projectInfo.number}`);
            console.log(`📌 Issue #${issueNumber} → Status: "${statusLabel}"`);

            // ============================================
            // GraphQL로 Project Item ID 찾기
            // ============================================
            const projectItemQuery = `
              query($owner: String!, $repo: String!, $issueNumber: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issueNumber) {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project {
                          number
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectItemResult = await github.graphql(projectItemQuery, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issueNumber: issueNumber
            });

            const projectItems = projectItemResult.repository?.issue?.projectItems?.nodes || [];
            const targetItem = projectItems.find(item =>
              item.project.number === projectInfo.number
            );

            if (!targetItem) {
              console.log('⏭️ The issue is not in this project.');
              console.log(`   Project number: ${projectInfo.number}`);
              console.log('');
              console.log('💡 How to fix:');
              console.log('   1. Add the issue to the project in GitHub Projects.');
              console.log('   2. Or add it from "Projects" in the issue sidebar.');
              return;
            }

            console.log(`📌 Project Item ID: ${targetItem.id}`);

            // ============================================
            // Project 필드 정보 조회 (Organization vs User)
            // ============================================
            const orgProjectQuery = `
              query($owner: String!, $projectNumber: Int!) {
                organization(login: $owner) {
                  projectV2(number: $projectNumber) {
                    id
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            `;

            const userProjectQuery = `
              query($owner: String!, $projectNumber: Int!) {
                user(login: $owner) {
                  projectV2(number: $projectNumber) {
                    id
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField {
                        id
                        options {
                          id
                          name
                        }
                      }
                    }
                  }
                }
              }
            `;

            const projectQuery = isOrgProject ? orgProjectQuery : userProjectQuery;

            let projectResult;
            try {
              projectResult = await github.graphql(projectQuery, {
                owner: projectInfo.owner,
                projectNumber: projectInfo.number
              });
            } catch (error) {
              console.log('❌ Failed to read the project.');
              console.log(`   Error: ${error.message}`);
              console.log('');
              console.log('💡 Check:');
              console.log('   1. PROJECT_URL is correct.');
              console.log('   2. _GITHUB_PAT_TOKEN can access the project.');
              console.log('   3. The project exists.');
              return;
            }

            const projectV2 = isOrgProject
              ? projectResult.organization?.projectV2
              : projectResult.user?.projectV2;

            if (!projectV2) {
              console.log('❌ Project not found.');
              console.log(`   Owner: ${projectInfo.owner}`);
              console.log(`   Project number: ${projectInfo.number}`);
              return;
            }

            const statusField = projectV2.field;
            if (!statusField) {
              console.log('❌ No Status field in the project.');
              console.log('');
              console.log('💡 How to fix:');
              console.log('   1. Make sure GitHub Projects has a "Status" field.');
              console.log('   2. Make sure the field is named exactly "Status".');
              return;
            }

            // 한글/영문 라벨은 같은 상태다. 보드의 열 이름이 어느 쪽이든 찾을 수 있게 별칭 그룹으로 매칭한다 (#776).
            const STATUS_ALIASES = [
              ['작업전', 'status: todo'],
              ['작업중', 'status: in progress'],
              ['담당자확인', 'status: needs review'],
              ['피드백', 'status: feedback'],
              ['작업완료', 'status: done'],
              ['보류', 'status: on hold'],
              ['취소', 'status: cancelled'],
            ];
            const aliasGroup = STATUS_ALIASES.find(g => g.includes(statusLabel)) || [statusLabel];
            // 라벨 이름과 정확히 같은 열을 우선하고, 없을 때만 별칭 열을 쓴다
            const targetOption =
              statusField.options.find(opt => opt.name === statusLabel) ||
              statusField.options.find(opt => aliasGroup.includes(opt.name));
            if (!targetOption) {
              console.log(`❌ The project has no "${statusLabel}" status option.`);
              console.log('');
              console.log('💡 Status options in the project:');
              statusField.options.forEach(opt => {
                console.log(`   - ${opt.name}`);
              });
              console.log('');
              console.log('💡 How to fix:');
              console.log('   1. Add the status option in GitHub Projects.');
              console.log('   2. Or change STATUS_LABELS in the workflow to match the project.');
              return;
            }

            console.log(`📌 Status Option ID: ${targetOption.id}`);

            // ============================================
            // Status 업데이트
            // ============================================
            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: {
                      singleSelectOptionId: $optionId
                    }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;

            try {
              await github.graphql(updateMutation, {
                projectId: projectV2.id,
                itemId: targetItem.id,
                fieldId: statusField.id,
                optionId: targetOption.id
              });

              console.log(`✅ Status updated to "${statusLabel}".`);
            } catch (error) {
              console.log('❌ Status update failed.');
              console.log(`   Error: ${error.message}`);
            }
