# ===================================================================
# PROJECT-NODE-NPM-PUBLISH.yaml
# npm package auto-publish workflow v1.0
# ===================================================================
#
# Publishes an npm library/CLI package to the public npmjs registry automatically.
#
# What it does:
# - reads the version.yml version, injects it into package.json, then npm publish
# - a version already in the registry ends successfully (idempotent)
#
# Triggers: push to main (+ manual run)
# - publishes on a release merge (develop->main), at the same time as README-VERSION-UPDATE etc.
# - When VERSION-CONTROL changes version.yml with GITHUB_TOKEN,
#   follow-up workflows are not triggered, so main push is used as the trigger
#
# Required Secret:
# - NPM_TOKEN: npm Granular Access Token (2FA bypass allowed, publish permission)
#   Create: https://www.npmjs.com/settings → Access Tokens → Generate New Token
# ===================================================================

name: PROJECT-NODE-NPM-PUBLISH

concurrency:
  group: npm-publish
  cancel-in-progress: false

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-npm:
    name: Publish npm package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Read version from version.yml
        id: version
        run: |
          chmod +x .github/scripts/version_manager.sh
          VERSION=$(./.github/scripts/version_manager.sh get | tail -n 1)
          if [ -z "$VERSION" ]; then
            echo "❌ Could not read the version from version.yml"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version to publish: $VERSION"

      - name: Set package.json version
        run: npm pkg set version=${{ steps.version.outputs.version }}

      - name: Check whether this version is already published (idempotent)
        id: check
        run: |
          PKG_NAME=$(npm pkg get name | tr -d '"')
          VERSION="${{ steps.version.outputs.version }}"
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "ℹ️ ${PKG_NAME}@${VERSION} is already published. Skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish summary
        if: steps.check.outputs.skip == 'false'
        run: echo "✅ ${{ steps.check.outputs.pkg_name }}@${{ steps.version.outputs.version }} published to npm"
