# ===================================================================
# Python FastAPI CI/CD 배포 (SSH + Docker)
# ===================================================================
#
# main 브랜치 푸시 시 Docker 이미지를 빌드하고
# SSH로 접속 가능한 서버(Synology·AWS EC2·VPS 등)에 자동 배포합니다.
#
# ===================================================================
# 🔑 필수 GitHub Secrets
# ===================================================================
# ENV_FILE: .env 파일 내용
# DOCKERHUB_USERNAME: DockerHub 사용자명
# DOCKERHUB_TOKEN: DockerHub 액세스 토큰
# SERVER_HOST: 배포 서버 주소
# SERVER_USER: SSH 사용자명
# SERVER_PASSWORD: SSH 비밀번호 (SSH_AUTH_METHOD=password일 때)
# SSH_KEY: SSH 개인키 .pem 내용 (SSH_AUTH_METHOD=key일 때, AWS EC2 등)
# ===================================================================
#
# 🔧 환경변수 설정 (env 섹션에서 설정)
# ===================================================================
#
# 🌐 포트 및 컨테이너:
# CONTAINER_INTERNAL_PORT: FastAPI 내부 포트 (기본: 8000)
# DEPLOY_PORT: 배포 포트
# CONTAINER_NAME: 컨테이너 이름 (기본: PROJECT_NAME)
#
# 📦 볼륨 마운트:
# ENABLE_VOLUME_MOUNT: 볼륨 마운트 활성화 (true/false)
# VOLUME_HOST_PATH: 호스트 볼륨 경로
# VOLUME_CONTAINER_PATH: 컨테이너 내부 마운트 경로
#
# 🔌 SSH 연결:
# SSH_PORT: SSH 포트 (기본: 2022)
# SSH_COMMAND_TIMEOUT: SSH 명령 타임아웃 (기본: 600s)
# SSH_CONNECTION_TIMEOUT: SSH 연결 타임아웃 (기본: 60s)
#
# ⏱️ 헬스체크:
# HEALTHCHECK_WAIT_SECONDS: 초기화 대기 시간 (기본: 10초)
# HEALTHCHECK_PATH: HTTP 엔드포인트 경로 (비어있으면 로그만 사용)
# HEALTHCHECK_MAX_RETRIES: HTTP 재시도 횟수 (기본: 5회)
# HEALTHCHECK_RETRY_INTERVAL: 재시도 간격 (기본: 3초)
# HEALTHCHECK_LOG_PATTERN: Fallback 로그 검색 패턴
#
# 💡 HEALTHCHECK_PATH 예시:
#   FastAPI: "/docs"
#   커스텀: "/api/v1/health"
# ===================================================================

name: PROJECT-PYTHON-SIMPLE-CICD

# ===================================================================
# 트리거 설정
# ===================================================================
on:
  push:
    branches:
      - main  # 프로덕션 배포
    # @wizard paths-anchor (모노레포일 때 integrator가 paths 필터를 여기 주입)
  workflow_dispatch:  # 수동 실행 허용

permissions:
  # GITHUB_TOKEN 으로는 읽기만 한다. 명시해 두면 레포 기본값이 나중에 write 로 바뀌어도
  # 이 워크플로우가 필요 이상의 권한을 갖지 않는다 (#595).
  contents: read

# ===================================================================
# 환경 변수 설정
# ===================================================================
env:
  # 프로젝트 고유 식별자
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo

  # 🌐 포트 설정
  DEPLOY_PORT: "__DEPLOY_PORT__"  # @wizard ask:8000

  # 🐍 Python 설정
  PYTHON_VERSION: "3.13"

  # 🐳 컨테이너 이름 설정 (비워두면 PROJECT_NAME 사용)
  CONTAINER_NAME: ""

  # 🗂️ 볼륨 마운트 설정 (빈값이면 마운트 안함)
  ENABLE_VOLUME_MOUNT: "false"
  VOLUME_HOST_PATH: "/volume1/projects/__PROJECT_NAME__"  # @wizard ask:/volume1/projects/__PROJECT_NAME__
  VOLUME_CONTAINER_PATH: "/mnt/__PROJECT_NAME__"  # @wizard ask:/mnt/__PROJECT_NAME__

  # 🔐 SSH 인증 방식: "password"(Synology·일반 서버) | "key"(AWS EC2·.pem)
  #   password → SERVER_PASSWORD secret 사용
  #   key      → SSH_KEY secret 사용 (.pem 파일 전체 내용을 secret 값으로)
  SSH_AUTH_METHOD: "password"  # @wizard ask:password

  # 🔌 SSH 연결 설정
  SSH_PORT: "2022"  # SSH 포트 (Synology 기본: 2022)
  SSH_COMMAND_TIMEOUT: "600s"  # SSH 명령 실행 타임아웃
  SSH_CONNECTION_TIMEOUT: "60s"  # SSH 연결 타임아웃

  # 🌐 컨테이너 포트 설정
  CONTAINER_INTERNAL_PORT: "8000"  # FastAPI 내부 포트

  # ⏱️ 헬스체크 설정
  HEALTHCHECK_WAIT_SECONDS: "10"  # 컨테이너 초기화 대기 시간 (초)
  HEALTHCHECK_PATH: "/docs"  # HTTP 엔드포인트 경로 (비어있으면 로그 패턴만 사용)
  HEALTHCHECK_MAX_RETRIES: "5"  # HTTP 재시도 횟수
  HEALTHCHECK_RETRY_INTERVAL: "3"  # 재시도 간격 (초)
  HEALTHCHECK_LOG_PATTERN: "Uvicorn running on"  # Fallback 로그 검색 패턴

jobs:
  # ===================================================================
  # 빌드 작업
  # ===================================================================
  build:
    name: Build Python FastAPI application
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: Check out code
        uses: actions/checkout@v5

      # 사전 점검 (#666)
      # 신규 설치 직후에는 Secret, Dockerfile, gradlew 가 없는 것이 정상이다. 그대로 두면 하위 step 에서
      # 원인을 짚기 어려운 한 줄로 실패하므로, 무엇이 없고 무엇을 해야 하는지 첫 step 에서 알린다.
      # 전제가 모두 갖춰진 레포는 이 step 을 그대로 통과하며 이후 동작은 달라지지 않는다.
      - name: Preflight check
        env:
          SSH_AUTH_METHOD: ${{ env.SSH_AUTH_METHOD }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          fail=0
          # Dockerfile 점검: 없으면 docker build 단계에서 "failed to read dockerfile" 로만 알려준다
          if [ ! -f "./Dockerfile" ]; then
            echo "::error title=Preflight check::Dockerfile (./Dockerfile) is missing. Add a Dockerfile to the project root and commit it."
            fail=1
          fi
          # Secret 점검: 빈 값이면 로그인, SSH 접속 단계에서 원인 불명 에러가 난다
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN SERVER_HOST SERVER_USER; do
            if [ -z "${!name}" ]; then
              echo "::error title=Preflight check::Secret ${name} is missing. Add it under Settings > Secrets and variables > Actions > New repository secret"
              fail=1
            fi
          done
          # SSH 인증 방식에 따라 필요한 Secret 이 다르다 (SSH_AUTH_METHOD: password | key)
          if [ "${SSH_AUTH_METHOD:-password}" = "key" ]; then
            [ -n "$SSH_KEY" ] || { echo "::error title=Preflight check::Secret SSH_KEY is missing (SSH_AUTH_METHOD=key). Add the full .pem content as its value under Settings > Secrets and variables > Actions > New repository secret"; fail=1; }
          else
            [ -n "$SERVER_PASSWORD" ] || { echo "::error title=Preflight check::Secret SERVER_PASSWORD is missing (SSH_AUTH_METHOD=password). Add it under Settings > Secrets and variables > Actions > New repository secret"; fail=1; }
          fi
          [ "$fail" = "0" ] || exit 1
          echo "✅ Preflight check passed"

      # 2. 디스크 공간 확보
      - name: Free up disk space
        run: |
          echo "📊 Disk usage before build:"
          df -h

          echo "🧹 Removing unneeded files..."
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true

          echo "🐳 Cleaning up Docker..."
          docker system prune -af --volumes || true

          echo "📊 Disk usage after cleanup:"
          df -h

      # 3. .env 파일 생성
      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > .env
          echo "✅ .env file created"

      # 4. Docker 빌드 환경 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 5. DockerHub 로그인
      - name: Log in to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Docker 이미지 빌드 및 푸시
      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:${{ github.ref_name }}
          # GitHub Actions 캐시 사용 (로컬 디스크 공간 절약)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 7. 빌드 후 정리
      - name: Clean up after build
        if: always()
        run: |
          echo "🧹 Cleaning up after build..."
          docker system prune -f || true
          echo "📊 Final disk usage:"
          df -h

  # ===================================================================
  # 배포 작업
  # ===================================================================
  deploy:
    name: Deploy to remote server
    needs: build
    runs-on: ubuntu-latest

    steps:
      # SSH 통한 원격 서버 배포 실행
      - name: Deploy
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SSH_AUTH_METHOD: ${{ env.SSH_AUTH_METHOD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          command_timeout: ${{ env.SSH_COMMAND_TIMEOUT }}
          timeout: ${{ env.SSH_CONNECTION_TIMEOUT }}
          envs: SSH_AUTH_METHOD,SERVER_PASSWORD
          script: |
            set -e

            # ============================================================
            # 배포 환경 변수 설정
            # ============================================================
            echo "🔧 Setting environment variables.."
            export PATH=$PATH:/usr/local/bin
            export PW="${SERVER_PASSWORD}"

            # 🔐 SSH 인증 방식에 따른 sudo 추상화
            #   password 모드: echo $PW | sudo -S  (Synology 등 sudo 비밀번호 필요 서버)
            #   key 모드: sudo 직접  (AWS EC2 등 passwordless sudo 서버)
            SSH_AUTH_METHOD="${SSH_AUTH_METHOD:-password}"
            if [ "${SSH_AUTH_METHOD}" = "key" ]; then
              SUDO() { sudo "$@"; }
            else
              SUDO() { echo "$PW" | sudo -S "$@"; }
            fi
            echo "🔐 SSH auth method: ${SSH_AUTH_METHOD}"

            # GitHub에서 전달받은 브랜치명
            BRANCH=${{ github.ref_name }}

            # 프로젝트 설정
            PROJECT_NAME="${{ env.PROJECT_NAME }}"

            # ============================================================
            # 포트 및 컨테이너명 설정
            # ============================================================
            PORT=${{ env.DEPLOY_PORT }}

            # 컨테이너 이름 설정
            if [ -z "${{ env.CONTAINER_NAME }}" ]; then
              CONTAINER_NAME="${PROJECT_NAME}"
              echo "ℹ️ CONTAINER_NAME is not set, using PROJECT_NAME: $CONTAINER_NAME"
            else
              CONTAINER_NAME="${{ env.CONTAINER_NAME }}"
              echo "ℹ️ Using custom CONTAINER_NAME: $CONTAINER_NAME"
            fi

            echo "🚀 Deploying to the deploy environment (branch: $BRANCH)"

            # 설정 정보 출력
            echo "📋 Deploy settings:"
            echo "  - Branch: $BRANCH"
            echo "  - Project: $PROJECT_NAME"
            echo "  - Container name: $CONTAINER_NAME"
            echo "  - Port: $PORT"
            echo "  - Docker image: ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}:${BRANCH}"

            # ============================================================
            # Docker 이미지 풀 (Pull)
            # ============================================================
            echo "⬇️ Pulling Docker image: ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}:${BRANCH}"
            SUDO docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}:${BRANCH}

            # 컨테이너 시작을 함수로 둬서 배포 실패 시 이전 이미지로 같은 옵션으로 복구할 수 있게 한다 (#730)
            start_container() {
              # 서버 재부팅·Docker 재시작 뒤에도 서비스가 자동으로 올라오도록 한다 (#727)
              SUDO docker run -d \
                -p ${PORT}:${{ env.CONTAINER_INTERNAL_PORT }} \
                --name $CONTAINER_NAME \
                --restart unless-stopped \
                -e TZ=Asia/Seoul \
                $VOLUME_OPTS \
                "$1"
            }

            # 교체 중 실패하면 실패한 컨테이너를 지우고 이전 이미지로 복구한다 (#730)
            PREV_IMAGE=""
            REPLACING=false
            DEPLOY_OK=false
            rollback_on_failure() {
              status=$?
              if [ "$REPLACING" = "true" ] && [ "$DEPLOY_OK" != "true" ]; then
                echo "⚠️ Deploy failed: removing the failed container"
                SUDO docker rm -f $CONTAINER_NAME >/dev/null 2>&1 || true
                if [ -n "$PREV_IMAGE" ]; then
                  echo "↩️ Restoring the previous version: $PREV_IMAGE"
                  if start_container "$PREV_IMAGE"; then
                    echo "✅ Previous version restored (this deploy is still marked as failed)"
                  else
                    echo "❌ Failed to restore the previous version"
                  fi
                else
                  echo "ℹ️ No container was running before, so there is no version to restore"
                fi
              fi
              exit $status
            }
            trap rollback_on_failure EXIT

            # ============================================================
            # 기존 컨테이너 정리
            # ============================================================
            echo "🧹 Checking whether container $CONTAINER_NAME exists..."

            # 동일한 이름의 컨테이너가 존재하는지 확인
            # 이전 이미지 ID 를 기억해 둔다 (태그가 새 이미지로 옮겨가도 ID 로 복구할 수 있다)
            PREV_IMAGE=$(SUDO docker inspect --format '{{.Image}}' $CONTAINER_NAME 2>/dev/null || true)
            REPLACING=true
            if SUDO docker ps -a --format '{{.Names}}' | grep -Eq "^${CONTAINER_NAME}\$"; then
              echo "⚠️ Container $CONTAINER_NAME exists. Stopping and removing it..."
              SUDO docker rm -f $CONTAINER_NAME
              echo "✅ Container $CONTAINER_NAME removed."
            else
              echo "ℹ️ No existing container $CONTAINER_NAME."
            fi

            # ============================================================
            # 새 컨테이너 실행
            # ============================================================
            echo "🚀 Starting new container $CONTAINER_NAME..."

            # Docker 컨테이너 실행
            # - 포트 매핑: ${PORT}:${{ env.CONTAINER_INTERNAL_PORT }} (외부:내부)
            # - 시간대: Asia/Seoul
            # - 볼륨 마운트: 로컬 시간 동기화 및 프로젝트 데이터
            # ⚠️ .env 파일은 이미 Docker 이미지에 포함되어 있습니다

            # 볼륨 마운트 옵션 구성
            VOLUME_OPTS="-v /etc/localtime:/etc/localtime:ro"
            if [ "${{ env.ENABLE_VOLUME_MOUNT }}" == "true" ]; then
              # 디렉토리가 없으면 생성
              if [ ! -d "${{ env.VOLUME_HOST_PATH }}" ]; then
                echo "📁 Creating volume mount directory: ${{ env.VOLUME_HOST_PATH }}"
                SUDO mkdir -p "${{ env.VOLUME_HOST_PATH }}"
              fi
              VOLUME_OPTS="$VOLUME_OPTS -v ${{ env.VOLUME_HOST_PATH }}:${{ env.VOLUME_CONTAINER_PATH }}"
              echo "📦 Volume mount enabled: $VOLUME_OPTS"
            else
              echo "ℹ️ Volume mount disabled"
            fi

            start_container ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}:${BRANCH}

            # ============================================================
            # 컨테이너 헬스체크
            # ============================================================
            echo "⏳ Waiting for the container to start... (${{ env.HEALTHCHECK_WAIT_SECONDS }}s)"
            sleep ${{ env.HEALTHCHECK_WAIT_SECONDS }}

            # 1단계: 컨테이너 프로세스 확인
            echo "🏥 Running container health check..."
            if ! SUDO docker ps --format '{{.Names}}' | grep -Eq "^${CONTAINER_NAME}\$"; then
              echo "❌ Container $CONTAINER_NAME process is not running"
              SUDO docker logs --tail 50 $CONTAINER_NAME || true
              exit 1
            fi
            echo "✅ Container process is running"

            # 2단계: HTTP 엔드포인트 체크 (설정된 경우)
            HEALTHCHECK_SUCCESS=false
            if [ -n "${{ env.HEALTHCHECK_PATH }}" ]; then
              echo "🌐 Starting HTTP health check: http://localhost:${PORT}${{ env.HEALTHCHECK_PATH }}"

              for i in $(seq 1 ${{ env.HEALTHCHECK_MAX_RETRIES }}); do
                echo "  Attempt $i/${{ env.HEALTHCHECK_MAX_RETRIES }}..."

                HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:${PORT}${{ env.HEALTHCHECK_PATH }} || echo "000")

                if [ "$HTTP_CODE" = "200" ]; then
                  echo "✅ HTTP health check passed (status code: $HTTP_CODE)"
                  HEALTHCHECK_SUCCESS=true
                  break
                else
                  echo "⚠️ HTTP health check failed (status code: $HTTP_CODE)"
                  if [ $i -lt ${{ env.HEALTHCHECK_MAX_RETRIES }} ]; then
                    echo "  Retrying in ${{ env.HEALTHCHECK_RETRY_INTERVAL }}s..."
                    sleep ${{ env.HEALTHCHECK_RETRY_INTERVAL }}
                  fi
                fi
              done

              # HTTP 체크 실패 시 fallback으로 로그 패턴 매칭
              if [ "$HEALTHCHECK_SUCCESS" = "false" ]; then
                echo "⚠️ HTTP health check failed for good, falling back to log pattern matching..."
              fi
            else
              echo "ℹ️ HEALTHCHECK_PATH is not set, using log pattern matching only"
            fi

            # 3단계: 로그 패턴 매칭 (HTTP 실패 시 또는 HTTP 체크 비활성화 시)
            if [ "$HEALTHCHECK_SUCCESS" = "false" ]; then
              echo "📋 Starting log pattern matching: '${{ env.HEALTHCHECK_LOG_PATTERN }}'"

              if SUDO docker logs $CONTAINER_NAME 2>&1 | grep -q "${{ env.HEALTHCHECK_LOG_PATTERN }}"; then
                echo "✅ Log pattern matched: the application started correctly"
                HEALTHCHECK_SUCCESS=true
              else
                echo "❌ Log pattern not matched: could not find the application start log"
                echo ""
                echo "📋 Debug info:"
                echo "  - Search pattern: ${{ env.HEALTHCHECK_LOG_PATTERN }}"
                echo "  - Container: $CONTAINER_NAME"
                echo "  - Image: ${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}:${BRANCH}"
                echo "  - Port: ${PORT}:${{ env.CONTAINER_INTERNAL_PORT }}"
                echo "  - Volume: $VOLUME_OPTS"
                echo ""
                echo "📋 Container log (last 50 lines):"
                SUDO docker logs --tail 50 $CONTAINER_NAME || true
                exit 1
              fi
            fi

            # 최종 성공 메시지
            if [ "$HEALTHCHECK_SUCCESS" = "true" ]; then
              echo "✅ Health check complete: container $CONTAINER_NAME is running"
            fi

            # ============================================================
            # 배포 완료 확인
            # ============================================================
            DEPLOY_OK=true
            echo "✅ Deploy completed successfully!"
            echo ""
            echo "📋 Deploy summary:"
            echo "  🎯 Project: $PROJECT_NAME"
            echo "  🌿 Branch: $BRANCH"
            echo "  🐳 Container: $CONTAINER_NAME"
            echo "  🌐 Port: $PORT"
            echo "  ⏰ Deployed at: $(date '+%Y-%m-%d %H:%M:%S')"
            echo ""
            echo "🔗 URL: http://${{ secrets.SERVER_HOST }}:${PORT}/docs"
