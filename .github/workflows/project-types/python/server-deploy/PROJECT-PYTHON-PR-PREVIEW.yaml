# ===================================================================
# Python/FastAPI PR Preview (SSH + Docker + Traefik)
# ===================================================================
#
# PR 또는 Issue 코멘트 명령어를 통해 Preview 환경을 자동으로 관리합니다.
# Traefik 리버스 프록시를 통해 동적 라우팅됩니다.
#
# ===================================================================
# 🔑 필수 GitHub Secrets
# ===================================================================
# ENV_FILE: .env 파일 전체 내용
# DOCKERHUB_USERNAME: Docker Hub 사용자명
# DOCKERHUB_TOKEN: Docker Hub 액세스 토큰
# SERVER_HOST: 서버 호스트(SSH 접속 주소)
# SERVER_USER: SSH 사용자명
# SERVER_PASSWORD: SSH 비밀번호 (SSH_AUTH_METHOD=password일 때)
# SSH_KEY: SSH 개인키 .pem 내용 (SSH_AUTH_METHOD=key일 때, AWS EC2 등)
# ===================================================================
#
# 🚀 사용법:
# @projectops server build    - Preview 빌드 및 배포
# @projectops server destroy  - Preview 환경 삭제
# @projectops server status   - 현재 상태 확인
#
# 📊 리소스 네이밍:
# - 컨테이너: {PROJECT_NAME}-pr-{번호}
# - 도메인: {PROJECT_NAME}-pr-{번호}.pr.suhsaechan.kr
#
# 📋 사전 요구사항:
# - Traefik 컨테이너 실행 중 (traefik-network)
# - 와일드카드 DNS 설정: *.pr.suhsaechan.kr → 서버
# ===================================================================

name: PROJECT-PYTHON-PR-PREVIEW

# ===================================================================
# ⚠️ [영역 1] 프로젝트별 설정 - 다른 프로젝트에서 사용 시 이 섹션만 수정하세요
# ===================================================================
env:
  # 프로젝트 고유 식별자 (컨테이너명, 이미지명, 도메인에 사용)
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo

  # Docker 설정
  DOCKERFILE_PATH: './Dockerfile'
  INTERNAL_PORT: '8000'

  # 🗂️ 볼륨 마운트 설정 (프로젝트별 수정 필요, 빈값이면 마운트 안함)
  PROJECT_TARGET_DIR: "/volume1/projects/프로젝트명/ai"  # 서버의 데이터 디렉토리
  PROJECT_MNT_DIR: "/mnt/프로젝트명"                     # 컨테이너 내부 마운트 경로

  # Traefik & Preview 도메인 설정 (환경 구축 후 수정 금지)
  TRAEFIK_NETWORK: traefik-network
  PREVIEW_DOMAIN_SUFFIX: pr.suhsaechan.kr
  PREVIEW_PORT: '8079'

  # 🔐 SSH 인증 방식: "password"(Synology·일반 서버) | "key"(AWS EC2·.pem)
  #   password → SERVER_PASSWORD secret 사용
  #   key      → SSH_KEY secret 사용 (.pem 파일 전체 내용을 secret 값으로)
  SSH_AUTH_METHOD: "password"  # @wizard ask:password

  # SSH 포트 (서버 포트 환경 구축 후 수정 금지)
  SSH_PORT: '2022'

  # Issue Helper 댓글 마커 (프로젝트별 수정 필요)
  # Issue 댓글에서 브랜치명을 추출할 때 사용
  ISSUE_HELPER_MARKER: 'Guide by SUH-LAB'

  # Health Check 설정 (프로젝트별 수정 필요)
  # - HEALTH_CHECK_PATH: HTTP Health Check 경로 (빈값이면 HTTP 체크 건너뜀)
  # - HEALTH_CHECK_LOG_PATTERN: 로그 패턴 매칭 (HTTP 실패 시 폴백)
  # - API_DOCS_PATH: API 문서 URL (빈값이면 배포 코멘트에 미표시)
  #
  # 프레임워크별 기본값 예시:
  #   FastAPI: '/docs', 'Uvicorn running on|Application startup complete'
  #   Spring Boot: '/actuator/health', 'Started.*Application|Tomcat started on port'
  #   Express: '/health', 'Server listening on port'
  HEALTH_CHECK_PATH: '/docs'
  HEALTH_CHECK_LOG_PATTERN: 'Uvicorn running on|Application startup complete'
  API_DOCS_PATH: '/docs'

# ===================================================================
# 트리거 설정
# ===================================================================
on:
  issue_comment:
    types: [created]      # PR 댓글 + Issue 댓글
  issues:
    types: [closed]       # Issue 닫힘 시 destroy
  pull_request:
    types: [closed]       # PR 닫힘 시 destroy

permissions:
  contents: read
  pull-requests: write
  issues: write

# ===================================================================
# Jobs
# ===================================================================
jobs:
  # -----------------------------------------------------------------
  # Job 1: 명령어 파싱 (PR 댓글 + Issue 댓글 모두 지원)
  # -----------------------------------------------------------------
  check-command:
    # 잡 이름은 브랜치 보호의 필수 상태 체크 이름이 될 수 있어 번역하지 않는다 (#769)
    name: 명령어 확인
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.parse.outputs.command }}
      is_valid: ${{ steps.parse.outputs.is_valid }}
      is_pr: ${{ steps.parse.outputs.is_pr }}
      custom_branch: ${{ steps.parse.outputs.custom_branch }}
      is_custom_branch: ${{ steps.parse.outputs.is_custom_branch }}
    steps:
      - name: Add 👀 reaction to the comment
        # 봇 안내 댓글은 제외한다 (#576) — 안내문 문구가 조건을 만족해 오발동한 전례가 있다
        if: ${{ !contains(github.event.comment.body, '<!-- SUH-ISSUE-HELPER -->') && contains(github.event.comment.body, '@projectops') && contains(github.event.comment.body, 'server') }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Parse the command
        id: parse
        env:
          COMMENT: ${{ github.event.comment.body }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
        run: |
          # PR인지 Issue인지 확인
          if [[ "$IS_PR" == "true" ]]; then
            echo "is_pr=true" >> $GITHUB_OUTPUT
            echo "ℹ️ Command detected in a PR comment"
          else
            echo "is_pr=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Command detected in an issue comment"
          fi

          # 명령어 파싱 (브랜치 파라미터 지원)
          # 형식: @projectops server <command> [브랜치명]
          if [[ "$COMMENT" =~ @projectops[[:space:]]+server[[:space:]]+build([[:space:]]+([^[:space:]]+))? ]]; then
            echo "command=build" >> $GITHUB_OUTPUT
            echo "is_valid=true" >> $GITHUB_OUTPUT
            if [[ -n "${BASH_REMATCH[2]}" ]]; then
              echo "custom_branch=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
              echo "is_custom_branch=true" >> $GITHUB_OUTPUT
              echo "✅ Command detected: build (branch: ${BASH_REMATCH[2]})"
            else
              echo "is_custom_branch=false" >> $GITHUB_OUTPUT
              echo "✅ Command detected: build"
            fi
          elif [[ "$COMMENT" =~ @projectops[[:space:]]+server[[:space:]]+destroy([[:space:]]+([^[:space:]]+))? ]]; then
            echo "command=destroy" >> $GITHUB_OUTPUT
            echo "is_valid=true" >> $GITHUB_OUTPUT
            if [[ -n "${BASH_REMATCH[2]}" ]]; then
              echo "custom_branch=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
              echo "is_custom_branch=true" >> $GITHUB_OUTPUT
              echo "✅ Command detected: destroy (branch: ${BASH_REMATCH[2]})"
            else
              echo "is_custom_branch=false" >> $GITHUB_OUTPUT
              echo "✅ Command detected: destroy"
            fi
          elif [[ "$COMMENT" =~ @projectops[[:space:]]+server[[:space:]]+status([[:space:]]+([^[:space:]]+))? ]]; then
            echo "command=status" >> $GITHUB_OUTPUT
            echo "is_valid=true" >> $GITHUB_OUTPUT
            if [[ -n "${BASH_REMATCH[2]}" ]]; then
              echo "custom_branch=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
              echo "is_custom_branch=true" >> $GITHUB_OUTPUT
              echo "✅ Command detected: status (branch: ${BASH_REMATCH[2]})"
            else
              echo "is_custom_branch=false" >> $GITHUB_OUTPUT
              echo "✅ Command detected: status"
            fi
          else
            echo "is_valid=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Not an @projectops server command"
          fi

  # -----------------------------------------------------------------
  # Job 2-1: 빌드 & 배포 (PR 댓글에서 실행)
  # -----------------------------------------------------------------
  build-preview-pr:
    # 잡 이름은 브랜치 보호의 필수 상태 체크 이름이 될 수 있어 번역하지 않는다 (#769)
    name: Preview 빌드 & 배포 (PR)
    needs: check-command
    if: |
      needs.check-command.outputs.is_valid == 'true' &&
      needs.check-command.outputs.command == 'build' &&
      needs.check-command.outputs.is_pr == 'true' &&
      needs.check-command.outputs.is_custom_branch != 'true'
    runs-on: ubuntu-latest
    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js python_preview. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('sha', pr.data.head.sha.substring(0, 7));
            return pr.data.number;

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 진행 상황 댓글 시스템
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Create progress comment
        id: progress
        uses: actions/github-script@v7
        with:
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const prNumber = context.issue.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const startTime = Date.now();

            const body = [
              t('python_preview.heading.building', { kind: 'PR' }),
              '',
              t('python_preview.table.steps_header'),
              '|------|------|----------|',
              t('python_preview.row.docker_in_progress'),
              t('python_preview.row.deploy_waiting'),
              '',
              t('python_preview.live_log', { url: runUrl }),
              '',
              '---',
              t('python_preview.footer.auto_update')
            ].join('\n');

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body
            });

            core.setOutput('comment_id', comment.id);
            core.setOutput('start_time', startTime);
            core.setOutput('docker_start', startTime);

      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.ref }}

      # =================================================================
      # ⚠️ [영역 2] 환경변수 파일 생성
      # =================================================================
      - name: "[Required] Create .env file"
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > .env
      # =================================================================
      # ⚠️ [영역 2 끝] 환경변수 파일 생성 끝
      # =================================================================

      - name: Docker login
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build & push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:pr-${{ github.event.issue.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Progress - Docker done
        id: docker_progress
        uses: actions/github-script@v7
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id }};
            const dockerStart = ${{ steps.progress.outputs.docker_start }};
            const now = Date.now();
            const dockerElapsed = now - dockerStart;
            const minutes = Math.floor(dockerElapsed / 60000);
            const seconds = Math.floor((dockerElapsed % 60000) / 1000);
            const dockerDuration = elapsed(minutes, seconds);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              t('python_preview.heading.building', { kind: 'PR' }),
              '',
              t('python_preview.table.steps_header'),
              '|------|------|----------|',
              t('python_preview.row.docker_done', { duration: dockerDuration }),
              t('python_preview.row.deploy_in_progress'),
              '',
              t('python_preview.live_log', { url: runUrl }),
              '',
              '---',
              t('python_preview.footer.auto_update')
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            core.setOutput('docker_duration', dockerDuration);
            core.setOutput('deploy_start', now);

      - name: Deploy to server
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SSH_AUTH_METHOD: ${{ env.SSH_AUTH_METHOD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          envs: SSH_AUTH_METHOD,SERVER_PASSWORD
          script: |
            set -e

            # 환경 변수 설정 (배포 서버용)
            export PATH=$PATH:/usr/local/bin
            export PW="${SERVER_PASSWORD}"

            # 🔐 SSH 인증 방식에 따른 sudo 추상화
            SSH_AUTH_METHOD="${SSH_AUTH_METHOD:-password}"
            if [ "${SSH_AUTH_METHOD}" = "key" ]; then
              SUDO() { sudo "$@"; }
            else
              SUDO() { echo "$PW" | sudo -S "$@"; }
            fi
            echo "🔐 SSH auth method: ${SSH_AUTH_METHOD}"

            # 변수 설정
            PR_NUMBER=${{ github.event.issue.number }}
            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            CONTAINER_NAME="${PROJECT_NAME}-pr-${PR_NUMBER}"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}:pr-${PR_NUMBER}"
            DOMAIN="${PROJECT_NAME}-pr-${PR_NUMBER}.${{ env.PREVIEW_DOMAIN_SUFFIX }}"
            INTERNAL_PORT="${{ env.INTERNAL_PORT }}"
            TRAEFIK_NETWORK="${{ env.TRAEFIK_NETWORK }}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Starting PR Preview deployment"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦 Project: ${PROJECT_NAME}"
            echo "🔢 PR number: #${PR_NUMBER}"
            echo "📛 Container: ${CONTAINER_NAME}"
            echo "🌐 Domain: ${DOMAIN}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # 이미지 Pull
            echo "📥 Pulling Docker image..."
            SUDO docker pull "${IMAGE}"

            # 기존 컨테이너 삭제
            echo "🗑️ Removing the existing container..."
            SUDO docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

            # 볼륨 마운트 옵션 구성
            VOLUME_OPTS="-v /etc/localtime:/etc/localtime:ro"
            if [ -n "${{ env.PROJECT_TARGET_DIR }}" ] && [ -n "${{ env.PROJECT_MNT_DIR }}" ]; then
              VOLUME_OPTS="$VOLUME_OPTS -v ${{ env.PROJECT_TARGET_DIR }}:${{ env.PROJECT_MNT_DIR }}"
            fi

            # 새 컨테이너 실행
            echo "🐳 Starting the new container..."
            SUDO docker run -d \
              --name "${CONTAINER_NAME}" \
              --network "${TRAEFIK_NETWORK}" \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.${CONTAINER_NAME}.rule=Host(\`${DOMAIN}\`)" \
              --label "traefik.http.routers.${CONTAINER_NAME}.entrypoints=web" \
              --label "traefik.http.services.${CONTAINER_NAME}.loadbalancer.server.port=${INTERNAL_PORT}" \
              -e TZ=Asia/Seoul \
              -e ENVIRONMENT=prod \
              $VOLUME_OPTS \
              "${IMAGE}"

            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            # Health Check (최대 120초 대기) - 하이브리드 방식
            # 1. HEALTH_CHECK_PATH가 설정되어 있으면 HTTP 체크 시도
            # 2. 폴백: 로그 패턴 매칭 (HEALTH_CHECK_LOG_PATTERN)
            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            echo ""
            echo "⏳ Starting health check (waiting up to 120s)..."
            HEALTH_PATH="${{ env.HEALTH_CHECK_PATH }}"
            LOG_PATTERN="${{ env.HEALTH_CHECK_LOG_PATTERN }}"
            MAX_RETRIES=24
            RETRY_COUNT=0
            HEALTH_CHECK_PASSED=false
            HEALTH_CHECK_METHOD=""

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              sleep 5
              RETRY_COUNT=$((RETRY_COUNT + 1))

              # 1. 컨테이너 상태 확인
              STATUS=$(SUDO docker inspect --format='{{.State.Status}}' "${CONTAINER_NAME}" 2>/dev/null || echo "not_found")

              if [ "$STATUS" = "exited" ]; then
                echo "❌ Container exited unexpectedly!"
                echo ""
                echo "📋 Container logs (last 100 lines):"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                SUDO docker logs --tail 100 "${CONTAINER_NAME}"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                exit 1
              fi

              if [ "$STATUS" = "running" ]; then
                # 2. HTTP Health Check 시도 (HEALTH_CHECK_PATH가 설정된 경우에만)
                if [ -n "$HEALTH_PATH" ]; then
                  HEALTH=$(SUDO docker exec "${CONTAINER_NAME}" curl -sf "http://localhost:${INTERNAL_PORT}${HEALTH_PATH}" 2>/dev/null || echo "")

                  if [ -n "$HEALTH" ]; then
                    echo "✅ Startup confirmed! (HTTP response: ${HEALTH_PATH})"
                    HEALTH_CHECK_PASSED=true
                    HEALTH_CHECK_METHOD="HTTP"
                    break
                  fi
                fi

                # 3. HTTP 응답 없으면 로그 패턴 매칭으로 폴백
                if [ -n "$LOG_PATTERN" ]; then
                  STARTED=$(SUDO docker logs --tail 50 "${CONTAINER_NAME}" 2>&1 | grep -E "$LOG_PATTERN" || echo "")

                  if [ -n "$STARTED" ]; then
                    echo "✅ Startup confirmed! (log pattern)"
                    echo "   $STARTED"
                    HEALTH_CHECK_PASSED=true
                    HEALTH_CHECK_METHOD="Log"
                    break
                  fi
                fi
              fi

              echo "⏳ Waiting... ($RETRY_COUNT/$MAX_RETRIES) - status: $STATUS"
            done

            if [ "$HEALTH_CHECK_PASSED" = "false" ]; then
              echo ""
              echo "❌ Health check timed out (120s)"
              echo ""
              echo "📋 Container logs (last 100 lines):"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              SUDO docker logs --tail 100 "${CONTAINER_NAME}"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              exit 1
            fi

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ Deployment and health check complete! (method: ${HEALTH_CHECK_METHOD})"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Deployment complete comment
        uses: actions/github-script@v7
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id }};
            const dockerDuration = '${{ steps.docker_progress.outputs.docker_duration }}';
            const deployStart = ${{ steps.docker_progress.outputs.deploy_start }};
            const now = Date.now();
            const deployElapsed = now - deployStart;
            const minutes = Math.floor(deployElapsed / 60000);
            const seconds = Math.floor((deployElapsed % 60000) / 1000);
            const deployDuration = elapsed(minutes, seconds);

            const projectName = '${{ env.PROJECT_NAME }}';
            const domainSuffix = '${{ env.PREVIEW_DOMAIN_SUFFIX }}';
            const previewPort = '${{ env.PREVIEW_PORT }}';
            const apiDocsPath = '${{ env.API_DOCS_PATH }}';
            const prNumber = context.issue.number;
            const domain = `${projectName}-pr-${prNumber}.${domainSuffix}`;
            const previewUrl = `http://${domain}:${previewPort}`;
            const sha = '${{ steps.pr.outputs.sha }}';

            // Preview 환경 테이블 구성 (API_DOCS_PATH가 있을 때만 API Docs 행 추가)
            const envRows = [
              `| **Preview URL** | ${previewUrl} |`,
            ];
            if (apiDocsPath) {
              envRows.push(`| **API Docs** | ${previewUrl}${apiDocsPath} |`);
            }
            envRows.push(t('python_preview.row.container', { container: `${projectName}-pr-${prNumber}` }));
            envRows.push(t('python_preview.row.commit', { sha }));

            const branchName = '${{ steps.pr.outputs.ref }}';

            const body = [
              t('python_preview.heading.deployed', { kind: 'PR' }),
              '',
              t('python_preview.table.steps_header'),
              '|------|------|----------|',
              t('python_preview.row.docker_done', { duration: dockerDuration }),
              t('python_preview.row.deploy_done', { duration: deployDuration }),
              '',
              t('python_preview.env_heading'),
              t('python_preview.table.item_header'),
              '|------|-----|',
              ...envRows,
              '',
              t('python_preview.commands.heading'),
              t('python_preview.commands.header'),
              '|--------|------|',
              t('python_preview.commands.redeploy', { command: '@projectops server build' }),
              t('python_preview.commands.destroy', { command: '@projectops server destroy' }),
              t('python_preview.commands.status', { command: '@projectops server status' }),
              '',
              '<details>',
              t('python_preview.commands.advanced_summary'),
              '',
              '```',
              `@projectops server build ${branchName}`,
              `@projectops server destroy ${branchName}`,
              `@projectops server status ${branchName}`,
              '```',
              '</details>',
              '',
              '---',
              t('python_preview.footer.generated', { kind: 'PR' })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

      - name: Error comment on build/deploy failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id || 0 }};
            const projectName = '${{ env.PROJECT_NAME }}';
            const prNumber = context.issue.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // 진행 상황에 따라 어디서 실패했는지 표시
            const dockerDuration = '${{ steps.docker_progress.outputs.docker_duration }}';

            // 실패 지점 판단 - 초기 단계 실패도 구분
            let dockerStatus, deployStatus;
            let dockerTime = '-';

            if (!commentId) {
              // 진행 상황 댓글 생성 전 실패 (초기화 단계)
              dockerStatus = t('python_preview.status.init_failed');
              deployStatus = '-';
            } else if (!dockerDuration || dockerDuration === '') {
              // Docker 빌드 단계에서 실패
              dockerStatus = t('python_preview.status.failed');
              deployStatus = t('python_preview.status.waiting');
            } else {
              // 배포 단계에서 실패
              dockerStatus = t('python_preview.status.done');
              deployStatus = t('python_preview.status.failed');
              dockerTime = dockerDuration;
            }

            const body = [
              t('python_preview.heading.deploy_failed', { kind: 'PR' }),
              '',
              t('python_preview.table.steps_header'),
              '|------|------|----------|',
              t('python_preview.row.docker_status', { status: dockerStatus, duration: dockerTime }),
              t('python_preview.row.deploy_status', { status: deployStatus }),
              '',
              t('python_preview.failure.log_link', { url: runUrl }),
              '',
              t('python_preview.failure.causes_heading'),
              t('python_preview.failure.cause_build'),
              t('python_preview.failure.cause_start'),
              t('python_preview.failure.cause_timeout'),
              t('python_preview.failure.cause_env'),
              '',
              t('python_preview.failure.next_heading'),
              t('python_preview.failure.next_check_log'),
              t('python_preview.failure.next_retry', { command: '@projectops server build' }),
              '',
              '---',
              t('python_preview.footer.generated', { kind: 'PR' })
            ].join('\n');

            // 진행 상황 댓글이 있으면 업데이트, 없으면 새로 생성
            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }

  # -----------------------------------------------------------------
  # Job 2-2: Issue에서 브랜치명 추출
  # -----------------------------------------------------------------
  get-branch-from-issue:
    # 잡 이름은 브랜치 보호의 필수 상태 체크 이름이 될 수 있어 번역하지 않는다 (#769)
    name: Issue에서 브랜치 추출
    needs: check-command
    if: |
      needs.check-command.outputs.is_valid == 'true' &&
      needs.check-command.outputs.is_pr == 'false' &&
      needs.check-command.outputs.is_custom_branch != 'true'
    runs-on: ubuntu-latest
    outputs:
      branch_name: ${{ steps.extract.outputs.branch }}
      found: ${{ steps.extract.outputs.found }}
      issue_number: ${{ steps.extract.outputs.issue_number }}
    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js python_preview. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Extract branch name from issue comments
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.issue.number;
            const marker = '${{ env.ISSUE_HELPER_MARKER }}';

            console.log(`🔍 Searching issue #${issueNumber} for a branch...`);
            console.log(`📝 Marker: ${marker}`);

            // Issue의 모든 댓글 조회
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });

            // 브랜치 추출 패턴 (마커와 무관하게 동일한 형식)
            // "### 브랜치" 또는 "### 브랜치명" 둘 다 매칭
            const branchRegex = /###\s*브랜치(?:명)?\s*\n```\s*\n([^\n]+)\s*\n```/;

            for (const comment of comments.data) {
              // 마커가 포함된 댓글 찾기
              if (comment.body.includes(marker)) {
                const match = comment.body.match(branchRegex);
                if (match) {
                  const branchName = match[1].trim();
                  core.setOutput('branch', branchName);
                  core.setOutput('found', 'true');
                  core.setOutput('issue_number', issueNumber);
                  console.log(`✅ Branch found: ${branchName}`);
                  return;
                }
              }
            }

            // 브랜치를 찾지 못한 경우 - 에러가 아님, graceful하게 처리
            core.setOutput('found', 'false');
            core.setOutput('issue_number', issueNumber);
            console.log('⚠️ No branch found in the Issue Helper comments.');

      - name: Notify missing branch
        if: steps.extract.outputs.found == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const issueNumber = context.issue.number;
            const marker = '${{ env.ISSUE_HELPER_MARKER }}';

            const body = [
              t('python_preview.no_branch.heading'),
              '',
              t('python_preview.table.item_header'),
              '|------|-----|',
              `| **Issue** | #${issueNumber} |`,
              t('python_preview.no_branch.marker_row', { marker }),
              '',
              t('python_preview.checks.heading'),
              t('python_preview.no_branch.check_comment'),
              // 계약 문자열(contracts.BRANCH_HEADING)은 카탈로그에 넣지 않고 값으로 붙인다
              t('python_preview.no_branch.check_section', { heading: '### 브랜치' }),
              t('python_preview.no_branch.check_marker'),
              '',
              '---',
              t('python_preview.footer.generated_plain')
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

  # -----------------------------------------------------------------
  # Job 2-3: 빌드 & 배포 (Issue 댓글에서 실행)
  # -----------------------------------------------------------------
  build-preview-issue:
    # 잡 이름은 브랜치 보호의 필수 상태 체크 이름이 될 수 있어 번역하지 않는다 (#769)
    name: Preview 빌드 & 배포 (Issue)
    needs: [check-command, get-branch-from-issue]
    if: |
      needs.check-command.outputs.is_valid == 'true' &&
      needs.check-command.outputs.command == 'build' &&
      needs.check-command.outputs.is_pr == 'false' &&
      needs.check-command.outputs.is_custom_branch != 'true' &&
      needs.get-branch-from-issue.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js python_preview. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Check branch exists
        id: check_branch
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.get-branch-from-issue.outputs.branch_name }}
        with:
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const branchName = process.env.BRANCH_NAME;
            const issueNumber = ${{ needs.get-branch-from-issue.outputs.issue_number }};

            console.log(`🔍 Checking branch exists: ${branchName}`);

            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: branchName
              });
              core.setOutput('exists', 'true');
              console.log(`✅ Branch exists: ${branchName}`);
            } catch (error) {
              if (error.status === 404) {
                core.setOutput('exists', 'false');
                console.log(`❌ Branch not found: ${branchName}`);

                // 브랜치 없음 알림 댓글
                const body = [
                  t('python_preview.branch_missing.heading'),
                  '',
                  t('python_preview.table.item_header'),
                  '|------|-----|',
                  `| **Issue** | #${issueNumber} |`,
                  t('python_preview.row.branch', { branch: branchName }),
                  '',
                  t('python_preview.checks.heading'),
                  t('python_preview.branch_missing.check_pushed', { n: 1 }),
                  t('python_preview.branch_missing.check_name', { n: 2 }),
                  t('python_preview.branch_missing.check_deleted', { n: 3 }),
                  '',
                  '---',
                  t('python_preview.footer.generated_plain')
                ].join('\n');

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: body
                });
              } else {
                throw error;
              }
            }

      - name: Stop if the branch is missing
        if: steps.check_branch.outputs.exists == 'false'
        run: |
          echo "⚠️ The branch does not exist, skipping the build."
          exit 0

      - name: Set issue info
        if: steps.check_branch.outputs.exists == 'true'
        id: issue
        env:
          BRANCH_NAME: ${{ needs.get-branch-from-issue.outputs.branch_name }}
        run: |
          echo "ref=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "issue_number=${{ needs.get-branch-from-issue.outputs.issue_number }}" >> $GITHUB_OUTPUT
          # 브랜치의 최신 커밋 SHA 가져오기
          echo "sha=$(git ls-remote https://github.com/${{ github.repository }}.git "refs/heads/$BRANCH_NAME" | cut -c1-7)" >> $GITHUB_OUTPUT

      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      # 진행 상황 댓글 시스템
      # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
      - name: Create progress comment
        if: steps.check_branch.outputs.exists == 'true'
        id: progress
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.get-branch-from-issue.outputs.branch_name }}
        with:
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const issueNumber = ${{ needs.get-branch-from-issue.outputs.issue_number }};
            const branchName = process.env.BRANCH_NAME;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const startTime = Date.now();

            const body = [
              t('python_preview.heading.building', { kind: 'Issue' }),
              '',
              t('python_preview.branch_line', { branch: branchName }),
              '',
              t('python_preview.table.steps_header'),
              '|------|------|----------|',
              t('python_preview.row.docker_in_progress'),
              t('python_preview.row.deploy_waiting'),
              '',
              t('python_preview.live_log', { url: runUrl }),
              '',
              '---',
              t('python_preview.footer.auto_update')
            ].join('\n');

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

            core.setOutput('comment_id', comment.id);
            core.setOutput('start_time', startTime);
            core.setOutput('docker_start', startTime);

      - name: Check out code
        if: steps.check_branch.outputs.exists == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.get-branch-from-issue.outputs.branch_name }}

      # =================================================================
      # ⚠️ [영역 2] 환경변수 파일 생성
      # =================================================================
      - name: "[Required] Create .env file"
        if: steps.check_branch.outputs.exists == 'true'
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > .env
      # =================================================================
      # ⚠️ [영역 2 끝] 환경변수 파일 생성 끝
      # =================================================================

      - name: Docker login
        if: steps.check_branch.outputs.exists == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check_branch.outputs.exists == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build & push Docker image
        if: steps.check_branch.outputs.exists == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:pr-${{ needs.get-branch-from-issue.outputs.issue_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Progress - Docker done
        if: steps.check_branch.outputs.exists == 'true'
        id: docker_progress
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.get-branch-from-issue.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id }};
            const branchName = process.env.BRANCH_NAME;
            const dockerStart = ${{ steps.progress.outputs.docker_start }};
            const now = Date.now();
            const dockerElapsed = now - dockerStart;
            const minutes = Math.floor(dockerElapsed / 60000);
            const seconds = Math.floor((dockerElapsed % 60000) / 1000);
            const dockerDuration = elapsed(minutes, seconds);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              t('python_preview.heading.building', { kind: 'Issue' }),
              '',
              t('python_preview.branch_line', { branch: branchName }),
              '',
              t('python_preview.table.steps_header'),
              '|------|------|----------|',
              t('python_preview.row.docker_done', { duration: dockerDuration }),
              t('python_preview.row.deploy_in_progress'),
              '',
              t('python_preview.live_log', { url: runUrl }),
              '',
              '---',
              t('python_preview.footer.auto_update')
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            core.setOutput('docker_duration', dockerDuration);
            core.setOutput('deploy_start', now);

      - name: Deploy to server
        if: steps.check_branch.outputs.exists == 'true'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SSH_AUTH_METHOD: ${{ env.SSH_AUTH_METHOD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          envs: SSH_AUTH_METHOD,SERVER_PASSWORD
          script: |
            set -e

            # 환경 변수 설정 (배포 서버용)
            export PATH=$PATH:/usr/local/bin
            export PW="${SERVER_PASSWORD}"

            # 🔐 SSH 인증 방식에 따른 sudo 추상화
            SSH_AUTH_METHOD="${SSH_AUTH_METHOD:-password}"
            if [ "${SSH_AUTH_METHOD}" = "key" ]; then
              SUDO() { sudo "$@"; }
            else
              SUDO() { echo "$PW" | sudo -S "$@"; }
            fi
            echo "🔐 SSH auth method: ${SSH_AUTH_METHOD}"

            # 변수 설정
            ISSUE_NUMBER=${{ needs.get-branch-from-issue.outputs.issue_number }}
            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            CONTAINER_NAME="${PROJECT_NAME}-pr-${ISSUE_NUMBER}"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}:pr-${ISSUE_NUMBER}"
            DOMAIN="${PROJECT_NAME}-pr-${ISSUE_NUMBER}.${{ env.PREVIEW_DOMAIN_SUFFIX }}"
            INTERNAL_PORT="${{ env.INTERNAL_PORT }}"
            TRAEFIK_NETWORK="${{ env.TRAEFIK_NETWORK }}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Starting Issue Preview deployment"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦 Project: ${PROJECT_NAME}"
            echo "🔢 Issue number: #${ISSUE_NUMBER}"
            echo "📛 Container: ${CONTAINER_NAME}"
            echo "🌐 Domain: ${DOMAIN}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # 이미지 Pull
            echo "📥 Pulling Docker image..."
            SUDO docker pull "${IMAGE}"

            # 기존 컨테이너 삭제
            echo "🗑️ Removing the existing container..."
            SUDO docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

            # 볼륨 마운트 옵션 구성
            VOLUME_OPTS="-v /etc/localtime:/etc/localtime:ro"
            if [ -n "${{ env.PROJECT_TARGET_DIR }}" ] && [ -n "${{ env.PROJECT_MNT_DIR }}" ]; then
              VOLUME_OPTS="$VOLUME_OPTS -v ${{ env.PROJECT_TARGET_DIR }}:${{ env.PROJECT_MNT_DIR }}"
            fi

            # 새 컨테이너 실행
            echo "🐳 Starting the new container..."
            SUDO docker run -d \
              --name "${CONTAINER_NAME}" \
              --network "${TRAEFIK_NETWORK}" \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.${CONTAINER_NAME}.rule=Host(\`${DOMAIN}\`)" \
              --label "traefik.http.routers.${CONTAINER_NAME}.entrypoints=web" \
              --label "traefik.http.services.${CONTAINER_NAME}.loadbalancer.server.port=${INTERNAL_PORT}" \
              -e TZ=Asia/Seoul \
              -e ENVIRONMENT=prod \
              $VOLUME_OPTS \
              "${IMAGE}"

            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            # Health Check (최대 120초 대기) - 하이브리드 방식
            # 1. HEALTH_CHECK_PATH가 설정되어 있으면 HTTP 체크 시도
            # 2. 폴백: 로그 패턴 매칭 (HEALTH_CHECK_LOG_PATTERN)
            # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
            echo ""
            echo "⏳ Starting health check (waiting up to 120s)..."
            HEALTH_PATH="${{ env.HEALTH_CHECK_PATH }}"
            LOG_PATTERN="${{ env.HEALTH_CHECK_LOG_PATTERN }}"
            MAX_RETRIES=24
            RETRY_COUNT=0
            HEALTH_CHECK_PASSED=false
            HEALTH_CHECK_METHOD=""

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              sleep 5
              RETRY_COUNT=$((RETRY_COUNT + 1))

              # 1. 컨테이너 상태 확인
              STATUS=$(SUDO docker inspect --format='{{.State.Status}}' "${CONTAINER_NAME}" 2>/dev/null || echo "not_found")

              if [ "$STATUS" = "exited" ]; then
                echo "❌ Container exited unexpectedly!"
                echo ""
                echo "📋 Container logs (last 100 lines):"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                SUDO docker logs --tail 100 "${CONTAINER_NAME}"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                exit 1
              fi

              if [ "$STATUS" = "running" ]; then
                # 2. HTTP Health Check 시도 (HEALTH_CHECK_PATH가 설정된 경우에만)
                if [ -n "$HEALTH_PATH" ]; then
                  HEALTH=$(SUDO docker exec "${CONTAINER_NAME}" curl -sf "http://localhost:${INTERNAL_PORT}${HEALTH_PATH}" 2>/dev/null || echo "")

                  if [ -n "$HEALTH" ]; then
                    echo "✅ Startup confirmed! (HTTP response: ${HEALTH_PATH})"
                    HEALTH_CHECK_PASSED=true
                    HEALTH_CHECK_METHOD="HTTP"
                    break
                  fi
                fi

                # 3. HTTP 응답 없으면 로그 패턴 매칭으로 폴백
                if [ -n "$LOG_PATTERN" ]; then
                  STARTED=$(SUDO docker logs --tail 50 "${CONTAINER_NAME}" 2>&1 | grep -E "$LOG_PATTERN" || echo "")

                  if [ -n "$STARTED" ]; then
                    echo "✅ Startup confirmed! (log pattern)"
                    echo "   $STARTED"
                    HEALTH_CHECK_PASSED=true
                    HEALTH_CHECK_METHOD="Log"
                    break
                  fi
                fi
              fi

              echo "⏳ Waiting... ($RETRY_COUNT/$MAX_RETRIES) - status: $STATUS"
            done

            if [ "$HEALTH_CHECK_PASSED" = "false" ]; then
              echo ""
              echo "❌ Health check timed out (120s)"
              echo ""
              echo "📋 Container logs (last 100 lines):"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              SUDO docker logs --tail 100 "${CONTAINER_NAME}"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              exit 1
            fi

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ Deployment and health check complete! (method: ${HEALTH_CHECK_METHOD})"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Deployment complete comment
        if: steps.check_branch.outputs.exists == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.get-branch-from-issue.outputs.branch_name }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id }};
            const branchName = process.env.BRANCH_NAME;
            const dockerDuration = '${{ steps.docker_progress.outputs.docker_duration }}';
            const deployStart = ${{ steps.docker_progress.outputs.deploy_start }};
            const now = Date.now();
            const deployElapsed = now - deployStart;
            const minutes = Math.floor(deployElapsed / 60000);
            const seconds = Math.floor((deployElapsed % 60000) / 1000);
            const deployDuration = elapsed(minutes, seconds);

            const projectName = '${{ env.PROJECT_NAME }}';
            const domainSuffix = '${{ env.PREVIEW_DOMAIN_SUFFIX }}';
            const previewPort = '${{ env.PREVIEW_PORT }}';
            const apiDocsPath = '${{ env.API_DOCS_PATH }}';
            const issueNumber = ${{ needs.get-branch-from-issue.outputs.issue_number }};
            const domain = `${projectName}-pr-${issueNumber}.${domainSuffix}`;
            const previewUrl = `http://${domain}:${previewPort}`;
            const sha = '${{ steps.issue.outputs.sha }}';

            // Preview 환경 테이블 구성 (API_DOCS_PATH가 있을 때만 API Docs 행 추가)
            const envRows = [
              `| **Preview URL** | ${previewUrl} |`,
            ];
            if (apiDocsPath) {
              envRows.push(`| **API Docs** | ${previewUrl}${apiDocsPath} |`);
            }
            envRows.push(t('python_preview.row.container', { container: `${projectName}-pr-${issueNumber}` }));
            envRows.push(t('python_preview.row.branch', { branch: branchName }));
            envRows.push(t('python_preview.row.commit', { sha }));

            const body = [
              t('python_preview.heading.deployed', { kind: 'Issue' }),
              '',
              t('python_preview.branch_line', { branch: branchName }),
              '',
              t('python_preview.table.steps_header'),
              '|------|------|----------|',
              t('python_preview.row.docker_done', { duration: dockerDuration }),
              t('python_preview.row.deploy_done', { duration: deployDuration }),
              '',
              t('python_preview.env_heading'),
              t('python_preview.table.item_header'),
              '|------|-----|',
              ...envRows,
              '',
              t('python_preview.commands.heading'),
              t('python_preview.commands.header'),
              '|--------|------|',
              t('python_preview.commands.redeploy', { command: '@projectops server build' }),
              t('python_preview.commands.destroy', { command: '@projectops server destroy' }),
              t('python_preview.commands.status', { command: '@projectops server status' }),
              '',
              '<details>',
              t('python_preview.commands.advanced_summary'),
              '',
              '```',
              `@projectops server build ${branchName}`,
              `@projectops server destroy ${branchName}`,
              `@projectops server status ${branchName}`,
              '```',
              '</details>',
              '',
              '---',
              t('python_preview.footer.generated', { kind: 'Issue' })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

      - name: Error comment on build/deploy failure
        if: failure() && steps.check_branch.outputs.exists == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.get-branch-from-issue.outputs.branch_name }}
        with:
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id || 0 }};
            const projectName = '${{ env.PROJECT_NAME }}';
            const issueNumber = ${{ needs.get-branch-from-issue.outputs.issue_number }};
            const branchName = process.env.BRANCH_NAME;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const dockerDuration = '${{ steps.docker_progress.outputs.docker_duration }}';

            let dockerStatus, deployStatus;
            let dockerTime = '-';

            if (!commentId) {
              dockerStatus = t('python_preview.status.init_failed');
              deployStatus = '-';
            } else if (!dockerDuration || dockerDuration === '') {
              dockerStatus = t('python_preview.status.failed');
              deployStatus = t('python_preview.status.waiting');
            } else {
              dockerStatus = t('python_preview.status.done');
              deployStatus = t('python_preview.status.failed');
              dockerTime = dockerDuration;
            }

            const body = [
              t('python_preview.heading.deploy_failed', { kind: 'Issue' }),
              '',
              t('python_preview.branch_line', { branch: branchName }),
              '',
              t('python_preview.table.steps_header'),
              '|------|------|----------|',
              t('python_preview.row.docker_status', { status: dockerStatus, duration: dockerTime }),
              t('python_preview.row.deploy_status', { status: deployStatus }),
              '',
              t('python_preview.failure.log_link', { url: runUrl }),
              '',
              t('python_preview.failure.causes_heading'),
              t('python_preview.failure.cause_build'),
              t('python_preview.failure.cause_start'),
              t('python_preview.failure.cause_timeout'),
              t('python_preview.failure.cause_env'),
              '',
              t('python_preview.failure.next_heading'),
              t('python_preview.failure.next_check_log'),
              t('python_preview.failure.next_retry', { command: '@projectops server build' }),
              '',
              '---',
              t('python_preview.footer.generated', { kind: 'Issue' })
            ].join('\n');

            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: body
              });
            }

  # -----------------------------------------------------------------
  # Job 3: Preview 삭제 (PR/Issue 닫힘 또는 destroy 명령)
  # -----------------------------------------------------------------
  destroy-preview:
    # 잡 이름은 브랜치 보호의 필수 상태 체크 이름이 될 수 있어 번역하지 않는다 (#769)
    name: Preview 삭제
    # needs 의존성 제거: PR/Issue 닫힘 이벤트에서도 독립적으로 실행되도록 함
    if: |
      (github.event_name == 'pull_request' && github.event.action == 'closed') ||
      (github.event_name == 'issues' && github.event.action == 'closed') ||
      (github.event_name == 'issue_comment' && !contains(github.event.comment.body, '<!-- SUH-ISSUE-HELPER -->') && contains(github.event.comment.body, '@projectops') && contains(github.event.comment.body, 'server destroy'))
    runs-on: ubuntu-latest
    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js python_preview. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Get PR/issue number
        id: pr_number
        run: |
          if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "type=comment" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
            echo "type=pr_closed" >> $GITHUB_OUTPUT
          else
            echo "number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "type=issue_closed" >> $GITHUB_OUTPUT
          fi

      # 닫힘 이벤트마다 무조건 SSH·댓글을 돌리면 프리뷰를 쓴 적 없는 레포에서
      # secret 없음 실패와 댓글 폭주(secondary rate limit)가 난다 (#808).
      # 배포 완료 댓글이 남아 있을 때만 지우고, secret 이 없으면 조용히 건너뛴다.
      - name: Check what to delete
        id: target
        uses: actions/github-script@v7
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
          NUMBER: ${{ steps.pr_number.outputs.number }}
          TRIGGER_TYPE: ${{ steps.pr_number.outputs.type }}
        with:
          script: |
            const number = Number(process.env.NUMBER);
            if (!process.env.SERVER_HOST) {
              core.notice('No SERVER_HOST secret, skipping Preview deletion.');
              core.setOutput('should_destroy', 'false');
              return;
            }
            // 사용자가 직접 destroy 를 요청했으면 흔적이 없어도 그대로 지운다.
            if (process.env.TRIGGER_TYPE === 'comment') {
              core.setOutput('should_destroy', 'true');
              return;
            }
            const container = `${process.env.PROJECT_NAME}-pr-${number}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            });
            // 마지막 배포 완료 댓글이 마지막 삭제 완료 댓글보다 뒤에 있어야 살아 있는 Preview 다.
            // 두 언어 문구를 모두 찾는다 (이관 전 한국어 댓글, 영문 레포 댓글). 완료·삭제 제목 키와 짝 (#769)
            const deployMarkers = ['Preview 배포 완료', 'Preview deployed'];
            const destroyMarkers = ['Preview 환경 삭제 완료', 'Preview environment deleted'];
            let lastDeploy = -1, lastDestroy = -1;
            comments.forEach((c, i) => {
              const body = c.body || '';
              if (!body.includes(`\`${container}\``)) return;
              if (deployMarkers.some((marker) => body.includes(marker))) lastDeploy = i;
              if (destroyMarkers.some((marker) => body.includes(marker))) lastDestroy = i;
            });
            const alive = lastDeploy > lastDestroy;
            if (!alive) core.notice(`No Preview deployed for #${number}, skipping deletion.`);
            core.setOutput('should_destroy', alive ? 'true' : 'false');

      - name: Delete container & image
        if: steps.target.outputs.should_destroy == 'true'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SSH_AUTH_METHOD: ${{ env.SSH_AUTH_METHOD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          envs: SSH_AUTH_METHOD,SERVER_PASSWORD
          script: |
            # 환경 변수 설정 (배포 서버용)
            export PATH=$PATH:/usr/local/bin
            export PW="${SERVER_PASSWORD}"

            # 🔐 SSH 인증 방식에 따른 sudo 추상화
            SSH_AUTH_METHOD="${SSH_AUTH_METHOD:-password}"
            if [ "${SSH_AUTH_METHOD}" = "key" ]; then
              SUDO() { sudo "$@"; }
            else
              SUDO() { echo "$PW" | sudo -S "$@"; }
            fi
            echo "🔐 SSH auth method: ${SSH_AUTH_METHOD}"

            PR_NUMBER=${{ steps.pr_number.outputs.number }}
            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            CONTAINER_NAME="${PROJECT_NAME}-pr-${PR_NUMBER}"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}:pr-${PR_NUMBER}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🗑️ Deleting PR Preview"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦 Project: ${PROJECT_NAME}"
            echo "🔢 PR number: #${PR_NUMBER}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # 컨테이너 삭제
            echo "🐳 Deleting container..."
            SUDO docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

            # 이미지 삭제
            echo "🖼️ Deleting image..."
            SUDO docker rmi "${IMAGE}" 2>/dev/null || true

            echo "✅ Deleted!"

      - name: Deletion complete comment
        # 실제로 지웠을 때만 남긴다 — 지운 게 없는데 '삭제 완료'를 다는 것이 댓글 폭주의 원인이었다 (#808)
        if: steps.target.outputs.should_destroy == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const number = ${{ steps.pr_number.outputs.number }};
            const projectName = '${{ env.PROJECT_NAME }}';

            const body = [
              t('python_preview.destroyed.heading'),
              '',
              t('python_preview.table.item_header'),
              '|------|-----|',
              t('python_preview.row.container', { container: `${projectName}-pr-${number}` }),
              t('python_preview.row.state_deleted'),
              '',
              t('python_preview.destroyed.redeploy_hint', { command: '@projectops server build' }),
              '',
              '---',
              t('python_preview.footer.generated', { kind: 'PR/Issue' })
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: body
            });

  # -----------------------------------------------------------------
  # Job 4: 상태 확인 (PR/Issue 모두 지원)
  # -----------------------------------------------------------------
  check-status:
    # 잡 이름은 브랜치 보호의 필수 상태 체크 이름이 될 수 있어 번역하지 않는다 (#769)
    name: Preview 상태 확인
    needs: check-command
    if: needs.check-command.outputs.is_valid == 'true' && needs.check-command.outputs.command == 'status'
    runs-on: ubuntu-latest
    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js python_preview. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Check container status
        id: status
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            # 환경 변수 설정 (배포 서버용)
            export PATH=$PATH:/usr/local/bin

            NUMBER=${{ github.event.issue.number }}
            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            CONTAINER_NAME="${PROJECT_NAME}-pr-${NUMBER}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔍 Checking Preview status"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            if docker ps --filter "name=${CONTAINER_NAME}" --format "{{.Names}}" | grep -q "${CONTAINER_NAME}"; then
              echo "STATUS=running"
              echo "✅ Container is running"
              docker ps --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Status}}\t{{.RunningFor}}"
            else
              echo "STATUS=not_found"
              echo "❌ Container not found"
            fi

      - name: Status comment (running)
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        id: check_running
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            # 환경 변수 설정 (배포 서버용)
            export PATH=$PATH:/usr/local/bin

            NUMBER=${{ github.event.issue.number }}
            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            CONTAINER_NAME="${PROJECT_NAME}-pr-${NUMBER}"
            docker ps --filter "name=${CONTAINER_NAME}" --format "{{.Names}}" | grep -q "${CONTAINER_NAME}"

      - name: Post status comment
        uses: actions/github-script@v7
        with:
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const number = context.issue.number;
            const projectName = '${{ env.PROJECT_NAME }}';
            const domainSuffix = '${{ env.PREVIEW_DOMAIN_SUFFIX }}';
            const previewPort = '${{ env.PREVIEW_PORT }}';
            const domain = `${projectName}-pr-${number}.${domainSuffix}`;
            const previewUrl = `http://${domain}:${previewPort}`;
            const isRunning = '${{ steps.check_running.outcome }}' === 'success';
            const isPr = '${{ needs.check-command.outputs.is_pr }}' === 'true';
            const contextType = isPr ? 'PR' : 'Issue';

            let body;
            if (isRunning) {
              body = [
                t('python_preview.status.running_heading'),
                '',
                t('python_preview.table.item_header'),
                '|------|-----|',
                `| **Preview URL** | ${previewUrl} |`,
                t('python_preview.row.container', { container: `${projectName}-pr-${number}` }),
                t('python_preview.row.state_running'),
                '',
                t('python_preview.commands.heading'),
                t('python_preview.commands.header'),
                '|--------|------|',
                t('python_preview.commands.redeploy', { command: '@projectops server build' }),
                t('python_preview.commands.destroy', { command: '@projectops server destroy' }),
                '',
                '---',
                t('python_preview.footer.generated', { kind: contextType })
              ].join('\n');
            } else {
              body = [
                t('python_preview.status.missing_heading'),
                '',
                t('python_preview.table.item_header'),
                '|------|-----|',
                t('python_preview.row.container', { container: `${projectName}-pr-${number}` }),
                t('python_preview.row.state_not_found'),
                '',
                t('python_preview.status.deploy_hint', { command: '@projectops server build' }),
                '',
                '---',
                t('python_preview.footer.generated', { kind: contextType })
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: body
            });

  # -----------------------------------------------------------------
  # Job 5: 커스텀 브랜치 빌드 & 배포
  # -----------------------------------------------------------------
  build-preview-custom-branch:
    # 잡 이름은 브랜치 보호의 필수 상태 체크 이름이 될 수 있어 번역하지 않는다 (#769)
    name: Preview 빌드 & 배포 (Custom Branch)
    needs: check-command
    if: |
      needs.check-command.outputs.is_valid == 'true' &&
      needs.check-command.outputs.command == 'build' &&
      needs.check-command.outputs.is_custom_branch == 'true'
    runs-on: ubuntu-latest
    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js python_preview. comment. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Check branch and extract info
        id: branch_info
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.check-command.outputs.custom_branch }}
        with:
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const branchName = process.env.BRANCH_NAME;
            const issueNumber = context.issue.number;

            console.log(`🔍 Checking branch: ${branchName}`);

            // 브랜치 존재 여부 확인
            try {
              await github.rest.repos.getBranch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                branch: branchName
              });
              console.log(`✅ Branch exists: ${branchName}`);
            } catch (error) {
              if (error.status === 404) {
                console.log(`❌ Branch not found: ${branchName}`);

                // 에러 댓글 작성
                const body = [
                  t('python_preview.branch_missing.heading'),
                  '',
                  t('python_preview.table.item_header'),
                  '|------|-----|',
                  t('python_preview.row.branch', { branch: branchName }),
                  '',
                  t('python_preview.checks.heading'),
                  t('python_preview.branch_missing.check_name', { n: 1 }),
                  t('python_preview.branch_missing.check_pushed', { n: 2 }),
                  t('python_preview.branch_missing.check_deleted', { n: 3 }),
                  '',
                  '---',
                  t('python_preview.footer.generated_plain')
                ].join('\n');

                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  body: body
                });

                core.setFailed('Branch not found');
                return;
              }
              throw error;
            }

            // 브랜치명에서 Issue 번호 추출 (#번호 패턴)
            const issueMatch = branchName.match(/#(\d+)/);

            if (issueMatch) {
              // 번호 추출 성공
              core.setOutput('container_number', issueMatch[1]);
              core.setOutput('use_hash', 'false');
              console.log(`✅ Issue number extracted: #${issueMatch[1]}`);
            } else {
              // 해시 생성
              let hash = 0;
              for (let i = 0; i < branchName.length; i++) {
                const char = branchName.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
              }
              const hashStr = Math.abs(hash).toString(16).slice(-6).padStart(6, '0');
              core.setOutput('container_suffix', `custom-${hashStr}`);
              core.setOutput('use_hash', 'true');
              console.log(`✅ Hash generated: custom-${hashStr}`);
            }

            core.setOutput('branch_name', branchName);
            core.setOutput('branch_exists', 'true');

      - name: Get the branch's latest commit SHA
        if: steps.branch_info.outputs.branch_exists == 'true'
        id: get_sha
        env:
          CUSTOM_BRANCH: ${{ needs.check-command.outputs.custom_branch }}
        run: |
          SHA=$(git ls-remote https://github.com/${{ github.repository }}.git "refs/heads/$CUSTOM_BRANCH" | cut -c1-7)
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      # 진행 상황 댓글 생성
      - name: Create progress comment
        if: steps.branch_info.outputs.branch_exists == 'true'
        id: progress
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.check-command.outputs.custom_branch }}
        with:
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const issueNumber = context.issue.number;
            const branchName = process.env.BRANCH_NAME;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const startTime = Date.now();

            const body = [
              t('python_preview.heading.building', { kind: 'Custom Branch' }),
              '',
              t('python_preview.branch_line', { branch: branchName }),
              '',
              t('python_preview.table.steps_header'),
              '|------|------|----------|',
              t('python_preview.row.docker_in_progress'),
              t('python_preview.row.deploy_waiting'),
              '',
              t('python_preview.live_log', { url: runUrl }),
              '',
              '---',
              t('python_preview.footer.auto_update')
            ].join('\n');

            const { data: comment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: body
            });

            core.setOutput('comment_id', comment.id);
            core.setOutput('start_time', startTime);
            core.setOutput('docker_start', startTime);

      - name: Check out code
        if: steps.branch_info.outputs.branch_exists == 'true'
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.check-command.outputs.custom_branch }}

      # 환경변수 파일 생성
      - name: "[Required] Create .env file"
        if: steps.branch_info.outputs.branch_exists == 'true'
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > .env

      - name: Docker login
        if: steps.branch_info.outputs.branch_exists == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.branch_info.outputs.branch_exists == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Decide container name
        if: steps.branch_info.outputs.branch_exists == 'true'
        id: container
        run: |
          if [[ "${{ steps.branch_info.outputs.use_hash }}" == "true" ]]; then
            SUFFIX="${{ steps.branch_info.outputs.container_suffix }}"
          else
            SUFFIX="pr-${{ steps.branch_info.outputs.container_number }}"
          fi
          echo "suffix=$SUFFIX" >> $GITHUB_OUTPUT
          echo "name=${{ env.PROJECT_NAME }}-${SUFFIX}" >> $GITHUB_OUTPUT

      - name: Build & push Docker image
        if: steps.branch_info.outputs.branch_exists == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PROJECT_NAME }}:${{ steps.container.outputs.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Progress - Docker done
        if: steps.branch_info.outputs.branch_exists == 'true'
        id: docker_progress
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.check-command.outputs.custom_branch }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id }};
            const branchName = process.env.BRANCH_NAME;
            const dockerStart = ${{ steps.progress.outputs.docker_start }};
            const now = Date.now();
            const dockerElapsed = now - dockerStart;
            const minutes = Math.floor(dockerElapsed / 60000);
            const seconds = Math.floor((dockerElapsed % 60000) / 1000);
            const dockerDuration = elapsed(minutes, seconds);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              t('python_preview.heading.building', { kind: 'Custom Branch' }),
              '',
              t('python_preview.branch_line', { branch: branchName }),
              '',
              t('python_preview.table.steps_header'),
              '|------|------|----------|',
              t('python_preview.row.docker_done', { duration: dockerDuration }),
              t('python_preview.row.deploy_in_progress'),
              '',
              t('python_preview.live_log', { url: runUrl }),
              '',
              '---',
              t('python_preview.footer.auto_update')
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

            core.setOutput('docker_duration', dockerDuration);
            core.setOutput('deploy_start', now);

      - name: Deploy to server
        if: steps.branch_info.outputs.branch_exists == 'true'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SSH_AUTH_METHOD: ${{ env.SSH_AUTH_METHOD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          envs: SSH_AUTH_METHOD,SERVER_PASSWORD
          script: |
            set -e

            # 환경 변수 설정 (배포 서버용)
            export PATH=$PATH:/usr/local/bin
            export PW="${SERVER_PASSWORD}"

            # 🔐 SSH 인증 방식에 따른 sudo 추상화
            SSH_AUTH_METHOD="${SSH_AUTH_METHOD:-password}"
            if [ "${SSH_AUTH_METHOD}" = "key" ]; then
              SUDO() { sudo "$@"; }
            else
              SUDO() { echo "$PW" | sudo -S "$@"; }
            fi
            echo "🔐 SSH auth method: ${SSH_AUTH_METHOD}"

            # 변수 설정
            PROJECT_NAME="${{ env.PROJECT_NAME }}"
            CONTAINER_NAME="${{ steps.container.outputs.name }}"
            CONTAINER_SUFFIX="${{ steps.container.outputs.suffix }}"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}:${CONTAINER_SUFFIX}"
            DOMAIN="${CONTAINER_NAME}.${{ env.PREVIEW_DOMAIN_SUFFIX }}"
            INTERNAL_PORT="${{ env.INTERNAL_PORT }}"
            TRAEFIK_NETWORK="${{ env.TRAEFIK_NETWORK }}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🚀 Starting Custom Branch Preview deployment"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦 Project: ${PROJECT_NAME}"
            echo "📛 Container: ${CONTAINER_NAME}"
            echo "🌐 Domain: ${DOMAIN}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # 이미지 Pull
            echo "📥 Pulling Docker image..."
            SUDO docker pull "${IMAGE}"

            # 기존 컨테이너 삭제
            echo "🗑️ Removing the existing container..."
            SUDO docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

            # 볼륨 마운트 옵션 구성
            VOLUME_OPTS="-v /etc/localtime:/etc/localtime:ro"
            if [ -n "${{ env.PROJECT_TARGET_DIR }}" ] && [ -n "${{ env.PROJECT_MNT_DIR }}" ]; then
              VOLUME_OPTS="$VOLUME_OPTS -v ${{ env.PROJECT_TARGET_DIR }}:${{ env.PROJECT_MNT_DIR }}"
            fi

            # 새 컨테이너 실행
            echo "🐳 Starting the new container..."
            SUDO docker run -d \
              --name "${CONTAINER_NAME}" \
              --network "${TRAEFIK_NETWORK}" \
              --label "traefik.enable=true" \
              --label "traefik.http.routers.${CONTAINER_NAME}.rule=Host(\`${DOMAIN}\`)" \
              --label "traefik.http.routers.${CONTAINER_NAME}.entrypoints=web" \
              --label "traefik.http.services.${CONTAINER_NAME}.loadbalancer.server.port=${INTERNAL_PORT}" \
              -e TZ=Asia/Seoul \
              -e ENVIRONMENT=prod \
              $VOLUME_OPTS \
              "${IMAGE}"

            # Health Check
            echo ""
            echo "⏳ Starting health check (waiting up to 120s)..."
            HEALTH_PATH="${{ env.HEALTH_CHECK_PATH }}"
            LOG_PATTERN="${{ env.HEALTH_CHECK_LOG_PATTERN }}"
            MAX_RETRIES=24
            RETRY_COUNT=0
            HEALTH_CHECK_PASSED=false
            HEALTH_CHECK_METHOD=""

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              sleep 5
              RETRY_COUNT=$((RETRY_COUNT + 1))

              STATUS=$(SUDO docker inspect --format='{{.State.Status}}' "${CONTAINER_NAME}" 2>/dev/null || echo "not_found")

              if [ "$STATUS" = "exited" ]; then
                echo "❌ Container exited unexpectedly!"
                echo ""
                echo "📋 Container logs (last 100 lines):"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                SUDO docker logs --tail 100 "${CONTAINER_NAME}"
                echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                exit 1
              fi

              if [ "$STATUS" = "running" ]; then
                if [ -n "$HEALTH_PATH" ]; then
                  HEALTH=$(SUDO docker exec "${CONTAINER_NAME}" curl -sf "http://localhost:${INTERNAL_PORT}${HEALTH_PATH}" 2>/dev/null || echo "")

                  if [ -n "$HEALTH" ]; then
                    echo "✅ Startup confirmed! (HTTP response: ${HEALTH_PATH})"
                    HEALTH_CHECK_PASSED=true
                    HEALTH_CHECK_METHOD="HTTP"
                    break
                  fi
                fi

                if [ -n "$LOG_PATTERN" ]; then
                  STARTED=$(SUDO docker logs --tail 50 "${CONTAINER_NAME}" 2>&1 | grep -E "$LOG_PATTERN" || echo "")

                  if [ -n "$STARTED" ]; then
                    echo "✅ Startup confirmed! (log pattern)"
                    echo "   $STARTED"
                    HEALTH_CHECK_PASSED=true
                    HEALTH_CHECK_METHOD="Log"
                    break
                  fi
                fi
              fi

              echo "⏳ Waiting... ($RETRY_COUNT/$MAX_RETRIES) - status: $STATUS"
            done

            if [ "$HEALTH_CHECK_PASSED" = "false" ]; then
              echo ""
              echo "❌ Health check timed out (120s)"
              echo ""
              echo "📋 Container logs (last 100 lines):"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              SUDO docker logs --tail 100 "${CONTAINER_NAME}"
              echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
              exit 1
            fi

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ Deployment and health check complete! (method: ${HEALTH_CHECK_METHOD})"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Deployment complete comment
        if: steps.branch_info.outputs.branch_exists == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.check-command.outputs.custom_branch }}
        with:
          script: |
            const { t, elapsed } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id }};
            const branchName = process.env.BRANCH_NAME;
            const dockerDuration = '${{ steps.docker_progress.outputs.docker_duration }}';
            const deployStart = ${{ steps.docker_progress.outputs.deploy_start }};
            const now = Date.now();
            const deployElapsed = now - deployStart;
            const minutes = Math.floor(deployElapsed / 60000);
            const seconds = Math.floor((deployElapsed % 60000) / 1000);
            const deployDuration = elapsed(minutes, seconds);

            const projectName = '${{ env.PROJECT_NAME }}';
            const domainSuffix = '${{ env.PREVIEW_DOMAIN_SUFFIX }}';
            const previewPort = '${{ env.PREVIEW_PORT }}';
            const apiDocsPath = '${{ env.API_DOCS_PATH }}';
            const containerName = '${{ steps.container.outputs.name }}';
            const domain = `${containerName}.${domainSuffix}`;
            const previewUrl = `http://${domain}:${previewPort}`;
            const sha = '${{ steps.get_sha.outputs.sha }}';

            // Preview 환경 테이블 구성
            const envRows = [
              `| **Preview URL** | ${previewUrl} |`,
            ];
            if (apiDocsPath) {
              envRows.push(`| **API Docs** | ${previewUrl}${apiDocsPath} |`);
            }
            envRows.push(t('python_preview.row.container', { container: containerName }));
            envRows.push(t('python_preview.row.branch', { branch: branchName }));
            envRows.push(t('python_preview.row.commit', { sha }));

            const body = [
              t('python_preview.heading.deployed', { kind: 'Custom Branch' }),
              '',
              t('python_preview.branch_line', { branch: branchName }),
              '',
              t('python_preview.table.steps_header'),
              '|------|------|----------|',
              t('python_preview.row.docker_done', { duration: dockerDuration }),
              t('python_preview.row.deploy_done', { duration: deployDuration }),
              '',
              t('python_preview.env_heading'),
              t('python_preview.table.item_header'),
              '|------|-----|',
              ...envRows,
              '',
              t('python_preview.commands.heading'),
              t('python_preview.commands.header'),
              '|--------|------|',
              t('python_preview.commands.redeploy', { command: '@projectops server build' }),
              t('python_preview.commands.destroy', { command: '@projectops server destroy' }),
              t('python_preview.commands.status', { command: '@projectops server status' }),
              '',
              '<details>',
              t('python_preview.commands.advanced_summary'),
              '',
              '```',
              `@projectops server build ${branchName}`,
              `@projectops server destroy ${branchName}`,
              `@projectops server status ${branchName}`,
              '```',
              '</details>',
              '',
              '---',
              t('python_preview.footer.generated', { kind: 'Custom Branch' })
            ].join('\n');

            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: commentId,
              body: body
            });

      - name: Error comment on build/deploy failure
        if: failure() && steps.branch_info.outputs.branch_exists == 'true'
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.check-command.outputs.custom_branch }}
        with:
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const commentId = ${{ steps.progress.outputs.comment_id || 0 }};
            const branchName = process.env.BRANCH_NAME;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const dockerDuration = '${{ steps.docker_progress.outputs.docker_duration }}';

            let dockerStatus, deployStatus;
            let dockerTime = '-';

            if (!commentId) {
              dockerStatus = t('python_preview.status.init_failed');
              deployStatus = '-';
            } else if (!dockerDuration || dockerDuration === '') {
              dockerStatus = t('python_preview.status.failed');
              deployStatus = t('python_preview.status.waiting');
            } else {
              dockerStatus = t('python_preview.status.done');
              deployStatus = t('python_preview.status.failed');
              dockerTime = dockerDuration;
            }

            const body = [
              t('python_preview.heading.deploy_failed', { kind: 'Custom Branch' }),
              '',
              t('python_preview.branch_line', { branch: branchName }),
              '',
              t('python_preview.table.steps_header'),
              '|------|------|----------|',
              t('python_preview.row.docker_status', { status: dockerStatus, duration: dockerTime }),
              t('python_preview.row.deploy_status', { status: deployStatus }),
              '',
              t('python_preview.failure.log_link', { url: runUrl }),
              '',
              t('python_preview.failure.causes_heading'),
              t('python_preview.failure.cause_build'),
              t('python_preview.failure.cause_start'),
              t('python_preview.failure.cause_timeout'),
              t('python_preview.failure.cause_env'),
              '',
              t('python_preview.failure.next_heading'),
              t('python_preview.failure.next_check_log'),
              t('python_preview.failure.next_retry', { command: `@projectops server build ${branchName}` }),
              '',
              '---',
              t('python_preview.footer.generated', { kind: 'Custom Branch' })
            ].join('\n');

            if (commentId) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # -----------------------------------------------------------------
  # Job 6: 커스텀 브랜치 Preview 삭제
  # -----------------------------------------------------------------
  destroy-preview-custom-branch:
    # 잡 이름은 브랜치 보호의 필수 상태 체크 이름이 될 수 있어 번역하지 않는다 (#769)
    name: Preview 삭제 (Custom Branch)
    needs: check-command
    if: |
      needs.check-command.outputs.is_valid == 'true' &&
      needs.check-command.outputs.command == 'destroy' &&
      needs.check-command.outputs.is_custom_branch == 'true'
    runs-on: ubuntu-latest
    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js python_preview. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Extract container info from branch name
        id: container_info
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.check-command.outputs.custom_branch }}
        with:
          script: |
            const branchName = process.env.BRANCH_NAME;
            const projectName = '${{ env.PROJECT_NAME }}';

            // 브랜치명에서 Issue 번호 추출 (#번호 패턴)
            const issueMatch = branchName.match(/#(\d+)/);

            let containerName;
            if (issueMatch) {
              containerName = `${projectName}-pr-${issueMatch[1]}`;
              console.log(`✅ Issue number extracted: #${issueMatch[1]}`);
            } else {
              // 해시 생성
              let hash = 0;
              for (let i = 0; i < branchName.length; i++) {
                const char = branchName.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
              }
              const hashStr = Math.abs(hash).toString(16).slice(-6).padStart(6, '0');
              containerName = `${projectName}-custom-${hashStr}`;
              console.log(`✅ Hash generated: custom-${hashStr}`);
            }

            core.setOutput('container_name', containerName);
            core.setOutput('branch_name', branchName);

      - name: Delete container & image
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          SSH_AUTH_METHOD: ${{ env.SSH_AUTH_METHOD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          envs: SSH_AUTH_METHOD,SERVER_PASSWORD
          script: |
            # 환경 변수 설정 (배포 서버용)
            export PATH=$PATH:/usr/local/bin
            export PW="${SERVER_PASSWORD}"

            # 🔐 SSH 인증 방식에 따른 sudo 추상화
            SSH_AUTH_METHOD="${SSH_AUTH_METHOD:-password}"
            if [ "${SSH_AUTH_METHOD}" = "key" ]; then
              SUDO() { sudo "$@"; }
            else
              SUDO() { echo "$PW" | sudo -S "$@"; }
            fi
            echo "🔐 SSH auth method: ${SSH_AUTH_METHOD}"

            CONTAINER_NAME="${{ steps.container_info.outputs.container_name }}"
            PROJECT_NAME="${{ env.PROJECT_NAME }}"

            # 컨테이너명에서 suffix 추출
            SUFFIX="${CONTAINER_NAME#${PROJECT_NAME}-}"
            IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${PROJECT_NAME}:${SUFFIX}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🗑️ Deleting Custom Branch Preview"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📦 Project: ${PROJECT_NAME}"
            echo "📛 Container: ${CONTAINER_NAME}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # 컨테이너 삭제
            echo "🐳 Deleting container..."
            SUDO docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true

            # 이미지 삭제
            echo "🖼️ Deleting image..."
            SUDO docker rmi "${IMAGE}" 2>/dev/null || true

            echo "✅ Deleted!"

      - name: Deletion complete comment
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.check-command.outputs.custom_branch }}
        with:
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const branchName = process.env.BRANCH_NAME;
            const containerName = '${{ steps.container_info.outputs.container_name }}';

            const body = [
              t('python_preview.destroyed.heading_custom'),
              '',
              t('python_preview.table.item_header'),
              '|------|-----|',
              t('python_preview.row.branch', { branch: branchName }),
              t('python_preview.row.container', { container: containerName }),
              t('python_preview.row.state_deleted'),
              '',
              t('python_preview.destroyed.redeploy_hint', { command: `@projectops server build ${branchName}` }),
              '',
              '---',
              t('python_preview.footer.generated', { kind: 'Custom Branch' })
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

  # -----------------------------------------------------------------
  # Job 7: 커스텀 브랜치 Preview 상태 확인
  # -----------------------------------------------------------------
  check-status-custom-branch:
    # 잡 이름은 브랜치 보호의 필수 상태 체크 이름이 될 수 있어 번역하지 않는다 (#769)
    name: Preview 상태 확인 (Custom Branch)
    needs: check-command
    if: |
      needs.check-command.outputs.is_valid == 'true' &&
      needs.check-command.outputs.command == 'status' &&
      needs.check-command.outputs.is_custom_branch == 'true'
    runs-on: ubuntu-latest
    steps:
      # 댓글 문구는 레포 언어(version.yml options.language)를 따른다 (#769).
      # 카탈로그만 따로 받아 $RUNNER_TEMP 에 모듈로 두고 받은 폴더는 지운다 (뒤의 checkout 과 겹치지 않게)
      # 기본 브랜치에서 받는다 — PR 닫힘 이벤트의 merge ref 는 이미 없을 수 있다
      - name: Check out the message catalog
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/i18n
            version.yml
          sparse-checkout-cone-mode: false
          path: .projectops-messages

      - name: Load comment messages
        working-directory: ${{ github.workspace }}
        run: |
          python3 .projectops-messages/.github/scripts/i18n/messages.py js python_preview. \
            --version-yml .projectops-messages/version.yml > "$RUNNER_TEMP/projectops-messages.cjs" \
            || { echo "::warning::Message catalog not found, comments show message keys"
                 echo 'module.exports = { t: (k) => k, elapsed: (m, s) => (m > 0 ? `${m}m ${s}s` : `${s}s`), lang: "en" };' > "$RUNNER_TEMP/projectops-messages.cjs"; }
          rm -rf .projectops-messages

      - name: Extract container info from branch name
        id: container_info
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.check-command.outputs.custom_branch }}
        with:
          script: |
            const branchName = process.env.BRANCH_NAME;
            const projectName = '${{ env.PROJECT_NAME }}';

            // 브랜치명에서 Issue 번호 추출 (#번호 패턴)
            const issueMatch = branchName.match(/#(\d+)/);

            let containerName;
            if (issueMatch) {
              containerName = `${projectName}-pr-${issueMatch[1]}`;
            } else {
              // 해시 생성
              let hash = 0;
              for (let i = 0; i < branchName.length; i++) {
                const char = branchName.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
              }
              const hashStr = Math.abs(hash).toString(16).slice(-6).padStart(6, '0');
              containerName = `${projectName}-custom-${hashStr}`;
            }

            core.setOutput('container_name', containerName);
            core.setOutput('branch_name', branchName);

      - name: Check container status
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        id: check_running
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            export PATH=$PATH:/usr/local/bin

            CONTAINER_NAME="${{ steps.container_info.outputs.container_name }}"

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔍 Checking Custom Branch Preview status"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

            if docker ps --filter "name=${CONTAINER_NAME}" --format "{{.Names}}" | grep -q "${CONTAINER_NAME}"; then
              echo "STATUS=running"
              echo "✅ Container is running"
              docker ps --filter "name=${CONTAINER_NAME}" --format "table {{.Names}}\t{{.Status}}\t{{.RunningFor}}"
            else
              echo "STATUS=not_found"
              echo "❌ Container not found"
              exit 1
            fi

      - name: Post status comment
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ needs.check-command.outputs.custom_branch }}
        with:
          script: |
            const { t } = require(`${process.env.RUNNER_TEMP}/projectops-messages.cjs`);
            const branchName = process.env.BRANCH_NAME;
            const containerName = '${{ steps.container_info.outputs.container_name }}';
            const projectName = '${{ env.PROJECT_NAME }}';
            const domainSuffix = '${{ env.PREVIEW_DOMAIN_SUFFIX }}';
            const previewPort = '${{ env.PREVIEW_PORT }}';
            const domain = `${containerName}.${domainSuffix}`;
            const previewUrl = `http://${domain}:${previewPort}`;
            const isRunning = '${{ steps.check_running.outcome }}' === 'success';

            let body;
            if (isRunning) {
              body = [
                t('python_preview.status.running_heading_custom'),
                '',
                t('python_preview.table.item_header'),
                '|------|-----|',
                t('python_preview.row.branch', { branch: branchName }),
                `| **Preview URL** | ${previewUrl} |`,
                t('python_preview.row.container', { container: containerName }),
                t('python_preview.row.state_running'),
                '',
                t('python_preview.commands.heading'),
                t('python_preview.commands.header'),
                '|--------|------|',
                t('python_preview.commands.redeploy', { command: `@projectops server build ${branchName}` }),
                t('python_preview.commands.destroy', { command: `@projectops server destroy ${branchName}` }),
                '',
                '---',
                t('python_preview.footer.generated', { kind: 'Custom Branch' })
              ].join('\n');
            } else {
              body = [
                t('python_preview.status.missing_heading_custom'),
                '',
                t('python_preview.table.item_header'),
                '|------|-----|',
                t('python_preview.row.branch', { branch: branchName }),
                t('python_preview.row.container', { container: containerName }),
                t('python_preview.row.state_not_found'),
                '',
                t('python_preview.status.deploy_hint', { command: `@projectops server build ${branchName}` }),
                '',
                '---',
                t('python_preview.footer.generated', { kind: 'Custom Branch' })
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
