# ===================================================================
# Python FastAPI 빌드 검증 워크플로우 (CI Only)
# ===================================================================
#
# 설명:
# - main 브랜치에 push 시 Docker 빌드가 정상적으로 되는지만 검증
# - 배포는 수행하지 않음 (main 브랜치에서만 배포)
#
# ===================================================================

name: PROJECT-PYTHON-CI

# ===================================================================
# 트리거 설정
# ===================================================================
on:
  push:
    branches:
      - develop  # develop 브랜치 push 시 빌드 검증
  pull_request:
    branches:
      - develop  # develop 브랜치로의 PR 시 빌드 검증
  workflow_dispatch:  # 수동 실행 허용

permissions:
  # GITHUB_TOKEN 으로는 읽기만 한다. 명시해 두면 레포 기본값이 나중에 write 로 바뀌어도
  # 이 워크플로우가 필요 이상의 권한을 갖지 않는다 (#595).
  contents: read

# ===================================================================
# 환경 변수 설정
# ===================================================================
env:
  # 프로젝트 고유 식별자 (컨테이너명, 이미지명, 도메인에 사용)
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo

  # 🐍 Python 설정
  PYTHON_VERSION: "3.13"

jobs:
  # ===================================================================
  # 빌드 검증 작업
  # ===================================================================
  build-check:
    name: Python FastAPI 빌드 검증
    runs-on: ubuntu-latest

    steps:
      # 1. 소스코드 체크아웃
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      # 사전 점검 (#666)
      # 신규 설치 직후에는 Secret, Dockerfile, gradlew 가 없는 것이 정상이다. 그대로 두면 하위 step 에서
      # 원인을 짚기 어려운 한 줄로 실패하므로, 무엇이 없고 무엇을 해야 하는지 첫 step 에서 알린다.
      # 전제가 모두 갖춰진 레포는 이 step 을 그대로 통과하며 이후 동작은 달라지지 않는다.
      - name: 배포 전제 사전 점검
        run: |
          fail=0
          # Dockerfile 점검: 없으면 docker build 단계에서 "failed to read dockerfile" 로만 알려준다
          if [ ! -f "./Dockerfile" ]; then
            echo "::error title=배포 사전 점검::Dockerfile(./Dockerfile)이 없습니다. 프로젝트 루트에 Dockerfile 을 추가하고 커밋하세요."
            fail=1
          fi
          [ "$fail" = "0" ] || exit 1
          echo "✅ 사전 점검 통과"

      # 2. .env 파일 생성 (빌드 검증용)
      - name: .env 파일 생성
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > .env
          echo "✅ .env 파일이 생성되었습니다"

      # 3. Docker 빌드 환경 설정
      - name: Docker 빌드환경 설정
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 4. Docker 이미지 빌드 (push 없이 검증만)
      - name: Docker 이미지 빌드 검증
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          push: false  # 푸시하지 않음 (빌드 검증만)
          tags: ${{ env.PROJECT_NAME }}:build-check
          # GitHub Actions 캐시 사용
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. 빌드 성공 메시지
      - name: 빌드 검증 완료
        run: |
          echo "✅ Docker 빌드 검증이 성공적으로 완료되었습니다!"
          echo ""
          echo "📋 빌드 정보:"
          echo "  🎯 프로젝트: ${{ env.PROJECT_NAME }}"
          echo "  🌿 브랜치: $GITHUB_REF_NAME"
          echo "  📝 커밋: ${{ github.sha }}"
          echo "  ⏰ 검증 시간: $(date '+%Y-%m-%d %H:%M:%S')"
