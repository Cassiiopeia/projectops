# ===================================================================
# Python FastAPI build verification workflow (CI only)
# ===================================================================
#
# Description:
# - on a push, only verifies that the Docker build works
# - does not deploy (deploys happen only on main)
#
# ===================================================================

name: PROJECT-PYTHON-CI

# ===================================================================
# Trigger settings
# ===================================================================
on:
  push:
    branches:
      - develop  # verify the build on a push to develop
  pull_request:
    branches:
      - develop  # verify the build on PRs to develop
  workflow_dispatch:  # allow manual runs

permissions:
  # GITHUB_TOKEN only reads. Declaring it keeps this workflow from gaining more permissions than needed
  # even if the repo default later changes to write (#595).
  contents: read

# ===================================================================
# Environment variables
# ===================================================================
env:
  # Project identifier (used for container name, image name, domain)
  PROJECT_NAME: "__PROJECT_NAME__"  # @wizard ask:@repo

  # 🐍 Python settings
  PYTHON_VERSION: "3.13"

jobs:
  # ===================================================================
  # Build verification job
  # ===================================================================
  build-check:
    # Job names may be required status check names in branch protection, so they are not translated (#769)
    name: Python FastAPI 빌드 검증
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source
      - name: Check out code
        uses: actions/checkout@v5

      # Preflight (#666)
      # Right after a fresh install, a missing Secret, Dockerfile or gradlew is normal. Left alone, a later step
      # fails with a single line whose cause is hard to see, so the first step says what is missing and what to do.
      # Repos with every prerequisite pass this step unchanged and later behavior does not change.
      - name: Preflight check
        run: |
          fail=0
          # Dockerfile check: without it, docker build only says "failed to read dockerfile"
          if [ ! -f "./Dockerfile" ]; then
            echo "::error title=Preflight check::Dockerfile (./Dockerfile) is missing. Add a Dockerfile to the project root and commit it."
            fail=1
          fi
          [ "$fail" = "0" ] || exit 1
          echo "✅ Preflight check passed"

      # 2. Create the .env file (for build verification)
      - name: Create .env file
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE }}
        run: |
          printf '%s\n' "$ENV_CONTENT" > .env
          echo "✅ .env file created"

      # 3. Set up the Docker build environment
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 4. Build the Docker image (verify only, no push)
      - name: Verify Docker image build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./Dockerfile
          push: false  # no push (build verification only)
          tags: ${{ env.PROJECT_NAME }}:build-check
          # Use the GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Build success message
      - name: Build verification complete
        run: |
          echo "✅ Docker build verification succeeded!"
          echo ""
          echo "📋 Build info:"
          echo "  🎯 Project: ${{ env.PROJECT_NAME }}"
          echo "  🌿 Branch: $GITHUB_REF_NAME"
          echo "  📝 Commit: ${{ github.sha }}"
          echo "  ⏰ Verified at: $(date '+%Y-%m-%d %H:%M:%S')"
