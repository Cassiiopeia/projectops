# ===================================================================
# PROJECT-TEMPLATE-PLUGIN-VERSION-SYNC.yaml
# 플러그인 매니페스트 버전 동기화 워크플로우 v1.0
# ===================================================================
#
# 이 워크플로우는 projectops 저장소 전용입니다.
# template_integrator로 복사되지 않습니다.
#
# version.yml의 버전이 변경되면 다음 파일들을 자동 동기화합니다:
# - .claude-plugin/plugin.json
# - .claude-plugin/marketplace.json
# - .codex-plugin/plugin.json
# - .agents/plugins/marketplace.json (Codex marketplace source metadata, no version field)
# - plugins/projectops-extras/.claude-plugin/plugin.json, .codex-plugin/plugin.json
# - gemini-extension.json
# - package.json (pi 패키지 매니페스트)
#
# 트리거: main 브랜치 push 시
# (VERSION-CONTROL이 GITHUB_TOKEN으로 version.yml을 변경하면
#  후속 워크플로우가 트리거되지 않으므로 main push를 트리거로 사용)
# ===================================================================

name: PROJECT-TEMPLATE-PLUGIN-VERSION-SYNC

concurrency:
  group: plugin-version-sync
  cancel-in-progress: false

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-plugin-version:
    name: Sync plugin versions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Make version manager script executable
        run: chmod +x .github/scripts/version_manager.sh

      - name: Read version from version.yml
        id: version
        run: |
          VERSION=$(./.github/scripts/version_manager.sh get | tail -n 1)
          if [ -z "$VERSION" ]; then
            echo "❌ Could not read the version from version.yml"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Current version: $VERSION"

      - name: Sync plugin.json version
        run: |
          PLUGIN_FILE=".claude-plugin/plugin.json"
          VERSION="${{ steps.version.outputs.version }}"

          if [ ! -f "$PLUGIN_FILE" ]; then
            echo "⚠️ $PLUGIN_FILE not found, skipping."
            exit 0
          fi

          # jq가 있으면 사용, 없으면 sed로 대체
          if command -v jq &> /dev/null; then
            jq --arg v "$VERSION" '.version = $v' "$PLUGIN_FILE" > tmp.json && mv tmp.json "$PLUGIN_FILE"
          else
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" "$PLUGIN_FILE"
          fi

          echo "✅ plugin.json version synced: $VERSION"

      - name: Sync marketplace.json version
        run: |
          MARKETPLACE_FILE=".claude-plugin/marketplace.json"
          VERSION="${{ steps.version.outputs.version }}"

          if [ ! -f "$MARKETPLACE_FILE" ]; then
            echo "⚠️ $MARKETPLACE_FILE not found, skipping."
            exit 0
          fi

          # jq가 있으면 사용, 없으면 sed로 대체
          if command -v jq &> /dev/null; then
            jq --arg v "$VERSION" '.plugins[].version = $v' "$MARKETPLACE_FILE" > tmp.json && mv tmp.json "$MARKETPLACE_FILE"
          else
            # "plugins" 줄 이후의 version만 변경 (metadata.version 보존, 모든 플러그인 항목 대상)
            sed -i.bak "/\"plugins\"/,\$ s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" "$MARKETPLACE_FILE" && rm -f "$MARKETPLACE_FILE.bak"
          fi

          echo "✅ marketplace.json version synced: $VERSION"

      - name: Sync Codex plugin.json version
        run: |
          CODEX_PLUGIN_FILE=".codex-plugin/plugin.json"
          VERSION="${{ steps.version.outputs.version }}"

          if [ ! -f "$CODEX_PLUGIN_FILE" ]; then
            echo "⚠️ $CODEX_PLUGIN_FILE not found, skipping."
            exit 0
          fi

          if command -v jq &> /dev/null; then
            jq --arg v "$VERSION" '.version = $v' "$CODEX_PLUGIN_FILE" > tmp.json && mv tmp.json "$CODEX_PLUGIN_FILE"
          else
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" "$CODEX_PLUGIN_FILE"
          fi

          echo "✅ Codex plugin.json version synced: $VERSION"

      - name: Sync extras plugin versions
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          for F in plugins/projectops-extras/.claude-plugin/plugin.json plugins/projectops-extras/.codex-plugin/plugin.json; do
            if [ ! -f "$F" ]; then
              echo "⚠️ $F not found, skipping."
              continue
            fi

            if command -v jq &> /dev/null; then
              jq --arg v "$VERSION" '.version = $v' "$F" > tmp.json && mv tmp.json "$F"
            else
              sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" "$F"
            fi

            echo "✅ $F version synced: $VERSION"
          done

      - name: Sync Gemini extension version
        run: |
          GEMINI_EXTENSION_FILE="gemini-extension.json"
          VERSION="${{ steps.version.outputs.version }}"

          if [ ! -f "$GEMINI_EXTENSION_FILE" ]; then
            echo "⚠️ $GEMINI_EXTENSION_FILE not found, skipping."
            exit 0
          fi

          if command -v jq &> /dev/null; then
            jq --arg v "$VERSION" '.version = $v' "$GEMINI_EXTENSION_FILE" > tmp.json && mv tmp.json "$GEMINI_EXTENSION_FILE"
          else
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" "$GEMINI_EXTENSION_FILE"
          fi

          echo "✅ Gemini extension version synced: $VERSION"

      - name: Sync pi package.json version
        run: |
          PI_PACKAGE_FILE="package.json"
          VERSION="${{ steps.version.outputs.version }}"

          if [ ! -f "$PI_PACKAGE_FILE" ]; then
            echo "⚠️ $PI_PACKAGE_FILE not found, skipping."
            exit 0
          fi

          if command -v jq &> /dev/null; then
            jq --arg v "$VERSION" '.version = $v' "$PI_PACKAGE_FILE" > tmp.json && mv tmp.json "$PI_PACKAGE_FILE"
          else
            sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" "$PI_PACKAGE_FILE"
          fi

          echo "✅ pi package.json version synced: $VERSION"

      - name: Commit changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add .claude-plugin/plugin.json .claude-plugin/marketplace.json .codex-plugin/plugin.json gemini-extension.json package.json plugins/projectops-extras/.claude-plugin/plugin.json plugins/projectops-extras/.codex-plugin/plugin.json

          if git diff --staged --quiet; then
            echo "ℹ️ Plugin versions are already in sync."
          else
            VERSION="${{ steps.version.outputs.version }}"
            git commit -m "Sync plugin manifest versions: $VERSION [skip ci]"

            # Race Condition 방지: 다른 버전 워크플로우가 동시에 main을 push하면
            # 단순 git push가 ! [rejected] (fetch first)로 거부된다.
            # pull-rebase 후 재시도 (VERSION-CONTROL v2.1과 동일 패턴, 최대 3회).
            MAX_RETRIES=3
            RETRY_COUNT=0
            PUSH_SUCCESS=false

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "🔄 Push attempt $RETRY_COUNT/$MAX_RETRIES..."

              if git push; then
                PUSH_SUCCESS=true
                echo "✅ Plugin version sync committed"
                break
              else
                echo "⚠️ Push failed, pulling remote changes..."

                if git pull --rebase origin ${{ github.event.repository.default_branch || 'main' }}; then
                  echo "✅ Rebase succeeded, retrying push..."
                else
                  echo "❌ Rebase failed, conflicts need to be resolved"
                  git rebase --abort 2>/dev/null || true
                  exit 1
                fi
              fi
            done

            if [ "$PUSH_SUCCESS" = false ]; then
              echo "❌ Push still failed after $MAX_RETRIES attempts"
              exit 1
            fi
          fi
