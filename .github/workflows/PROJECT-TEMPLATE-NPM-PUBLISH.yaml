# ===================================================================
# PROJECT-TEMPLATE-NPM-PUBLISH.yaml
# projectops npm package auto-publish workflow v1.0
# ===================================================================
#
# This workflow is for the projectops repo only.
# template_integrator does not copy it, and template_initializer deletes it.
#
# What it does:
# - reads the version.yml version on main, injects it into package.json, then npm publish
# - a version already in the registry ends successfully (idempotent)
# - after publishing, creates a GitHub Release for the same version (separate job, skipped if it exists, #738)
#   Why it lives in this repo-only file and not a shared workflow copied into installed repos:
#   putting Release creation in the shared one would change behavior in every repo that installed this template.
#
# Channel policy (#796): npm `latest` always equals what was pushed to the deploy branch (main).
#   - Pushing to main and passing CI ships it as `latest`. No separate promotion cycle or waiting period.
#   - develop (the development branch) is never published to npm. So users on `latest` get only versions
#     a person decided to push to main. "How often it ships" is how often main is pushed, i.e. the maintainer's decision.
#   - To keep this policy intact, the trigger is main only and the dist-tag is set to `latest` explicitly.

# Triggers: push to main (+ manual run)
# (When VERSION-CONTROL changes version.yml with GITHUB_TOKEN,
#  follow-up workflows are not triggered, so main push is used as the trigger
#  — same pattern as PLUGIN-VERSION-SYNC)
#
# Auth: npm Trusted Publishing (OIDC). No Secret
#   - This repo and this workflow file name are registered as a Trusted Publisher in the npmjs.com package settings.
#     Renaming the file requires changing that setting too (otherwise publish fails auth)
#   - Needs npm 11.5.1 or later, so Node 24 is used. Requires `id-token: write` permission
#   - 2FA-bypass tokens (NPM_TOKEN) are not used, since direct publishing with them is blocked from 2027-01
# ===================================================================

name: PROJECT-TEMPLATE-NPM-PUBLISH

concurrency:
  group: npm-publish
  cancel-in-progress: false

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # Ship only commits that passed the 3-OS smoke. Without the gate a broken version goes to latest first.
  # The GitHub API sometimes shows a run completed/successful while a job is still queued, so check jobs too.
  wait-for-ci:
    name: Wait for CI on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run: skipping the CI wait."
            echo "passed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runs_url="repos/$GITHUB_REPOSITORY/actions/workflows/PROJECT-TEMPLATE-CI.yaml/runs?head_sha=$GITHUB_SHA&event=push"
          # CI has a paths filter, so docs-only commits have no run. If none appears within 3 minutes, it is not a target
          for attempt in $(seq 1 170); do
            run_id=$(gh api "$runs_url" --jq '.workflow_runs[0].id // empty')
            if [ -z "$run_id" ]; then
              if [ "$attempt" -ge 6 ]; then
                echo "No CI run for this commit (paths filter)."
                echo "passed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep 30
              continue
            fi
            total=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '.jobs | length')
            open=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | select(.status != "completed")] | length')
            run_status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
            if [ "$total" -gt 0 ] && [ "$open" = "0" ] && [ "$run_status" = "completed" ]; then
              cancelled=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "cancelled")] | length')
              bad=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "cancelled")] | length')
              if [ "$bad" != "0" ]; then
                echo "::error::CI failed for this commit, not publishing."
                exit 1
              fi
              if [ "$cancelled" != "0" ]; then
                # A new push cancelled this run. That push's publish takes over
                echo "CI was replaced by a newer push, leaving the publish to that run."
                echo "passed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "All $total CI jobs passed."
              echo "passed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for CI."
          exit 1

  publish-npm:
    name: Publish npm package
    needs: wait-for-ci
    if: needs.wait-for-ci.outputs.passed == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository (main)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read version from version.yml
        id: version
        run: |
          chmod +x .github/scripts/version_manager.sh
          VERSION=$(./.github/scripts/version_manager.sh get | tail -n 1)
          if [ -z "$VERSION" ]; then
            echo "❌ Could not read the version from version.yml"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version to publish: $VERSION"

      - name: Set package.json version
        run: npm pkg set version=${{ steps.version.outputs.version }}

      - name: Check whether this version is already published (idempotent)
        id: check
        run: |
          PKG_NAME=$(npm pkg get name | tr -d '"')
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "ℹ️ ${PKG_NAME}@${VERSION} is already published, skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --provenance --access public --tag latest

      - name: Publish summary
        if: steps.check.outputs.skip == 'false'
        run: echo "✅ Published projectops@${{ steps.version.outputs.version }} to npm"

  # Why separate from npm publishing: contents: write goes only to this job,
  # so the npm publish step never shares a job with a repo-write token.
  github-release:
    name: Create GitHub Release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository (main)
        uses: actions/checkout@v5
        with:
          ref: main

      # RELEASE-CHANGELOG creates the tag. It may not exist yet at push time, so wait a bit.
      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish-npm.outputs.version }}
        run: |
          TAG="v${VERSION}"
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          release_exists() {
            [ "$(curl -s -o /dev/null -w "%{http_code}" "${AUTH[@]}" "$API/releases/tags/$TAG")" = "200" ]
          }

          if release_exists; then
            echo "ℹ️ Release $TAG already exists, skipping."
            exit 0
          fi

          # Wait up to 5 minutes for the tag to appear on the remote (passing silently would lose the Release forever)
          for i in $(seq 1 20); do
            git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG" && FOUND=1 && break
            echo "⏳ Waiting for tag $TAG ($i/20)"
            sleep 15
          done
          if [ -z "$FOUND" ]; then
            echo "::error::Tag $TAG is not on the remote, so the Release was not created."
            exit 1
          fi

          python3 .github/scripts/changelog_manager.py export --version "$VERSION" --output release_notes.txt || true
          [ -s release_notes.txt ] || echo "See CHANGELOG.md for the changes in release $VERSION." > release_notes.txt

          jq -n --arg tag "$TAG" --arg name "$TAG" --rawfile body release_notes.txt \
            '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}' > release_payload.json

          # Retry transient errors (5xx, 429) up to 3 times. 422 means it was created elsewhere first; confirm it exists and treat as success.
          for attempt in 1 2 3; do
            CODE=$(curl -s -o release_resp.json -w "%{http_code}" -X POST "${AUTH[@]}" \
              -d @release_payload.json "$API/releases")
            case "$CODE" in
              201) echo "✅ Created GitHub Release: $TAG"; exit 0 ;;
              422) release_exists && { echo "ℹ️ Another run already created it: $TAG"; exit 0; } ;;
              429|5??) echo "⏳ Temporary error (HTTP $CODE), retry $attempt/3"; sleep $((attempt * 10)); continue ;;
            esac
            break
          done
          echo "::error::Failed to create the Release (HTTP $CODE)"
          cat release_resp.json
          exit 1
