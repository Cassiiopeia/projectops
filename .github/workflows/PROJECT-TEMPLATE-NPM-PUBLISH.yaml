# ===================================================================
# PROJECT-TEMPLATE-NPM-PUBLISH.yaml
# projectops npm 패키지 자동 배포 워크플로우 v1.0
# ===================================================================
#
# 이 워크플로우는 projectops 저장소 전용입니다.
# template_integrator로 복사되지 않으며, template_initializer가 삭제합니다.
#
# 동작:
# - main 기준으로 version.yml 버전을 읽어 package.json에 주입 후 npm publish
# - 이미 레지스트리에 있는 버전이면 성공 종료 (멱등)
# - 배포 후 같은 버전의 GitHub Release를 만든다 (별도 job, 이미 있으면 건너뜀, #738)
#   설치 대상 레포로 복사되는 공통 워크플로우가 아니라 이 레포 전용 파일에 둔 이유:
#   Release 생성을 공통에 넣으면 이 템플릿을 설치한 모든 레포의 동작이 바뀐다.
#
# 채널 정책 (#796): npm `latest` 는 배포 브랜치(main)에 올린 것과 항상 같다.
#   - main 에 push 하고 CI 를 통과하면 `latest` 로 나간다. 별도 승격 주기·대기 기간은 없다.
#   - develop(개발 브랜치)은 npm 에 올리지 않는다. 그래서 `latest` 를 받는 사용자는 사람이 main 에 올리기로
#     결정한 버전만 받는다. "얼마나 자주 나가는가"는 main 에 올리는 빈도, 곧 메인테이너의 결정이다.
#   - 이 정책이 깨지지 않도록 트리거를 main 으로만 두고 dist-tag 를 `latest` 로 명시한다.

# 트리거: main 브랜치 push 시 (+ 수동 실행)
# (VERSION-CONTROL이 GITHUB_TOKEN으로 version.yml을 변경하면
#  후속 워크플로우가 트리거되지 않으므로 main push를 트리거로 사용
#  — PLUGIN-VERSION-SYNC와 동일 패턴)
#
# 인증: npm Trusted Publishing (OIDC). Secret 없음
#   - npmjs.com 패키지 설정의 Trusted Publisher 에 이 레포와 이 워크플로 파일 이름이 등록되어 있다.
#     파일 이름을 바꾸면 그 설정도 같이 바꿔야 한다 (안 바꾸면 publish 가 인증에서 실패)
#   - npm 11.5.1 이상이 필요해 Node 24 를 쓴다. `id-token: write` 권한이 있어야 한다
#   - 2FA 우회 토큰(NPM_TOKEN)은 2027-01 부터 직접 배포가 막혀 쓰지 않는다
# ===================================================================

name: PROJECT-TEMPLATE-NPM-PUBLISH

concurrency:
  group: npm-publish
  cancel-in-progress: false

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  # 3 OS 스모크를 통과한 커밋만 내보낸다. 게이트가 없으면 깨진 버전이 먼저 latest 로 나간다.
  # GitHub API 는 run 이 완료·성공이어도 job 이 아직 대기 중일 때가 있어 job 까지 본다.
  wait-for-ci:
    name: Wait for CI on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run: skipping the CI wait."
            echo "passed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runs_url="repos/$GITHUB_REPOSITORY/actions/workflows/PROJECT-TEMPLATE-CI.yaml/runs?head_sha=$GITHUB_SHA&event=push"
          # CI 는 paths 필터가 있어 문서만 바뀐 커밋에는 run 이 없다. 3분 안에 안 생기면 대상이 아니다
          for attempt in $(seq 1 170); do
            run_id=$(gh api "$runs_url" --jq '.workflow_runs[0].id // empty')
            if [ -z "$run_id" ]; then
              if [ "$attempt" -ge 6 ]; then
                echo "No CI run for this commit (paths filter)."
                echo "passed=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              sleep 30
              continue
            fi
            total=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '.jobs | length')
            open=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | select(.status != "completed")] | length')
            run_status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status')
            if [ "$total" -gt 0 ] && [ "$open" = "0" ] && [ "$run_status" = "completed" ]; then
              cancelled=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "cancelled")] | length')
              bad=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "cancelled")] | length')
              if [ "$bad" != "0" ]; then
                echo "::error::CI failed for this commit, not publishing."
                exit 1
              fi
              if [ "$cancelled" != "0" ]; then
                # 새 push 가 이 run 을 취소했다. 그 push 의 배포가 이어받는다
                echo "CI was replaced by a newer push, leaving the publish to that run."
                echo "passed=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "All $total CI jobs passed."
              echo "passed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for CI."
          exit 1

  publish-npm:
    name: Publish npm package
    needs: wait-for-ci
    if: needs.wait-for-ci.outputs.passed == 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository (main)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read version from version.yml
        id: version
        run: |
          chmod +x .github/scripts/version_manager.sh
          VERSION=$(./.github/scripts/version_manager.sh get | tail -n 1)
          if [ -z "$VERSION" ]; then
            echo "❌ Could not read the version from version.yml"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version to publish: $VERSION"

      - name: Set package.json version
        run: npm pkg set version=${{ steps.version.outputs.version }}

      - name: Check whether this version is already published (idempotent)
        id: check
        run: |
          PKG_NAME=$(npm pkg get name | tr -d '"')
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "${PKG_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "ℹ️ ${PKG_NAME}@${VERSION} is already published, skipping."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --provenance --access public --tag latest

      - name: Publish summary
        if: steps.check.outputs.skip == 'false'
        run: echo "✅ Published projectops@${{ steps.version.outputs.version }} to npm"

  # npm 배포와 분리한 이유: contents: write 를 이 job 에만 주어,
  # npm 에 올리는 publish 단계가 저장소 쓰기 권한 토큰과 같은 job 에 있지 않게 한다.
  github-release:
    name: Create GitHub Release
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository (main)
        uses: actions/checkout@v5
        with:
          ref: main

      # 태그는 RELEASE-CHANGELOG가 만든다. push 시점에 아직 없을 수 있어 잠시 기다린다.
      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.publish-npm.outputs.version }}
        run: |
          TAG="v${VERSION}"
          API="https://api.github.com/repos/${{ github.repository }}"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")

          release_exists() {
            [ "$(curl -s -o /dev/null -w "%{http_code}" "${AUTH[@]}" "$API/releases/tags/$TAG")" = "200" ]
          }

          if release_exists; then
            echo "ℹ️ Release $TAG already exists, skipping."
            exit 0
          fi

          # 태그가 원격에 생길 때까지 최대 5분 대기 (조용히 넘기면 Release가 영영 누락된다)
          for i in $(seq 1 20); do
            git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG" && FOUND=1 && break
            echo "⏳ Waiting for tag $TAG ($i/20)"
            sleep 15
          done
          if [ -z "$FOUND" ]; then
            echo "::error::Tag $TAG is not on the remote, so the Release was not created."
            exit 1
          fi

          python3 .github/scripts/changelog_manager.py export --version "$VERSION" --output release_notes.txt || true
          [ -s release_notes.txt ] || echo "See CHANGELOG.md for the changes in release $VERSION." > release_notes.txt

          jq -n --arg tag "$TAG" --arg name "$TAG" --rawfile body release_notes.txt \
            '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}' > release_payload.json

          # 일시 오류(5xx, 429)는 3회까지 재시도한다. 422는 다른 곳에서 먼저 만들어진 경우라 존재 확인 후 성공 처리한다.
          for attempt in 1 2 3; do
            CODE=$(curl -s -o release_resp.json -w "%{http_code}" -X POST "${AUTH[@]}" \
              -d @release_payload.json "$API/releases")
            case "$CODE" in
              201) echo "✅ Created GitHub Release: $TAG"; exit 0 ;;
              422) release_exists && { echo "ℹ️ Another run already created it: $TAG"; exit 0; } ;;
              429|5??) echo "⏳ Temporary error (HTTP $CODE), retry $attempt/3"; sleep $((attempt * 10)); continue ;;
            esac
            break
          done
          echo "::error::Failed to create the Release (HTTP $CODE)"
          cat release_resp.json
          exit 1
