# ===================================================
# PROJECT-COMMON-SUH-ISSUE-HELPER
# ===================================================
#
# Automatically comments the branch name and commit message template when a GitHub issue is created or retitled.
# Logic: .github/scripts/issue_helper.py (no external action — brought in-house in v4.3.0)
#
# ⚙️ Customization: version.yml → metadata.template.options.issue_helper
#   branch_prefix / max_branch_length / timezone / commit_template
#   / commit_type_map / comment_marker / show_guide
#   (without the section everything uses defaults)
#
# 🔑 Token: public repos use GITHUB_TOKEN automatically.
#   Register the _GITHUB_PAT_TOKEN secret if a private repo needs to chain-trigger other workflows.
#
# ⚠️ Some consumers machine-parse this comment (do not change the format):
#   - PROJECT-FLUTTER-PROJECTOPS-APP-BUILD-TRIGGER.yaml
#     : extracts the "### 브랜치" code block from the "Guide by ProjectOps" comment to pick the build target
#   Details: docs/BRANCH-CONVENTION.md (template repo)
#
# ===================================================

name: PROJECT-COMMON-SUH-ISSUE-HELPER

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  generate-comment:
    if: github.event.action == 'opened' || (github.event.action == 'edited' && github.event.changes.title)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate branch & commit comment
        env:
          GITHUB_TOKEN: ${{ secrets._GITHUB_PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/issue_helper.py
