# ===================================================================
# PROJECT-TEMPLATE-CI.yaml
# projectops repo watch-check workflow v2.0
# ===================================================================
#
# This workflow is for the projectops repo only.
# template_integrator does not copy it, and template_initializer deletes it.
#
# Runs only the 5 watch checks + wizard consistency + CLI smoke.
# Checks only that promises scattered across files agree (skill count/descriptions, Korean line ledger, workflow permissions, options source).
#
#   fast path  every develop push/PR    1 ubuntu runner
#   wide path  main push / manual run   3-OS CLI smoke (macOS bash 3.2 / Windows .cmd differences #415 #418)
#
# Triggers: push to develop/main / PRs targeting develop (+ manual run)
# ===================================================================

name: PROJECT-TEMPLATE-CI

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["develop", "main"]
    paths:
      - "src/**"
      - "test/**"
      - "bin/**"
      - "package.json"
      - ".github/util/flutter/**"
      # The Python side was missing, so commits touching only skills never ran CI (#587)
      - ".github/scripts/**"
      - "skills/**"
      - "scripts/**"
      - ".github/workflows/PROJECT-TEMPLATE-CI.yaml"
  pull_request:
    # Release PRs (develop->main) are excluded — their content was already verified on the develop push,
    # and automerge merges right away, cutting the run and leaving it as failed (#565).
    branches: ["develop"]
    paths:
      - "src/**"
      - "test/**"
      - "bin/**"
      - "package.json"
      - ".github/util/flutter/**"
      # The Python side was missing, so commits touching only skills never ran CI (#587)
      - ".github/scripts/**"
      - "skills/**"
      - "scripts/**"
      - ".github/workflows/PROJECT-TEMPLATE-CI.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ===================================================================
  # Fast path — every commit
  # ===================================================================
  quick:
    name: Guard checks (ubuntu · Node 20)
    # Do not run on the release version finalize commit ([skip ci])
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        # Match the engines floor (20.12)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # package-lock.json is gitignored (not committed), so use npm install
        run: |
          npm install --no-audit --no-fund
          python3 -m pip install --quiet pytest pyyaml

      - name: node --test (skill count and list match, options schema)
        # node --test without arguments finds test files from cwd (Node 20+)
        run: npm test

      - name: CLI smoke test (--help exits 0)
        run: node bin/projectops.js --help

      - name: pytest (skill docs, Korean line budget, workflow permissions)
        run: python3 -m pytest scripts/tests/ .github/scripts/test/ -q

      - name: Wizard consistency check
        # Shared CSS/JS asset loading, shared util overrides, version.json <-> HTML sync, i18n dictionaries
        run: python3 .github/util/flutter/_shared/check-consistency.py

      - name: Architecture rules (frozen lists)
        # ledger check exits 0 even with violations, so check the verdict directly
        run: |
          python3 skills/pro-code-consult/scripts/arch_cli.py ledger . check > ledger.json
          python3 -c "import json,sys; d=json.load(open('ledger.json')); print(d['summary']); sys.exit(d['verdict']!='pass')"

  # ===================================================================
  # Windows Python watch checks — only on main push / manual run (#1018: closes the gap where Windows ran only the CLI smoke)
  # ===================================================================
  python-windows:
    name: Guard checks pytest (windows)
    if: ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pytest pyyaml

      - name: pytest (skill docs, Korean line budget, workflow permissions)
        # Do not enable UTF-8 mode, same as a regular user's PC
        run: python -m pytest scripts/tests/ .github/scripts/test/ -q

  # ===================================================================
  # Wide path — only on main push / manual run. OS differences are checked by running the CLI.
  # ===================================================================
  matrix-smoke:
    name: CLI smoke test (${{ matrix.os }}, Node ${{ matrix.node }})
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
          && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # engines floor and current LTS. Some defects (like fs.cpSync) appear only with a specific Node version and OS
        node: [20, 24]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: CLI smoke test (--help exits 0)
        run: node bin/projectops.js --help

      - name: Install into a non-ASCII path with spaces
        # User folder names often contain Korean and spaces. English-only paths miss crashes in the copy step
        shell: bash
        run: |
          target="$RUNNER_TEMP/"$'\xed\x95\x9c\xea\xb8\x80'" smoke"
          mkdir -p "$target"
          cd "$target"
          git init -q -b main
          echo '{"name":"smoke","version":"1.0.0"}' > package.json
          node "$GITHUB_WORKSPACE/bin/projectops.js" --mode full --type node --force
          test -f version.yml
          test -d .github/workflows
          test ! -d .template_download_temp

      - name: Run skill CLIs from a non-ASCII path
        # Run with the system default code page. git output is UTF-8, so without an encoding stdout becomes None
        shell: bash
        run: |
          cd "$RUNNER_TEMP/"$'\xed\x95\x9c\xea\xb8\x80'" smoke"
          for cli in skills/pro-report/scripts/report_cli.py skills/pro-review/scripts/review_cli.py; do
            python "$GITHUB_WORKSPACE/$cli" get-output-path > /dev/null
          done
          python "$GITHUB_WORKSPACE/skills/pro-launch/scripts/launch_cli.py" --help > /dev/null
