# ===================================================================
# PROJECT-TEMPLATE-CI.yaml
# projectops npx CLI 크로스-OS 테스트 워크플로우 v1.0
# ===================================================================
#
# 이 워크플로우는 projectops 저장소 전용입니다.
# template_integrator로 복사되지 않으며, template_initializer가 삭제합니다.
#
# 동작:
# - src/·test/·package.json 변경 시 node --test 를 3-OS × 2 Node 버전(20·22)으로 실행
# - ubuntu·windows·macos 전부에서 npx CLI가 도는지 자동 검증
#   (detect-fs.js의 which/where 분기, ide/runner.js의 win32 .cmd 처리 등
#    OS 종속 코드가 실제로 mac/linux/windows에서 동작하는지 보장)
#
# 트리거: develop·main 브랜치 push / 해당 브랜치 대상 PR (+ 수동 실행)
# ===================================================================

name: PROJECT-TEMPLATE-CI

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["develop", "main"]
    paths:
      - "src/**"
      - "test/**"
      - "bin/**"
      - "package.json"
      - ".github/util/flutter/**"
      # 파이썬 쪽이 빠져 있어 스킬만 고친 커밋은 CI를 아예 안 탔다 (#587)
      - ".github/scripts/**"
      - "skills/**"
      - "scripts/**"
      - ".github/workflows/PROJECT-TEMPLATE-CI.yaml"
  pull_request:
    # 릴리스 PR(develop→main)은 제외한다 — 그 내용은 develop push에서 이미 검증됐고,
    # automerge가 곧바로 머지해 run이 잘리면서 실패로 남았다 (#565).
    branches: ["develop"]
    paths:
      - "src/**"
      - "test/**"
      - "bin/**"
      - "package.json"
      - ".github/util/flutter/**"
      # 파이썬 쪽이 빠져 있어 스킬만 고친 커밋은 CI를 아예 안 탔다 (#587)
      - ".github/scripts/**"
      - "skills/**"
      - "scripts/**"
      - ".github/workflows/PROJECT-TEMPLATE-CI.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node --test (${{ matrix.os }} · Node ${{ matrix.node }})
    # 릴리스 버전 확정 커밋([skip ci])에서는 실행하지 않음
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 의존성 @clack/core가 node:util styleText(Node 20.12+ 전용)를 쓰므로 20 이상만 지원.
        # (package.json engines: >=20.12 와 일치)
        node: [20, 22]

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Node.js ${{ matrix.node }} 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 의존성 설치
        # package-lock.json은 .gitignore 대상(레포에 커밋 안 됨)이라 npm install 사용
        run: npm install --no-audit --no-fund

      - name: 테스트 실행 (npm test → node --test)
        # 인자 없는 node --test 는 cwd 기준 test 파일을 자동 탐색한다(Node 20+ 안정).
        # glob 패턴("test/**")은 Node 21+ 전용이라 매트릭스 Node 20에서 깨지므로 인자 없이 실행.
        run: npm test

      - name: CLI 스모크 (--help 종료코드 0)
        run: node bin/projectops.js --help

  pytest:
    name: pytest (${{ matrix.os }})
    # 릴리스 버전 확정 커밋([skip ci])에서는 실행하지 않음
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 이 저장소는 경로·셸 처리에서 OS 차이를 여러 번 겪었다. 양쪽에서 본다.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pytest 설치
        run: python3 -m pip install --quiet pytest

      - name: 스크립트 테스트
        # changelog provider · version manager · issue helper
        run: python3 -m pytest .github/scripts/test/ -q

      - name: 스킬 테스트
        # 기기·브라우저·서버 없이 돌도록 만들었다. 없으면 해당 테스트만 건너뛴다.
        run: python3 -m pytest skills/ -q

  wizards:
    name: Flutter 마법사 정합성 · CLI 계약
    # 릴리스 버전 확정 커밋([skip ci])에서는 실행하지 않음
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 마법사 3종 정합성 검증
        # CSS/JS 공통 자산 로드, 공통 유틸 재정의, 필수 기능 균일성,
        # version.json ↔ HTML 동기화, 낡은 링크, 첫 사용자 안내, CLI 계약을 검사한다
        run: python3 .github/util/flutter/_shared/check-consistency.py

      - name: 마법사 CLI 계약 · dry-run 안전성 테스트
        run: python3 .github/util/flutter/_shared/test_wizard_cli.py
