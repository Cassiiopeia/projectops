# ===================================================================
# PROJECT-TEMPLATE-CI.yaml
# projectops 저장소 감시 검사 워크플로우 v2.0
# ===================================================================
#
# 이 워크플로우는 projectops 저장소 전용입니다.
# template_integrator로 복사되지 않으며, template_initializer가 삭제합니다.
#
# 감시용 검사 5개 + 마법사 정합성 + CLI 스모크만 돈다.
# 여러 파일에 흩어진 약속이 서로 맞는지만 본다 (스킬 개수·설명, 한글 줄 장부, 워크플로 권한, 옵션 정본).
#
#   빠른 길  develop push·PR 마다   ubuntu 1대
#   넓은 길  main push·수동 실행    3 OS CLI 스모크 (macOS bash 3.2·Windows .cmd 차이 #415·#418)
#
# 트리거: develop·main 브랜치 push / develop 대상 PR (+ 수동 실행)
# ===================================================================

name: PROJECT-TEMPLATE-CI

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["develop", "main"]
    paths:
      - "src/**"
      - "test/**"
      - "bin/**"
      - "package.json"
      - ".github/util/flutter/**"
      # 파이썬 쪽이 빠져 있어 스킬만 고친 커밋은 CI를 아예 안 탔다 (#587)
      - ".github/scripts/**"
      - "skills/**"
      - "scripts/**"
      - ".github/workflows/PROJECT-TEMPLATE-CI.yaml"
  pull_request:
    # 릴리스 PR(develop→main)은 제외한다 — 그 내용은 develop push에서 이미 검증됐고,
    # automerge가 곧바로 머지해 run이 잘리면서 실패로 남았다 (#565).
    branches: ["develop"]
    paths:
      - "src/**"
      - "test/**"
      - "bin/**"
      - "package.json"
      - ".github/util/flutter/**"
      # 파이썬 쪽이 빠져 있어 스킬만 고친 커밋은 CI를 아예 안 탔다 (#587)
      - ".github/scripts/**"
      - "skills/**"
      - "scripts/**"
      - ".github/workflows/PROJECT-TEMPLATE-CI.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ===================================================================
  # 빠른 길 — 모든 커밋
  # ===================================================================
  quick:
    name: 감시 검사 (ubuntu · Node 20)
    # 릴리스 버전 확정 커밋([skip ci])에서는 실행하지 않음
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 설정
        # engines의 하한(20.12)에 맞춘다
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        # package-lock.json은 .gitignore 대상(레포에 커밋 안 됨)이라 npm install 사용
        run: |
          npm install --no-audit --no-fund
          python3 -m pip install --quiet pytest pyyaml

      - name: node --test (스킬 개수·목록 일치, 옵션 정본)
        # 인자 없는 node --test 는 cwd 기준 test 파일을 자동 탐색한다(Node 20+)
        run: npm test

      - name: CLI 스모크 (--help 종료코드 0)
        run: node bin/projectops.js --help

      - name: pytest (스킬 설명, 한글 줄 장부, 워크플로 권한)
        run: python3 -m pytest scripts/tests/ .github/scripts/test/ -q

      - name: 마법사 정합성 검증
        # CSS/JS 공통 자산 로드, 공통 유틸 재정의, version.json ↔ HTML 동기화, i18n 사전
        run: python3 .github/util/flutter/_shared/check-consistency.py

  # ===================================================================
  # 넓은 길 — main push·수동 실행에서만. OS 차이는 CLI 실행으로 본다.
  # ===================================================================
  matrix-smoke:
    name: CLI 스모크 (${{ matrix.os }})
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
          && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 의존성 설치
        run: npm install --no-audit --no-fund

      - name: CLI 스모크 (--help 종료코드 0)
        run: node bin/projectops.js --help
