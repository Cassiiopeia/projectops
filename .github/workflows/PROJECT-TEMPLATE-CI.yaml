# ===================================================================
# PROJECT-TEMPLATE-CI.yaml
# projectops 저장소 감시 검사 워크플로우 v2.0
# ===================================================================
#
# 이 워크플로우는 projectops 저장소 전용입니다.
# template_integrator로 복사되지 않으며, template_initializer가 삭제합니다.
#
# 감시용 검사 5개 + 마법사 정합성 + CLI 스모크만 돈다.
# 여러 파일에 흩어진 약속이 서로 맞는지만 본다 (스킬 개수·설명, 한글 줄 장부, 워크플로 권한, 옵션 정본).
#
#   빠른 길  develop push·PR 마다   ubuntu 1대
#   넓은 길  main push·수동 실행    3 OS CLI 스모크 (macOS bash 3.2·Windows .cmd 차이 #415·#418)
#
# 트리거: develop·main 브랜치 push / develop 대상 PR (+ 수동 실행)
# ===================================================================

name: PROJECT-TEMPLATE-CI

concurrency:
  group: template-ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["develop", "main"]
    paths:
      - "src/**"
      - "test/**"
      - "bin/**"
      - "package.json"
      - ".github/util/flutter/**"
      # 파이썬 쪽이 빠져 있어 스킬만 고친 커밋은 CI를 아예 안 탔다 (#587)
      - ".github/scripts/**"
      - "skills/**"
      - "scripts/**"
      - ".github/workflows/PROJECT-TEMPLATE-CI.yaml"
  pull_request:
    # 릴리스 PR(develop→main)은 제외한다 — 그 내용은 develop push에서 이미 검증됐고,
    # automerge가 곧바로 머지해 run이 잘리면서 실패로 남았다 (#565).
    branches: ["develop"]
    paths:
      - "src/**"
      - "test/**"
      - "bin/**"
      - "package.json"
      - ".github/util/flutter/**"
      # 파이썬 쪽이 빠져 있어 스킬만 고친 커밋은 CI를 아예 안 탔다 (#587)
      - ".github/scripts/**"
      - "skills/**"
      - "scripts/**"
      - ".github/workflows/PROJECT-TEMPLATE-CI.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ===================================================================
  # 빠른 길 — 모든 커밋
  # ===================================================================
  quick:
    name: 감시 검사 (ubuntu · Node 20)
    # 릴리스 버전 확정 커밋([skip ci])에서는 실행하지 않음
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 설정
        # engines의 하한(20.12)에 맞춘다
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        # package-lock.json은 .gitignore 대상(레포에 커밋 안 됨)이라 npm install 사용
        run: |
          npm install --no-audit --no-fund
          python3 -m pip install --quiet pytest pyyaml

      - name: node --test (스킬 개수·목록 일치, 옵션 정본)
        # 인자 없는 node --test 는 cwd 기준 test 파일을 자동 탐색한다(Node 20+)
        run: npm test

      - name: CLI 스모크 (--help 종료코드 0)
        run: node bin/projectops.js --help

      - name: pytest (스킬 설명, 한글 줄 장부, 워크플로 권한)
        run: python3 -m pytest scripts/tests/ .github/scripts/test/ -q

      - name: 마법사 정합성 검증
        # CSS/JS 공통 자산 로드, 공통 유틸 재정의, version.json ↔ HTML 동기화, i18n 사전
        run: python3 .github/util/flutter/_shared/check-consistency.py

      - name: Architecture rules (frozen lists)
        # ledger check 는 위반이 있어도 exit 0 이라 verdict 를 직접 본다
        run: |
          python3 plugins/projectops-extras/skills/pro-code-consult/scripts/arch_cli.py ledger . check > ledger.json
          python3 -c "import json,sys; d=json.load(open('ledger.json')); print(d['summary']); sys.exit(d['verdict']!='pass')"

  # ===================================================================
  # Windows 파이썬 감시 검사 — main push·수동 실행에서만 (#1018: Windows 는 CLI 스모크만 돌던 빈틈)
  # ===================================================================
  python-windows:
    name: Guard checks pytest (windows)
    if: ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet pytest pyyaml

      - name: pytest (skill docs, Korean line budget, workflow permissions)
        # 일반 사용자 PC 와 같게 UTF-8 모드를 켜지 않는다
        run: python -m pytest scripts/tests/ .github/scripts/test/ -q

  # ===================================================================
  # 넓은 길 — main push·수동 실행에서만. OS 차이는 CLI 실행으로 본다.
  # ===================================================================
  matrix-smoke:
    name: CLI 스모크 (${{ matrix.os }}, Node ${{ matrix.node }})
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main')
          && !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # engines 하한과 현행 LTS. fs.cpSync 처럼 Node 버전과 OS 가 겹쳐야 드러나는 결함이 있다
        node: [20, 24]
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: npm install --no-audit --no-fund

      - name: CLI 스모크 (--help 종료코드 0)
        run: node bin/projectops.js --help

      - name: Install into a non-ASCII path with spaces
        # 사용자 폴더 이름에 한글과 공백이 흔하다. 영문 경로만 보면 복사 단계 크래시를 놓친다
        shell: bash
        run: |
          target="$RUNNER_TEMP/"$'\xed\x95\x9c\xea\xb8\x80'" smoke"
          mkdir -p "$target"
          cd "$target"
          git init -q -b main
          echo '{"name":"smoke","version":"1.0.0"}' > package.json
          node "$GITHUB_WORKSPACE/bin/projectops.js" --mode full --type node --force
          test -f version.yml
          test -d .github/workflows
          test ! -d .template_download_temp

      - name: Run skill CLIs from a non-ASCII path
        # 시스템 기본 코드페이지 그대로 돌린다. git 출력은 UTF-8 이라 인코딩을 안 적으면 stdout 이 None 이 된다
        shell: bash
        run: |
          cd "$RUNNER_TEMP/"$'\xed\x95\x9c\xea\xb8\x80'" smoke"
          for cli in skills/pro-report/scripts/report_cli.py skills/pro-review/scripts/review_cli.py; do
            python "$GITHUB_WORKSPACE/$cli" get-output-path > /dev/null
          done
          python "$GITHUB_WORKSPACE/skills/pro-launch/scripts/launch_cli.py" --help > /dev/null
