# Automatic dependency updates — weekly, with a cap so update PRs do not pile up
#
# ⚠️ Points to watch in this repo (#751)
#  - A PR to the default branch (main) deploys the moment it is merged. Always target the development branch (develop).
#  - The common workflows in the root .github/workflows/ must stay identical to the project-types/common/ sources.
#    Dependabot changes only the root copies, so when merging an action version PR, fix the source too
#    (no automatic check prevents this. Compare the two files by hand).
#  - Major version bumps can change the behavior of repos that installed this template, so they are excluded from automatic PRs.
version: 2
updates:
  # Action versions used by workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  # npx package (projectops) dependencies
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
