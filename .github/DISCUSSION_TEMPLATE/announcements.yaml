title: "📄 [Docs] {Write the title}"
labels:
  - "documentation"
body:
  # Guide text (markdown)
  - type: markdown
    attributes:
      value: |
        <!--
        📚 GitHub issue (or discussion) template
        Copy and paste the title tag you need!

        🔧 [Feature Request][Category] Which part needs a feature
        ⚙️ [Feature][Category] Which part gets a new feature
        🚀 [Improvement][Category] Which part gets improved
        🔥 [Urgent]
        📄 [Docs]
        ⌛ [~month/day]

        Fill in the sections below in order.
        -->

  # Current problem (required)
  - type: textarea
    id: current_issues
    attributes:
      label: "📝 Current problem"
      description: "Explain why a feature is missing or needs improvement."
      placeholder: |
        - What is the problem right now?
        - Why do you think it needs improving?
    validations:
      required: true

  # Proposed solution / feature (required)
  - type: textarea
    id: suggested_solution
    attributes:
      label: "🛠️ Proposed solution / feature"
      description: |
        Describe a concrete way to solve the problem.
        Describe your idea for the new feature or improvement in detail.
      placeholder: |
        - e.g. add option B to feature A
        - e.g. improve the UI/UX
        - ...
    validations:
      required: true

  # Extra work items: uncomment and fill in when needed (optional)
  - type: markdown
    attributes:
      value: |
        <!--
        ⚙️ Work items (e.g. for Feature and Improvement)
        ---
        - List what the implementation needs as a checklist.
        - e.g. API design, frontend screens, UI design

        Example:
        - [ ] Update the login API
        - [ ] Improve the sign-up form design
        - [ ] ...
        -->

  # Assignees (optional)
  - type: textarea
    id: assignees
    attributes:
      label: "🙋‍♂️ Assignees"
      description: |
        Enter the assignees if they are already decided.
        - Backend: name
        - Frontend: name
        - Design: name
      placeholder: |
        - Backend:
        - Frontend:
        - Design:
    validations:
      required: false
