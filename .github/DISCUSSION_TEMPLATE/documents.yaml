title: "📄 [Docs] {Write the title}"
labels:
  - "documentation"
body:
  # Guide text (markdown)
  - type: markdown
    attributes:
      value: |
        <!--
        📚 GitHub Discussions document template
        Use the sections below as a guide. Fill in whatever parts you need.
        -->

  # Problem
  - type: textarea
    id: concept
    attributes:
      label: "❌ Problem"
      description: "Describe the problem that led you to adopt this technology"
    validations:
      required: false

  # Body (required)
  - type: textarea
    id: main
    attributes:
      label: "📝 Key points and direction"
      description: "Describe what you built during development or the technical details."
      placeholder: |
        - Background knowledge and basic concepts
        - What you built during development, or technical details
      value:
    validations:
      required: true

  # Troubleshooting and expected benefits (optional)
  - type: textarea
    id: expected
    attributes:
      label: "📚 Troubleshooting and expected benefits"
      placeholder: |
        - Describe the problems you hit while building it and how you solved them
        - Describe the benefits of using this feature
        e.g. a better user authentication process
    validations:
      required: false

  # References (optional)
  - type: textarea
    id: references
    attributes:
      label: "🔗 References"
      description: "Share related documents or external links."
      placeholder: |
        - [Link 1](http://example.com)
        - [Link 2](http://example.com)
        - #issue-number
    validations:
      required: false

  # Assignees (optional)
  - type: textarea
    id: assignees
    attributes:
      label: "🙋‍ Assignees"
      value: |
        - Backend: name
        - Frontend: name
        - Design: name
    validations:
      required: false
